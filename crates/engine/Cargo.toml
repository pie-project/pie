[package]
name = "engine"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "The runtime↔engine contract for pie: the Engine verbs, the load request, the fire submission, guest-program registration, and the KV transfer types shared with cross-node transport."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"


[lib]
name = "engine"
crate-type = ["rlib"]
path = "src/lib.rs"

# NO FEATURES. The crate that stood here had two (`rpc`, `runtime`), and both
# existed to keep a dependency out of somebody's graph: `tarpc` dragged tokio
# through a wasm/windows platform closure, and the completion broker dragged
# `waker` -> `loom` -> a C compiler. Neither dependency is here any more —
# the broker went to the runtime and the wire went to the transport (palo
# design §7) — so there is nothing left to gate, and a contract with no
# optional surface is a contract that means the same thing to every reader.

[dependencies]
# Decision 18: the RUNTIME traces, `Plan` crosses the boundary, `CompiledModel` never
# does. So the contract's load request carries a `model_ir::Plan` verbatim and
# the shell does its own `compile`. The second reason this edge exists is
# decision 1: `model_ir::Dtype` is THE dtype of a model-plane value, and the
# `KvDtype` that used to sit in `transfer.rs` was a second spelling of five of
# its variants that nothing kept in step.
model-ir = { path = "../model-ir" }

# The guest-program half of the contract (`program.rs`) is ETA's own
# vocabulary, not a private re-encoding of it. `DType`, `ChanDType`,
# `HostRole`, `ExternDir`, `Port`, `Stage` and `IntrinsicId` all live here
# already; the `serde` feature exists so a contract type can embed them
# instead of flattening them back to the `u8` tags `local.rs` used to carry.
# The dependency also carries the port registry home (decision 19) — this
# crate does NOT re-export `Port`/`PortMask`/`GeometryClass`, it names them.
eta-ir = { path = "../eta-ir", features = ["serde"] }

# THE ARROW THAT FLIPPED. This crate declared the launch package — the
# compiler's output artifact — because it was the only crate both the runtime
# and every engine could name. That made `eta-compiler` depend on the contract
# in order to describe its own output, and left five types declared twice with
# `match`es and struct copies bridging them. The producer owns its output type
# now, so `ProgramRegistration` names `eta_compiler::codegen::launch::LaunchPackage`
# and `eta-compiler` names nothing here at all.
#
# NO NEW CRATE ENTERS ANYONE'S CLOSURE. `eta-compiler`'s feature-resolved
# closure after losing this edge is `{eta-ir, serde}` — a strict subset of what
# this crate already carried — so the only addition to a reader's graph is
# `eta-compiler` itself. It is also the reason the "all four are leaves"
# sentence in `lib.rs` had to go: this dependency is not a leaf, and saying so
# is cheaper than pretending the floor did not move.
eta-compiler = { path = "../eta-compiler" }

# Every noun serde, no exceptions (decision 19: "remote is a property, not an
# encoding"). A remote engine is a `dyn Engine` whose body happens to be a
# socket; which envelope, which framing and which wire version it uses are the
# transport's business and appear nowhere below this line.
serde = { version = "1.0", features = ["derive"] }

# `Error` is a typed enum with a `Display` per variant, which is what
# replaced the `PIE_STATUS_*` `i32` ladder. `thiserror` is the workspace's
# spelling for that (runtime, transport, worker-api, checkpoint all use it).
thiserror = "2.0"

[dev-dependencies]
# The serde round trip in `tests/` needs a concrete format to round trip
# THROUGH. JSON, because a human reads the failure.
serde_json = "1.0"
