[package]
name = "engine"
version = "0.4.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "Programmable Inference Engine (Pie)"
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "engine"
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
# tart: the declared-forward toolchain, and OPTIONAL now.
#
driver-api = { path = "../driver-api" }
tensor-ir = { path = "../tensor-ir" }
tensor-compiler = { path = "../tensor-compiler" }
# THE CUTOVER, DONE. This was `driver-cuda-new` beside a C++ `driver-cuda`
# that supplied the same thirteen `pie_cuda_*` symbols, so which archive
# the seam linked was the whole switch and `backend/cuda.rs` was unchanged
# either way. There is one now, and it has the name.
driver-cuda = { path = "../driver-cuda", optional = true }
# `driver-metal` STOOD HERE. R3 took the three shader drivers out of the
# workspace (they were the last consumers of `model-legacy` and
# `model_compiler::lower`), and an optional path dependency is enough to drag
# one back in: cargo adopts a path dep inside the workspace directory as a
# member whatever its features say. So the edge is cut, not merely gated. It
# comes back with the driver at P5.

client = { path = "../client" }
tokio = { version = "1.53", features = ["full"] }
parking_lot = "0.12"
tarpc = { version = "0.37", features = ["serde1"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
rand = { version = "0.10.2", features = ["std_rng", "sys_rng"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
# default-features off: the default set drags in the HTTP transports
# (`http-proto` → prost/opentelemetry-http → a second reqwest client) which
# `telemetry.rs` never reaches — it only ever calls `.with_tonic()`.
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "grpc-tonic",
    "trace",
    "metrics",
] }
serde_json = { version = "1.0", features = ["preserve_order"] }
# default-features off, because wasmtime's default set is the *tooling*
# build, not the embedder one: `wat`/`wit-parser` (text and WIT parsing we
# never do — inferlets arrive as binary components), `cache` (module cache on
# disk), `coredump`, `profiling`, `debug-builtins`, the three GC collectors,
# `stack-switching` and `threads` (no guest uses them). Everything the engine
# actually reaches is listed here.
wasmtime = { version = "47.0.1", default-features = false, features = [
    "runtime",
    "std",
    "anyhow",
    "async",
    "backtrace",
    "cranelift",
    "parallel-compilation",
    "component-model",
    "component-model-async",
    "pooling-allocator",
    "addr2line",
    "demangle",
] }
# p1 off (it is a default): nothing here links preview1 — the engine only ever
# calls `p2::add_to_linker_async` and `p3::add_to_linker`, and p1 is what drags
# in wiggle → witx → a second, ancient `wast`.
wasmtime-wasi = { version = "47.0.1", default-features = false, features = ["p2", "p3"] }
# `default-send-request` stays on (it is a default): it is what supplies the
# blanket `WasiHttpHooks::send_request`, and its rustls is the ring build, not
# aws-lc.
wasmtime-wasi-http = { version = "47.0.1", default-features = false, features = [
    "p2",
    "p3",
    "default-send-request",
] }
# Names `http::uri::Scheme` for the wasi:http@0.3 network-policy hook
# (ProcessCtx::PieHttpHooks); shared with wasmtime-wasi-http's http 1.x.
http = "1"
bytes = "1.12.1"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
dashmap = "6.2.1"
boxcar = "0.2.14"
thiserror = "2.0.19"
futures = "0.3.33"
waker = { path = "../waker" }
tokenizer = { path = "../tokenizer" }
grammar = { path = "../grammar" }
# What this engine needs to know about the model it serves that is NOT its
# forward pass: the chat template a turn is written with, the `(layers, vocab)`
# a sampler and the PTIR lowering are sized from, host-side multimodal decode,
# and the shape an artifact's metadata arrives in. All of it is `model::serve`.
#
# It used to be `model-legacy`, and the reason was one module: a scheduler site
# table that traced a real legacy declaration to find a fire's divergence sites.
# That table had no producer, no carrier and no consumer (see
# `src/scheduler/fire_plan.rs`), and it walked a traced form the baker path does
# not produce — so R1 deleted it, and with it this crate's last need for a
# declaration. Everything left is serving knowledge, and it moved to this crate
# rather than being ported, file for file.
model = { path = "../model", features = ["serve"] }
blake3 = "1.8.5"
fancy-regex = "0.18.0"
async-trait = "0.1.91"
wasm-encoder = { version = "0.254.0", features = ["wasmparser"] }
wasmparser = "0.254.0"
wasm-metadata = "0.254.0"
libc = "0.2"
# default-features off so reqwest's `default-tls` (native-tls → openssl) is
# never pulled in: it dynamically links libssl.so.1.1, which doesn't exist on
# OpenSSL-3 distros (Ubuntu 22.04+) and breaks the manylinux_2_28 release
# binary. rustls is statically linked and distro-independent.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset"] }
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
rustc-hash = "2.1"
smallvec = "1"
lru = "0.18.1"
ipnet = "2"

[features]
default = []
# The CUDA shell. It used to share these symbols with a C++ archive of the
# same name, and enabling both was a duplicate-symbol error -- the right
# failure, since the seam must not be ambiguous about which driver it is
# calling. Only one supplies them now.
#
# It needs a CUDA runtime ABI chosen, for the reason that crate's own
# `compile_error!` gives: guessing wrong is a segfault inside the driver
# rather than a build error.
#
# So the version is IN THE NAME, and there is no version-less `driver-cuda`
# to select. This crate used to offer one, defined as `driver-cuda/cuda-13`,
# and that is precisely the guess `driver-cuda` refuses to make: `pie` exposed
# only the bare name, so `cuda-12` was unreachable from any binary while CI
# shipped six `cuda12.8`-labelled artifacts built against the 13 ABI. Naming
# the version is what makes forgetting it impossible -- Cargo answers a stale
# `--features driver-cuda` with "the package does not contain this feature",
# which is a better error than a segfault in `cudaGraphAddNode`.
#
# `_driver-cuda` is the private "the CUDA shell is linked" gate, the same
# shape and the same underscore as `driver-cuda`'s own `_cuda`: every
# `#[cfg]` in this crate is written against it, so the modules do not have to
# name a version they do not care about.
_driver-cuda = ["dep:driver-cuda", "driver-cuda/abi"]
driver-cuda-12 = ["_driver-cuda", "driver-cuda/cuda-12"]
driver-cuda-13 = ["_driver-cuda", "driver-cuda/cuda-13"]
# The `driver-metal` feature STOOD HERE, and went with the dependency above.
# Host-side performance probes. Each scenario is a separate flag so you
# only pay for the probes you ask for — different domains have different
# sample rates and different audiences. The `probe_<domain>!` macros in
# `src/scheduler/probe.rs` expands to zero code when its feature is off.
#
# Adding a new domain: define it under `src/scheduler/probe.rs` (or an
# `src/scheduler/probe/` submodule) with its probe-holder
# struct + `probe_<domain>!` macro pair, then add a feature flag here.
profile-fire = []          # per-fire scheduler lifecycle (90×/sec at conc=256)
# `profile-hot-path` and `profile-all` STOOD HERE, both defined as
# `["profile-fire"]` -- three names for one domain, because `probe.rs` has
# only ever had one. Neither carried a `#[cfg]` of its own and neither was
# forwarded past `worker`, so no binary could select them and no code could
# tell them apart. Bring them back when a SECOND domain makes a bundle mean
# something; a bundle of one is a promise the catalog does not keep.

[dev-dependencies]
tempfile = "3"
# The text-format parser, for tests only. The linker tests build their
# fixtures as `(module ...)` source, which `Module::new` will only accept
# with `wat` on; nothing in the engine itself ever compiles text, so the
# parser has no business in a shipped binary. Dev-dependencies are not built
# for `cargo build`, which is exactly the line we want here.
wasmtime = { version = "47", default-features = false, features = ["wat"] }
# `criterion` and `mimalloc` STOOD HERE, for benchmarks: this crate has no
# `benches/` directory and no `[[bench]]`, and neither name appears in a line
# of its source. The mimalloc line carried the one fact worth keeping — a
# bench of an engine entry point has to link the allocator `worker` installs
# or it measures glibc malloc — so bring both back together when a bench does.

#[profile.release]
#lto = "fat"
#codegen-units = 1
