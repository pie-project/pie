[package]
name = "engine"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "The runtime↔engine contract for pie: the Engine verbs, the load request, the fire submission, guest-program registration, and the KV transfer types shared with cross-node transport."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"


[lib]
name = "engine"
crate-type = ["rlib"]
path = "src/lib.rs"


[dependencies]
model-ir = { path = "../model-ir" }

eta-ir = { path = "../eta-ir", features = ["serde"] }

eta-compiler = { path = "../eta-compiler" }

serde = { version = "1.0", features = ["derive"] }

thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"
