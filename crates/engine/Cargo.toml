[package]
name = "engine"
version = "0.4.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "Programmable Inference Engine (Pie)"
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "engine"
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
# tart: the declared-forward toolchain, and OPTIONAL now.
#
# These two were unconditional, for the fire planner's site table: `lower` (the
# launch list its cost model read) and the traced form's vocabulary. R1 deleted
# that table -- it had no producer, no carrier and no consumer, and it walked
# `model_ir::trace::ForwardPlan`, the LEGACY traced form the baker path does not
# produce (`src/scheduler/fire_plan.rs` records the measurement).
#
# What is left of either in this crate is `backend/{vulkan,wgpu}.rs`, which
# lower a legacy declaration to build a shader program: `model_compiler::lower`
# and `model_ir::trace::FireClass`, nowhere else. So they ride the same two
# features `model-legacy` does, and a default build of this crate carries no
# part of the legacy forward toolchain at all.
model-compiler = { path = "../model-compiler", optional = true }
model-ir = { path = "../model-ir", optional = true }
driver-api = { path = "../driver-api" }
tensor-ir = { path = "../tensor-ir" }
tensor-compiler = { path = "../tensor-compiler" }
# THE CUTOVER, DONE. This was `driver-cuda-new` beside a C++ `driver-cuda`
# that supplied the same thirteen `pie_cuda_*` symbols, so which archive
# the seam linked was the whole switch and `backend/cuda.rs` was unchanged
# either way. There is one now, and it has the name.
driver-cuda = { path = "../driver-cuda", optional = true }
# The Rust Metal shell. Unlike `driver-cuda` this is not linked for an
# archive: the seam calls it as a plain Rust library, which is what a driver
# written in the same language should cost. Its device half is
# `#[cfg(target_vendor = "apple")]`, so the seam below is too.
driver-metal = { path = "../driver-metal", optional = true }

# The Rust Vulkan shell, and the checkpoint reader it deliberately does not
# have. `driver-vulkan` keeps `model-loader` a DEV-dependency and proves the
# closure with a test, because a driver that depended on a checkpoint format
# would be a driver that could not be handed bytes. So the conversion runs
# here, on the side that already reads checkpoints.
driver-vulkan = { path = "../driver-vulkan", optional = true }
# The Rust WebGPU shell. Same arrangement as `driver-vulkan` above and for the
# same reason -- it keeps `model-loader` a DEV-dependency and proves the
# closure with `tests/pure.rs`, so the checkpoint is read on this side -- with
# one thing neither sibling has: no SDK, no loader, no `-sys` crate anywhere in
# its closure. See the `driver-wgpu` feature below.
driver-wgpu = { path = "../driver-wgpu", optional = true }
model-loader = { path = "../model-loader", default-features = false, optional = true }
client = { path = "../client" }
tokio = { version = "1.53", features = ["full"] }
parking_lot = "0.12"
tarpc = { version = "0.37", features = ["serde1"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
rand = { version = "0.10.2", features = ["std_rng", "sys_rng"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
# default-features off: the default set drags in the HTTP transports
# (`http-proto` → prost/opentelemetry-http → a second reqwest client) which
# `telemetry.rs` never reaches — it only ever calls `.with_tonic()`.
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "grpc-tonic",
    "trace",
    "metrics",
] }
serde_json = { version = "1.0", features = ["preserve_order"] }
# default-features off, because wasmtime's default set is the *tooling*
# build, not the embedder one: `wat`/`wit-parser` (text and WIT parsing we
# never do — inferlets arrive as binary components), `cache` (module cache on
# disk), `coredump`, `profiling`, `debug-builtins`, the three GC collectors,
# `stack-switching` and `threads` (no guest uses them). Everything the engine
# actually reaches is listed here.
wasmtime = { version = "47.0.1", default-features = false, features = [
    "runtime",
    "std",
    "anyhow",
    "async",
    "backtrace",
    "cranelift",
    "parallel-compilation",
    "component-model",
    "component-model-async",
    "pooling-allocator",
    "addr2line",
    "demangle",
] }
# p1 off (it is a default): nothing here links preview1 — the engine only ever
# calls `p2::add_to_linker_async` and `p3::add_to_linker`, and p1 is what drags
# in wiggle → witx → a second, ancient `wast`.
wasmtime-wasi = { version = "47.0.1", default-features = false, features = ["p2", "p3"] }
# `default-send-request` stays on (it is a default): it is what supplies the
# blanket `WasiHttpHooks::send_request`, and its rustls is the ring build, not
# aws-lc.
wasmtime-wasi-http = { version = "47.0.1", default-features = false, features = [
    "p2",
    "p3",
    "default-send-request",
] }
# Names `http::uri::Scheme` for the wasi:http@0.3 network-policy hook
# (ProcessCtx::PieHttpHooks); shared with wasmtime-wasi-http's http 1.x.
http = "1"
bytes = "1.12.1"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
dashmap = "6.2.1"
boxcar = "0.2.14"
thiserror = "2.0.19"
futures = "0.3.33"
waker = { path = "../waker" }
tokenizer = { path = "../tokenizer" }
grammar = { path = "../grammar" }
# What this engine needs to know about the model it serves that is NOT its
# forward pass: the chat template a turn is written with, the `(layers, vocab)`
# a sampler and the PTIR lowering are sized from, host-side multimodal decode,
# and the shape an artifact's metadata arrives in. All of it is `model::serve`.
#
# It used to be `model-legacy`, and the reason was one module: a scheduler site
# table that traced a real legacy declaration to find a fire's divergence sites.
# That table had no producer, no carrier and no consumer (see
# `src/scheduler/fire_plan.rs`), and it walked a traced form the baker path does
# not produce — so R1 deleted it, and with it this crate's last need for a
# declaration. Everything left is serving knowledge, and it moved to this crate
# rather than being ported, file for file.
model = { path = "../model", features = ["serve"] }
# THE LEGACY DECLARATIONS, and only for the two shader backends that still read
# one. `backend/{vulkan,wgpu}.rs` identify a checkpoint against the legacy
# catalog, author its load plan through `model::boot`, and trace
# `shared::llama_like` to build the shader program — that is the whole of what
# is left, it is what P5 replaces with a baker executor per plane, and R2
# quarantines these two backends until it lands.
#
# Optional, and pulled in by those two features ALONE. That is the cut: a
# default `cargo build -p engine` has no `model-legacy` edge at all, and one
# appears exactly when a build asks for a backend that still reads a legacy
# declaration.
model-legacy = { path = "../model-legacy", package = "model-legacy", default-features = false, features = [
    "contract",
], optional = true }
blake3 = "1.8.5"
fancy-regex = "0.18.0"
async-trait = "0.1.91"
wasm-encoder = { version = "0.254.0", features = ["wasmparser"] }
wasmparser = "0.254.0"
wasm-metadata = "0.254.0"
libc = "0.2"
# default-features off so reqwest's `default-tls` (native-tls → openssl) is
# never pulled in: it dynamically links libssl.so.1.1, which doesn't exist on
# OpenSSL-3 distros (Ubuntu 22.04+) and breaks the manylinux_2_28 release
# binary. rustls is statically linked and distro-independent.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset"] }
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
rustc-hash = "2.1"
smallvec = "1"
lru = "0.18.1"
ipnet = "2"

[features]
default = []
# The CUDA shell. It used to share these symbols with a C++ archive of the
# same name, and enabling both was a duplicate-symbol error -- the right
# failure, since the seam must not be ambiguous about which driver it is
# calling. Only one supplies them now.
#
# It needs a CUDA runtime ABI chosen, for the reason that crate's own
# `compile_error!` gives: guessing wrong is a segfault inside the driver
# rather than a build error.
#
# So the version is IN THE NAME, and there is no version-less `driver-cuda`
# to select. This crate used to offer one, defined as `driver-cuda/cuda-13`,
# and that is precisely the guess `driver-cuda` refuses to make: `pie` exposed
# only the bare name, so `cuda-12` was unreachable from any binary while CI
# shipped six `cuda12.8`-labelled artifacts built against the 13 ABI. Naming
# the version is what makes forgetting it impossible -- Cargo answers a stale
# `--features driver-cuda` with "the package does not contain this feature",
# which is a better error than a segfault in `cudaGraphAddNode`.
#
# `_driver-cuda` is the private "the CUDA shell is linked" gate, the same
# shape and the same underscore as `driver-cuda`'s own `_cuda`: every
# `#[cfg]` in this crate is written against it, so the modules do not have to
# name a version they do not care about.
_driver-cuda = ["dep:driver-cuda", "driver-cuda/abi"]
driver-cuda-12 = ["_driver-cuda", "driver-cuda/cuda-12"]
driver-cuda-13 = ["_driver-cuda", "driver-cuda/cuda-13"]
# The Rust Metal shell's seam. No archive and no `extern "C"`: this one is a
# library call, so the feature owes nothing but the dependency and the
# driver's own device gate.
#
# `driver-metal/metal-4` is NOT optional here. That crate deliberately has no
# default feature, so that `cargo test -p driver-metal` reaches its portable
# half; a consumer that wants the serving path has to say so. Omitting it
# makes `driver_metal::gpu` an unresolved path IN THIS CRATE, which is the
# better place to find out.
driver-metal = ["dep:driver-metal", "driver-metal/metal-4"]
# The Rust Vulkan shell's seam. A library call, like the Metal one, and gated
# on the feature ALONE -- not on a target. Vulkan is a loader rather than a
# platform: the same crate builds and runs on Linux, Windows and Android.
#
# `driver-vulkan/native` is not optional here for the same reason
# `driver-metal/metal-4` is not: that crate has no default feature so its
# portable half can be tested without a GPU, and a consumer that wants the
# serving path has to say so. Omitting it makes `driver_vulkan::device` an
# unresolved path IN THIS CRATE, which is the better place to find out.
#
# `model-loader` comes with it, because THIS crate loads the checkpoint for
# that driver -- see `src/driver/backend/vulkan.rs` for why loading is on this
# side of the seam and not the other.
driver-vulkan = [
    "dep:driver-vulkan",
    "driver-vulkan/native",
    "dep:model-loader",
    "dep:model-compiler",
    "dep:model-ir",
    # `catalog::identify`, `contract::author` and `boot::compile_load_plan_for`
    # -- the identification and the load plan, all of them off the LEGACY
    # declarations. This is the only kind of consumer that still needs them,
    # which is why the dependency is optional and named here rather than
    # carried by every build.
    "dep:model-legacy",
]
# The Rust WebGPU shell's seam. A library call, like the two above, and gated
# on the feature ALONE.
#
# `driver-wgpu/native` is not optional here, for the reason
# `driver-vulkan/native` and `driver-metal/metal-4` are not: that crate has no
# default feature so its portable half -- which parses the WGSL it will
# dispatch and checks it against the kernel table, with no adapter present --
# can be tested without a GPU. Omitting it makes `driver_wgpu::device` an empty
# module and `driver_wgpu::shell` absent, and the failure arrives at model load
# instead of at `cargo build`.
#
# `model-loader` and `model-legacy` come with it because THIS crate loads the
# checkpoint for that driver, exactly as it does for Vulkan -- see
# `src/driver/backend/wgpu.rs` for why loading is on this side of the seam.
#
# THE ARGUMENT THIS BACKEND HAS THAT NEITHER SIBLING DOES, for whoever decides
# what ships on by default:
#
# `driver-cuda` needs a CUDA toolkit and an NVIDIA card. `driver-metal` needs a
# Mac. `driver-vulkan` needs a loader and an ICD. This one needs NONE of them.
# Its whole dependency closure is pure Rust -- `driver-wgpu/tests/pure.rs`
# asserts that with `native` ON, which is the version of the claim that matters
# -- `naga` compiles the shaders in-process so there is no module directory to
# ship beside the binary, it builds for `wasm32-unknown-unknown` including the
# browser backend (`tests/browser.rs`), and it reaches Vulkan, Metal, D3D12 and
# WebGPU through one binary. Nothing about turning it on can fail to build on a
# machine that can build the engine at all.
#
# That makes it the only driver that could reasonably be a DEFAULT feature.
# This change deliberately does not make it one: the existing three are all
# opt-in, "which backends a build carries" is a deployment policy rather than a
# seam's decision, and `create` still opens an adapter -- so a default would
# turn a machine with no GPU from "no backend compiled in" into "a backend that
# fails at boot". The case is stated here so that whoever makes that call has
# it in one place rather than reconstructing it.
driver-wgpu = [
    "dep:driver-wgpu",
    "driver-wgpu/native",
    "dep:model-loader",
    "dep:model-legacy",
    "dep:model-compiler",
    "dep:model-ir",
]
# Host-side performance probes. Each scenario is a separate flag so you
# only pay for the probes you ask for — different domains have different
# sample rates and different audiences. The `probe_<domain>!` macros in
# `src/scheduler/probe.rs` expands to zero code when its feature is off.
#
# Adding a new domain: define it under `src/scheduler/probe.rs` (or an
# `src/scheduler/probe/` submodule) with its probe-holder
# struct + `probe_<domain>!` macro pair, then add a feature flag here.
profile-fire = []          # per-fire scheduler lifecycle (90×/sec at conc=256)
# `profile-hot-path` and `profile-all` STOOD HERE, both defined as
# `["profile-fire"]` -- three names for one domain, because `probe.rs` has
# only ever had one. Neither carried a `#[cfg]` of its own and neither was
# forwarded past `worker`, so no binary could select them and no code could
# tell them apart. Bring them back when a SECOND domain makes a bundle mean
# something; a bundle of one is a promise the catalog does not keep.

[dev-dependencies]
tempfile = "3"
# The text-format parser, for tests only. The linker tests build their
# fixtures as `(module ...)` source, which `Module::new` will only accept
# with `wat` on; nothing in the engine itself ever compiles text, so the
# parser has no business in a shipped binary. Dev-dependencies are not built
# for `cargo build`, which is exactly the line we want here.
wasmtime = { version = "47", default-features = false, features = ["wat"] }
tensor-ir = { path = "../tensor-ir" }
criterion = { version = "0.8", features = ["html_reports"] }
# Benchmarks must allocate the way production does. Every engine entry point
# links `worker`, which sets mimalloc as the global allocator; a bench that
# omitted it would measure glibc malloc and report a machine nobody runs.
mimalloc = { version = "0.1", features = ["local_dynamic_tls"] }

#[profile.release]
#lto = "fat"
#codegen-units = 1
