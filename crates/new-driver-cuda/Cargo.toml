[package]
name = "new-driver-cuda"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The menlo CUDA driver's dispatch layer: a Run that resolves plan ids to device handles and answers every Dispatch* trait by calling new-kernels-cuda entries on the stream Ctx. Merges into driver-cuda when the old stack is deleted."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "new_driver_cuda"
path = "src/lib.rs"

[dependencies]
# The vocabulary the resolver routes on: `ValueDecl`, `Def`, `RuntimeInput`,
# `StructKind` — and the 15 family enums the dispatch arms destructure.
new-model-ir = { path = "../new-model-ir" }
# The contract implemented: the 15 `Dispatch*` traits and `KernelError`.
new-kernels = { path = "../new-kernels" }
# The entries called and the handles resolved to: `Tensor`, `RaggedTensor`,
# `KvPool`, `RecurrentPool`, the four plan structs and their pure builders.
# No `cuda-12`/`cuda-13` feature is named here on purpose: picking the
# runtime version is the BINARY's decision (the two disagree on
# `cudaGraphAddNode`'s arity), and this crate builds and tests everywhere —
# a fire without a runtime answers with a typed refusal.
new-kernels-cuda = { path = "../new-kernels-cuda" }
# The shared walk, re-exported: the prepare/capture split and program-order
# dispatch, written once and driven over this crate's `Run`.
new-driver = { path = "../new-driver" }
