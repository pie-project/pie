[package]
name = "inferlet-api"
version = "0.4.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "The pie:inferlet guest contract: the canonical WIT package and the wit-bindgen bindings generated from it."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
keywords = ["wasi", "wasm", "pie", "inferlet"]
categories = ["wasm"]

# The WIT package is the crate's payload, not an input the build ignores:
# `wit_bindgen::generate!` reads `wit/` at macro-expansion time, so a published
# .crate that lacks it does not compile. Cargo includes `wit/` by default (it
# is not in .gitignore), but say so, because the failure mode is a broken
# release rather than a build error here.
include = ["src/**/*", "wit/**/*"]

[lib]
name = "inferlet_api"
path = "src/lib.rs"

[dependencies]
wit-bindgen = { version = "0.59.0", features = ["async-spawn"] }
