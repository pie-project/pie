[package]
name = "kernels-cuda"
version = "0.4.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "CUDA's kernel signature table, and the extern \"C\" launch shim generated from it."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

# The `links` key is how `driver-cuda` reads `DEP_PIE_KERNELS_CUDA_LAUNCH_SHIM`
# -- the directory holding `libpie_launch_shim.a`, which this crate builds and
# `driver-cuda` names on its link line.
#
# The NAME is now historical. It was the archive `native` used to build, and
# the key set was `INCLUDE`, `FLASHINFER`, `CCCL` and six others; the archive
# and every one of those keys is deleted. `LAUNCH_SHIM` is the only survivor.
# Renaming the `links` key would be a rename of the `DEP_*` variable in every
# consumer for no gain, so it stays as the crate's metadata namespace rather
# than as a claim about what is built.
links = "pie_kernels_cuda"
build = "build.rs"

[lib]
name = "kernels_cuda"
path = "src/lib.rs"

[features]
# `native` = generate `shim.cpp` and compile it into libpie_launch_shim.a.
# Off by default, and that is the point rather than caution: `model-compiler`
# reads the signature table on every trace, and a compiler dev loop must not
# pay a C++ compiler to look up a symbol's contract. `driver-cuda` turns it
# on; everyone else takes the table alone.
#
# It used to read `["dep:cmake", "dep:cc"]` and to mean "build `csrc/` into
# libpie_kernels_cuda.a". The `cmake` half is deleted with
# `csrc/CMakeLists.txt`: that archive had no sources of its own -- its entire
# content was the CUTLASS MoE object library -- and `csrc/src` holds zero
# `.cu` and zero `.cpp`. **Dropping `dep:cmake` is what takes nvcc out of
# this workspace**; the `cc` half is a host compile and goes with `bridge`.
default = []
native = ["dep:cc"]

[dependencies]
kernels = { path = "../kernels" }

# The ROWS, which this crate used to own and now reads.
#
# The edge ran the other way until the migration seam closed:
# `kernels-cuda-new` took its table from here, because while both paths must
# run a symbol has to have exactly ONE contract. That argument never said
# which crate should hold the file. The JIT crate is the table's only
# remaining AUTHOR -- a row there states a `LaunchRule` and an instantiation,
# which is the whole kernel -- while this crate only reads rows to emit C, so
# the rows went there and this became the re-export. Reversing it in two steps
# was not available: the second edge is a cycle until the first is gone.
#
# `default-features = false` so no `cudarc`, no CUDA version feature, and no
# GPU: the tables and the device sources are data, and this is the same edge
# `model-compiler` takes through here on every trace.
kernels-cuda-new = { path = "../kernels-cuda-new", default-features = false }

[build-dependencies]
# `cmake = { version = "0.1", optional = true }` STOOD HERE. It drove
# `csrc/CMakeLists.txt`, whose `enable_language(CUDA)` was the only line in
# the workspace that made a build look for nvcc. Deleted with the file.
#
# Compiles the generated `shim.cpp` into `libpie_launch_shim.a`. The shim is
# the only thing that DEFINES the `pie_k_*` symbols, so it has to be built by
# the crate that owns the launchers it forwards into — otherwise every crate
# that wants to call a kernel builds its own copy and a binary linking two of
# them fails on duplicate definitions.
#
# BUILT here, LINKED by the caller: `build.rs` runs `cc` with
# `cargo_metadata(false)` and publishes the archive's directory as
# `launch_shim` instead, because a `-l` emitted here reaches no dependent's
# link line. `shim()`'s doc has the measurement; it is the same split
# `libpie_kernels_cuda.a` has always had.
cc = { version = "1", optional = true }
# The ROWS, the DEVICE ROWS, and the EMITTERS.
#
# This block used to say *"`build.rs` still reaches `src/abi.rs` through
# `#[path]`, because a build script cannot depend on the crate it builds"*,
# and required these two entries to mirror `[dependencies]` for that reason.
# **It was false when it was written down.** `build.rs` says so itself, in a
# comment eleven lines into the module: *"THERE IS NO `#[path]` INCLUDE HERE
# ANY MORE."* Both sentences were in this crate at the same time, one file
# apart, and the mirroring rule they justified outlived the mechanism by two
# refactors.
#
# `build.rs` names `kernels_cuda_new::abi::emit_c_shim`,
# `emit_rust_bindings_portable` and `kernels_cuda_new::device::jit_dispatched`
# DIRECTLY, as an ordinary build-dependency. `src/abi.rs` and
# `src/norm_device.rs` — the two one-line `pub use` files the `#[path]` rule
# was about — are deleted; no `mod` in `lib.rs` declared them and no `#[path]`
# included them, so they had been compiling in no target at all.
#
# The two entries still mirror, and now for the ordinary reason: `build.rs`
# needs the emitters and the example needs the rows.
#
# `kernels` stays because `native::tables()` types itself on
# `kernels::KernelSig` directly.
kernels = { path = "../kernels" }
kernels-cuda-new = { path = "../kernels-cuda-new", default-features = false }
