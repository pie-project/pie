[package]
name = "engine-cerebras"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The Cerebras engine: PIE's engine over a wafer program. A load plans the model's trace, builds and links the program (kernels-cerebras) and cuts the checkpoint for it, both cached, then drives it through a pure-Rust binding of the Cerebras SDK runtime (libsdkruntime, dlopened at runtime) on a CS system or the fabric simulator; guest programs run in the host interpreter."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "engine_cerebras"
path = "src/lib.rs"

[dependencies]
dtype = { package = "pie-dtype", path = "../dtype" }
kernels-cerebras = { path = "../kernels-cerebras" }
libloading = "0.9"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1.1"
poem-ir = { package = "pie-poem-ir", path = "../poem-ir" }
engine = { path = "../engine" }
poem-exec = { package = "pie-poem-exec", path = "../poem-exec" }
poem-compiler = { package = "pie-poem-compiler", path = "../poem-compiler" }
eta-ir = { package = "pie-eta-ir", path = "../eta-ir" }
eta-exec = { path = "../eta-exec" }
eta-compiler = { path = "../eta-compiler" }
checkpoint = { path = "../checkpoint" }
tracing = "0.1"
blake3 = "1"

[dev-dependencies]
sha2 = "0.11"

[lints]
workspace = true
