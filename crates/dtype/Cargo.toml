[package]
name = "dtype"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The one element-type enum: what a weight plane, a kv page, a checkpoint tensor and a compute value all say when asked what they hold. A leaf crate — the enum, its width in bits, plain serde, no internal deps."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

[lib]
name = "dtype"
crate-type = ["rlib"]
path = "src/lib.rs"

# A feature for one consumer: `eta-ir`, which a wasm guest imports and which
# takes this crate with `default-features = false`. On by default for everyone else.
[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
# `default-features = false` + `alloc` keeps the `no_std` promise in the lib.rs
# header true even when the feature is on.
serde = { version = "1.0", default-features = false, features = [
    "alloc",
], optional = true }

[dev-dependencies]
serde_json = "1.0"
