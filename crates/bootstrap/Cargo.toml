[package]
name = "bootstrap"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The pie process skeleton and the `pie-env` command. As a library it gives every bin the shared CLI flag skeleton, path/dir resolution, config sourcing to a String, tracing + a /metrics endpoint, and signal/panic/exit-code lifecycle. As a binary it answers, without booting a daemon, which config file a role will actually read and whether its boot preconditions hold. Depends on NO role library and never sees a typed Config."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

# Package, directory and lib are all `bootstrap` — the bins write
# `bootstrap::init` / `bootstrap::BootSpec`. The lib used to import as
# `startup`, which was a third name for one thing. The package
# still ships the `pie-env` command, because a command name is a user-facing
# thing and not a tree entry.
[lib]
name = "bootstrap"
path = "src/lib.rs"

# `bootstrap` — the only binary the skeleton itself ships. It reuses the very same
# resolution path the daemons take (`config::resolve_path`), so it can never
# disagree with them.
[[bin]]
name = "pie-env"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# CLI: the shared global flags as a `#[derive(clap::Args)] GlobalArgs` the bins
# `#[command(flatten)]` into their own `Parser` (one `--help`, typed role flags).
# `derive` also backs the `bootstrap` binary's own `Parser`.
clap = { version = "4.6", features = ["derive"] }
# Path/dir resolution (home dir for `$PIE_HOME` fallback).
dirs = "6.0"
# TLS: not used here, *selected* here. Every HTTP client in the process
# (reqwest in the runtime, the worker's blob fetch, `pie model import`) is built
# on `rustls-no-provider`, which refuses to pick a crypto backend on its own —
# so process boot installs one, and installing it once beside the panic hook is
# what keeps every bin from having to remember. `ring` rather than the aws-lc
# default: it is already in the graph for `wasmtime-wasi-http` and the client
# crate's signing, and the aws-lc build script was the most expensive unit in a
# cold build.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging", "std"] }
# Observability: structured logs + env-filter level control.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Signals + the hand-rolled /metrics listener. NOT a runtime — the bin owns the
# runtime (`#[tokio::main]`); the skeleton only `spawn`s onto the ambient one.
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "io-util"] }
