[package]
name = "bootstrap"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The pie process skeleton and the `pie-env` command. As a library it gives every bin the shared CLI flag skeleton, path/dir resolution, config sourcing to a String, tracing + a /metrics endpoint, and signal/panic/exit-code lifecycle. As a binary it answers, without booting a daemon, which config file a role will actually read and whether its boot preconditions hold. Depends on NO role library and never sees a typed Config."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "bootstrap"
path = "src/lib.rs"

[[bin]]
name = "pie-env"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:rustls", "dep:tracing-subscriber", "dep:tokio", "dep:tracing", "dep:anyhow"]

[dependencies]
anyhow = { version = "1", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
dirs = "7.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging", "std"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "io-util"], optional = true }

[lints]
workspace = true
