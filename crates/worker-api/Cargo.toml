[package]
name = "worker-api"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Gateway↔worker data-plane RPC interface: the `GatewayInbound` (gateway-served) + `WorkerControl` (worker-served) tarpc services that ride one worker→gateway connection, the shared two-way mux glue that splits that one connection into both, the single-sourced MessagePack data-plane codec, and the turn vocabulary those calls carry (Request/Accepted/Tokens/BlobRef/Priority/Control). Final DAG: deps pie-ids (atoms), pie-client-api (ClientMessage/ServerMessage), pie-controller-rpc (WorkerStatus), plus tarpc and its transitive foundations."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "worker_api"
path = "src/lib.rs"

[dependencies]
ids = { path = "../ids" }
client-api = { path = "../client-api" }
controller-api = { path = "../controller-api" }
tarpc = { version = "0.37", features = ["serde1", "tokio1"] }
serde = { version = "1.0", features = ["derive"] }
futures = "0.3"
tokio = { version = "1", features = ["rt"] }
thiserror = "2"
tracing = "0.1"
tokio-serde = { version = "0.9", features = ["messagepack"] }
