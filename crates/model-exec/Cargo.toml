[package]
name = "model-exec"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "The model forward substrate, in Rust: lane composition, the fire descriptor, the artifact walk, the paged kv geometry and the seat law. Device-free — the CUDA and Metal shells both read it."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

[lib]
name = "model_exec"
path = "src/lib.rs"

# Affordable here and not in the shells: `unsafe_code = "forbid"` holds because
# this layer is arithmetic over `#[repr(C)]` records and `Vec`s, which is also
# the mechanical proof that the model forward path needs no device.
[lints]
workspace = true

[dependencies]
# The artifact the fire walks. The arrow points this way on purpose: `compile`
# is pure and knows no engine, and `fire::walk` iterates what it produced.
model-compiler = { path = "../model-compiler" }

# The vocabulary both ends of that walk are written in: `Plan`, `Node`,
# `ClassSet`, `Operation` — named directly rather than one re-export deep.
model-ir = { path = "../model-ir" }

[dev-dependencies]
# Six model texts somebody else wrote, four platforms, sixty layers of nested
# split and merge — what the hand-built fixtures in `src/fire/` cannot supply.
# A dev edge only, and it does not cycle: nothing under `models` names this crate.
models = { path = "../models" }
model-dsl = { path = "../model-dsl" }
