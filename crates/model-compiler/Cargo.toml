[package]
name = "model-compiler"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Forward-pass lowering: a traced form plus the engine's rows to the flat launch list, operands and buffers a driver executes."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

# No `build.rs` here any more. It fingerprinted the TRACER, and the tracer is
# `model-dsl` + `model-ir` -- this crate consumes traced forms and does not
# decide what one is, so hashing its sources would have produced a number that
# moved for changes the fingerprint is not about. `compiler_version()` moved
# with it, to the crate that produces plans.

[lib]
name = "model_compiler"
path = "src/lib.rs"

[dependencies]
# The traced form, and the signature tables that come with it. The ONLY
# dependency: lowering reads an IR and writes rectangles, so it needs the
# vocabulary and nothing else -- no authoring surface, no device, no backend.
#
# The kernel tables are reached THROUGH `model-ir` (`model_ir::kernels`)
# rather than depended on here, which is what stops a second, differently
# featured view of the same table from existing: `check_plan` at trace time
# and `sig_in` at lowering time must agree about what a symbol's contract is,
# and they agree by being the same table.
model-ir = { path = "../model-ir" }
serde_json = "1"
