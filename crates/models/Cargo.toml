[package]
name = "models"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The model catalog of the menlo stack, built from the Starlark packages under models/, and each family's chat template, tokenizer contract and media front ends."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "models"
path = "src/lib.rs"


[dependencies]
chat-template = { path = "../chat-template" }
poem-compiler = { package = "pie-poem-compiler", path = "../poem-compiler" }
poem = { package = "pie-poem", path = "../poem" }
poem-ir = { package = "pie-poem-ir", path = "../poem-ir" }
checkpoint = { path = "../checkpoint" }
serde_json = "1"
thiserror = "2.0"
tokenizer = { path = "../tokenizer" }
ztensor = { workspace = true }

[dev-dependencies]
ztensor-compat = { workspace = true }

[lints]
workspace = true
