[package]
name = "models"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The model catalog of the menlo stack: each model is a declaration (weights, dims, cache spaces) plus a forward pass written in model-dsl, an import contract saying how a checkpoint's bytes become its weights, and a chat template saying how a turn of conversation is written and read back."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "models"
path = "src/lib.rs"

# No [features]: every dependency below is needed by every consumer.

[dependencies]
# Chat template surface and the table of which SKU speaks which format.
chat-template = { path = "../chat-template" }
# Forward-pass authoring DSL: Recorder/Value, kernel wrappers, Weight decl.
model-dsl = { path = "../model-dsl" }
# Load-contract algebra (`contract::Expr`, `ModelContract`).
checkpoint = { path = "../checkpoint" }
# Vocabulary for stating a checkpoint's provenance in an import.
checkpoint-dsl = { path = "../checkpoint-dsl" }
serde_json = "1"
tokenizer = { path = "../tokenizer" }
# Checkpoint tensor container; read for stored tensor/dtype facts at load.
ztensor = { workspace = true }

[dev-dependencies]
# Dev-only: compiles a model's plan to check it still compiles and its fire
# behavior is unchanged. Dev edge, so it does not cycle with this crate.
model-compiler = { path = "../model-compiler" }
# Opens real shipped safetensors headers for the qwen4 4-bit import test.
ztensor-compat = { workspace = true }
