[package]
name = "models"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The model catalog of the menlo stack: each model is a declaration (weights, dims, cache spaces) plus a forward pass written in poem-dsl, an import contract saying how a checkpoint's bytes become its weights, and a chat template saying how a turn of conversation is written and read back."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "models"
path = "src/lib.rs"


[dependencies]
chat-template = { path = "../chat-template" }
poem-compiler = { package = "pie-poem-compiler", path = "../poem-compiler" }
poem-dsl = { package = "pie-poem-dsl", path = "../poem-dsl" }
poem-ir = { package = "pie-poem-ir", path = "../poem-ir" }
checkpoint = { path = "../checkpoint" }
checkpoint-dsl = { path = "../checkpoint-dsl" }
serde_json = "1"
tokenizer = { path = "../tokenizer" }
ztensor = { workspace = true }

[dev-dependencies]
poem-ir = { package = "pie-poem-ir", path = "../poem-ir" }
ztensor-compat = { workspace = true }

[lints]
workspace = true
