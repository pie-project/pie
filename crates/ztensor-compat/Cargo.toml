[package]
name = "ztensor-compat"
version = "3.0.0"
description = "Foreign tensor formats projected into the zTensor object model"
authors = ["In Gim <in.gim@icloud.com>"]
edition = "2021"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/pie-project/ztensor"
readme = "README.md"
keywords = ["tensor", "safetensors", "gguf", "onnx", "hdf5"]
categories = ["encoding", "parser-implementations", "science"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["safetensors", "gguf"]
safetensors = ["dep:serde_json"]
gguf = []
npz = ["dep:zip"]
pickle = ["dep:zip"]
hdf5 = ["dep:flate2"]
onnx = []

[dependencies]
ztensor = { workspace = true }
memmap2 = "0.9"
serde_json = { version = "1", optional = true }
zip = { version = "7", optional = true, default-features = false, features = ["deflate"] }
flate2 = { version = "1", optional = true }

[dev-dependencies]
zip = { version = "7", default-features = false, features = ["deflate"] }
