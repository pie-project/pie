[package]
name = "pie-poem"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The language a model is written in: weight declarations, the forward pass recorded over the typed IR, the import contract reading a checkpoint onto the weights, and the Starlark packages a model is written as. It names no backend and reaches no device."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "poem"
path = "src/lib.rs"

[dependencies]
poem-ir = { package = "pie-poem-ir", path = "../poem-ir" }
checkpoint = { path = "../checkpoint" }
ztensor = { workspace = true }
starlark = "0.14.2"
allocative = "0.3.6"
starlark_derive = "0.14.2"
anyhow = "1"
blake3 = "1.8"

[dev-dependencies]
tempfile = "3"

# The workspace lints, with unsafe_code at deny rather than forbid: starlark
# 0.14's `ProvidesStaticType` derive emits an `unsafe impl`, allowed in
# `star` alone.
[lints.rust]
unsafe_code = "deny"
missing_docs = "allow"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
