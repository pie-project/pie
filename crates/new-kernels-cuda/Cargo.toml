[package]
name = "new-kernels-cuda"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Pure CUDA kernel definitions: jit unit names, argument marshalling, and launch geometry over a stream. Knows nothing about the IR; a driver Run resolves plan ids to handles and calls these entry functions."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

# The build script regenerates the carried-header table into OUT_DIR, for the
# same reason the old crate's did: a checked-in list still COMPILES when it is
# stale, and a stale list is a first-fire failure on a machine with a GPU —
# exactly the run-time failure generation exists to convert into a build-time
# one. It walks two directories, reads `#include` lines, and depends on
# nothing, so a box with no CUDA toolkit still builds.

[lib]
name = "new_kernels_cuda"
path = "src/lib.rs"

[features]
# Nothing by default: the handle vocabulary and every entry function compile
# on a machine with no toolkit, and a fire without a runtime answers with a
# typed refusal. This keeps a plain workspace build green everywhere.
default = []

# Exactly one of these turns the runtime on, and it must match the CUDA
# runtime that will be LOADED. The split is the driver's and it is not a
# style choice: `cudaGraphAddNode` has five parameters in `libcudart.so.12`
# and six in `libcudart.so.13`, so a binary that picked the wrong one
# segfaults inside the driver. Cargo unifies features across a graph, so a
# crate that hard-coded either would silently decide for every other crate
# in the build.
cuda-12 = ["_cuda", "cudarc/cuda-12080"]
cuda-13 = ["_cuda", "cudarc/cuda-13000"]

# Private: "some CUDA version was chosen". The runtime layers gate on this
# rather than on the two above, so that a build with no version selected
# produces one actionable error instead of burying it under every use of
# `cudarc`.
_cuda = ["dep:cudarc"]

[dependencies]
# `KernelError` — the shared answer vocabulary every kernel entry returns
# (design §8: `Unsupported`/`DtypeUnsupported` exist exactly for these fns).
new-kernels = { path = "../new-kernels" }
# `Dtype` only. new-kernels does not re-export it, so this edge is named
# directly — it adds a name, not a dependency: new-kernels already carries
# new-model-ir into the tree. Nothing else of the IR is spoken here.
new-model-ir = { path = "../new-model-ir" }

# The runtime, and the whole reason this crate can exist at all. Dynamically
# loaded (`fallback-dynamic-loading`), so nothing links against a toolkit and
# a build on a machine with no CUDA still produces a binary that RUNS on one
# that has a driver.
#
# `nvrtc` is not an optimisation: a kernel in this crate exists only as text,
# so a process that cannot open `libnvrtc.so` cannot fire one.
cudarc = { version = "0.19.8", optional = true, default-features = false, features = [
    "std",
    "driver",
    "runtime",
    "nvrtc",
    # `gemm`'s host programs. The dense autotuner and the plan cache are
    # `cublasLtMatmul` and nothing else, and `gemm::dense` issues them.
    #
    # Enabling these generates BINDINGS, not link flags:
    # `fallback-dynamic-loading` still resolves every symbol with `dlopen` on
    # first use, so **a box with no CUDA toolkit still builds** — the property
    # that is easiest to break by reaching for a linked symbol instead.
    "cublas",
    "cublaslt",
    # `dist`'s collectives. Bindings only, same as the two above: the symbols
    # resolve on first use, and the first use requires a communicator the
    # driver could only have built with libnccl already open. A box with no
    # NCCL still builds AND serves — single-rank contexts carry no
    # communicator, and `dist::` answers them with a typed refusal.
    "nccl",
    "fallback-dynamic-loading",
] }

# A refusal on the launch path is reported, not returned twice: `fire` gives
# the caller an error AND says once per symbol what went wrong, because the
# same broken instantiation is fired once per layer per token.
tracing = "0.1"
