[package]
name = "kernels-cuda-new"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "CUDA kernels as a JIT: the signature table, the device sources carried in the binary, and the runtime that compiles and fires them."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false
build = "build.rs"

[lib]
name = "kernels_cuda_new"
path = "src/lib.rs"

# NO `links` key, and that absence is the design. `kernels-cuda` declares
# `links = "pie_kernels_cuda"` because it BUILDS an archive with CMake and has
# to publish its include trees to the one crate that compiles against them.
# This crate builds no archive: a kernel is text in the binary and NVRTC turns
# it into a cubin at run time, so there is nothing to link, nothing to publish,
# and no toolkit needed at build time.
[features]
# The table alone. This is the surface `model-compiler` takes -- it reads a
# row on every trace and must never pay for a GPU dependency to look one up --
# and it is why `cudarc` is optional rather than a plain dependency. See
# `src/lib.rs` for the three layers this gates.
default = []

# Exactly one of these turns on layer 3, and it must match the CUDA runtime
# that will be LOADED. The split is `driver-cuda`'s and it is not a style
# choice: `cudaGraphAddNode` has five parameters in `libcudart.so.12` and six
# in `libcudart.so.13`, so a binary that picked the wrong one segfaults inside
# the driver. Cargo unifies features across a graph, so a crate that hard-coded
# either would silently decide for every other crate in the build --
# `model-loader`'s Cargo.toml records that exact collision having happened.
cuda-12 = ["_cuda", "cudarc/cuda-12080"]
cuda-13 = ["_cuda", "cudarc/cuda-13000"]

# Private: "some CUDA version was chosen". Layer 3 is gated on this rather
# than on the two above, so that a build with no version selected produces one
# actionable error instead of burying it under every use of `cudarc`.
_cuda = ["dep:cudarc"]

[dependencies]
# The vocabulary a row is written in: `KernelSig`, `LaunchRule`, `Ty`,
# `Source`. Layer 1 is this crate's re-export of it.
kernels = { path = "../kernels" }

# NO dependency on `kernels-cuda`, and that absence is recent enough to be
# worth stating. This crate took its rows from there through a
# `default-features = false` edge, because while both the AOT and the JIT path
# must run a symbol has to have exactly ONE contract and two copies of a table
# are two contracts waiting to disagree. The seam closed by moving the rows
# HERE rather than by retiring the archive -- 109 of the 198 rows still have
# no JIT twin -- and `kernels-cuda` now takes them back through an edge in the
# opposite direction and re-exports them under the paths it used to own. A
# dependency added back in this direction is a cycle, which is the one thing
# cargo will report immediately.

# Layer 3, and the whole reason this crate can exist at all. Dynamically
# loaded (`fallback-dynamic-loading`), so nothing links against a toolkit and
# a build on a machine with no CUDA still produces a binary that RUNS on one
# that has a driver.
#
# `nvrtc` is not an optimisation here the way it is for `driver-cuda`'s PTIR
# plane: a kernel in this crate exists only as text, so a process that cannot
# open `libnvrtc.so` cannot fire one.
cudarc = { version = "0.19.8", optional = true, default-features = false, features = [
    "std",
    "driver",
    "runtime",
    "nvrtc",
    # `x::gemm`'s host programs. The dense autotuner and the plan cache are
    # `cublasLtMatmul` and nothing else, and `x::gemm::dense` issues them —
    # they came in from `driver-cuda/src/fire/gemm.rs` in §5 step 5 and the
    # calls did not change, only the crate they live in.
    #
    # Enabling these generates BINDINGS, not link flags:
    # `fallback-dynamic-loading` still resolves every symbol with `dlopen` on
    # first use, so **a box with no CUDA toolkit still builds** — the property
    # `driver-cuda` has had since the first cuBLAS call and the one that is
    # easiest to break by reaching for a linked symbol instead.
    "cublas",
    "cublaslt",
    "fallback-dynamic-loading",
] }

# A refusal on the launch path is reported, not returned twice: `fire` gives
# the caller an error AND says once per symbol what went wrong, because the
# same broken row is fired once per layer per token.
tracing = "0.1"

[build-dependencies]
# `build.rs` reads this crate's own emitter and tables through `#[path]`,
# because a build script cannot depend on the crate it builds. That works only
# because those modules import nothing but this -- `src/emit.rs` named
# `kernels_cuda::norm_device::DeviceKernel` until the rows moved into
# `src/device.rs`, and it reaches for `crate::device` now, which the script
# pulls in beside it.
kernels = { path = "../kernels" }

# The probes need a CUDA runtime, and `cargo test` builds examples -- so
# without this a feature-free `cargo test` fails on `use cudarc`, which is the
# one build this crate most wants to keep working. `required-features` is how
# a target says "skip me" rather than "fail"; the alternative, `#[cfg]` inside
# each example, leaves a file whose every item is compiled out and whose `main`
# still has to exist.
#
# Autodiscovery stays ON, so a new `examples/*.rs` is picked up as before. A
# new probe that touches `cudarc` must be declared here too, or it breaks the
# feature-free build the same way -- which is why every entry below names the
# same feature and why they are listed together.
[[example]]
name = "header_probe"
required-features = ["_cuda"]

[[example]]
name = "stdlib_probe"
required-features = ["_cuda"]

[[example]]
name = "cg_probe"
required-features = ["_cuda"]

[[example]]
name = "mma_probe"
required-features = ["_cuda"]

[[example]]
name = "flashinfer_probe"
required-features = ["_cuda"]

[[example]]
name = "fp8_pipeline_probe"
required-features = ["_cuda"]

[[example]]
name = "halftype_parity"
required-features = ["_cuda"]

# Reads the tables and nothing else, so it runs on a machine with no CUDA --
# which is when someone is most likely to ask how far the migration got.
[[example]]
name = "migration_status"

[[example]]
name = "unit_probe_attn_heavy"
required-features = ["_cuda"]

[[example]]
name = "unit_probe_attn_small"
required-features = ["_cuda"]

[[example]]
name = "unit_probe_mlp"
required-features = ["_cuda"]

[[example]]
name = "unit_probe_norm"
required-features = ["_cuda"]

[[example]]
name = "unit_probe_quant"
required-features = ["_cuda"]

[[example]]
name = "unit_probe_rope_layout"
required-features = ["_cuda"]

[[example]]
name = "unit_probe_ssm"
required-features = ["_cuda"]

[[example]]
name = "argform_probe"
required-features = ["_cuda"]

# Measures whether three rows classified "no device text in this tree" would
# vendor into `csrc/vendor/flashinfer/` and compile under NVRTC. It stages
# upstream text in memory from the tree CPM already fetched -- it writes
# nothing and migrates nothing.
[[example]]
name = "vendor_probe"
required-features = ["_cuda"]
