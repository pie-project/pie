# ── THIS MANIFEST RESOLVES AGAIN (P5b) ─────────────────────────────────
#
# R3 put `driver-wgpu` in the root workspace's `exclude` list and left this
# file pointing at `../model-legacy`, a directory that was not there. The note
# that stood here said why a dangling path was the honest state: the crate was
# not being repaired, it was being REWRITTEN, and editing the line to a crate
# the source could not use would have been "a manifest that resolves and a
# build that does not, which is a worse lie than a dangling path."
#
# The rewrite happened. P5b gave this driver `src/baker/` -- a `Program` walk
# of its own through the dispatch generated from `kernels-wgpu`'s 21 claims --
# so what it depends on now is `crates/model`, exactly as `driver-cuda` and
# `driver-metal` do. Every legacy edge below is gone: `model-legacy`,
# `model-dsl-legacy`, `model-loader` and `model_compiler::lower`.

[package]
name = "driver-wgpu"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "The WebGPU execution shell, in Rust: adapters and devices, bind groups, WGSL pipelines and command encoding. Shares the claim vocabulary with the other drivers and needs neither an SDK nor a C toolchain."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

[lib]
name = "driver_wgpu"
path = "src/lib.rs"

# No `build.rs`. `kernels-wgpu` embeds every shader source in its rlib with
# `include_str!` and serves them from `kernels_wgpu::entrypoint_source`, so
# there is no directory to locate and nothing to relay.
#
# `driver-vulkan` had one, whose only job was to relay
# `DEP_PIE_KERNELS_VULKAN_SPV_DIR` on the grounds that SPIR-V is a build
# product that has to be found on disk. It is deleted: a build product can be
# `include_bytes!`d as easily as a source can be `include_str!`d, so neither
# sibling has a script now.

# NOT `[lints] workspace = true`, for the reason both siblings give: that table
# sets `unsafe_code = "forbid"`, and they cannot keep it because every `ash`
# entry point and every `objc2` message send is unsafe by construction.
#
# This crate CAN keep it, and `lib.rs` says so -- `wgpu` is a safe API, so the
# whole crate is safe Rust including the device half. The table is still
# restated by hand rather than taken whole, because taking it would put the
# ratchet in a manifest where a reader looking for the crate's guarantees does
# not pass; the ratchets belong next to each other, in `lib.rs`, where the
# argument for them is.

[features]
# No default, for the reason `driver-metal/Cargo.toml` states at length: a
# default has to be turned OFF to reach the portable half, and a check that can
# be skipped will be.
#
# The split is a THIRD one, and the difference is the point -- and P5b made it
# sharper rather than softer. `driver-metal` splits on what a COMPILER will
# accept: no Linux host can build an `objc2` message send, so its device half
# is unreachable here and the portable half is all a Linux sweep can carry.
# `driver-vulkan` splits on what needs a GPU to be PRESENT, since `ash` is a
# loader that builds anywhere. Here BOTH halves build anywhere AND the shader
# front end runs anywhere: `naga` is Rust, so this crate parses the WGSL it
# will dispatch, reads off its workgroup and its bindings, and checks them
# against the row -- with no adapter, no driver and no SDK. `native` gates only
# what needs an ADAPTER to answer.
#
# What P5b added to that argument: the BAKER EXECUTOR is in the portable half.
# `baker/` names no `wgpu` type at all -- `Ctx` is `dyn Encode`, so the walk,
# the marks, the bound statement and the resolve pass are all checkable with no
# adapter in the process. That is metal's design restated, and here it means a
# featureless `cargo test -p driver-wgpu` covers the executor whole.
default = []

# The device half: `wgpu`, an adapter, a queue, real pipelines.
native = ["dep:wgpu"]

[dependencies]
# The handshake the engine's seam speaks: `DeviceFacts` and the ABI version.
# `default-features = false` drops the tarpc service, which is the only thing
# in that crate this one does not want: tokio's platform closure carries
# `windows-sys` and `js-sys`, and `tests/pure.rs` is not going to be taught to
# ignore a `-sys` crate.
driver-api = { path = "../driver-api", default-features = false }

# THE HALF OF THE BAKER EXECUTOR THAT IS NOT THIS PLANE: the walk over a
# `Program`, the bound statement a generated dispatch reads, the frame's
# numbering and the load-time resolve pass. `src/baker/plane.rs` is this
# crate's answer to its two traits, and the five modules left in `src/baker/`
# are the ones that MEASURABLY differ from `driver-metal`'s -- the region, the
# staging, the views, and the two that plan a dispatch.
#
# It needs no adapter, no toolkit and no OS, so it is a workspace default
# member and its tests run in an unqualified sweep. This crate's whole baker
# executor is in the portable half for the same reason it is: `Ctx` is
# `dyn Encode`, so nothing on that path names a `wgpu` type.

# Claim bodies state their logical lanes with the shared operand vocabulary;
# the loaded WGSL pipeline supplies the workgroup divisor.
kernels = { path = "../kernels" }

# The WebGPU signature table, the launch ABI, the WGSL sources themselves --
# and, since P5b, `points_dispatch`: the generated data->type crossing this
# driver's walk fires every statement through. No feature to select: that crate
# has none, because WGSL is not a build product. `entrypoint_source` is what
# `src/reflect.rs` parses, so the shader tree is a dependency of the PORTABLE
# half here where `kernels-vulkan`'s `.spv` tree is a dependency of a build
# script.
kernels-wgpu = { path = "../kernels-wgpu" }

# THE CATALOG, and the edge that replaced the quarantine. `src/baker/mod.rs`
# reads a row (`model::serve::row`), traces it for THIS PLANE
# (`model::trace_of(sku)(Backend::Wgpu)`), sizes the tower off the same plan
# (`model::deployment::Deployment::of`) and produces the weights a plan names
# (`model::produce`). This is `driver-metal`'s edge, taken for its reasons: one
# catalog, and a driver that names a plane rather than observing a binding.
model = { path = "../model" }

# The plan a driver executes. `model_compiler::program::{Program, bound}` is
# what `baker::Baked` holds a lane of and what `baker::walk` steps through;
# `model-ir` beside it for the traced `Plan` those name.
#
# `model_compiler::lower` STOOD HERE and is deleted -- it was this crate's one
# hard-broken edge at R3, and `src/binding.rs`, `src/dispatch.rs` and
# `src/lowering/` reached it. The walk replaced all three readers.
model-compiler = { path = "../model-compiler" }
model-ir = { path = "../model-ir" }

# The PTIR channel plane: the program/channel/instance registry, the ring and
# every bind-time derivation. A REAL dependency and not a dev one -- this is
# not a checkpoint format, it is the plane the engine registers work on, and
# `src/programs.rs` serves it.
#
# `default-features = false` on the same terms `driver-api` above gets it, and
# for a defect that was found rather than predicted: `driver` names no `tarpc`
# anywhere, but its edge took `driver-api`'s DEFAULT features, and `rpc`
# reaches `js-sys` and `wasm-bindgen-shared` through tokio. `tests/pure.rs`
# caught that in `driver-vulkan` and would catch it here.
driver = { path = "../driver" }

# The WGSL front end, DIRECTLY and not through `wgpu`.
#
# `wgpu` re-exports the same crate, and taking it that way would work and would
# be wrong: reflection is wanted in the PORTABLE half. `src/reflect.rs` answers
# what a module declares -- its workgroup, its bindings, its uniform block --
# and every one of those questions is about the SOURCE, not about a device. A
# `naga` edge is what lets `cargo test -p driver-wgpu` with no features check a
# real shader against a real row on a machine with no adapter in it.
#
# `wgsl-in` is named because `naga`'s default feature set has no front end at
# all: without it `naga::front::wgsl` does not exist. Pinned to the version
# `wgpu` 30 resolves, so the two are one crate and cannot disagree about what
# WGSL is.
naga = { version = "30", features = ["wgsl-in"] }

# `default-features = false` drops the windowing and surface stack -- this is
# compute, there is no swapchain. `vulkan`/`metal`/`dx12` are the three native
# backends worth having; `wgsl` is the front end, and it is the same `naga`
# above, unified by cargo. `noop` is deliberately absent: a shell that silently
# ran on no device would report success for nothing.
wgpu = { version = "30", default-features = false, features = [
    "wgsl",
    "vulkan",
    "metal",
    "dx12",
], optional = true }

[dev-dependencies]
# TEST-ONLY, and the one test edge that is a REGULAR dependency of this crate
# too: `tests/cooperative.rs` opens its own device, because `src/device.rs`
# asks for `ExperimentalFeatures::disabled()` and that file exists to measure
# what the experimental token buys. An integration test cannot reach a
# `[dependencies]` entry, so the same crate is named again here. Identical
# version and features, so cargo unifies the two and nothing is built twice.
wgpu = { version = "30", default-features = false, features = [
    "wgsl",
    "vulkan",
    "metal",
    "dx12",
] }

# `tests/pure.rs` only: reading what `cargo metadata` says the resolver did, so
# that "this crate is pure Rust" is asked of the closure rather than of a
# reading of the manifests. That question is this crate's headline -- `wgpu`
# being pure Rust is the entire reason this backend exists beside CUDA and
# Metal -- so the test that asks it is not optional furniture.
serde_json = "1.0"

# `model-legacy`, `model-dsl-legacy` AND `model-loader` STOOD HERE, and all
# three left with the tests that named them. The first two are deleted crates
# (R3). `model-loader` is alive and is deliberately NOT taken back:
# `tests/checkpoint.rs` wanted it for a snapshot's tensor names and extents,
# and `driver-metal` dropped the same edge at P5a for the reason that applies
# here unchanged -- a driver that depended on a checkpoint FORMAT would be a
# driver that could not simply be handed bytes. What a plan's params are is
# `model::produce`'s answer now, and `baker::join` is where it is checked.

# Neither an adapter nor a shader compiler: it asks the resolver what this
# crate depends on. Ungated on purpose -- the constraint it checks is about the
# builds that DO NOT have a toolchain, and it runs the query with `native` ON
# because a purity claim about the half without the GPU API is not the claim.
[[test]]
name = "pure"

# The device half's own suite: an adapter, real pipelines, real numbers.
#
# `required-features` and NOT an `#[ignore]` on every test, which is the shape
# that rots: an ignored test is one nobody runs, and a suite that needs a GPU is
# exactly the suite whose failures matter. Gated on the feature, so a build box
# with no adapter does not compile it; on a machine that HAS one it runs in a
# plain `cargo test -p driver-wgpu --features native`.
#
# A machine with the feature on and no adapter answering is a third case, and
# each test SKIPS with a printed reason rather than failing -- see
# `tests/device.rs`'s own note on why that is not the same as ignoring it.
#
# This stanza and `tests/device.rs` must land and leave TOGETHER, and both
# orders have already been got wrong once. A stanza with no file makes this
# manifest unparseable, and cargo parses every member's manifest for ANY
# command -- so it does not break one crate's tests, it breaks `cargo check` and
# `cargo test -p kernels-wgpu` with an error ("can't find `device` test") whose
# text has no relationship to what the person ran. A file with no stanza is the
# mirror image and quieter: cargo AUTO-DISCOVERS `tests/*.rs`, so the suite
# compiles into the default build, where everything it names is behind
# `#[cfg(feature = "native")]` and does not exist.
[[test]]
name = "device"
required-features = ["native"]

# THE FIRST REAL SHADER-PLANE KERNEL FIRE (P5b), and it needs an adapter and
# nothing else: no checkpoint, no catalog row, no lane. One claim body --
# `norm.rmsnorm`, which this plane DOES claim -- driven through the generated
# dispatch and the baker walk onto the L40S, and its output compared against a
# host reference computed in f64. Same stanza and the same skip protocol as
# `device` above.
#
# It is a separate target from `device` because the question is a different
# one. `device` asks whether this crate's device half works; this asks whether
# the BAKER PATH does -- statement -> `BoundOp` -> generated dispatch -> claim
# body -> `Encode::fire` -> a real WGSL dispatch -> numbers that are right.
[[test]]
name = "device_fire"
required-features = ["native"]

# The matrix unit, which this crate does not use and can. Same stanza and the
# same reasons; what it adds is a THIRD absence -- the adapter may answer and
# offer no cooperative matrix, which the tests print and skip on.
[[test]]
name = "cooperative"
required-features = ["native"]

# The lse plane and the sink rescale: `attention.{decode_lse, prefill_lse,
# sink}`, fired through the shipped claim bodies onto the adapter. Same stanza
# and the same skip protocol as `device` above.
#
# A separate target from `device_fire` because the question is different again.
# That one asks whether the BAKER PATH computes a number; this one asks whether
# three specific points compute the RIGHT numbers, and it drives the claim
# bodies directly (`Ctx` is `dyn Encode`, so a recorder is a whole plane) rather
# than through a plan. Two of its six items are fault injections that compile
# the shipped expansion with one constant changed and assert the comparison goes
# red.
[[test]]
name = "device_sink"
required-features = ["native"]

# `[[test]] name = "serving"` STOOD HERE and left with its file. That suite
# (6,227 lines, 9 of its 32 tests ignored) drove `turns::Serving` through a
# `model_compiler::lower` lowering of a `model-legacy` forward plan -- three
# deleted things in one sentence. `baker/` is what serves now, and what tests
# it on a machine with no adapter is `the_walk_is_the_program`, which needs no
# stanza because it needs no feature.
