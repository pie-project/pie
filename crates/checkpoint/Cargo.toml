[package]
name = "checkpoint"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Typed checkpoint compiler: a checkpoint and a contract in, a verified memory layout a device can be pointed at out."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "checkpoint"
crate-type = ["rlib"]
path = "src/lib.rs"


[features]
default = ["testkit"]

testkit = []


[dependencies]
dtype = { path = "../dtype" }
half = "2"
libc = "0.2"
ztensor = { workspace = true }
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ztensor-compat = { workspace = true, features = [
    "safetensors",
    "gguf",
    "npz",
    "pickle",
    "hdf5",
    "onnx",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
