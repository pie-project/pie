[package]
name = "ztensor"
version = "3.0.0"
description = "zTensor v3: an aligned, verifiable container format for tensor data"
authors = ["In Gim <in.gim@icloud.com>"]
edition = "2021"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/pie-project/ztensor"
readme = "README.md"
keywords = ["tensor", "checkpoint", "mmap", "container", "safetensors"]
categories = ["encoding", "data-structures", "science"]

[package.metadata.docs.rs]
all-features = true

[features]
zstd = ["dep:zstd"]

[dependencies]
memmap2 = "0.9"
sha2 = "0.10"
unicode-normalization = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = { version = "0.13", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
