[package]
name = "driver-cuda"
version = "0.4.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "The CUDA execution shell, in Rust: streams, capture-safe allocation, graphs (incl. conditional nodes) and the elastic VMM arena."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

# Deliberately no `links` key, for the reason `driver-metal` states: the
# C++ shell publishes `pie_driver_cuda_lib`, and two packages in one workspace
# claiming one `links` value is a RESOLUTION error, not a link error -- it
# would break `cargo metadata` for everyone rather than just for whoever
# selected this crate.

[lib]
name = "driver_cuda"
path = "src/lib.rs"

# NOT `[lints] workspace = true`. That table sets `unsafe_code = "forbid"`,
# which every `cudarc::*::sys` call violates by construction. The rest of it
# (`missing_docs`, the clippy ratchets) is worth having and is set in
# `lib.rs`, where `unsafe_code` can be left out of the list.

[features]
# Exactly one of these must be on, and it must match the CUDA runtime that
# will be *loaded*, not merely the one available at build time. See
# `src/cuda/graph.rs`'s `add_node` for what goes wrong otherwise: the symbol
# `cudaGraphAddNode` has five parameters in `libcudart.so.12` and six in
# `libcudart.so.13`, so a mismatched build segfaults inside the driver rather
# than returning an error. `Device::bind` checks at startup so the failure is
# a message instead of a crash.
#
# There is deliberately NO `default`. A default would have to be a guess about
# someone else's machine, and the cost of guessing wrong is a segfault in the
# driver rather than a build error -- so the honest thing is to refuse to
# build until a human says which runtime this binary will meet. `lib.rs`
# turns the omission into a compile_error that says so.
#
# `kernels-cuda-new/cuda-1X` rides along, and it is not optional politeness:
# that crate's runtime layer is the one that now COMPILES AND FIRES the JIT
# rows (`bind::jit`), so it loads a libcudart in this process. Two crates in
# one binary that disagreed about which would be one set of `cudarc` bindings
# calling the other's runtime -- the `cudaGraphAddNode` arity trap above,
# reached from a second direction. The version is selected in exactly one
# place, here, and inherited.
cuda-12 = ["_cuda", "cudarc/cuda-12080", "model-loader?/cuda-12", "kernels-cuda-new/cuda-12"]
cuda-13 = ["_cuda", "cudarc/cuda-13000", "model-loader?/cuda-13", "kernels-cuda-new/cuda-13"]

# Private: "some CUDA version was chosen". Modules are gated on this so that a
# build with no version selected emits one actionable error instead of burying
# it under every use of `cudarc`. It also gates the test targets, which keeps
# `cargo test` with no features on the same single error.
_cuda = ["dep:cudarc"]

# There is deliberately NO `default`, and deliberately no `portable`
# either. A default would be a guess about someone else's machine; a
# `portable` feature would be one whose job is to SUBTRACT, which is the
# shape that breaks under Cargo's feature unification.
#
# With NO feature this crate builds its portable half — geometry,
# budgets, plans, the profile cache — and `tests/portable_half.rs` is the
# target that runs. See `src/lib.rs` for why that is safer than refusing
# to build, and `src/gpu/mod.rs` for where the line runs.

# The launch bridge (retirement plan phase A): build.rs generates the
# `extern "C"` shim and the Rust bindings from the kernel table, compiles the
# shim against the real headers, and links the kernels archive so
# `launch::ffi` can actually be called. Off by default, deliberately: the
# bridge needs the CUDA toolkit at BUILD time (real `cuda_runtime.h`, nvcc
# for the archive), and this crate's toolkit-free build — cudarc resolves
# symbols by `dlopen`, nothing links — is load-bearing for CI.
#
# `kernels-cuda/native` rather than `dep:kernels-cuda`: the table itself is
# now a plain dependency (see `[dependencies]`), because `bind::launch` reads
# a row's launch rule with no shim in the build. What `bridge` adds is the
# ARCHIVE, which is that crate's `native` feature and nothing else.
bridge = ["kernels-cuda/native"]

# Phase D's door: the thirteen `pie_cuda_*` exports the engine binds
# (retirement plan — "the cutover boundary, measured"). Implies `bridge`
# (the shell runs the executor). MUTUALLY EXCLUSIVE with linking the C++
# shell into the same binary: same symbols, one provider.
abi = ["bridge", "dep:driver-api", "dep:model-loader", "model/contract"]

[dependencies]
# The CUDA version is pinned EXPLICITLY rather than through
# `cuda-version-from-build-system`, and that is the whole reason this crate
# compiles on a machine with no CUDA at all: the build-system feature probes
# `nvcc` and fails without one, while a named version plus
# `fallback-dynamic-loading` emits no link line and resolves every symbol
# through `dlopen` on first call. `csrc/CMakeLists.txt` looks for
# `/usr/local/cuda-12.8`, so 12080 is the toolkit this tree is written
# against; conditional graph nodes need >= 12030 and would silently vanish
# from `sys` below that.
#
# `default-features = false` drops cublas/cublaslt/curand/nvrtc for now. They
# come back one at a time, as the subsystem that needs them lands -- the
# feature list is meant to read as the API surface this shell actually uses.
#
# `optional = true` is not about the dependency being optional -- there is no
# build of this crate without it. It exists so that selecting no CUDA feature
# leaves cudarc out of the graph entirely, and the build then fails on
# `lib.rs`'s `compile_error!`, which names the two features. Without it, the
# first thing to fail is cudarc's own build script, which panics about a
# missing CUDA version and says nothing about how to fix it.
cudarc = { version = "0.19.8", optional = true, default-features = false, features = [
    "std",
    "driver",
    "runtime",
    # The first subsystem to come back (see the note above): the live
    # `CublasOps` behind `cuda::cublas::CublasHandle` makes the five handle
    # calls the C++ wrapper makes. Dynamically loaded like everything else.
    "cublas",
    # The second: PTIR's compile plane. The host emits ONE self-contained CUDA
    # translation unit per fused region and this driver carries no emitter, so
    # NVRTC is not an optimisation -- a program with a generated region cannot
    # run without it. Dynamically loaded like the rest, which is what keeps the
    # toolkit-free build: `libnvrtc.so` is resolved on first compile, and a box
    # that never registers a PTIR program never opens it.
    "nvrtc",
    "fallback-dynamic-loading",
] }

# The shell is a library loaded into someone else's process, so a degraded
# path (a peer that turns out not to be reachable, say) has to be reported
# through the host's subscriber rather than printed. The C++ writes those to
# `std::cerr`, which is the behaviour being replaced, not preserved.
tracing = "0.1"

# The planner profile cache is a JSON document shared with the C++, which
# parses it with nlohmann. Only the READER is serde_json: the writer is
# `store::json`, hand-written so that key order and float formatting match
# nlohmann exactly.
#
# `preserve_order` is requested DELIBERATELY, even though this crate does not
# need insertion order. Four other crates in this workspace already enable it
# (`engine`, `grammar`, `model`, `tokenizer`) and Cargo unifies features, so
# the real build gets an `IndexMap` whatever this line says. Asking for it here
# means the isolated `cargo test -p driver-cuda` build sees the same map
# type as the workspace build -- without it, `Map` falls back to a `BTreeMap`
# that is already sorted, `store::json`'s explicit key sort becomes dead code
# in the tests, and the parity proof stops covering the one thing that sort
# exists to prevent.
serde_json = { version = "1.0", features = ["preserve_order"] }

# The `pie.model/1` schema. Two features now, not three, and the third's
# disappearance is the refactor in one line: `config` is GONE, because the
# `HfConfig` this driver used to read back out of the artifact is gone with
# it. A checkpoint's identity is a `model::catalog` row, linked into both
# this driver and the worker, so there is nothing to parse and nothing to
# agree about.
#
# The `contract` because the library authors a load contract
# (`model::boot::compile_load_plan` -> `model::contract::author_with_policy`),
# and carries `model::encoding` with it. There is no second feature to name:
# `model::catalog`'s `deployment`/`trace` used to be gated on a `forward`
# feature that every consumer enabled, and it is deleted -- the family texts
# are as ungated as the rows they belong to.
#
# Getting the OLD list to three took two wrong answers -- it said `config`
# alone for a while and still built, then `contract` alone, and still built.
# Both times for the same reason: this crate's DEV-dependency on `model`
# names every feature, and the resolver unifies them back on for every
# `cargo test` and every `cargo check` that resolves dev targets. So the
# library declaration is the one thing in this file that NOTHING in the
# workspace reads -- CI's `cargo test --workspace` excludes this crate, and
# any build that includes it also builds its tests.
#
# `cargo tree -e features,no-dev` is what shows the truth, and
# `crates/model/tests/declared_features.rs` is what now checks it, because a
# trap found three times is not going to be remembered the fourth.
#
# Not `chat`: the chat templates are not in the load path.
model = { path = "../model", default-features = false, features = ["contract"] }

# NO `libc`. It was here for `flock` and `open` on the profile cache —
# the read -> merge -> rename has to be atomic against another process
# calibrating a different GPU under the same $HOME — and `File::lock` is
# the same advisory whole-file lock with the descriptor's lifetime in the
# type. Dropping it is what lets `layout/` carry `#![forbid(unsafe_code)]`.

# The executor's input: `lower()`'s flat launch list and the trace types
# its operands name. Pure Rust — the toolkit-free build is unaffected.
model-compiler = { path = "../model-compiler" }

# The PTIR channel plane, shared with the Metal shell: launch-package
# adoption, the compile-cache identity, the emitted-table index, the bounded
# caches, the channel ring and the reference pass. NOT optional and NOT gated
# on a CUDA feature -- none of it names a CUDA symbol, which is the whole
# reason it is a crate: the C++ carried three hand-written copies of this one
# golden model, one per backend, and nothing ever checked that they agreed.
driver = { path = "../driver" }

# The ABI's Rust source of truth: the `#[repr(C)]` descriptors and status
# codes the thirteen exports speak. Optional — only the `abi` shell needs
# it.
driver-api = { path = "../driver-api", optional = true }

# `load_model`'s checkpoint reader — one parse of the snapshot, all three
# layouts (.zt artifact, HF safetensors, GGUF), and the embedded
# `model/descriptor` meta an artifact carries.
model-loader = { path = "../model-loader", optional = true }

# The boot config `create` receives as `config_bytes` — the C++ shell
# parses the same TOML with toml++; `[model] id` names the catalog row
# and `[model] config` points at the snapshot's own `config.json`, read
# for the one field a row does not hold: the declared quantization.
# NOT optional. `boot.rs` parses the driver's knobs out of the boot
# TOML, and that is portable — it is text, and the answers it produces
# size things in `layout/`. Making it optional put the one place this
# driver states its own configuration behind the ABI feature.
toml = "1.1"

# The bridge's other half: with `bridge` on, the same crate that provides the
# table also builds `libpie_kernels_cuda.a` AND `libpie_launch_shim.a` (its
# `native` feature, CMake + nvcc + cc) and publishes their directories. BOTH
# `-l` directives are OURS to emit, in build.rs, and neither is a matter of
# taste: cargo hands a build script's `-l` to its own package's lib and to
# nothing downstream, so a `-l` crosses a crate boundary only inside rustc's
# metadata — and only for a crate rustc actually LOADED. Nothing has named
# `kernels_cuda::` since §21.8, so nothing this crate depends on can carry a
# link directive for it. The crate that references a symbol names the archive
# defining it; the order is shim then kernels, because a static archive is
# scanned in place and the shim calls the launchers.
#
# `default-features = false` and NOT optional, which is the change Tier A
# made and the dev-dependency below predicted: *"This moves to
# `[dependencies]` when the first launcher is actually called."* It is
# called now. `bind::device` resolves a row's `pie_g_*` entry point AT RUN
# TIME, so the driver cannot load a kernel image without the table that says
# which kernels are in it -- the same argument, in the same words,
# `driver-metal` makes about `kernels-metal`. Table-only costs no nvcc: what
# `bridge` turns on is `native`, above.
#
# THIS EDGE IS THE ONE THAT MATTERS, and after §21.11 it is the only one: it
# is what turns on `native`, and `DEP_PIE_KERNELS_CUDA_LAUNCH_SHIM` — the
# shim archive's directory — is readable in our build script because of it.
kernels-cuda = { path = "../kernels-cuda", default-features = false }

# THE JIT, and where a migrated row now actually fires from.
#
# `bind::jit` used to hold a module cache of its own over `bind::nvrtc`'s unit
# list; it forwards to this crate's `runtime::fire` instead. One cache per
# process is the whole point -- two would compile the same unit twice, hold
# two `CUmodule`s of it, and (the part that is not merely wasteful) key them
# on two option sets, so the same row could be launched from cubins built with
# different float flags depending on which half of the tree called it.
#
# `default-features = false` and NOT optional, exactly like `kernels-cuda`
# above: layers 1 and 2 are rows and text, they cost no CUDA to depend on, and
# the runtime layer arrives with the `cuda-1X` feature that selects the
# version for everything else. That is why the feature lines above name it
# rather than an `optional = true` here -- a binary that has chosen a runtime
# gets this crate's runtime too, on the same libcudart, or it does not get one
# at all.
kernels-cuda-new = { path = "../kernels-cuda-new", default-features = false }

# The kernel contract vocabulary: `KernelSig`, `Ty`, and `LaunchRule` -- the
# grid shape a row states, which `bind::launch` evaluates. A regular
# dependency for the reason `driver-metal` states: a driver that dispatches
# by reading a row cannot do it without the words a row is written in.
kernels = { path = "../kernels" }

# The launch ABI pilot reads the kernel table and generates both halves of the
# flat entry points from it (`kernels_cuda::abi`). A dev-dependency rather
# than a dependency: nothing in the library calls a launcher yet, and the
# generated Rust bindings are only compiled by `tests/rope_abi.rs`. This moves
# to `[dependencies]` when the first launcher is actually called.
#
# `default-features = false` is the point of the split in that crate -- it
# leaves `native` off, so reading the table costs no nvcc.
[dev-dependencies]
kernels = { path = "../kernels" }
# `kernels-cuda` IS STILL HERE, and the two previous rounds each gave a
# different reason. Both were wrong, and §21.11 measured why.
#
# It used to be a SOURCE dependency: the tests spelled `kernels_cuda::abi::*`,
# `kernels_cuda::norm_device::*` and `kernels_cuda::<family>::KERNELS`. Every
# one of those had become a `pub use` of `kernels-cuda-new` — the tables moved
# in §19, the emitters in §21.8 — so the tests were naming the archive's crate
# to reach text that is not in it. They name `kernels_cuda_new` directly now.
#
# The round after that called it a LINK dependency, on the evidence that
# removing it left the four dispatch-compiling test targets failing at LINK.
# They were failing at link WITH it too. `cc`'s
# `cargo:rustc-link-lib=static=pie_launch_shim` was never reaching any link:
# `static=` defaults to `+bundle`, so rustc copied the archive's members into
# `libkernels_cuda.rlib` instead of re-emitting a `-l`, and rustc never loads
# an `--extern` no source path names — of the 118 rlibs on that link line,
# `libkernels_cuda-*.rlib` was not one. The experiment could not tell a
# dependency that carries nothing from one that carries something, because
# both sides of it were the same failure.
#
# So it is NEITHER: not text, and — measurably — not linkage. The linkage is
# `[dependencies]`'s edge above, which turns on `native` and publishes the
# archive our own build.rs names. This line is kept because removing it is a
# separate decision from fixing the mechanism, and it is what makes
# `cargo tree -e normal,build,dev | grep -c "kernels-cuda v"` 2 rather than 1.
# When it goes, nothing about linking changes.
kernels-cuda = { path = "../kernels-cuda", default-features = false }
# The executor's binder test lowers a REAL deployment's traced form, which
# needs no feature of its own: the family texts are ungated.
model = { path = "../model", default-features = false, features = ["contract"] }
# The PRODUCER, for `tests/gpu_ptir_emitted.rs` only: that test authors a
# trace, runs the host's real bind → compile → lower → emit chain over it, and
# compiles the result — so it proves the emitter's CUDA and this driver's NVRTC
# options agree rather than proving a hand-written kernel compiles. A
# dev-dependency and never a regular one: the driver must not depend on the
# compiler to RUN, only to prove it agrees with it before it ships. That is the
# same arrangement `driver-pipeline`'s oracle uses.
tensor-compiler = { path = "../tensor-compiler" }
tensor-ir = { path = "../tensor-ir" }
driver-api = { path = "../driver-api" }

# The bridge generator: build.rs reads the SAME tables the tests read and
# writes both halves of the flat ABI to OUT_DIR. Table-only — generating text
# costs no nvcc; compiling the shim is `cc`'s job below.
#
# `kernels-cuda` IS NOT HERE, and its absence is the point of this round.
# It was, for as long as `abi::{emit_rust_bindings, emit_rust_dispatch}` lived
# in the archive's crate — so a script that wanted a function from rows to
# text named a crate whose other content is a CMake project, an nvcc build and
# a `links` key. The emitters are `kernels_cuda_new::abi`'s now (they read
# `table` and `device`, and always did), so this list is one line shorter and
# `cargo tree -e normal,build,dev | grep -c "kernels-cuda v"` is 2 rather than
# 3. The two that remain are the archive under two names: `bridge` turns on
# `kernels-cuda/native` through the regular dependency above, and the
# dev-dependency compiles the same archive under test.
[build-dependencies]
# The TABLE, the DEVICE ROWS and the EMITTERS. Layer 1 supplies the eleven
# family tables the bindings and the dispatch are generated from; layer 2
# supplies `device::jit_dispatched` and, for the gate below, `unit::unit_of` —
# every symbol the dispatcher routes to `bind::jit::fire` must be a symbol
# some unit in this crate will compile. All of it answers with no feature, no
# cudarc and no device, which is what lets the check run in a build script at
# all, and why it is a build error rather than an `Error::Unknown` on the
# first fire of a model text.
kernels-cuda-new = { path = "../kernels-cuda-new", default-features = false }
cc = "1"

# `required-features` keeps `cargo test` with no CUDA feature reporting the
# same one error the library does, instead of additionally failing to compile
# test targets whose imports have all been cfg'd away.
# The targets that name something under `gpu/`. Declared rather than
# auto-discovered, because a featureless `cargo test` builds every
# auto-discovered target and these do not compile without a device
# selected — which is the whole point of the featureless build.
#
# The three NOT here — `dtoa_parity`, `profile_cache_parity`,
# `workspace_parity` — are portable and run in that build, which is
# coverage the crate did not have before.
#
# `hf_descriptor_parity` was a fourth. It replayed the C++ reader's
# 134-field dump of a `pie.model/1` descriptor against the Rust port,
# byte for byte over the corpus — and both the descriptor and the
# normalizer that produced it are deleted. What it was really pinning,
# "the two readers of this document agree", is now answered by there
# being one document and no readers: a model's numbers are `const` rows
# in `model::catalog`, checked against the corpus by
# `model/tests/catalog_differential.rs`.
[[test]]
name = "attn_score_parity"
required-features = ["_cuda"]

[[test]]
name = "attn_ws_parity"
required-features = ["_cuda"]

[[test]]
name = "cublas_handle_parity"
required-features = ["_cuda"]

[[test]]
name = "entry_validation"
required-features = ["_cuda"]

[[test]]
name = "gpu_plan_load"
required-features = ["_cuda"]

[[test]]
name = "kv_cache_live_parity"
required-features = ["_cuda"]

[[test]]
name = "kv_view_parity"
required-features = ["_cuda"]

[[test]]
name = "lora_stage_parity"
required-features = ["_cuda"]

[[test]]
name = "page_mask_parity"
required-features = ["_cuda"]

[[test]]
name = "sideband_arena_parity"
required-features = ["_cuda"]

[[test]]
name = "stage_hooks_parity"
required-features = ["_cuda"]

[[test]]
name = "weight_view_parity"
required-features = ["_cuda"]

# The one test target with no CUDA feature: it asks whether the portable
# half is still portable, which is a question only a build can answer.
[[test]]
name = "portable_half"

[[test]]
name = "gpu_smoke"
required-features = ["_cuda"]

[[test]]
name = "gpu_vmm"
required-features = ["_cuda"]

[[test]]
name = "gpu_ptir"
required-features = ["_cuda"]

[[test]]
name = "gpu_ptir_emitted"
required-features = ["_cuda"]

[[test]]
name = "gpu_ptir_fire"
required-features = ["_cuda"]

[[test]]
name = "gpu_graph"
required-features = ["_cuda"]

[[test]]
name = "kv_format_parity"
required-features = ["_cuda"]

[[test]]
name = "kv_geometry_parity"
required-features = ["_cuda"]

[[test]]
name = "planner_policy_parity"
required-features = ["_cuda"]

[[test]]
name = "store_parity"
required-features = ["_cuda"]

[[test]]
name = "memory_planner_parity"
required-features = ["_cuda"]

[[test]]
name = "kv_cache_parity"
required-features = ["_cuda"]

[[test]]
name = "recurrent_parity"
required-features = ["_cuda"]

[[test]]
name = "caches_parity"
required-features = ["_cuda"]

[[test]]
name = "launch_abi"
required-features = ["_cuda"]

[[test]]
name = "bridge_smoke"
required-features = ["_cuda", "bridge"]

[[test]]
name = "executor_bind"
required-features = ["_cuda"]

[[test]]
name = "real_prefill"
required-features = ["_cuda", "bridge"]

[[test]]
name = "real_hybrid"
required-features = ["_cuda", "bridge"]

[[test]]
name = "real_gemma4"
required-features = ["_cuda", "bridge"]

[[test]]
name = "serve"
required-features = ["_cuda", "abi"]

[[test]]
name = "union_lower"
required-features = ["_cuda"]

[[test]]
name = "gpu_supergraph"
required-features = ["_cuda", "bridge"]

[[test]]
name = "catalog_coverage"
required-features = ["_cuda", "abi"]

[[test]]
name = "shape_analysis"
required-features = ["_cuda"]

# Tier A: the device-entry pilot. `_cuda` alone and NOT `bridge` -- the whole
# claim is that a kernel can be launched with no shim in the build, so a test
# that needed one would not be testing it.
[[test]]
name = "tier_a_pilot"
required-features = ["_cuda"]

# The cutover's proof. `bridge` because `bind::dispatch` is the bridge
# executor's entry and the whole point is to enter there -- firing the row by
# hand is what `tier_a_pilot` already does, and it stays green whether the
# dispatcher routes or not.
[[test]]
name = "jit_dispatch"
required-features = ["_cuda", "bridge"]
