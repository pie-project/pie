# `[[test]] bridge_smoke` STOOD HERE and is deleted with its subject.
#
# 5,097 lines that fired ONE generated binding end to end —
# `quant::cast_fp32_to_bf16`, chosen because bf16 is the top half of the fp32
# so the answer is bit-checkable on the host. Its first line was
# `use driver_cuda::bind::abi::ffi;`, and `bind::abi::ffi` is deleted in this
# commit: the module was `include!(launch_bindings.rs)` and that file is
# generated per STATED row, of which there are none.
#
# It proved the plumbing, and the plumbing is what north star §5 replaced. A
# row's launch is a `unit!` plus a `fn` now, and what smokes one is the
# family's own tests in `kernels-cuda-new`.


[[test]]
name = "executor_bind"
required-features = ["_cuda"]

[[test]]
