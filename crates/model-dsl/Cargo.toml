[package]
name = "model-dsl"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The forward-pass authoring eDSL: typed weight handles, tape-carrying values, and the raw kernel-signature surfaces a lowered declaration is written against. What a model family's forward pass is WRITTEN IN; it names no family."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

# No `links`: the C header and the `#[repr(C)]` surface it describes are
# `crates/model`'s, because they are how a DRIVER reaches a declaration and a
# declaration is a model's, not the toolchain's. build.rs is here for the
# tracer fingerprint alone, which needs no `links` -- it is a
# `cargo:rustc-env`, read back by `compiler_version()`.
#
# It follows the fingerprint: the traced form is a pure function of
# (declaration code, facts), and the code that decides it is THIS crate's
# surface plus `model-ir`'s recorder, so the hash covers both source trees.
# It sits here rather than on `model-ir` because this is the crate that
# PRODUCES plans -- `trace_semantic` / `trace_cuda` / `trace_metal` are the
# entry points a version number is a claim about.
build = "build.rs"

[lib]
name = "model_dsl"
path = "src/lib.rs"

[dependencies]
model-dsl-macros = { path = "../model-dsl-macros" }
# Only for the two `derive`s on `WeightRepr` / `ScaleLayout`: a weight's
# representation is a deployment fact that crosses to the loader, so it
# serializes even though nothing else on this surface does.
serde = { version = "1.0", features = ["derive"] }
# The traced form this surface records onto. The ONLY dependency, and that is
# the point of the split: an authoring surface reaches the IR and nothing else
# -- not the lowering, and not a device.
model-ir = { path = "../model-ir" }
# `fire::<R>`'s bounds (Signature + Derivation) and, for the CUDA aliases,
# the marker types themselves. TABLE ONLY on the plane crate — same
# `default-features = false` rule `model-ir` already follows, so the
# authoring surface still reaches no device.
kernels = { path = "../kernels" }
kernels-cuda = { path = "../kernels-cuda", default-features = false }
# The metal plane's markers (for the generated wrappers in `metal::generated`)
# and its census (`kernel_of` — `fire_at`'s check that a stated entrypoint
# belongs to the routine whose marker fired it). Table only, same rule as
# `kernels-cuda` above and `model-ir`'s own dependency on this crate.
kernels-metal = { path = "../kernels-metal", default-features = false }

[dev-dependencies]
# The wrapper GENERATOR's parser (design-no-ask §10, B4-gen). A dev-dep and
# not a build-dep on purpose: `src/cuda/generated.rs` is CHECKED IN, and
# `tests/wrappers_are_current.rs` is the one thing that regenerates and
# diffs it — a build script that wrote into `src/` on every build would
# race parallel builds and break read-only checkouts, and checked-in
# generation needs no `rerun-if-changed` plumbing. Same version/features
# line as `kernels-macros`, which parses the same signatures.
# `visit` joined `full` when the generator grew its metal half: a metal
# routine's SYMBOL is the entrypoint its body names (`Fire::at(file, entry)`),
# so the generator walks the body's expressions for that one literal.
syn = { version = "3.0", features = ["full", "visit"] }
