[package]
name = "model-dsl"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The forward-pass authoring eDSL over the typed IR: the Recorder/Value trace machinery, per-family wrappers that compute shapes in plain Rust, weight declarations without dtype generics, and split/merge/Facts guard tracking. What a model's forward pass is WRITTEN IN; it names no backend and reaches no device."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "model_dsl"
path = "src/lib.rs"

[dependencies]
# The plan this surface records onto, and the only substantive dependency: an
# authoring surface reaches the IR and nothing else.
model-ir = { path = "../model-ir" }
