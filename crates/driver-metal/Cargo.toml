# ── THIS MANIFEST DOES NOT RESOLVE, AND THAT IS THE QUARANTINE (R3) ─────
#
# `driver-metal` is in the root workspace's `exclude` list and no member
# path-depends on it, because it was one of the last three consumers of
# `model-legacy` and `model_compiler::lower` — both deleted. The
# `model-legacy` edge below therefore points at a directory that is not
# there.
#
# It is left standing rather than deleted because the crate is not being
# repaired, it is being REWRITTEN: P5 ("Shader planes — impl the families for
# metal/vulkan/wgpu Ctx") gives this driver a `#[claims] impl` for its plane
# and a `Program` walk of its own, and what it will depend on then is
# `crates/model`, exactly as `driver-cuda` does now. Editing the line to a
# crate this source cannot use would be a manifest that resolves and a build
# that does not, which is a worse lie than a dangling path.

[package]
name = "driver-metal"
version = "0.4.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "The Metal execution shell, in Rust: MTL4 device objects, heaps and residency, runtime shader compilation and command encoding. Grows beside driver-metal until it replaces it."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

# Deliberately no `links` key. The C++ shell publishes
# `pie_driver_metal_lib` and the two crates are members of one workspace at
# the same time -- two packages claiming one `links` value is a resolution
# error, not a link error, so it would break `cargo metadata` for everyone
# rather than just for whoever selected this crate.
[lib]
name = "driver_metal"
path = "src/lib.rs"

# NOT `[lints] workspace = true`. That table sets `unsafe_code = "forbid"`,
# which every objc2 message send violates by construction. The rest of it
# (`missing_docs`, the clippy ratchets) is worth having and is set in
# `lib.rs`, where `unsafe_code` can be left out of the list.

[features]
# There is deliberately NO default. `cargo test -p driver-metal` with no
# features builds and tests the PORTABLE half -- `layout/` and `lowering/`,
# everything that is a function of the plan's numbers rather than of the
# device -- and that is the whole reason this is a feature rather than
# `cfg(target_vendor = "apple")`:
#
#   A platform cfg cannot be tested. A feature can.
#
# On macOS `target_vendor = "apple"` is always true, so the portable half is
# never compiled; on Linux it is always false, so the Apple half never is.
# NO MACHINE BUILDS BOTH, and no single job can catch a reference across the
# boundary -- which is exactly how three such errors got in and stayed
# (`.wiki/driver/real-metal-north-star.md` §7). With a feature, one macOS
# runner builds both sides, on the machine the people who work on this crate
# actually use.
#
# `default = []` is load-bearing rather than a preference: a default would
# have to be turned OFF to reach the portable half, and rule 4 of
# `.wiki/driver/north-star.md` is that if a check can be skipped it will be.
default = []

# The Metal 4 stack this driver is written against. Gates `src/gpu/` -- the
# one `#[cfg]` -- and every device test target.
metal-4 = []

# NO `serde_json`. It was here for `facts.rs`, which parsed a `pie.model/1`
# descriptor into a private facts struct -- a driver reading a JSON document
# to find out what model it had been given. Nothing in this crate parses JSON
# any more: a checkpoint's tensors match a `model::catalog` row and the row
# states the shape, so the one thing still read out of a `config.json` is the
# declared quantization and `model::encoding` does that reading. The
# dependency going away is the measurement of the change -- a driver that
# needs a JSON parser is a driver that is still normalizing something.
[dependencies]

# The pipeline interpreter is pure CPU logic and reuses the launch/IR source of
# truth rather than re-porting the C++ `pie::driver::launch` mirror:
# `driver` owns the adopted launch-package types (`LaunchPackage` and its
# members) and the `PIE_*` ABI constants, and `tensor-ir` owns the op table,
# dtypes, intrinsic ids and the canonical RNG contract. Both are host-portable,
# so they belong here in the plain (non-Apple) table.
driver-api = { path = "../driver-api" }
tensor-ir = { path = "../tensor-ir" }

# The PTIR channel plane, which used to be `src/pipeline/` here. It moved out
# when the CUDA shell reached the same layer -- both shells pack the same lane
# table and read the same launch package, and the C++ answered that by keeping
# three hand-written copies of one golden model. `src/pipeline.rs` re-exports
# it, so every call site in `src/metal/` still spells `crate::pipeline::`.
driver = { path = "../driver" }

# `codegen::metal::fused::METAL_M3_REGION_THREADS` — the threadgroup width the
# emitted grouped kernels size their reduction buffer for. This crate carried a
# `program::grouped::REGION_THREADS = 512` copy of it and a dev-dependency test
# comparing the two; `driver` did the same for four more of the compiler's
# declarations and that whole arrangement is gone, so this one goes with it.
#
# `driver`'s own table says the rest: importing a number the EMITTER decided is
# better than copying it and is still not the end state, which is for it to
# ride on the emitted kernel beside the entry name and the source.
tensor-compiler = { path = "../tensor-compiler" }

# The kernel contract vocabulary: `LaunchRule` (which grid shape a row states)
# and `sig_in` (how an instantiated point resolves to its row). Tables only --
# no shader is built by reading one.
kernels = { path = "../kernels" }

# The load-plan path calls the loader in-process where the C++ went through
# the C ABI: `model` owns the author registry (the `contract` feature alone --
# no chat aspect, so no tokenizer or image decoders ride along), and
# `model-loader` owns the plan compiler and the checkpoint readers. Both are
# host-portable.
# The lowering the executor runs: `model_compiler::lower` states a fire as a
# flat list of launches naming kernel symbols. Host-portable — reading a
# lowered trace builds no shader. `model-ir` alongside it for the traced form
# those launches are stated over, and for `kernels`, the signature table this
# crate's binding checks itself against.
model-compiler = { path = "../model-compiler" }
model-ir = { path = "../model-ir" }
# The Metal signature table. A real dependency and not a dev one: the executor
# resolves every symbol the lowering states through `sig_in` AT RUN TIME -- the
# row is where a kernel's file and launch rule live, so a driver that dispatches
# by name cannot do it without the table. `default-features = false` keeps it to
# the table itself, which is host-portable: no shader is built by reading one.
kernels-metal = { path = "../kernels-metal", default-features = false }
# `contract` for the load plan's author; `forward` for the TEXTS. The driver
# needs the texts because selecting one is the driver's job -- it runs the
# model it loaded -- and `driver-cuda` takes the same two for the same
# reason. Selecting is not CHOOSING A KERNEL: the text names every symbol, and
# what the driver does is look up which text the checkpoint it loaded is.
model = { path = "../model-legacy", package = "model-legacy", default-features = false, features = ["contract"] }
model-loader = { path = "../model-loader" }

# Apple-only. Everything that names a Metal type lives under `src/metal/` and
# is gated on this cfg, so the crate still builds -- and its portable half
# still tests -- on the Linux boxes the rest of the workspace is developed on.
# That is the point of the split: `shader.rs` and `tuning.rs` are the parts
# with logic worth testing, and neither needs a GPU to run.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSError",
    "NSString",
    "NSArray",
    # `resolveCounterRange:` answers with an `NSData` of packed ticks.
    "NSData",
    "NSObject",
    "NSRange",
    "NSURL",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFBase",
    "CFNumber",
    "CFString",
    "CFDictionary",
] }
# `objc2-io-kit` publishes exactly one feature (`AppleUSBDefinitions`) and the
# registry API is not behind it. `libc` comes with it for `mach_port_t` and
# `kern_return_t`, which its signatures are written in.
objc2-io-kit = { version = "0.3.2", default-features = false, features = [
    # `kIOMainPortDefault` is behind the `libc` feature -- the registry
    # signatures are written in `libc::mach_port_t`, so the port constant
    # only exists when that dependency does.
    "libc",
] }
libc = "0.2"
# The commit-feedback handler is an Objective-C block. `block2` is the only
# way to hand Metal one, and `objc2-metal`'s own `block2` feature is what
# exposes `addFeedbackHandler:` at all.
block2 = "0.6"

# Feature-gated per header, so the list IS the API surface this shell uses.
# Adding a Metal type means adding its feature here; that is the intended
# friction, and it is why the list is not `features = ["all"]`.
[target.'cfg(target_vendor = "apple")'.dependencies.objc2-metal]
version = "0.3.2"
default-features = false
features = [
    "std",
    # `addFeedbackHandler:` takes a block, and the method does not exist
    # without this.
    "block2",
    # `MTL4CommitFeedback`'s two timestamps are `CFTimeInterval`, so they do
    # not exist without this.
    "objc2-core-foundation",
    # core device + resources
    "MTLDevice",
    "MTLResource",
    "MTLAllocation",
    "MTLBuffer",
    "MTLHeap",
    "MTLResidencySet",
    # Indirect command buffers: a fire RECORDED once and replayed, rather than
    # re-encoded every step. `.wiki/driver/graph-metal.md` measures what that
    # is worth here -- host encode is 47.5% of a prefill and 76.4% of a decode
    # -- and corrects this tree's older claim that Metal has no such API.
    "MTLIndirectCommandBuffer",
    "MTLIndirectCommandEncoder",
    "MTLEvent",
    "MTLLibrary",
    "MTLComputePipeline",
    "MTLTypes",
    "MTLPixelFormat",
    "MTLCounters",
    "MTLArgument",
    "MTLCommandBuffer",
    # `MTLStages` and the encoder barrier live here; the MTL4 encoder's barrier
    # methods are gated on it even though nothing else in this driver is.
    "MTLCommandEncoder",
    # `MTLSparseTextureMappingMode` and, transitively, the MTL4 queue's
    # sparse-remap operation struct. Named for a texture encoder this driver
    # never uses; the enum is what elastic buffers need.
    "MTLResourceStateCommandEncoder",
    # the Metal 4 stack this driver is written against
    "MTL4CommandQueue",
    "MTL4CommandBuffer",
    "MTL4CommandAllocator",
    "MTL4CommandEncoder",
    "MTL4ComputeCommandEncoder",
    "MTL4ComputePipeline",
    "MTL4ArgumentTable",
    "MTL4Compiler",
    "MTL4CompilerTask",
    "MTL4LibraryDescriptor",
    "MTL4FunctionDescriptor",
    "MTL4LibraryFunctionDescriptor",
    "MTL4PipelineState",
    "MTL4Counters",
    "MTL4CommitFeedback",
    "MTL4Archive",
    "MTL4PipelineDataSetSerializer",
]

[dev-dependencies]
tempfile = "3"

# Tests only. The binder is proved against a REAL lowering, and the texts live
# behind `model`'s `forward` feature -- which the driver itself does not need,
# so it is enabled here rather than in the dependency table above.
model = { path = "../model-legacy", package = "model-legacy", default-features = false, features = ["contract"] }

# `required-features` keeps `cargo test -p driver-metal` with no feature to
# the portable half, rather than failing to build the device targets. It is
# the mechanism `driver-cuda/Cargo.toml` already uses for `_cuda`, and the
# reason the same job can run the crate both ways on one runner.
#
# The tests NOT listed here are the portable ones -- `portable_half`,
# `mod_audit`, `model_bind`, `model_dispatch`, `polymorphism`, `layering`,
# `no_family_names`, `catalog_coverage`, `text_conformance` -- and that list
# is the claim this file makes about what needs no GPU.
#
# `family_registry` and `geometry_from_descriptor` were on that list and are
# deleted. Both were gates on the SPLIT: one reconciled the two `model_type`
# tables that decided which family Metal supported, the other pinned a
# `pie.model/1` descriptor being cut into four family-prefixed blocks and
# merged back. There is one `model::catalog` row per model now and no
# document between it and the driver, so neither property is expressible --
# `catalog_coverage` replaces the first with the claim that survived it.

[[test]]
name = "device_archive"
required-features = ["metal-4"]

