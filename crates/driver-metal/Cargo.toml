[package]
name = "driver-metal"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The menlo Metal driver's dispatch layer: a Run that resolves plan ids to device handles and answers every Dispatch* trait by calling kernels-metal entries through dyn Encode. Merges into driver-metal when the old stack is deleted."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "driver_metal"
path = "src/lib.rs"

[dependencies]
# The vocabulary the resolver routes on: `ValueDecl`, `Def`, `RuntimeInput`,
# `ValueId` — and the six family enums the dispatch arms destructure.
model-ir = { path = "../model-ir" }
# The contract implemented — the six `Dispatch*` traits and `KernelError`.
# Contract only: the walk written over it lives in the driver substrate
# (`driver::fire::walk`) and is driven over this crate's `Run` from there.
kernels = { path = "../kernels" }
# The entries called and the handles resolved to: `Tensor`, `RaggedTensor`,
# `KvPool`, `RecurrentPool`, the plan payloads, and the `dyn Encode` sink
# that keeps this crate OS-portable.
kernels-metal = { path = "../kernels-metal" }
