# ── THE QUARANTINE IS OVER (P5) ─────────────────────────────────────────
#
# R3 left this manifest naming `model-legacy` on a DANGLING path and said
# why: the crate was not being repaired, it was being REWRITTEN, and editing
# the line to a crate the source could not use would have been "a manifest
# that resolves and a build that does not". The rewrite is here. What this
# crate depends on now is `crates/model` and `model_compiler::program`,
# exactly as `driver-cuda` does — the same catalog, the same lowering, the
# same generated dispatch — and the dangling edge is gone because there is
# source behind it.
#
# EVERY DEPENDENCY BELOW WAS MEASURED against the baker executor rather than
# inherited: `model-loader` went with the legacy load contract (see its
# stanza), and `kernels-metal` changed from a table lookup to the plane the
# dispatch is generated for.

[package]
name = "driver-metal"
version = "0.4.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "The Metal execution shell, in Rust: MTL4 device objects, heaps and residency, runtime shader compilation and command encoding. Grows beside driver-metal until it replaces it."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

# Deliberately no `links` key. The C++ shell publishes
# `pie_driver_metal_lib` and the two crates are members of one workspace at
# the same time -- two packages claiming one `links` value is a resolution
# error, not a link error, so it would break `cargo metadata` for everyone
# rather than just for whoever selected this crate.
[lib]
name = "driver_metal"
path = "src/lib.rs"

# NOT `[lints] workspace = true`. That table sets `unsafe_code = "forbid"`,
# which every objc2 message send violates by construction. The rest of it
# (`missing_docs`, the clippy ratchets) is worth having and is set in
# `lib.rs`, where `unsafe_code` can be left out of the list.

[features]
# There is deliberately NO default. `cargo test -p driver-metal` with no
# features builds and tests the PORTABLE half -- `layout/` and `baker/`,
# everything that is a function of the plan's numbers rather than of the
# device -- and that is the whole reason this is a feature rather than
# `cfg(target_vendor = "apple")`:
#
#   A platform cfg cannot be tested. A feature can.
#
# On macOS `target_vendor = "apple"` is always true, so the portable half is
# never compiled; on Linux it is always false, so the Apple half never is.
# NO MACHINE BUILDS BOTH, and no single job can catch a reference across the
# boundary -- which is exactly how three such errors got in and stayed
# (`.wiki/driver/real-metal-north-star.md` §7). With a feature, one macOS
# runner builds both sides, on the machine the people who work on this crate
# actually use.
#
# `default = []` is load-bearing rather than a preference: a default would
# have to be turned OFF to reach the portable half, and rule 4 of
# `.wiki/driver/north-star.md` is that if a check can be skipped it will be.
default = []

# The Metal 4 stack this driver is written against. Gates `src/gpu/` -- the
# one `#[cfg]` -- and every device test target.
metal-4 = []

# NO `serde_json`. It was here for `facts.rs`, which parsed a `pie.model/1`
# descriptor into a private facts struct -- a driver reading a JSON document
# to find out what model it had been given. Nothing in this crate parses JSON
# any more: a checkpoint's tensors match a `model::catalog` row and the row
# states the shape, so the one thing still read out of a `config.json` is the
# declared quantization and `model::encoding` does that reading. The
# dependency going away is the measurement of the change -- a driver that
# needs a JSON parser is a driver that is still normalizing something.
[dependencies]

# The pipeline interpreter is pure CPU logic and reuses the launch/IR source of
# truth rather than re-porting the C++ `pie::driver::launch` mirror:
# `driver` owns the adopted launch-package types (`LaunchPackage` and its
# members) and the `PIE_*` ABI constants, and `tensor-ir` owns the op table,
# dtypes, intrinsic ids and the canonical RNG contract. Both are host-portable,
# so they belong here in the plain (non-Apple) table.
driver-api = { path = "../driver-api" }
tensor-ir = { path = "../tensor-ir" }

# The PTIR channel plane, which used to be `src/pipeline/` here. It moved out
# when the CUDA shell reached the same layer -- both shells pack the same lane
# table and read the same launch package, and the C++ answered that by keeping
# three hand-written copies of one golden model. `src/pipeline.rs` re-exports
# it, so every call site in `src/metal/` still spells `crate::pipeline::`.
driver = { path = "../driver" }

# `codegen::metal::fused::METAL_M3_REGION_THREADS` — the threadgroup width the
# emitted grouped kernels size their reduction buffer for. This crate carried a
# `program::grouped::REGION_THREADS = 512` copy of it and a dev-dependency test
# comparing the two; `driver` did the same for four more of the compiler's
# declarations and that whole arrangement is gone, so this one goes with it.
#
# `driver`'s own table says the rest: importing a number the EMITTER decided is
# better than copying it and is still not the end state, which is for it to
# ride on the emitted kernel beside the entry name and the source.
tensor-compiler = { path = "../tensor-compiler" }

# THE HALF OF THE BAKER EXECUTOR THAT IS NOT THIS PLANE: the walk over a
# `Program`, the bound statement a generated dispatch reads, the frame's
# numbering and the load-time resolve pass. `src/baker/plane.rs` is this
# crate's answer to its one trait, and the five modules left in `src/baker/`
# are the ones that MEASURABLY differ from `driver-wgpu`'s -- the region, the
# staging, the views, and the two that plan a dispatch.
#
# It needs no GPU, no toolkit and no OS, which is `crates/driver`'s rule, so
# it is a workspace default member and its tests run in an unqualified sweep.

# THE DECLARATION FLOOR. `kernels::bound::BoundOp` is the trait
# `baker_walk::bound` implements -- the one data->type crossing, whose accessors
# hand back the marks (`In`, `Out`, `InOut`, `Const`, `Cache`) a claim body
# takes -- and `kernels::Refusal` is what every one of them answers
# with. `kernels::raises::{Class, Struct}` beside them for the by-key door.
#
# It was here for `LaunchRule` and `sig_in`: which grid shape a ROW states,
# and how an instantiated point resolved to one. There are no rows. A grid is
# computed by the claim body that fires it and arrives on `Fire::lanes`, so
# neither name is read any more and the crate is depended on for the trait
# instead.
kernels = { path = "../kernels" }

# The lowering the executor runs. `model_compiler::program::bound(&plan)`
# binds each of a plan's lanes into a `Program` -- steps naming POINTS, and
# slots saying where each value lives in the fire's arena -- and that is the
# whole of what this crate reads from it. Host-portable: binding a lane
# builds no shader.
#
# IT WAS `model_compiler::lower`, and the difference is the crossing. `lower`
# stated a fire as a flat list of launches naming kernel SYMBOLS, which this
# driver then matched against a by-name registry; a `Program`'s steps name
# points, and the plane's own generated dispatch answers them. `lower` is
# deleted (R3) and this crate was one of its last three consumers.
model-compiler = { path = "../model-compiler" }
# The traced form a `Program` is bound from: `Plan`, its `Op` rows and the
# `ValueId`s a slot is keyed by, plus `kernels::Backend` -- which is how this
# crate says `Metal` when it asks a catalog row to trace.
model-ir = { path = "../model-ir" }
# THE PLANE. `kernels_metal::points_dispatch::dispatch(ctx, op)` is what one
# step of a fire becomes, `plane::{Handle, Planes}` are the payloads this
# crate mints for it, `routine::{Encode, ArgValue, Fire}` is the encode door a
# claim body talks through, and `views::{PagedKvView, RecurrentView}` are the
# two pool carriers a `Cache` mark hands over. `default-features = false`
# keeps it off `native`, which stages shaders and needs a toolchain; every
# name above is host-portable.
#
# It was here for the SIGNATURE TABLE -- `sig_in` resolved a symbol the
# lowering stated to the row holding its file and launch rule. The rows are
# gone with `#[routine]` and the launches are `#[claims]` bodies; what this
# crate reads now is the dispatch generated from those claims.
kernels-metal = { path = "../kernels-metal", default-features = false }
# THE CATALOG, singular since R3. `model::identify` says which SKU a
# checkpoint's tensors are, `model::trace_of` gives the plan the program is
# built from, `model::deployment::Deployment::of` reads the pool geometry off
# THAT SAME plan, `model::produce` turns a checkpoint's bytes into the tensors
# the plan's params name, and `model::serve::ROWS` carries the two facts no
# trace states. Default features: `serve` is off, which is what keeps the
# chat templates and the image decoders out of a driver.
#
# `model-legacy` STOOD HERE under the name `model`, with `features =
# ["contract"]` for a load-contract author that no longer exists. One catalog
# now, and this is it.
model = { path = "../model" }

# Apple-only. Everything that names a Metal type lives under `src/metal/` and
# is gated on this cfg, so the crate still builds -- and its portable half
# still tests -- on the Linux boxes the rest of the workspace is developed on.
# That is the point of the split: `shader.rs` and `tuning.rs` are the parts
# with logic worth testing, and neither needs a GPU to run.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSError",
    "NSString",
    "NSArray",
    # `resolveCounterRange:` answers with an `NSData` of packed ticks.
    "NSData",
    "NSObject",
    "NSRange",
    "NSURL",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFBase",
    "CFNumber",
    "CFString",
    "CFDictionary",
] }
# `objc2-io-kit` publishes exactly one feature (`AppleUSBDefinitions`) and the
# registry API is not behind it. `libc` comes with it for `mach_port_t` and
# `kern_return_t`, which its signatures are written in.
objc2-io-kit = { version = "0.3.2", default-features = false, features = [
    # `kIOMainPortDefault` is behind the `libc` feature -- the registry
    # signatures are written in `libc::mach_port_t`, so the port constant
    # only exists when that dependency does.
    "libc",
] }
libc = "0.2"
# The commit-feedback handler is an Objective-C block. `block2` is the only
# way to hand Metal one, and `objc2-metal`'s own `block2` feature is what
# exposes `addFeedbackHandler:` at all.
block2 = "0.6"

# Feature-gated per header, so the list IS the API surface this shell uses.
# Adding a Metal type means adding its feature here; that is the intended
# friction, and it is why the list is not `features = ["all"]`.
[target.'cfg(target_vendor = "apple")'.dependencies.objc2-metal]
version = "0.3.2"
default-features = false
features = [
    "std",
    # `addFeedbackHandler:` takes a block, and the method does not exist
    # without this.
    "block2",
    # `MTL4CommitFeedback`'s two timestamps are `CFTimeInterval`, so they do
    # not exist without this.
    "objc2-core-foundation",
    # core device + resources
    "MTLDevice",
    "MTLResource",
    "MTLAllocation",
    "MTLBuffer",
    "MTLHeap",
    "MTLResidencySet",
    # Indirect command buffers: a fire RECORDED once and replayed, rather than
    # re-encoded every step. `.wiki/driver/graph-metal.md` measures what that
    # is worth here -- host encode is 47.5% of a prefill and 76.4% of a decode
    # -- and corrects this tree's older claim that Metal has no such API.
    "MTLIndirectCommandBuffer",
    "MTLIndirectCommandEncoder",
    "MTLEvent",
    "MTLLibrary",
    "MTLComputePipeline",
    "MTLTypes",
    "MTLPixelFormat",
    "MTLCounters",
    "MTLArgument",
    "MTLCommandBuffer",
    # `MTLStages` and the encoder barrier live here; the MTL4 encoder's barrier
    # methods are gated on it even though nothing else in this driver is.
    "MTLCommandEncoder",
    # `MTLSparseTextureMappingMode` and, transitively, the MTL4 queue's
    # sparse-remap operation struct. Named for a texture encoder this driver
    # never uses; the enum is what elastic buffers need.
    "MTLResourceStateCommandEncoder",
    # the Metal 4 stack this driver is written against
    "MTL4CommandQueue",
    "MTL4CommandBuffer",
    "MTL4CommandAllocator",
    "MTL4CommandEncoder",
    "MTL4ComputeCommandEncoder",
    "MTL4ComputePipeline",
    "MTL4ArgumentTable",
    "MTL4Compiler",
    "MTL4CompilerTask",
    "MTL4LibraryDescriptor",
    "MTL4FunctionDescriptor",
    "MTL4LibraryFunctionDescriptor",
    "MTL4PipelineState",
    "MTL4Counters",
    "MTL4CommitFeedback",
    "MTL4Archive",
    "MTL4PipelineDataSetSerializer",
]

[dev-dependencies]
tempfile = "3"

# A SECOND `model` EDGE STOOD HERE, for a `forward` feature the line did not
# actually request. There is one catalog and the driver depends on it above;
# the walk test reads the same rows the driver loads, which is the point of
# the test.

# `required-features` keeps `cargo test -p driver-metal` with no feature to
# the portable half, rather than failing to build the device targets. It is
# the mechanism `driver-cuda/Cargo.toml` already uses for `_cuda`, and the
# reason the same job can run the crate both ways on one runner.
#
# The tests NOT listed here are the portable ones -- `the_walk_is_the_program`,
# `portable_half`, `mod_audit`, `layering`,
# `every_public_function_has_a_reader`, `real_kernels` -- and that list is the
# claim this file makes about what needs no GPU.
#
# `the_walk_is_the_program` IS THE EXECUTOR'S GATE and it is portable on
# purpose: a fire's steps are walked against a mock `Encode` that records what
# it was asked to fire, so the walk order, the points asked and the handles
# bound are all checkable with no Metal in the process. That is what
# `baker::encode` being a plain `Encode` implementor buys -- the device half
# is the encoder BEHIND the door, not the door.
#
# `text_conformance`, `model_bind`, `model_dispatch`, `polymorphism`,
# `no_family_names`, `catalog_coverage`, `no_probe_decides_a_fact`,
# `packed_params_cover_the_struct` and `geometry_is_stated` were on that list
# and are deleted with the legacy walk they measured: every one of them was a
# property of the by-name crossing (which symbol a text states, which row
# claims it, which slot a `kernel!` row reorders an operand into) and there is
# no by-name crossing. `every_claim_has_an_arm` in `kernels-metal` is where
# the surviving half of that question is asked now.
#
# `device_text_fire` and `device_checkpoint_names` JOIN THAT LIST, one commit
# late, and the lateness is the finding. Both were gated on `metal-4`, so
# nothing on a Linux runner ever compiled them and the deletion sweep above
# could not see them; the first lowered `model::shared::llama_like` through
# `model_compiler::lower` and fired it, and the second joined
# `lowering::resolve::Names` against a checkpoint. `llama_like`, `lower` and
# `Names` are all deleted. What each measured is asked elsewhere now:
# `tests/the_walk_is_the_program.rs` walks a real `Program` for the first, and
# `baker::join` (run at every load, and reported as JOIN by
# `model/src/bin/baker_load.rs`) is the second. Their two device-only
# survivors -- the KV pool's allocation and its move plan -- moved to
# `device_pool`, which is what a pool test is called.
#
# THE GATE THAT LET THAT HAPPEN IS CLOSED. `scripts/check-metal-4.sh` type-
# checks this feature on a non-Apple host by cross-checking
# `--target aarch64-apple-darwin`, and CI runs it; see the script's own header
# for what it can and cannot catch.

[[test]]
name = "device_archive"
required-features = ["metal-4"]

[[test]]
name = "device_add_bias"
required-features = ["metal-4"]

