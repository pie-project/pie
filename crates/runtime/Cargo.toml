[package]
name = "runtime"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "Programmable Inference Engine (Pie)"
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "runtime"
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
engine = { path = "../engine" }
eta-ir = { package = "pie-eta-ir", path = "../eta-ir" }
model-ir = { path = "../model-ir" }
eta-compiler = { path = "../eta-compiler" }
engine-cuda = { path = "../engine-cuda", optional = true, default-features = false }
engine-metal = { path = "../engine-metal", optional = true }

client-api = { package = "pie-client-api", path = "../client-api" }
parking_lot = "0.12"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
rand = { version = "0.10.2", features = ["std_rng", "sys_rng"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing = "0.1.44"
serde_json = { version = "1.0", features = ["preserve_order"] }
http = "1"
bytes = "1.12.1"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
dashmap = "6.2.1"
boxcar = "0.2.14"
thiserror = "2.0.19"
futures = "0.3.33"
waker = { path = "../waker" }
tokenizer = { path = "../tokenizer" }
grammar = { path = "../grammar" }
models = { path = "../models" }
checkpoint = { path = "../checkpoint", default-features = false }
checkpoint-dsl = { path = "../checkpoint-dsl" }
ztensor = { workspace = true }
ztensor-compat = { workspace = true }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }
blake3 = "1.8.5"
fancy-regex = "0.18.0"
async-trait = "0.1.91"
wasm-metadata = "0.254.0"
cudarc = { version = "0.19.8", optional = true, default-features = false, features = [
    "std",
    "driver",
    "fallback-dynamic-loading",
] }
libloading = { version = "0.9", optional = true }
rustc-hash = "2.1"
smallvec = "1"
lru = "0.18.1"
ipnet = "2"

engine-vulkan = { path = "../engine-vulkan", optional = true }

engine-wgpu = { path = "../engine-wgpu", optional = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53", features = ["full"] }
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
tracing-appender = "0.2"
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "grpc-tonic",
    "trace",
    "metrics",
] }
wasmtime = { version = "48.0.1", default-features = false, features = [
    "runtime",
    "std",
    "anyhow",
    "async",
    "backtrace",
    "cranelift",
    "parallel-compilation",
    "component-model",
    "component-model-async",
    "pooling-allocator",
    "cache",
    "addr2line",
    "demangle",
] }
wasmtime-wasi = { version = "48.0.1", default-features = false, features = ["p2", "p3"] }
wasmtime-wasi-http = { version = "48.0.1", default-features = false, features = [
    "p2",
    "p3",
    "default-send-request",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.53", default-features = false, features = ["sync", "macros"] }
web-std = { path = "../web-std" }
wasmtime-web = { path = "../wasmtime-web" }
wasmtime = { version = "48.0.1", default-features = false, features = [
    "runtime",
    "std",
    "anyhow",
    "async",
    "cranelift",
    "pulley",
    "component-model",
    "component-model-async",
    "custom-fiber",
    "custom-virtual-memory",
] }
uuid = { version = "1.24.0", features = ["serde", "v4", "js"] }
wgpu = { version = "30", default-features = false, features = [
    "wgsl",
    "webgpu",
    "fragile-send-sync-non-atomic-wasm",
], optional = true }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
engine-metal = { path = "../engine-metal", optional = true }

[features]
default = []
cuda = ["dep:engine-cuda", "engine-cuda/cuda", "dep:cudarc", "dep:libloading", "cudarc/cuda-13000"]
metal = ["dep:engine-metal"]
vulkan = ["dep:engine-vulkan", "engine-vulkan/vulkan"]
wgpu = ["dep:engine-wgpu", "engine-wgpu/wgpu", "dep:wgpu"]
profile-fire = []

[dev-dependencies]
tempfile = "3"
wasmtime = { version = "48", default-features = false, features = ["wat"] }
