[package]
name = "inferlet"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "Inferlet support library for Pie"
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
keywords = ["wasi", "wasm", "pie", "inferlet"]
categories = ["wasm"]

include = ["src/**/*", "wit/**/*"]

[dependencies]
blake3 = { version = "1.8", default-features = false }
wit-bindgen = { version = "0.63.0", features = ["async-spawn"] }
inferlet-macros = { version = "0.6.0", path = "../inferlet-macros" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eta-dsl = { package = "pie-eta-dsl", version = "0.6.0", path = "../eta-dsl" }

[dev-dependencies]
eta-compiler = { path = "../eta-compiler" }

[lints]
workspace = true
