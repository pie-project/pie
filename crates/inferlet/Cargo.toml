[package]
name = "inferlet"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "Inferlet support library for Pie"
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
keywords = ["wasi", "wasm", "pie", "inferlet"]
categories = ["wasm"]

# `wit_bindgen::generate!` reads `wit/` at macro-expansion time, so a published
# .crate that lacks it does not compile. Stated explicitly because the failure
# mode is a broken release rather than a build error here.
include = ["src/**/*", "wit/**/*"]

[dependencies]
# The guest bindings are generated from this crate's own `wit/`; see the
# `generate!` site in src/lib.rs.
wit-bindgen = { version = "0.59.0", features = ["async-spawn"] }
inferlet-macros = { version = "0.5.0", path = "../inferlet-macros" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The ETA authoring DSL. It carries no wit-bindgen — the single `generate!`
# stays here — and `inferlet::eta` drives its `Builder`.
eta-dsl = { path = "../eta-dsl" }
