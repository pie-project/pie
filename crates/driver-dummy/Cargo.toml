[package]
name = "driver-dummy"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Direct local dummy driver used by runtime tests."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "driver_dummy"
crate-type = ["rlib"]

[dependencies]
driver = { path = "../driver" }
tensor-ir = { path = "../tensor-ir" }
tensor-compiler = { path = "../tensor-compiler" }
anyhow = "1.0"

[dev-dependencies]
tokio = { version = "1.53", features = ["rt", "sync", "time"] }
