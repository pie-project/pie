[package]
name = "tensor-compiler"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
authors = ["In Gim <in.gim@yale.edu>"]
description = "The host toolchain for guest tensor programs: PTIR execution planning, the tier-0 reference interpreter every backend diffs against, and CUDA/Metal source emission, with the conformance battery that holds the three to one another."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
keywords = ["pie", "tensor", "ir", "ptir", "compiler"]

[lib]
name = "tensor_compiler"
crate-type = ["rlib"]
path = "src/lib.rs"

# Host-only, and that is a CONSEQUENCE of the fold rather than a choice:
# `plan` alone was `no_std` (+ alloc), but `eval`'s extern channels are
# `std::sync::{Arc, Mutex}` and `codegen` writes files, so one crate holding
# all three cannot be. Nothing depended on the `no_std` mode -- the guest
# imports `tensor-ir` and `tensor-dsl`, which keep theirs, and those are the
# two the wasm build actually reaches. `plan`'s `std` feature is dropped with
# it; `tensor-ir` is taken with defaults here for the same reason.
[dependencies]
tensor-ir = { path = "../tensor-ir" }
# The shared host<->driver contract: the launch package is built out of the
# same declarations the drivers read it with, rather than a second copy.
#
# `default-features = false` for the reason `driver-vulkan` and `driver-wgpu`
# both write out at their own edges: the default `rpc` feature reaches `tarpc`
# and through it tokio, `opentelemetry` and `rand`, and `getrandom` REFUSES to
# build for `wasm32-unknown-unknown` without a cfg flag nothing here can set.
# This crate names no `tarpc` anywhere; it wants the declarations.
#
# Cargo unifies features across the graph, so one dependent taking the default
# hands `rpc` to everyone. `driver` now depends on this crate, `driver-wgpu`
# depends on `driver`, and that path -- one edge that did not say
# `default-features = false` -- is what broke `driver-wgpu`'s three browser
# tests. Both of that crate's own edges had said it, with comments explaining
# why, and neither could help.
driver-api = { path = "../driver-api", default-features = false }

# Shared ratchet from the root manifest. The toolchain's three crates are gated
# with `-D warnings` in CI; see `[workspace.lints]` in the workspace `Cargo.toml`.
[lints]
workspace = true
