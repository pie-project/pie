[package]
name = "worker"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Standalone Pie server (no Python). Embeds a native engine in-process."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "worker"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = []
cuda = ["runtime/cuda"]
metal = ["runtime/metal"]
vulkan = ["runtime/vulkan"]
wgpu = ["runtime/wgpu"]
nixl = ["dep:transport", "transport/nixl"]

profile-fire = ["runtime/profile-fire"]
session-lifetime-diagnostic = ["runtime/session-lifetime-diagnostic"]

[[test]]
name = "session_lifetime_diagnostic"
path = "tests/session_lifetime_diagnostic.rs"
required-features = ["session-lifetime-diagnostic"]

[dependencies]
runtime = { path = "../runtime" }
models = { path = "../models" }
controller-api = { path = "../controller-api" }
worker-api = { path = "../worker-api" }

engine = { path = "../engine" }
model-ir = { path = "../model-ir" }
transport = { path = "../transport", optional = true }
ids = { path = "../ids" }
client-api = { path = "../client-api" }
anyhow = "1.0"
bootstrap = { path = "../bootstrap" }
rmp-serde = "1.3"
blake3 = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
tokio = { version = "1.53", features = ["full"] }
tarpc = { version = "0.37", features = [
	"serde-transport",
	"serde-transport-bincode",
	"tcp",
	"unix",
] }
tokio-tungstenite = "0.30.0"
futures = "0.3.33"
mimalloc = { version = "0.1", features = ["local_dynamic_tls"] }
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }

checkpoint = { path = "../checkpoint", default-features = false }
tokenizer = { path = "../tokenizer" }

client = { path = "../client" }

[dev-dependencies]
tempfile = "3"
gateway = { path = "../gateway" }
tokio = { version = "1.53", features = ["test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints]
workspace = true
