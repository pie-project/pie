[package]
name = "worker"
version = "0.4.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Standalone Pie server (no Python). Embeds a native driver in-process."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

# Library half — the engine boot path (serve::start_engine, config types,
# the supervisors). The `pie` CLI binary below is one consumer; the
# `pie-server` Python wheel under `sdk/server/python/` is another.
[lib]
name = "worker"
path = "src/lib.rs"
crate-type = ["rlib"]

# Binary half — the `pie` CLI. Parses argv via clap and dispatches into
# the lib.
[features]
# Default = no embedded backend feature. Enable `driver-cuda` (Linux/NVIDIA),
# `driver-metal` (macOS), `driver-vulkan` (anywhere with a loader and an ICD)
# or `driver-wgpu` (anywhere with an adapter) to reach a device; with none of
# them, this crate builds and serves nothing locally.
#
# There used to be a third: an always-linked `driver-dummy` selected at
# runtime, plus a `driver-dummy = []` no-op kept for older build commands.
# Both are gone with the crate.
default = []
# Each flavor turns on a DEPENDENCY, not a branch in this crate's build
# script. Both drivers are Rust now, so what this crate needs from them is
# that they be in the graph.
driver-cuda = ["engine/driver-cuda"]
driver-metal = ["engine/driver-metal"]
# The pure-Rust Vulkan driver. Portable rather than vendor-specific, so it is
# a flavor a machine can have alongside either of the two above -- and without
# this line the `pie` binary could not reach it at all, however complete the
# driver was.
driver-vulkan = ["engine/driver-vulkan"]
# The WebGPU shell, portable one step further than that. `driver-vulkan`
# builds anywhere and needs a loader and an ICD to RUN; this one needs neither,
# because its whole closure is pure Rust and `kernels-wgpu` ships the shaders
# inside the rlib -- so turning it on cannot fail to build for want of a
# toolchain on any host cargo runs on. It still wants an adapter to serve,
# which is why it is opt-in like the other three.
driver-wgpu = ["engine/driver-wgpu"]
nixl = ["dep:transport", "transport/nixl"]

# Per-domain probe passthroughs. Each forwards to the runtime crate's
# corresponding flag. See `crates/engine/src/scheduler/probe.rs` for the
# catalog of domains.
profile-fire = ["engine/profile-fire"]
profile-hot-path = ["engine/profile-hot-path"]
profile-all = ["engine/profile-all"]

[dependencies]
# `pie` is the runtime crate. After Phase 8 deleted the legacy
# `pie._runtime` maturin module, runtime has no `python` feature to
# disable — pyo3 only lives in `driver/bridge_py/` (the Rust extension
# bundled into the `pie-driver-bridge` wheel via maturin), not in the
# runtime crate itself.
engine = { path = "../engine" }
# Shared tarpc control-plane contract.
controller-api = { path = "../controller-api" }
# Gateway data-plane RPC contract (post-inversion M3): GatewayInbound +
# WorkerControl traits + the shared spawn_twoway link glue. The worker dials
# INTO the gateway and serves WorkerControl over the split connection.
worker-api = { path = "../worker-api" }

# The runtime <-> driver vocabulary. A direct dep because this crate names
# those types, not (as it once did) so its build script could receive a C
# header directory through a `links` handoff.
driver-api = { path = "../driver-api" }
transport = { path = "../transport", optional = true }
# Shared id atoms (WorkerId / NodeId / ReqId / SessionId) and the client wire
# vocabulary (ClientMessage / ServerMessage) the gateway data plane carries.
ids = { path = "../ids" }
client-api = { path = "../client-api" }
anyhow = "1.0"
# `$PIE_HOME` fallback to the home directory (`crate::paths`).
dirs = "6.0"
rmp-serde = "1.3"
# Verify content-addressed blob fetches (design §9): blake3(body) == BlobRef.hash.
blake3 = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
tokio = { version = "1.53", features = ["full"] }
# `serde-transport-bincode` = control-plane codec (pie-controller-rpc client). The
# data-plane codec is single-sourced in `worker-api` (`dispatch_codec`,
# MessagePack), so no `serde-transport-json` here.
tarpc = { version = "0.37", features = [
	"serde-transport",
	"serde-transport-bincode",
	"tcp",
	"unix",
] }
# The WebSocket the standalone client server terminates (client wire vocabulary
# comes from `pie-client`, already a dependency below).
tokio-tungstenite = "0.30.0"
futures = "0.3.33"
# `local_dynamic_tls`: the pyo3 wheel is dlopen()ed, and mimalloc's default
# initial-exec TLS model cannot be satisfied by a late-loaded library.
mimalloc = { version = "0.1", features = ["local_dynamic_tls"] }
tracing = "0.1"
# Async HTTP client for the data-plane blob fetch (gateway_link.rs): the
# worker pulls `GET {origin}/blob/{hash}` for multimodal inputs during
# inference (design §9). Provisioning downloads (weights, py-runtime) live in
# `bin/pie`, so no `blocking` here — blob fetch is async.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }

# Always-linked Rust dummy driver — random tokens, no model load.
# `default-features = false` drops the loader's testkit (oracle, contract
# fixture builder, CPU executor). Nothing under `ffi/` reaches them, and this is
# what keeps that true.
model-loader = { path = "../model-loader", default-features = false }
# `model-compiler` STOOD HERE, with the note "no Rust in this process calls the
# forward toolchain — the drivers reach it over its C ABI — so the dependency
# exists to put the rlib in the link and to order the build-script include
# handoff." Neither half survives inspection: `build.rs` is a no-op since the
# drivers started building their own `csrc/`, and each driver names the
# toolchain itself, so the rlib is in the link because a driver put it there.
# The toolchain split made the dead edge visible — `model-compiler` means the
# LOWERING now, and this crate does not lower anything — so it went.
# The loader's C ABI. Depended on for two build-time reasons: the entry-point
# anchor in `embedded_driver.rs`, and `DEP_PIE_LOADER_INCLUDE` — this crate's
# `links = "pie_loader"` metadata — which `build.rs` hands to the C++ drivers.
# The artifact's compiled metadata is lifted here and handed to the runtime
# whole: `model` owns the shape it arrives in, `tokenizer` names the
# objects that make up a `pie.tokenizer/1`.
#
# `contract` is what names `model/config` and the `Encoding` read out of
# it, so the worker lifts a snapshot's own `config.json` and reads it back
# out of an artifact under the same name `convert` writes it under. It
# used to ask for `config`, a feature that carried an 845-line normalizer
# whose whole output the catalog now states as a `const`.
model = { path = "../model", features = ["contract"] }
tokenizer = { path = "../tokenizer" }

# Pie websocket client — used by `pie run` to drive an inferlet against
# the engine subprocess we boot. Same crate the dummy_roundtrip example
# uses.
client = { path = "../client" }

[dev-dependencies]
tempfile = "3"
tensor-ir = { path = "../tensor-ir" }
# The same `model`, with the one row that is not a model.
#
# `dummy_boot_uses_create_compile_load_sequence` writes a four-byte
# checkpoint because what it checks is the create/compile/load SEQUENCE, not
# a model. Identity is a manifest match now, so the dummy driver has to name
# a row it can be held to, and the smallest real one is half a gigabyte of
# embedding. See `model::test_rows`.
model = { path = "../model", features = ["contract", "test-rows"] }

[build-dependencies]
# `kill(pid, 0)` for the stale-launch-state sweep: reachability only, never a
# signal. Unix-only; the sweep is a no-op elsewhere.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
