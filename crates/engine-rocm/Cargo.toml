[package]
name = "engine-rocm"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The ROCm engine's dispatch layer: a Run that resolves plan ids to device handles and answers every Dispatch* trait by calling kernels-rocm entries on the stream Ctx."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "engine_rocm"
path = "src/lib.rs"

[dependencies]
memmap2 = "0.9"
toml = "1.1"
libc = "0.2"
serde_json = "1"
poem-ir = { package = "pie-poem-ir", path = "../poem-ir" }
kernels-rocm = { path = "../kernels-rocm" }

engine = { path = "../engine" }

poem-exec = { package = "pie-poem-exec", path = "../poem-exec" }

eta-exec = { path = "../eta-exec" }

eta-ir = { package = "pie-eta-ir", path = "../eta-ir" }
eta-compiler = { path = "../eta-compiler" }
poem-compiler = { package = "pie-poem-compiler", path = "../poem-compiler" }
profile = { package = "pie-profile", path = "../profile" }
checkpoint = { path = "../checkpoint" }
poem = { package = "pie-poem", path = "../poem" }
ztensor-compat = { workspace = true }


[features]
default = ["probe"]

probe = []

rocm = ["kernels-rocm/rocm"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }

[dev-dependencies]
poem = { package = "pie-poem", path = "../poem" }
tokenizer = { path = "../tokenizer" }
ztensor = { workspace = true }
ztensor-compat = { workspace = true }
tempfile = "3"
