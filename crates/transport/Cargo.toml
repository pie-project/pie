[package]
name = "transport"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "Worker↔worker P2P KV-tensor data plane (RDMA) for pie."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[dependencies]
thiserror = "2.0"
# `PeerConn` (peer id + exported handle + opaque connect creds) crosses the
# control channel, so it derives serde.
serde = { version = "1.0", features = ["derive"] }

# The KV layout and handle vocabulary: `engine::{KvLayout, KvLayoutKind,
# KvHandle, KvRegion, MemoryDomain}`. `engine` has no features, so
# `default-features = false` is a no-op kept for the day it does.
engine = { path = "../engine", default-features = false }
# The element type a `KvLayout` names, from the leaf that owns it: this crate
# wants a dtype, not an IR.
dtype = { path = "../dtype" }
# `WorkerId`, which a transfer names its src/dst by.
ids = { path = "../ids" }

[features]
# Cross-node RDMA/TCP/NVMe path via NIXL. Off by default: the on-device build
# ships NIXL-free with only the `local` backend. Enabling it turns on `bindgen`,
# which generates the C-API bindings and links `libnixl_capi.so` from
# `$NIXL_PREFIX` (see `build.rs`).
nixl = ["dep:bindgen"]

[build-dependencies]
# Only pulled in under `--features nixl`.
bindgen = { version = "0.72", optional = true }
