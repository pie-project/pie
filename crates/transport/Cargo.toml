[package]
name = "transport"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "Worker↔worker P2P KV-tensor data plane (RDMA) for pie."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }

engine = { path = "../engine", default-features = false }
dtype = { package = "pie-dtype", path = "../dtype" }
ids = { path = "../ids" }
tokio = { version = "1.53", features = ["net", "io-util", "rt", "macros", "sync"], optional = true }
socket2 = { version = "0.6", optional = true }
bytes = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }

[features]
nixl = ["dep:bindgen"]
# Pages' bytes over a plain TCP stream.
tcp = ["dep:tokio", "dep:socket2", "dep:tracing", "dep:bytes"]

[dev-dependencies]
tokio = { version = "1.53", features = ["net", "io-util", "rt", "macros", "rt-multi-thread"] }

[build-dependencies]
bindgen = { version = "0.73", optional = true }

[lints]
workspace = true
