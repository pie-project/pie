[package]
name = "pie-web"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "pie in a browser tab: the runtime, the WebGPU engine and the Pulley-interpreted inferlet sandbox compiled to wasm32, driven by the page through a handful of exports. The client protocol is the same ClientMessage/ServerMessage the WebSocket carries natively, as JSON."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "pie_web"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
runtime = { path = "../runtime", features = ["wgpu"] }
engine-wgpu = { path = "../engine-wgpu", features = ["wgpu"] }
engine = { path = "../engine" }
model-ir = { path = "../model-ir" }
models = { path = "../models" }
checkpoint = { path = "../checkpoint", default-features = false }
tokenizer = { path = "../tokenizer" }
ztensor = { workspace = true }
client-api = { path = "../client-api" }
web-std = { path = "../web-std" }
wasmtime-web = { path = "../wasmtime-web" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }


[features]
profile-fire = ["runtime/profile-fire"]
