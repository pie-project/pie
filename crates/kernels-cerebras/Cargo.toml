[package]
name = "kernels-cerebras"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The Cerebras wafer program compiler: plans a model's trace onto the wafer (poem's spatial pass), builds the program (blocks, floor, fabric, kernel ABI, the CSL kernels), links it with the SDK toolchain and cuts the checkpoint into its tiles, as an artifact the engine runs."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "kernels_cerebras"
path = "src/lib.rs"

[dependencies]
blake3 = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
poem-compiler = { package = "pie-poem-compiler", path = "../poem-compiler" }
poem-ir = { package = "pie-poem-ir", path = "../poem-ir" }
kernels-ir = { path = "../kernels-ir" }

[lints]
workspace = true
