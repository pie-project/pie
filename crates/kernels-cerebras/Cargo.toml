[package]
name = "kernels-cerebras"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Cerebras kernels: the CSL kernel library, with a census naming every kernel and its argument formats, and per-op entries that emit device work (phases of kernel calls over placed buffers). The engine owns where data lives and when it runs."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "kernels_cerebras"
path = "src/lib.rs"

[dependencies]
dtype = { package = "pie-dtype", path = "../dtype" }

[lints]
workspace = true
