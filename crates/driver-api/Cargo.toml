[package]
name = "driver-api"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "The runtime\u2194driver vocabulary for pie: fire descriptors, launch plans, create-time capabilities, and the KV transfer types shared with cross-node transport."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"


[lib]
name = "driver_api"
crate-type = ["rlib"]
path = "src/lib.rs"

[features]
# On by default, so every existing consumer is unaffected by the split.
default = ["rpc"]

# `remote`: the tarpc service the cross-node transport speaks.
#
# Optional because ONE module needs it and the rest of this crate is plain
# data. `tarpc` brings tokio, and tokio's platform closure reaches `js-sys`,
# `wasm-bindgen` and `windows-sys` -- none of which compiles C on Linux, but
# all of which a dependent that checks its closure for native libraries has to
# either accept or explain away. `driver-vulkan` is that dependent: it is
# required to be pure Rust and proves it by asking the resolver, and it needs
# `DeviceFacts` and nothing else from here.
rpc = ["dep:tarpc"]

[dependencies]
# `DriverCapabilities` (JSON handshake) + the transfer layout types are plain serde.
serde = { version = "1.0", features = ["derive"] }
tarpc = { version = "0.37", features = ["serde1"], optional = true }

# `Driver`'s verbs answer `Result<_, anyhow::Error>` for the same reason the
# seams they replaced did: a driver failure is a message a human reads, not a
# value the engine matches on. The one failure the engine DOES match on is
# `Unsupported`, which is a type here rather than a string.
anyhow = "1.0"
# What a completion is made of.
#
# `waker` is the slot table a `SubmissionCompletion` parks on, and it has no
# dependencies of its own; `crossbeam-queue` is the terminal-cell recycling
# pool. Both are pure Rust, which is the property `driver-vulkan` and
# `driver-wgpu` assert about this crate's closure in their `tests/pure.rs` --
# adding a dependency here adds one to nine crates, so the bar is that test
# rather than taste.
waker = { path = "../waker" }
crossbeam-queue = "0.3"

[dev-dependencies]
serde_json = "1.0"
# `completion`'s tests await a `SubmissionCompletion`, which is a `Future`.
# A DEV-dependency only: nothing in this crate's public surface is async, and
# `driver-vulkan`/`driver-wgpu` assert its closure is pure Rust.
tokio = { version = "1", features = ["rt", "macros", "time"] }
