[package]
name = "driver-api"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "The runtime\u2194driver vocabulary for pie: fire descriptors, launch plans, create-time capabilities, and the KV transfer types shared with cross-node transport."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"


[lib]
name = "driver_api"
crate-type = ["rlib"]
path = "src/lib.rs"

[features]
# On by default, so every existing consumer is unaffected by the split.
default = ["rpc", "runtime"]

# `remote`: the tarpc service the cross-node transport speaks.
#
# Optional because ONE module needs it and the rest of this crate is plain
# data. `tarpc` brings tokio, and tokio's platform closure reaches `js-sys`,
# `wasm-bindgen` and `windows-sys` -- none of which compiles C on Linux, but
# all of which a dependent that checks its closure for native libraries has to
# either accept or explain away. `driver-vulkan` is that dependent: it is
# required to be pure Rust and proves it by asking the resolver, and it needs
# `DeviceFacts` and nothing else from here.
rpc = ["dep:tarpc"]

# `runtime`: the `Driver` trait, the completions it mints, and the instance
# handle it answers.
#
# Optional on the same terms `rpc` is, and for a sharper reason. The rest of
# this crate is plain data — plans, descriptors, the records a driver answers
# with — and the device crates want ONLY that. `Driver` is implemented in
# `engine`, not in `driver-cuda`/`driver-vulkan`/`driver-wgpu`, so none of
# them names the trait, the broker, or `BoundInstance`.
#
# What turning it on costs them is `waker`, whose slot table a
# `SubmissionCompletion` parks on. `waker` takes `loom` under
# `[target.'cfg(loom)'.dependencies]` — a gate its own manifest says exists
# so the model check does not drag the runtime's graph in — and `loom` pulls
# `generator` (which builds with `cc`) and `tracing-subscriber` ->
# `windows-sys`. `driver-vulkan` and `driver-wgpu` assert their closure is
# pure Rust in `tests/pure.rs`, and `cargo tree --target all` cannot rule a
# cfg-gated edge out, so those two crates would fail a test that is right to
# fail: a driver has no business carrying a model checker.
#
# Every consumer that actually calls a driver takes the default and is
# unaffected.
runtime = ["dep:waker", "dep:crossbeam-queue"]

[dependencies]
# `DriverCapabilities` (JSON handshake) + the transfer layout types are plain serde.
serde = { version = "1.0", features = ["derive"] }
tarpc = { version = "0.37", features = ["serde1"], optional = true }

# `Driver`'s verbs answer `Result<_, anyhow::Error>` for the same reason the
# seams they replaced did: a driver failure is a message a human reads, not a
# value the engine matches on. The one failure the engine DOES match on is
# `Unsupported`, which is a type here rather than a string.
anyhow = "1.0"
# What a completion is made of, behind `runtime`.
#
# `waker` is the slot table a `SubmissionCompletion` parks on; `crossbeam-queue`
# is the terminal-cell recycling pool. Both are pure Rust THEMSELVES, but
# `waker` carries a `cfg(loom)` edge that `cargo tree --target all` cannot rule
# out -- see the `runtime` feature for why that is what made these optional.
waker = { path = "../waker", optional = true }
crossbeam-queue = { version = "0.3", optional = true }

[dev-dependencies]
serde_json = "1.0"
# `completion`'s tests await a `SubmissionCompletion`, which is a `Future`.
# A DEV-dependency only: nothing in this crate's public surface is async, and
# `driver-vulkan`/`driver-wgpu` assert its closure is pure Rust.
tokio = { version = "1", features = ["rt", "macros", "time"] }
