[package]
name = "engine-metal"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The menlo Metal engine's dispatch layer: a Run that resolves plan ids to device handles and answers every Dispatch* trait by calling kernels-metal entries through dyn Encode. Merges into engine-metal when the old stack is deleted."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "engine_metal"
path = "src/lib.rs"

[dependencies]
toml = "1.1"
poem-ir = { package = "pie-poem-ir", path = "../poem-ir" }
kernels-metal = { path = "../kernels-metal" }

engine = { path = "../engine" }

poem-exec = { package = "pie-poem-exec", path = "../poem-exec" }

eta-exec = { path = "../eta-exec" }

eta-compiler = { path = "../eta-compiler" }
eta-ir = { package = "pie-eta-ir", path = "../eta-ir" }
poem-compiler = { package = "pie-poem-compiler", path = "../poem-compiler" }
checkpoint = { path = "../checkpoint" }

libc = "0.2"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSError",
    "NSRange",
    "NSProcessInfo",
] }
objc2-metal = { version = "0.3", default-features = false, features = [
    "std",
    "MTLDevice",
    "MTLBuffer",
    "MTLResource",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "objc2-core-foundation",
    "MTLCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLLibrary",
    "MTLBlitCommandEncoder",
    "MTLTypes",
    "block2",
    "MTLIndirectCommandBuffer",
    "MTLIndirectCommandEncoder",
    "MTLAllocation",
    "MTLPipeline",
    # The elastic kv pool: placement heaps, the residency set that keeps
    # them resident on the legacy queue, the MTL4 queue that maps and unmaps
    # sparse buffer tiles, the shared event that orders those against the
    # host, and the encoder module that declares the mapping operation.
    "MTLHeap",
    "MTLResidencySet",
    "MTLEvent",
    "MTL4CommandQueue",
    "MTLResourceStateCommandEncoder",
] }

[dev-dependencies]
media = { path = "../media" }
poem = { package = "pie-poem", path = "../poem" }
tokenizer = { path = "../tokenizer" }
serde_json = "1"
ztensor = { workspace = true }
ztensor-compat = { workspace = true }
eta-dsl = { package = "pie-eta-dsl", path = "../eta-dsl" }
