[package]
name = "engine-metal"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The menlo Metal engine's dispatch layer: a Run that resolves plan ids to device handles and answers every Dispatch* trait by calling kernels-metal entries through dyn Encode. Merges into engine-metal when the old stack is deleted."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "engine_metal"
path = "src/lib.rs"

[dependencies]
toml = "1.1"
model-ir = { path = "../model-ir" }
kernels-metal = { path = "../kernels-metal" }

engine = { path = "../engine" }

model-exec = { path = "../model-exec" }

eta-exec = { path = "../eta-exec" }

eta-compiler = { path = "../eta-compiler" }
eta-ir = { path = "../eta-ir" }
model-compiler = { path = "../model-compiler" }
checkpoint = { path = "../checkpoint" }

libc = "0.2"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSError",
    "NSRange",
] }
objc2-metal = { version = "0.3", default-features = false, features = [
    "std",
    "MTLDevice",
    "MTLBuffer",
    "MTLResource",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "objc2-core-foundation",
    "MTLCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLLibrary",
    "MTLBlitCommandEncoder",
    "MTLTypes",
    "block2",
    "MTLIndirectCommandBuffer",
    "MTLIndirectCommandEncoder",
    "MTLAllocation",
    "MTLPipeline",
] }

[dev-dependencies]
checkpoint-dsl = { path = "../checkpoint-dsl" }
models = { path = "../models" }
model-dsl = { path = "../model-dsl" }
tokenizer = { path = "../tokenizer" }
serde_json = "1"
ztensor = { workspace = true }
ztensor-compat = { workspace = true }
eta-dsl = { path = "../eta-dsl" }
