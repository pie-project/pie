[package]
name = "engine-metal"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The menlo Metal engine's dispatch layer: a Run that resolves plan ids to device handles and answers every Dispatch* trait by calling kernels-metal entries through dyn Encode. Merges into engine-metal when the old stack is deleted."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "engine_metal"
path = "src/lib.rs"

[dependencies]
# The boot document's format, for `boot.rs` — this shell's own `[…]` tables,
# read into its own `DeviceBoot`. The reader used to live in `runtime`, which
# is where this line used to be; it moved with the code, because a crate that
# parses into a type should be the crate that declares it.
toml = "1.1"
# The vocabulary the resolver routes on: `ValueDecl`, `Def`, `RuntimeInput`,
# `ValueId` — and the six family enums the dispatch arms destructure.
model-ir = { path = "../model-ir" }
# `kernels` STOOD HERE for the contract this crate implements — the six
# `Dispatch*` traits and `KernelError` — and the crate is gone. Both halves
# went to `model-exec`, which is already below (the walk written over the
# contract has always lived there and is driven over this crate's `Run` from
# there), so this line was subtracted rather than replaced: the same names
# arrive over an edge this manifest already declared.
# The entries called and the handles resolved to: `Tensor`, `RaggedTensor`,
# `KvPool`, `RecurrentPool`, the plan payloads, and the `dyn Encode` sink
# that keeps this crate OS-portable.
kernels-metal = { path = "../kernels-metal" }

# The runtime↔engine contract: `trait Engine` and every noun its verbs take.
# This shell IMPLEMENTS it; nothing here is re-exported onward.
engine = { path = "../engine" }

# The shared fire substrate: `compose`, `FireDescriptor`, `walk`, `EagerSink`
# (palo design §6). The shell supplies the two traits and calls the walk; it
# never re-implements one.
model-exec = { path = "../model-exec" }

# The ETA host half: launch-package adoption, the channel ring, the reference
# pass. It was one crate with `model-exec` until the two were measured apart,
# and this shell is the reason there is no umbrella left to depend on instead:
# it uses BOTH halves, so a re-exporting parent would only have hidden which.
eta-exec = { path = "../eta-exec" }

# THE DEV EDGE THAT WAS ALSO A PRODUCTION EDGE ALL ALONG. Both crates sat
# under `[dev-dependencies]` below with a note explaining that `program/` is
# handed a `LaunchPackage` and never plans one — true, and not what the edge
# was for. Production code here reads `eta_compiler::codegen::launch::
# LaunchStagePlan` and `eta_ir::registry::Port`, and it reached them by
# spelling the substrate crate, then the contract crate it re-exported, then
# the IR: a re-export chain four crate names long whose only effect was to keep
# this manifest looking cleaner than the code. The chain is gone, so the lines
# are here.
eta-compiler = { path = "../eta-compiler" }
eta-ir = { path = "../eta-ir" }
# `CompiledModel` — the artifact this shell walks: the region template, the class
# table a descriptor's counts index, and the arena's static offsets. Metal
# records nothing (design §6: "no record.rs"), so `CompiledModel` is read as a
# template and never as a capture script.
model-compiler = { path = "../model-compiler" }
# The residency half: `ModelContract` (the caller's, per decision #18),
# `plan::compile` and the `Execution` that runs it against the checkpoint.
checkpoint = { path = "../checkpoint" }

# `mmap`/`munmap`/`msync`/`madvise`/`fstat`, for `host_source.rs` alone — the
# streamed tier's source is a mapping of an unlinked temporary file so that the
# kernel may reclaim it, and there is no std spelling of any of those five.
# NOT target-gated the way the Metal crates below are: this is POSIX and not
# Apple, and the whole point of the module is a property (a file-backed page is
# reclaimable, an anonymous one is only swappable) that Linux and darwin state
# the same way — so the module type-checks and its unit gates run on the
# workspace sweep, on the box that has no GPU.
libc = "0.2"

# Metal itself, and the two crates it is spoken through. TARGET-gated rather
# than feature-gated, which is the one place this manifest diverges from
# `engine-cuda`'s and for a reason that is not a preference: a CUDA runtime
# is a CHOICE a machine makes (which libcudart, which ABI) and a build that
# names it may still not have it, so the CUDA shell carries a feature and a
# `Runtimeless` answer. Metal is not a choice — it is the platform, present
# on every Apple target and absent from every other one — so the axis is
# `cfg(target_vendor = "apple")`, decided by the target triple. On any other
# target the device half compiles to its refusing twin and the whole shell,
# the walk included, is still type-checked by a plain workspace sweep.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
# The completion handler a committed command buffer is settled through
# (`device::ctx::Frame::commit_async`). `addCompletedHandler:` takes an
# Objective-C block and there is no other spelling of it: a shell that polled
# `status` instead would need somebody to poll, and the whole point of the
# asynchronous wave is that nobody is standing there.
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSError",
    "NSRange",
] }
objc2-metal = { version = "0.3", default-features = false, features = [
    "std",
    "MTLDevice",
    "MTLBuffer",
    "MTLResource",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLLibrary",
    "MTLBlitCommandEncoder",
    "MTLTypes",
    # `MTLCommandBufferHandler` — the block `addCompletedHandler:` takes.
    "block2",
    # The indirect command buffer plane (`crate::icb`): the buffer, the
    # per-slot compute command, and the `MTLAllocation` supertrait a resource
    # is declared resident through.
    "MTLIndirectCommandBuffer",
    "MTLIndirectCommandEncoder",
    "MTLAllocation",
    "MTLPipeline",
] }

[dev-dependencies]
# The smoke's catalog row and its load contract. A DEV dependency on purpose:
# the runtime traces and hands a `Plan` and a `ModelContract` across (design
# §7, decision #18), so the shell itself must not know a model family.
models = { path = "../models" }
# `Platform`, and the `Facts`/`Request` pair the smoke computes each lane's
# word with — `Classify::of`, runtime-side in production.
model-dsl = { path = "../model-dsl" }
# The prompt in, the continuation out.
tokenizer = { path = "../tokenizer" }
# ONE reader: `two_bit_moe_first_light` parses the DQ snapshot's safetensors
# header so its census is held against the artifact's own rectangles rather
# than against a table typed beside the assertion. A dev dependency for the
# same reason `model` is one — the shell reads checkpoints through a contract
# and never a header.
serde_json = "1"
# The checkpoint container the import contract is checked against, and the
# projection that lets a stock safetensors snapshot BE one.
ztensor = { workspace = true }
ztensor-compat = { workspace = true }
# The guest-authoring surface, for ONE fixture `eta-compiler`'s golden corpus
# does not hold: a single-lane pooled device-geometry epilogue. The corpus's
# only member that binds the whole port class is `beam_epilogue`, which reads
# its logits as `[B, V]` — two rows — and this plane's emitted intrinsic
# handler has no row stride to be told (`program::launch` refuses it by name).
# So `serve_smoke`'s device-geometry gate authors its subject rather than
# quoting one, which is the same builder `eta-compiler`'s own goldens were
# authored through.
eta-dsl = { path = "../eta-dsl" }
