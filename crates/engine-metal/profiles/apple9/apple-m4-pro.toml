api = 1

[target]
device = "Apple M4 Pro"

[provenance]
# No run states the check models these lines were compared on, so none is
# called measured (a decision is measured only where a check model read it
# and the run changed it or kept it within the agreement tolerance). The
# values stand on their own comments; `pie tune metal` on an M4 Pro states
# them anew.
measured = []

[kernel]
# From the first device profile's search (#942): the split-K fill a 4-bit
# decode's matmul takes on this GPU's cores. Read by a quantized model.
qmm_splitk      = { use = "fill", fill_tg = 896, max = 8 }
# Set by hand in #993: Splash's measured share and least chunk for the MLP
# on the Neural Engine; the projections stay on the GPU.
ane.mlp         = [{ when = "ane", use = "share", percent = 74 }, "gpu"]
ane.projections = "gpu"
ane.min_rows    = 512
# a 512-token prompt over Gemma 4 26B-A4B routes about 33 rows an expert: a 32-row tile
# runs most experts half empty, as a 16-row tile does not; gpt-oss's 67 rows an expert
# take the same 16-row tile, which two simdgroups multiply side by side
moe.tile_rows   = [{ when = "per_expert < 2", value = 1 }, { value = 16 }]
