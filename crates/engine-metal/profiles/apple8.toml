# The Apple8 GPU family (M2): what every device of the family runs. Every decision the Metal registry declares, spelled out.
api = 1
fuse = ["mlp_swiglu", "residual_add_rmsnorm"]

[target]
assumes = { family = 8 }

[provenance]
source = "the Apple8 family tuning pie applied before per-chip profiles, carried over unchanged"

[kernel]
qmm = [
  { when = "(rows >= 5 and bits == 2) or (rows >= 8 and format == fp16)", use = "tiled", crossover_tg = 160 },
  { when = "rows >= 12", use = "tiled", crossover_tg = 160 },
  { use = "qmv", rows_max = 8, packs = 1, crossover_tg = 160 },
]
qmm_fp16 = true
qmm_splitk = { use = "fill", fill_tg = 512, max = 8 }
qmm_precast = 16
qmm_widen = 32
qmm_mpp.split_rows = 32
qmm_mpp.split_cols = 8192
qmm_mpp.pipeline_rows = 16
qmm_mpp.pipeline_cols = 8192
qmm_mpp.linear_from = 1024
sdpa.mpp_rows.from = 32
sdpa.mpp_rows.direct_from = 512
sdpa.mpp_rows.paired_below = 32
sdpa.split = 32
ane.min_rows = 256
ane.min_columns = 4096
moe.path              = "tiled"
moe.tile_rows = [
  { when = "per_expert < 2",   value = 1 },
  { when = "per_expert >= 32", value = 32 },
  { value = 16 },
]
sdpa.prefill                = "mpp"
sdpa.tile_rows_per_request  = 32
sdpa.mma                    = true
sdpa.kv_q8                  = false
gdn.scan                    = { use = "simd", rows = 4 }
ane.mlp                     = [{ when = "ane", use = "share", percent = 47 }, "gpu"]
ane.projections             = [{ when = "ane", use = "share", percent = 47 }, "gpu"]

[compiler]
launch_us              = 1.0
cond_fixed_us          = 5.0
cond_per_arm_us        = 0.6
fat_region_us          = 250.0
fork_floor_us          = 20.0
side_streams           = 0
cost.attention_us      = 60.0
cost.linear_us         = 40.0
cost.elementwise_us    = 4.0
cost.layout_us         = 4.0
cost.collective_us     = 50.0
cost.custom_us         = 20.0
cost.spatial_us        = 40.0

[layout]
weights = "plain"

[engine]
stream.cut = "fan_out"
experts.prefetch = 4
experts.threads = 8
