api = 1

[target]
assumes = { family = 9 }

[kernel]
qmm = [
  { when = "rows >= 5 and rows <= 8", use = "register" },
  { when = "rows >= 5 and (bits == 2 or format == fp16)", use = "tiled", crossover_tg = 96 },
  { when = "rows >= 12", use = "tiled", crossover_tg = 96 },
  { use = "qmv", rows_max = 8, packs = 1, crossover_tg = 96 },
]
# A decode row reads each key and value once for its kv head's group of query heads.
sdpa.gqa        = true
ane.mlp         = [{ when = "ane", use = "share", percent = 47 }, "gpu"]
ane.projections = [{ when = "ane", use = "share", percent = 47 }, "gpu"]
