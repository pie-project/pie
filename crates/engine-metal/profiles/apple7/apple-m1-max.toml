api = 1

# The 24-core M1 Max (the 32-core part shares the name and states its own).
[target]
device = "Apple M1 Max"
assumes = { cores = 24 }

# What pie's Metal kernels reach here (M1 Max, 24-core GPU, macOS 27; median
# of 5 timed by the GPU after a warm run, `the_device_rates`; the vendor's
# peaks are the upper bounds).
[rates]
# A 4096^3 bf16 GEMM through the dense kernel serving dispatches
# (simdgroup-matrix, f32 accumulation): 5.28 TFLOPS. Peak: 7.96 TFLOPS of f32
# FMA (24 cores x 128 ALUs x 2 x 1.296 GHz); the GPU has no faster bf16 path.
bf16_flops_per_ns = 5282.0
# A 256 MiB blit between two buffers, read and write counted: 377 GB/s. Peak:
# 400 GB/s of LPDDR5 (Apple's M1 Max figure).
bytes_per_ns = 377.2
# A dispatch's launch, back to back in one serial pass (512 of the smallest
# GEMM in one frame).
launch_ns = 4867

[provenance]
rates = "the_device_rates test on a 24-core M1 Max on 2026-11-15, through the dense kernel serving dispatches"
