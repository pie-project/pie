api = 1

# The 24-core M1 Max (the 32-core part shares the name and states its own).
[target]
device = "Apple M1 Max"
assumes = { cores = 24 }

# What pie's Metal kernels reach here (M1 Max, 24-core GPU, macOS 27), as
# `pie tune metal --rates` measured them at engine::rates' lattice, warmed
# first (two runs 3 min apart: median 0.04%, every point within 2.1% but the
# launch's 4.4%): the matmul m x n x k (simdgroup-matrix, f32 accumulation)
# 1.11 TFLOPS at 16 x 1024 x 1024 to 5.30 at 8192 x 2048 x 4096 (peak
# 7.96 TFLOPS of f32 FMA); the causal prefill over cold, scattered q / kv
# sets 2.52 TFLOPS at 512 keys of 64 to 6.31 at 16384 of 128; the blit
# against 400 GB/s of LPDDR5. Every float operand engine::rates' pattern.
[rates]
# Reduced to the roofline's constants from the grid measured above on
# 2026-11-17: gemm_tflops its 8192 x 4096 x 4096 point (the grid ran no
# 8192^3), attn_tflops
# its longest keys (16384) at d 128, scan_gelems its 2048-token point.
launch_ns = 4449
gemm_tflops = 5.3
attn_tflops = 6.3
hbm_gbps = 376.9
scan_gelems = 89.9

[provenance]
rates = "pie tune metal --rates on 2026-11-16 (pie 0.6.0): each kernel through the dispatch serving runs, back to back in 20 ms frames timed by the GPU, the matmul over engine::rates::weights_at planes, attention over engine::rates::attn_sets_at sets; operands: engine::rates' pattern; at engine::rates' lattice (matmul m x n x k, m 16..8192, n and k 1024..16384; attention keys x keys, keys 512..16384, 16/8 heads of 64..256; scan 2048 tokens, 16/16 heads of 128x128, conv 4); reduced to the roofline's constants from its grid on 2026-11-17"
