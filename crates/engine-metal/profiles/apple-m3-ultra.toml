# Apple M3 Ultra. Every decision the Metal registry declares, spelled out.
api = 1
fuse = ["mlp_swiglu", "residual_add_rmsnorm"]

[target]
device  = "Apple M3 Ultra"
assumes = { family = 9, ane = true }

[provenance]
source   = "the Apple9 family tuning pie applied before per-chip profiles, carried over unchanged"
measured = false

[kernel]
qmm.path              = "tiled"
qmm.min_rows          = 5
qmm.min_rows_emulated = 12
qmm.crossover_tg      = 96
qmm.fp16              = true
qmv.rows_max          = 8
qmv.packs             = 1
moe.path              = "tiled"
moe.tile_rows = [
  { when = "per_expert < 2",   value = 1 },
  { when = "per_expert >= 32", value = 32 },
  { value = 16 },
]
sdpa.prefill                = "tiled"
sdpa.tile_rows_per_request  = 32
sdpa.mma                    = true
sdpa.kv_q8                  = false
gdn.scan                    = { use = "simd", rows = 4 }
ane.mlp                     = { use = "share", percent = 47 }
ane.projections             = { use = "share", percent = 47 }

[compiler]
launch_us              = 1.0
cond_fixed_us          = 5.0
cond_per_arm_us        = 0.6
fat_region_us          = 250.0
fork_floor_us          = 20.0
side_streams           = 0
cost.attention_us      = 60.0
cost.linear_us         = 40.0
cost.elementwise_us    = 4.0
cost.layout_us         = 4.0
cost.collective_us     = 50.0
cost.custom_us         = 20.0
cost.spatial_us        = 40.0

[layout]
weights = "plain"

[engine]
stream.cut = "fan_out"
