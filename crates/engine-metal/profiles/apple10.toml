api = 1

[target]
assumes = { family = 10 }

[kernel]
qmm = [
  { when = "rows >= 5 and rows <= 8", use = "staged" },
  { when = "rows >= 8 and (rows > 16 or n >= 1024)", use = "mpp" },
  { when = "rows >= 5 and (bits == 2 or format == fp16)", use = "tiled", crossover_tg = 160 },
  { when = "rows >= 12", use = "tiled", crossover_tg = 160 },
  { use = "qmv", rows_max = 8, packs = 1, crossover_tg = 160 },
]
moe.path        = "mpp"
moe.tile_rows   = [
  { when = "per_expert < 2", value = 1 },
  { when = "per_expert >= 64", value = 64 },
  { when = "per_expert >= 32", value = 32 },
  { value = 16 },
]
sdpa.prefill    = "mpp"
gdn.scan        = { use = "staged", min_rows = 32 }
