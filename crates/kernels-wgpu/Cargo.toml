[package]
name = "kernels-wgpu"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "WebGPU kernel implementations (WGSL compute shaders + a Rust variant expander) and the signature table that declares them."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

# The shader directory, published for parity with the two siblings: a shell
# reads DEP_PIE_KERNELS_WGPU_KERNELS_DIR for the `.wgsl` tree and
# DEP_..._INCLUDE for the shared `.inc.wgsl` fragments.
#
# A wgpu shell does not NEED either. Unlike `kernels-vulkan`, which publishes a
# `spv_dir` a driver has to read because SPIR-V is a build product, this crate
# embeds every shader source into the rlib with `include_str!` (see `build.rs`)
# and serves them from [`source`]. The `links` vars exist so a tool that wants
# the tree on disk -- an editor, an audit, a diff against `kernels-vulkan` --
# can find it without knowing this crate's layout.
links = "pie_kernels_wgpu"
build = "build.rs"

[lib]
name = "kernels_wgpu"
path = "src/lib.rs"

[features]
# EMPTY, and that is the headline.
#
# `kernels-vulkan` has a `native` that costs `glslc`, because a SPIR-V module is
# a BUILD product and something has to produce it before a driver can be handed
# one. WGSL is not: wgpu carries `naga`, which is a Rust WGSL front end, so a
# module is compiled by the same process that dispatches it. There is no
# toolchain to gate and so there is no feature to gate it with.
#
# `kernels-cuda` arrives at the same place by the other road and its features
# are worth reading for the contrast: it has no `native` either, because NVRTC
# compiles its device text in-process too, and what `cuda-12`/`cuda-13` select
# is which libcudart the process LOADS. A runtime fact, not a toolchain.
#
# That is the whole reason this backend exists beside the other two. The table
# and the shaders build, and every structural test runs, on any machine that
# can build Rust -- no SDK, no vendor driver, no cross-compiler.
default = []

[dependencies]
# The routine registry — see the workspace table for why this one.
linkme = { workspace = true }
# `#[routine]`, which builds each row beside its own `fn`.
kernels-macros = { path = "../kernels-macros" }
kernels = { path = "../kernels" }

[dev-dependencies]
# The table test resolves through `sig_in`, which is the shared crate's, to
# check the lookup `model-ir` actually calls rather than a copy of it.
kernels = { path = "../kernels" }

# The WGSL front end, on its own. `wgpu` carries the same crate, but a module
# that only has to PARSE should not need an adapter to say so: `naga` alone is
# what lets `tests/gpu.rs` prove a shader compiles on a machine with no GPU at
# all, which is most of the machines this crate is built on. Pinned to the
# version `wgpu` 30 already resolves, so the harness and the runtime front end
# are one crate and cannot disagree about what WGSL is.
#
# `wgsl-in` is named explicitly because `naga`'s own default feature set does
# not include a front end: without it `naga::front::wgsl` does not exist and
# the parse check does not compile. `wgpu` enables it for its own use, and
# cargo unifies the two, so this costs nothing.
naga = { version = "30", features = ["wgsl-in"] }

# wgpu, for the GPU harness in `tests/gpu.rs` ONLY. A dev-dependency for the
# reason `ash` is one next door: this crate ships a table and a shader tree, and
# a driver is what owns a device. If `wgpu` ever appears under `[dependencies]`
# here, the layering has gone wrong.
#
# `default-features = false` drops the windowing and surface stack -- this is
# compute, there is no swapchain -- and `wgsl` is the front end the shaders are
# written in. `vulkan`/`metal`/`dx12` are the three native backends worth
# having; `noop` is not enabled, because a harness that silently ran on no
# device would report success for nothing.
wgpu = { version = "30", default-features = false, features = [
    "wgsl",
    "vulkan",
    "metal",
    "dx12",
] }
pollster = "0.4"

# `tests/gpu.rs` reads back raw device bytes; `bytemuck` is how they become
# numbers without a transmute this crate would have to justify.
bytemuck = { version = "1", features = ["derive"] }

# The GPU harness has to await a buffer map and an adapter request. `pollster`
# blocks on them, which is what a `#[test]` wants; nothing here needs a runtime.

[[test]]
# The table's product against the census, and the three parity checks against
# `kernels-metal`. No GPU, no toolchain -- this is the test that has to run on
# the machines that build `model-ir`.
name = "entrypoints"

[[test]]
# Needs an ADAPTER, not a feature: wgpu falls back through Vulkan, Metal and
# DX12 and reports which it found. Ungated on purpose -- there is no `native`
# to gate it with -- so it SKIPS with a printed reason when no adapter answers,
# the same contract `kernels-vulkan`'s harness has when the loader is missing.
name = "gpu"

# NO `[[example]]` sections, and the absence is load-bearing for the reason
# `kernels-cuda/Cargo.toml` states at length: a `[[example]]` whose file is
# gone does not make a skipped target, it makes a manifest cargo cannot PARSE,
# and this crate is a workspace member, so every command in the workspace fails
# with it. `examples/` is deleted here -- `dump_layout.rs` printed the launch
# ABI that `kernels_wgpu::bindings` and `uniform_layout` derive -- so there is
# no file for such a section to name.
