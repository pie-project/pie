[package]
name = "kernels-wgpu"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "WebGPU kernel implementations (WGSL compute shaders + a Rust variant expander) and the signature table that declares them."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

# The shader directory, published for parity with the two siblings: a shell
# reads DEP_PIE_KERNELS_WGPU_KERNELS_DIR for the `.wgsl` tree and
# DEP_..._INCLUDE for the shared `.inc.wgsl` fragments.
#
# A wgpu shell does not NEED either. Unlike `kernels-vulkan`, which publishes a
# `spv_dir` a driver has to read because SPIR-V is a build product, this crate
# embeds every shader source into the rlib with `include_str!` (see `build.rs`)
# and serves them from [`source`]. The `links` vars exist so a tool that wants
# the tree on disk -- an editor, an audit, a diff against `kernels-vulkan` --
# can find it without knowing this crate's layout.
links = "pie_kernels_wgpu"
build = "build.rs"

[lib]
name = "kernels_wgpu"
path = "src/lib.rs"

[features]
# EMPTY, and that is the headline.
#
# `kernels-vulkan` has a `native` that costs `glslc`, because a SPIR-V module is
# a BUILD product and something has to produce it before a driver can be handed
# one. WGSL is not: wgpu carries `naga`, which is a Rust WGSL front end, so a
# module is compiled by the same process that dispatches it. There is no
# toolchain to gate and so there is no feature to gate it with.
#
# `kernels-cuda` arrives at the same place by the other road and its features
# are worth reading for the contrast: it has no `native` either, because NVRTC
# compiles its device text in-process too, and what `cuda-12`/`cuda-13` select
# is which libcudart the process LOADS. A runtime fact, not a toolchain.
#
# That is the whole reason this backend exists beside the other two. The table
# and the shaders build, and every structural test runs, on any machine that
# can build Rust -- no SDK, no vendor driver, no cross-compiler.
default = []

[dependencies]
# `#[claims]`, which states beside each `impl <Family> for Ctx<'_>` which of
# the family's points that block answers. The `#[routine]` layer this crate
# used to carry is gone, and `linkme`/`inventory` — the two distributed-slice
# registries its rows were collected into — went with it: the by-name reach
# they served was `driver-wgpu`'s, and that crate left the workspace at R3.
kernels-macros = { path = "../kernels-macros" }
kernels = { path = "../kernels" }

# NO `[[example]]` sections, and the absence is load-bearing for the reason
# `kernels-cuda/Cargo.toml` states at length: a `[[example]]` whose file is
# gone does not make a skipped target, it makes a manifest cargo cannot PARSE,
# and this crate is a workspace member, so every command in the workspace fails
# with it. `examples/` is deleted here -- `dump_layout.rs` printed the launch
# ABI of a routine table that no longer exists -- so there is no file for such
# a section to name.
