[package]
name = "engine-vulkan"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The Vulkan engine's dispatch layer: a Run that resolves plan ids to device handles and answers every Dispatch* trait by calling kernels-vulkan entries through dyn Encode."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "engine_vulkan"
path = "src/lib.rs"

[dependencies]

toml = "1.1"

model-ir = { path = "../model-ir" }

kernels-vulkan = { path = "../kernels-vulkan" }

engine = { path = "../engine" }

model-exec = { path = "../model-exec" }
model-compiler = { path = "../model-compiler" }

eta-ir = { path = "../eta-ir" }

eta-exec = { path = "../eta-exec" }

eta-compiler = { path = "../eta-compiler" }
checkpoint = { path = "../checkpoint" }

libc = "0.2"

tracing = "0.1"

naga = { version = "30", default-features = false, features = [
    "wgsl-in",
    "spv-out",
], optional = true }
ash = { version = "0.38", default-features = false, features = [
    "loaded",
    "std",
], optional = true }

[features]
default = []
vulkan = ["dep:ash", "dep:naga", "kernels-vulkan/native"]
