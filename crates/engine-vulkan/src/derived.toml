api = 1

[target]

# A desktop GPU (discrete, or NVIDIA / AMD / Intel) has no submit watchdog a
# step outlasts, so it submits each step whole and records it; a mobile one
# (Adreno with coopmat lands here) keeps the split.
[engine]
submit.split_rows = [
  { when = "discrete or vendor in (nvidia, amd, intel)", value = 0 },
  { value = 32 },
]

[kernel]
gemm.path = [{ when = "coopmat", use = "coopmat" }, { use = "tiled" }]
moe.path = [{ when = "coopmat", use = "coopmat" }, { use = "tiled" }]
qmm = [
  { when = "coopmat and rows >= 12", use = "coopmat" },
  { when = "rows >= 12", use = "tiled", crossover_tg = 160 },
  { use = "qmv", vecs = 4 },
]
sdpa.decode.split = [
  { when = "cores > 0", use = "per_core", per = 1 },
  { use = "fixed", groups = 16 },
]
