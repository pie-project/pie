# Qualcomm Adreno without cooperative matrices: register-tiled prompts, the one-row decode kernel at 32 lanes and wider.
api = 1

[target]
assumes = { vendor = "qualcomm", coopmat = false }

[provenance]
source = "the Adreno branch of the facts-derived profile pie ran before vendor files, carried over unchanged"

[kernel]
qmm = [
  { when = "rows > 32", use = "register_tiled", bm = 64, k16 = true },
  { when = "rows >= 12", use = "register_tiled", bm = 32, k16 = true },
  { when = "subgroup >= 32", use = "one_row", lanes = 32, rows = 1 },
  { use = "qmv", vecs = 4 },
]
sdpa.decode.split_min_keys = 128
