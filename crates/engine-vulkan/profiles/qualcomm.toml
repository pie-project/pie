api = 1

[target]
assumes = { vendor = "qualcomm", coopmat = false }

[kernel]
qmm = [
  { when = "rows > 32", use = "register_tiled", bm = 64, k16 = true },
  { when = "rows >= 12", use = "register_tiled", bm = 32, k16 = true },
  { when = "subgroup >= 32", use = "one_row", lanes = 32, rows = 1 },
  { use = "qmv", vecs = 4 },
]
sdpa.decode.split_min_keys = 128

# Measured on an Adreno TM-840 (Snapdragon 8 Elite Gen 5): past about 4096
# live command buffers vkAllocateCommandBuffers succeeds with a buffer whose
# vkBeginCommandBuffer faults in the driver. The arm walk stops below it.
[engine]
max_live_command_buffers = 4096
