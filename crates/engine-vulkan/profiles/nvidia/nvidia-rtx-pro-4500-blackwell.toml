api = 1

[target]
device = "NVIDIA RTX PRO 4500 Blackwell"
assumes = { coopmat = true }

[provenance]
measured = ["kernel.gemm.path"]
rates = "pie tune vulkan --rates on 2026-11-19 (pie 0.6.0, commit 0e6cf65bb), NVIDIA RTX PRO 4500 Blackwell, driver 595.112.07: the median of five runs, each its own process on a fresh PIE_HOME and shader cache, under the GPU lock with no build running (nr_throttled +0 in every run); each kernel through the dispatch serving runs, frames doubled until two successive doublings agree within AGREEMENT; the matmul at n = k = 1024, 2048, 4096 by half octaves of rows, 256 to 8192; the few-row matmul at 4 to 256 rows on the kernel serving picks there, the median rate past its weight reads; the tiled attention by keys at head widths 64, 128 and 256; the conv and the gated-delta scan each timed on its own; workgroups a core from one 16-row tile a head of 16 over 8192 keys against the curve's rate there, over 82 cores; operands: engine::rates' pattern. Spread over the five runs: matmul and attention points at most 6.3%, launch 1.8%, copy 2.4%, per-row ops 1.8%, scan 0.6%, few-row 0.9%, workgroups a core 0.4%"

[kernel]
# `pie tune --quick` over Qwen3-0.6B's and Qwen3-8B's bf16 projections: below
# 96 rows the 64-row cooperative-matrix tile launches one row of workgroups
# and runs 1.2-1.8x the 32x32 tiled kernel's time; from 96 it runs 0.5-0.95x.
# The fitted path runs at 1.011x the per-point best, coopmat everywhere 1.164x.
gemm.path = [{ when = "rows < 96", use = "tiled" }, "coopmat"]

[rates]
launch_ns = 2189
gemm_tflops_by_rows = [
  [1024, [[256, 7.1], [362, 10.1], [512, 14.2], [724, 16.2], [1024, 18.3], [1448, 15.1], [2048, 18.3], [2896, 18.9], [4096, 20.6], [5793, 22.6], [8192, 23.3]]],
  [2048, [[256, 12.5], [362, 17.1], [512, 18.3], [724, 14.3], [1024, 18.2], [1448, 19.9], [2048, 21.0], [2896, 22.9], [4096, 23.9], [5793, 24.3], [8192, 24.4]]],
  [4096, [[256, 18.5], [362, 16.0], [512, 17.9], [724, 19.8], [1024, 20.9], [1448, 23.1], [2048, 23.7], [2896, 24.2], [4096, 24.5], [5793, 24.7], [8192, 25.0]]],
]
