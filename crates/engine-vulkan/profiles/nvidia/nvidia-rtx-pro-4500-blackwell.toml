rates = "pie tune vulkan --rates on 2026-11-19 (pie 0.6.0): NVIDIA RTX PRO 4500 Blackwell; the matmul through the profile's path, the host's clock around each frame; operands: engine::rates' pattern; at commit unknown; at engine::rates' shapes (matmul m x w x w, w [1024, 2048, 4096], m [256, 362, 512, 724, 1024, 1448, 2048, 2896, 4096, 5793, 8192]; attention keys x keys, keys [512, 1024, 2048, 4096, 8192], 16/8 heads of 128; per-row ops 2048 x 4096; scan 2048 tokens, 16/16 heads of 128x128, conv 4)"

[kernel]
# `pie tune --quick` over Qwen3-0.6B's and Qwen3-8B's bf16 projections: below
# 96 rows the 64-row cooperative-matrix tile launches one row of workgroups
# and runs 1.2-1.8x the 32x32 tiled kernel's time; from 96 it runs 0.5-0.95x.
# The fitted path runs at 1.011x the per-point best, coopmat everywhere 1.164x.
gemm.path = [{ when = "rows < 96", use = "tiled" }, "coopmat"]

