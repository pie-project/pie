# Imagination PowerVR without cooperative matrices: register-tiled prompts, the one-row decode kernel at 32 lanes and wider.
api = 1

[target]
assumes = { vendor = "imagination", coopmat = false }

[provenance]
source = "the PowerVR branch of the facts-derived profile pie ran before vendor files, with the register-tiled prompts of #939"

[kernel]
qmm = [
  { when = "rows > 32", use = "register_tiled", bm = 64, k16 = true },
  { when = "rows >= 12", use = "register_tiled", bm = 32, k16 = true },
  { when = "subgroup >= 32", use = "one_row", lanes = 8, rows = 2 },
  { use = "qmv", vecs = 4 },
]
sdpa.decode.split = [
  { when = "cores > 0", use = "per_core", per = 1 },
  { use = "fixed", groups = 16 },
]
