[package]
name = "kernels-macros"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
description = "The `#[routine]` attribute: derives a kernel's operand sources from its own signature"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
