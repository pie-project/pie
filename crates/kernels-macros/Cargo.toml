[package]
name = "kernels-macros"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
description = "The kernel crates' declaration attributes: `#[points]` (a family's point table and its unclaimed bodies) and `#[claims]` (the points a plane answers)"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
