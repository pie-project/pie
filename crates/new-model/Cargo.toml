[package]
name = "new-model"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The model catalog of the menlo stack: each model is a declaration (weights, dims, cache spaces) plus a forward pass written in new-model-dsl. Qwen 3.5 is ported first, end-to-end; the others follow the same shape."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "new_model"
path = "src/lib.rs"

[dependencies]
# What a forward pass is written in: Recorder/Value, the per-family kernel
# wrappers, split/merge/Facts, and the declaration types (Weight, Norm,
# CacheRef). A model's only verbs come from here.
new-model-dsl = { path = "../new-model-dsl" }
# The IR data a declaration states directly — `Repr` on each weight, the
# `GeomKind` a forward fetches. Everything else arrives through the dsl's
# re-exports.
new-model-ir = { path = "../new-model-ir" }
