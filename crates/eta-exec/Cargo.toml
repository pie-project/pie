[package]
name = "eta-exec"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "The ETA channel plane, in Rust: launch-package adoption, the channel ring, the reference pass, and every bind-time derivation a device shell needs. Backend-agnostic — the CUDA and Metal shells both read it."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

[lib]
name = "eta_exec"
path = "src/lib.rs"

# Affordable here and not in the shells: `unsafe_code = "forbid"` holds because
# this layer is arithmetic over `#[repr(C)]` records and `Vec`s, which is also
# the mechanical proof that the ETA plane needs no device.
[lints]
workspace = true

[dependencies]
# The op table, dtypes, intrinsic ids, the port registry and the canonical RNG
# contract — `eval_op`'s numerics are a contract, written down here.
eta-ir = { path = "../eta-ir" }

# For the artifact vocabulary both ends must agree on — `plan`'s lane-table ABI
# and version numbers, `codegen::launch`'s `LaunchPackage` — not the emitter:
# nothing here plans, emits or compiles. Importing them replaces five copies
# that were only safe while a drift test watched them.
eta-compiler = { path = "../eta-compiler" }
