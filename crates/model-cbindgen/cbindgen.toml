language = "C++"
pragma_once = true
namespace = "pie_forward"
usize_is_size_t = true
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
autogen_warning = "/* Generated by pie-forward-cbindgen (cbindgen). Do not edit by hand. Regenerate: cargo run -p model-cbindgen */"

# The C surface is exactly `crates/model/src/ffi/`. Everything else — the
# chat templates, the load contracts, and (through `model-compiler`) the trace
# IR and the family declarations — has no `#[repr(C)]` and must not leak, the
# same fence `model-loader-capi`'s cbindgen config draws around its `ffi/`.
#
# `parse_deps = false` keeps `model-compiler` out. The fence that needs
# tending is the one around THIS crate: `model` has a much wider public
# surface than the toolchain did, and cbindgen emits any public `const` it
# can see. `export.exclude` below is that fence, and a new leak shows up as
# an unexplained addition to the committed header — which is what the CI
# drift check is for.
[parse]
parse_deps = false

[export]
# cbindgen's `export.include` is *additive*: it forces items into the header
# that are not otherwise reachable. These four are the enums behind the
# `uint32_t` fields of `PieForwardLlamaLikeFacts` — inputs the *caller*
# writes, so no exported struct holds one by type and cbindgen has no path
# to them. The same situation, and the same fix, as `PieLoaderExprKind` in
# `loader/cbindgen/cbindgen.toml`.
include = [
    "PieForwardNormVariant",
    "PieForwardRopeKind",
    "PieForwardNormPlacement",
    "PieForwardQkNorm",
    # The lowered-trace input that crosses as `uint32_t`: the fire class
    # argument of `pie_forward_trace_llama_like_cuda`. (Kernel statements
    # cross as `Launch` ops carrying launcher NAMES — no enum to export.)
    "PieForwardFireClass",
    # Guard predicates cross in `Guard.param0`; no exported struct holds
    # one by type.
    "PieForwardGuardPred",
    # The weight-representation tag behind the `proj_repr` field of both
    # backend fact structs -- another caller-written `uint32_t`, same
    # reason as the four above.
    "PieForwardWeightRepr",
]

# Public constants of `model` that are not part of the C surface. `model`
# holds the chat templates and the load contracts as well as the FFI, so a
# public `const` here is usually a fact about a checkpoint, not a word the
# driver speaks.
exclude = [
    # `mlx::AFFINE_GROUP` — the column count MLX's affine quantization groups
    # under one scale. A loader fact; the driver learns it from the weight
    # view, not from this header.
    "AFFINE_GROUP",
]

[enum]
prefix_with_name = false
