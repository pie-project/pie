[package]
name = "kernels"
version = "0.4.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "The declaration floor: the point families a text may state, the In/Out/InOut/Const/Cache marks a point is declared in, and the Refusal an unclaimed one answers with."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

[lib]
name = "kernels"
path = "src/lib.rs"

[dependencies]
# `#[points]`, which reads a family trait on the floor and states its point
# table beside it. The one edge the "no dependencies" line allows, and only
# because it is not one at run time: a proc macro is a compiler plugin, so
# nothing of `syn` reaches this crate's artifact.
kernels-macros = { path = "../kernels-macros" }
