[package]
name = "controller"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Distributed control plane for Pie"
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "controller"
path = "src/lib.rs"
crate-type = ["rlib"]


[dependencies]
units = { path = "../units" }
controller-api = { path = "../controller-api" }
ids = { path = "../ids" }
tarpc = { version = "0.38", features = [
    "serde-transport",
    "serde-transport-bincode",
    "tcp",
    "unix",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-util = "0.7"
futures = "0.3"
tracing = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
builtins = { path = "../builtins" }
client-api = { package = "pie-client-api", path = "../client-api" }
serde_json = "1"
thiserror = "2.0.19"
wasmparser = "0.262"
wasmtime = { version = "49.0.2", default-features = false, features = [
    "runtime",
    "std",
    "anyhow",
    "cranelift",
    "component-model",
    "component-model-async",
    "async",
] }
wasmtime-wasi = { version = "49.0.2", default-features = false, features = ["p3"] }
toml = "1.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
builtins = { path = "../builtins", features = ["test-policies"] }

[lints]
workspace = true
