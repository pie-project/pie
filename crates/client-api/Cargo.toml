[package]
name = "pie-client-api"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "Public client↔server message vocabulary + edge-session frames for pie: the only public, versioned interface. Internal to pie; depend on `pie-client` instead."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "client_api"
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"

[dev-dependencies]
rmp-serde = "1.3"
# What pie's own build turns on (through starlark), and what a portable
# `Props` must survive.
serde_json = { version = "1.0", features = ["arbitrary_precision"] }

[lints]
workspace = true
