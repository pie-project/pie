[package]
name = "pie-client-api"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "Public client↔server message vocabulary + edge-session frames for pie: the only public, versioned interface. Internal to pie; depend on `pie-client` instead."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "client_api"
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"

[lints]
workspace = true
