[package]
name = "client-api"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "Public client↔server message vocabulary + edge-session frames for pie: the only public, versioned interface."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "client_api"
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
# A true leaf: the message envelope and the edge frames reference no id atom,
# so this crate deps no sibling — serde and serde_bytes only.
serde = { version = "1.0", features = ["derive"] }
# Byte-slice serde adapter for the messages' `chunk_data` fields.
serde_bytes = "0.11"
