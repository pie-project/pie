[package]
name = "model"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The model catalog of the menlo stack: each model is a declaration (weights, dims, cache spaces) plus a forward pass written in model-dsl. Qwen 3.5 is ported first, end-to-end; the others follow the same shape."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "model"
path = "src/lib.rs"

[dependencies]
# What a forward pass is written in: Recorder/Value, the per-family kernel
# wrappers, split/merge/Facts, and the `Weight` declaration. A model's whole
# vocabulary comes from here — the IR names it needs (`Dtype`, `GeomKind`)
# arrive through the dsl's re-exports, so `model-ir` is never named directly.
model-dsl = { path = "../model-dsl" }
