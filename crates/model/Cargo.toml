[package]
name = "model"
version = "0.4.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "What a model is: the two registries (model_type -> load-contract author, arch_name -> chat template), the twenty generations they dispatch to, the vocabulary those share, and host-side multimodal decode."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "model"
path = "src/lib.rs"

["forward"]

# The Rust half of the descriptor round-trip check; see the module doc.
[[bin]]
name = "descriptor"
path = "src/bin/descriptor.rs"
required-features = ["config"]

[features]
# One feature per aspect, because the aspects pull different worlds: `chat`
# needs the tokenizer and the image decoders, `contract` needs the loader's
# algebra, `forward` will need the DSL. A consumer links only the aspect it
# reads — the loader's C ABI builds with `contract` alone, so a driver link
# never carries a chat template.
#
# These used to fan out: `chat` named fourteen generation crates' own `chat`
# features and `contract` named twelve more, so adding a generation meant
# editing this line twice and the row that dispatches to it. One crate, and a
# feature gates modules directly.
default = ["chat"]
chat = ["dep:tokenizer", "dep:anyhow", "dep:serde_json", "dep:image"]
# The `pie.model/1` descriptor: HuggingFace `config.json` normalization on the
# way in, `ModelFacts` projection on the way out. Its own aspect and its own
# feature because it is the ONE that carries no graph: serde and nothing else,
# no loader, no tracer, no kernels table. That is what `model-config` was a
# separate crate for, and a feature holds it just as well now that the only
# two consumers are `contract` below and `worker` — which already links this
# crate for `forward`.
config = ["dep:serde", "dep:serde_json", "dep:anyhow"]
# `config` comes with the contract aspect because `ModelFacts` is read out of
# a `pie.model/1` descriptor, and that module owns the descriptor's schema.
contract = ["dep:model-loader", "dep:serde_json", "config"]
# The forward aspect: a model's forward pass, written in `model-compiler`'s
# tracing eDSL, and the `#[repr(C)]` boundary a driver traces it across. NOT
# default -- `pie model convert` reads a chat template and a load contract and
# must not drag the tracer in behind them.
forward = ["dep:model-compiler", "dep:serde"]

[dependencies]
# The facts a declaration traces against are serialized for the goldens, the
# same way the traced form is; the descriptor's schema derives on it too.
serde = { version = "1.0", features = ["derive"], optional = true }
tokenizer = { path = "../tokenizer", optional = true }
# `default-features = false` drops the loader's testkit half — the authoring
# side needs the algebra, never the host executor.
model-loader = { path = "../model-loader", default-features = false, optional = true }
# The tracing eDSL a declaration is written in, plus the traced form it
# produces. The dependency runs THIS way: a model names the toolchain, never
# the reverse.
model-compiler = { path = "../model-compiler", optional = true }
anyhow = { version = "1.0", optional = true }
serde_json = { version = "1.0", features = ["preserve_order"], optional = true }
# Host-side media decode for the model-agnostic multimodal API.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"], optional = true }

[dev-dependencies]
# The contract tests compile and verify what the authors declare, which is the
# loader's whole job; the marshalled-view verifier they finish with lives in
# the ABI crate, the same pipeline a driver boot runs.
model-loader = { path = "../model-loader", default-features = false }
serde_json = { version = "1.0", features = ["preserve_order"] }
