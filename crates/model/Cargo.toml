[package]
name = "model"
version = "0.4.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "What a model is: one const catalog row per model, the twenty generations those rows live in, the vocabulary they share, and host-side multimodal decode."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "model"
path = "src/lib.rs"

# THE TEST TARGETS THAT NEED AN ASPECT, declared so that `cargo test -p
# model` runs the ones that do not instead of failing to compile.
#
# A target with no `required-features` is auto-discovered and built for
# EVERY feature set, so eight of these twenty turned `cargo test -p
# model` into 359 compile errors -- and the twelve that would have
# passed never ran. That is the same defect the driver's own feature
# work found: sixteen test targets there had no `required-features`, and
# four of them were portable and had never been run in a build that
# could not reach a GPU.
#
# A TEST THAT CANNOT BUILD REPORTS NOTHING, and nothing reads as fine.
#
# THIRTEEN of these stanzas are gone with the `forward` feature (see
# `[features]`), because a target cannot require a feature that no longer
# exists. The three that remain need `contract`, which is real: `engine`
# links this crate without it.
#
# The lesson the deleted stanzas taught is worth keeping even though they
# are: the minimum is what each target actually needs, found by BUILDING
# each against each aspect rather than by reading its imports.

[features]
# One feature per aspect, because the aspects pull different worlds: `chat`
# needs the tokenizer and the image decoders, `contract` needs the loader's
# algebra, `forward` will need the DSL. A consumer links only the aspect it
# reads — the loader's C ABI builds with `contract` alone, so a driver link
# never carries a chat template.
#
# These used to fan out: `chat` named fourteen generation crates' own `chat`
# features and `contract` named twelve more, so adding a generation meant
# editing this line twice and the row that dispatches to it. One crate, and a
# feature gates modules directly.
default = ["chat"]
chat = ["dep:tokenizer", "dep:serde_json", "dep:image"]
# THE `config` FEATURE IS GONE, and so are the 3,595 lines behind it: a
# `pie.model/1` descriptor normalized out of a 136-field schema by 845
# lines, a reader that parsed it back, a `ModelFacts` projection of the
# result, and eleven per-family derivations over all of it.
#
# It was its own aspect because it was the ONE that carried no graph —
# serde and nothing else. That is still true of what replaced it, which
# is why nothing replaced the FEATURE: a `catalog` row is a `const`, and
# a const needs no dependency to be read. `encoding` is the only part
# that still opens a file, and it rides with `contract` because the only
# thing that asks it is an authoring pass deciding how to store a weight.
contract = ["dep:model-loader", "dep:serde_json"]
# THE `forward` FEATURE IS GONE. It gated a generation's forward text on the
# argument that `pie model convert` "must not drag the tracer in behind"
# a chat template and a load contract. Nothing in this tree did that: all six
# consumers -- `engine`, `worker`, both `driver-metal` targets and both
# `driver-cuda` targets -- enabled it, and `model-compiler` is a NON-OPTIONAL
# dependency besides (see its entry below for why), so the weight it was
# protecting against was linked either way.
#
# What it cost was not nothing. It put `#[cfg]` on `Variant::trace`, which
# made THE TRAIT'S METHOD SET depend on a feature; it needed a
# `required-features` stanza per test target; and it gated `catalog::arches()`,
# which calls no gated code at all -- a gate documenting a dependency that did
# not exist. `chat` and `contract` stay, because those two are load-bearing:
# `engine` builds without `contract` and both drivers build without `chat`.
# ONE ROW THAT IS NOT A MODEL, for tests that need real bytes on disk.
#
# The closed set's cost, paid where it lands hardest: identity is a manifest
# match, so a test cannot make up a checkpoint, and the smallest real row is
# half a gigabyte of embedding. A test that writes safetensors and runs them
# through the executor is exactly the test worth having, so `test-rows` adds
# a 64-wide llama nothing ever trained.
#
# Off by default and never enabled by another feature, which is the whole
# guarantee. `catalog.rs` asserts a build without it carries no id with the
# `test-` prefix, so this cannot become load-bearing by accident.
test-rows = []

[dependencies]
# The facts a declaration traces against are serialized for the goldens, the
# same way the traced form is; the descriptor's schema derives on it too.
# Not optional for the reason `model-compiler` is not: a row DERIVES on it
# (the goldens serialize facts, and `spec.rs` is ungated now).
serde = { version = "1.0", features = ["derive"] }
tokenizer = { path = "../tokenizer", optional = true }
# `default-features = false` drops the loader's testkit half — the authoring
# side needs the algebra, never the host executor.
model-loader = { path = "../model-loader", default-features = false, optional = true }
# The tracing eDSL a declaration is written in, plus the traced form it
# produces, plus -- the reason NEITHER is optional -- the shared shape
# VOCABULARY (`facts::{NormPlacement, QkNorm}`, `trace::{RopeKind,
# NormVariant}`) that a catalog row is written in.
#
# It used to be `forward`-only, when a row's numbers existed solely to be
# traced. They are the crate's IDENTITY now: `chat` asks which template
# speaks for a row and `contract` asks how to author it, and both reach the
# same `const` the tracer reaches. A struct that only exists when the tracer
# is compiled in cannot be that.
#
# The cost is bounded and was measured before taking it: `kernels`,
# `kernels-cuda` and `kernels-metal` all arrive `default-features = false`
# through `model-ir`, which is the TABLE and not a `.cu` -- `pie model convert`
# still builds without nvcc, which is what the `forward` gate was protecting.
#
# TWO ENTRIES where there was one (`model-compiler`, before the toolchain
# split). This crate is the ONLY consumer of `model-dsl` in the workspace: a
# declaration is the one thing that writes the authoring surface, and every
# other consumer of the old crate wanted the lowering instead. The lowering is
# not here at all -- it is a `[dev-dependencies]` entry below, because the
# only code in this crate that lowers anything is a test asserting a
# declaration lowers the way it says it does.
model-dsl = { path = "../model-dsl" }
model-ir = { path = "../model-ir" }
serde_json = { version = "1.0", features = ["preserve_order"], optional = true }
# Host-side media decode for the model-agnostic multimodal API.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"], optional = true }

[dev-dependencies]
# The lowering, DEV-ONLY -- the split's sharpest single result. Seven test
# targets here (`lowering`, `lowering_cost`, `arena_soundness`,
# `regions_surface`, `seam_names`, `tp_quantized_spec`, `kernels_table`) lower
# a declaration to check that what it says and what it costs agree; not one
# line of `src/` does. While the toolchain was one crate that distinction had
# nowhere to be recorded, so `pie model convert` linked a lowering it can
# never call.
model-compiler = { path = "../model-compiler" }
# The contract tests compile and verify what the authors declare, which is the
# loader's whole job; the marshalled-view verifier they finish with lives in
# the ABI crate, the same pipeline a driver boot runs.
model-loader = { path = "../model-loader", default-features = false }
serde_json = { version = "1.0", features = ["preserve_order"] }
