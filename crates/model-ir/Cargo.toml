[package]
name = "model-ir"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The typed IR of a traced forward pass: op enums per family, the Operands def-use trait, ValueDecl (Def x Ty), Cond, the Plan container, and the post-trace validator. A leaf crate — pure data plus serde, no backend edges."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "model_ir"
path = "src/lib.rs"

[dependencies]
# `Dtype`, re-exported from `value.rs` at the path this crate spells it. A leaf
# beneath a leaf: the checkpoint loader names the same element type.
dtype = { path = "../dtype" }
serde = { version = "1.0", features = ["derive"] }
