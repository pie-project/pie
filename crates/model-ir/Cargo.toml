[package]
name = "model-ir"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The traced form of a forward pass: the op vocabulary, the plan container that carries it, the seam vocabulary a declaration states, and the signature table it is checked against. The representation layer the model toolchain's other two crates build on."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "model_ir"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
kernels = { path = "../kernels" }
kernels-cuda = { path = "../kernels-cuda", default-features = false }
kernels-metal = { path = "../kernels-metal", default-features = false }
# The wgpu claim tables, on the terms the two above are taken: this crate is
# the ONE join over every plane's `*_CLAIMS`, so a plane whose tables are not
# reachable from here is a plane `sweep::resolve` cannot bind a lane against.
# `kernels-wgpu` has no features to drop -- WGSL is not a build product, so
# there is no `native` and no toolchain behind one.
kernels-wgpu = { path = "../kernels-wgpu" }
# The vulkan claim tables, for the sentence above. `default-features = false`
# is load-bearing here in a way it is not for wgpu: SPIR-V IS a build product,
# and `native` is the `slangc` hop that makes it. Every crate that reads a
# `Plan` reads this crate, so an edge that took `native` would put a shader
# compiler in the closure of the whole model toolchain.
kernels-vulkan = { path = "../kernels-vulkan", default-features = false }
