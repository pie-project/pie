[package]
name = "model-ir"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The typed IR of a traced forward pass: op enums per family, the Operands def-use trait, ValueDecl (Def x Ty), Cond, the Plan container, and the post-trace validator. A leaf crate — pure data plus serde, no backend edges."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "model_ir"
path = "src/lib.rs"

# Contrast with old `model-ir`, whose manifest named every `kernels-*` platform
# to reach their claim tables: coverage is a missing match arm now, and the
# `Operands` impls are hand-written beside their own op enums — serde is the
# only edge left.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
