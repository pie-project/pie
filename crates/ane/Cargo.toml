[package]
name = "ane"
version.workspace = true
edition = "2024"
description = "Runs the Neural Engine's share of a split MLP for the Metal engine."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "ane"
path = "src/lib.rs"

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLEvent", "MTLDevice"] }

[build-dependencies]
cc = "1"
