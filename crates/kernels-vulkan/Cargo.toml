[package]
name = "kernels-vulkan"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "Vulkan kernel implementations (GLSL compute shaders + SPIR-V variant instantiation) and the signature table that declares them."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

# The shader directory. A Vulkan shell reads DEP_PIE_KERNELS_VULKAN_KERNELS_DIR
# for the `.comp` tree, DEP_..._INCLUDE for the param headers a shader and its
# host caller must agree on, and — under `native` — DEP_..._SPV_DIR for the
# compiled SPIR-V modules, one per entrypoint.
links = "pie_kernels_vulkan"
build = "build.rs"

[lib]
name = "kernels_vulkan"
path = "src/lib.rs"

[features]
# `native` is what costs `glslc`. Unlike Metal, Vulkan has no runtime shader
# compiler in the driver: a pipeline is built from a SPIR-V module, so the
# GLSL -> SPIR-V hop has to happen at BUILD time, and `native` is the hop.
# Off by default for the reason it is off on both siblings — `model-compiler`
# takes the signature table and should reach nothing else, least of all a
# shader toolchain.
default = []
native = []

[dependencies]
kernels = { path = "../kernels" }

[dev-dependencies]
# The table test resolves through `sig_in`, which is the shared crate's, to
# check the lookup `model-compiler` actually calls rather than a copy of it.
kernels = { path = "../kernels" }

# Vulkan itself, for the GPU harness in `tests/gpu.rs` and `examples/probe.rs`
# ONLY. It is a dev-dependency on purpose: this crate ships a table and a
# shader tree, and a driver is what owns a device. If Vulkan ever appears under
# `[dependencies]` here, the layering has gone wrong.
#
# `loaded` and not `linked`: the loader is opened with `dlopen` at run time, so
# a machine with no Vulkan at all still builds and still runs every other test.
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
