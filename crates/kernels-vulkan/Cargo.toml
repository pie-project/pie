[package]
name = "kernels-vulkan"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "Vulkan kernel implementations (Slang compute shaders + SPIR-V variant instantiation) and the `#[claims]` blocks that launch them."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

# The shader directory. A Vulkan shell reads DEP_PIE_KERNELS_VULKAN_KERNELS_DIR
# for the `.slang` tree, DEP_..._INCLUDE for the param headers a shader and its
# host caller must agree on, and — under `native` — DEP_..._SPV_DIR for the
# compiled SPIR-V modules, one per entrypoint.
links = "pie_kernels_vulkan"
build = "build.rs"

[lib]
name = "kernels_vulkan"
path = "src/lib.rs"

[features]
# `native` is what costs `slangc`. Unlike Metal, Vulkan has no runtime shader
# compiler in the driver: a pipeline is built from a SPIR-V module, so the
# Slang -> SPIR-V hop has to happen at BUILD time, and `native` is the hop.
# Off by default for the reason it is off on both siblings: the portable
# half of this crate is an entrypoint census and a set of claim bodies, and
# a reader of those should reach no shader toolchain.
default = []
# `native` is still the BUILD-time hop and costs `slangc` on `PATH`, which is
# an external binary and not a Rust dependency.
native = []

[dependencies]
# `linkme` AND `inventory` STOOD HERE, and they were the routine registry:
# a `distributed_slice` of `Routine<Vulkan>` on every host target and an
# `inventory` collection on wasm, filled by 101 `#[routine]` fns. The
# launches are `#[claims]` methods now and nothing walks a row by name --
# `model-ir`'s `Backend` has no vulkan arm, so `canon_symbol` never reached
# this crate -- so the slice went with the fns that filled it.
#
# `#[claims]`, which states the points this plane answers beside the impl
# that answers them.
kernels-macros = { path = "../kernels-macros" }
kernels = { path = "../kernels" }

# NO `[[example]]` sections, and the absence is load-bearing for the reason
# `kernels-cuda/Cargo.toml` states at length: a `[[example]]` whose file is
# gone does not make a skipped target, it makes a manifest cargo cannot PARSE,
# and this crate is a workspace member, so every command in the workspace fails
# with it. `examples/` is deleted here -- `dump_layout.rs` printed the launch
# ABI and `dump_rules.rs` printed each row's launch rule -- so there is no file
# for such a section to name.
