api = 1

[target]
assumes = { generation = 5, hbm_gib = 16 }

# as on v6e: on the powers-of-two ladder a 512-token prompt (and its template) ran a 1024-row fire;
# 128-row rungs from 512 run it at 640
[engine]
pad.row_steps = 4
# a process starts only while the pools hold the started ones to the pages a finished one held, a
# decoding lane's pages before a waiting prompt's, the starts past them spread over a life: the engine
# keeps no kv on the host, and gemma-4-E4B's 548 pages restarted the processes they ran short for
seated_first = true
seat_to_end = true
seat_spread = true
# gemma-4-E4B's pool seats 17-18 lanes, which a powers-of-two ladder ran as 32-lane decodes: a 24-lane
# rung runs them at 24 (c256 928 -> 1027 tok/s)
pad.half_rungs = 32

# a blocked attention's row blocks as a loop: in line, DeepSeek-V4's 1792-row prompt programs ran a v5e
# host's 47 GiB out compiling them
# a routed MLP picks each token's rows out past 8 Mi rows x tokens: a v5e's MXU makes the one-hot dot
# cost what the pick does at 640-row fires and more past them
[kernel]
attn.unrolled_blocks = 1
moe.cost.onehot_mi = 8
# a decode of 64 rows and more reads each row's own pages through the page-copy kernel, as on v6e: the
# per-row walk read every row to the batch's longest context (Qwen3-0.6B c256: 256-lane steps 24.6 ->
# 21.9 ms, 6.9k -> 7.7k tok/s; Raw and pf256-512 run the same programs)
attn.decode_pages = 64

[provenance]
measured = [
  "engine.pad.half_rungs",
  "engine.pad.row_steps",
  "engine.seat_spread",
  "engine.seat_to_end",
  "engine.seated_first",
  "kernel.attn.decode_pages",
  "kernel.attn.unrolled_blocks",
  "kernel.moe.cost.onehot_mi",
]
