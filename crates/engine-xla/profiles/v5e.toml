api = 1

[target]
assumes = { generation = 5, hbm_gib = 16 }

# as on v6e: on the powers-of-two ladder a 512-token prompt (and its template) ran a 1024-row fire;
# 128-row rungs from 512 run it at 640, and from 1024 three 553-token prompts at 1664 rows, not 1792
[engine]
pad.row_steps = 8
# a process starts only while the pools hold the started ones to the pages a finished one held, a
# decoding lane's pages before a waiting prompt's, the starts past them spread over a life: the engine
# keeps no kv on the host, and gemma-4-E4B's 548 pages restarted the processes they ran short for
seated_first = true
seat_to_end = true
seat_spread = true
# gemma-4-E4B's pool seats 17-18 lanes, which a powers-of-two ladder ran as 32-lane decodes: a 24-lane
# rung runs them at 24 (c256 928 -> 1027 tok/s)
pad.half_rungs = 32

# a blocked attention's row blocks as a loop: in line, DeepSeek-V4's 1792-row prompt programs ran a v5e
# host's 47 GiB out compiling them
# a routed MLP picks each token's rows out past 8 Mi rows x tokens: a v5e's MXU makes the one-hot dot
# cost what the pick does at 640-row fires and more past them
[kernel]
attn.unrolled_blocks = 1
moe.cost.onehot_mi = 8
# a decode of 64 rows and more reads each row's own pages through the page-copy kernel, as on v6e: the
# per-row walk read every row to the batch's longest context (Qwen3-0.6B c256: 256-lane steps 24.6 ->
# 21.9 ms, 6.9k -> 7.7k tok/s; Raw and pf256-512 run the same programs)
attn.decode_pages = 64
# a GDN decode step of 16 lanes and more takes its heads' products through the MXU, each lane's state
# stored back while the next steps: on the VPU, with each store waited, 256 lanes of Qwen3.5-0.8B's 16
# heads took 896 us a layer (482 now), Qwen3.6-27B's 48 heads 2464 (1285); under 16 lanes the VPU's is
# as fast
ssm.step_mxu = 16
# a prompt fire of up to 64 lanes takes its GDN rows where they lie, a step a 64-row block, each lane's piece
# of it in turn: no chunk of q|k|v rows gathered and no output gathered back (Qwen3.6-27B's 2816-row fire of
# five prompts: a GDN layer 1148 -> 723 us, pf256-512 at 2816 rows 24.7k -> 25.3k tok/s; 1792 rows of three
# 668 -> 446; Qwen3.5-0.8B 2048 rows 326 -> 212)
ssm.row_blocks = 64
# a prefill's flash kernel takes 128 query rows a block for 128-wide heads, not 256: fewer key blocks
# past a row block's own prompt where a fire's prompts meet, and the v5e's softmax holds its VPU
# (Qwen3-0.6B pf256-512 1792-row fires: 106.1k -> 108.2k tok/s; a v6e loses 10%, so it stays at 256)
attn.flash_narrow_rows = 128
# a prompt fire of 2304 rows and more lays its GLU rows and gated-norm rows out before the dots that read
# them: fused into the dots, they cost Qwen3.8-27B's mini8 cut's 2816-row fires 124.2 ms (the down
# product at 68-75% of the MXU's rate), laid out 116.4 (96%); pf32-512 at 2816 rows 22.5k -> 23.9k tok/s
linear.dot_barrier_rows = 2304
# a routed MLP's prompt of 1280 tokens and more sums each block of 128 tokens' runs of expert rows by its
# own dot, as on v6e, not by the pick (Gemma-4-26B-A4B's 32-expert cut, 1664 tokens: 2132 -> 1734 us;
# Qwen3.6-35B-A3B's 16-expert cut 995 -> 936); at 1088 Qwen's pick is cheaper (690 vs 725)
moe.segment_tokens = 128
moe.segment_from = 1280
# a routed MLP's prompt of 1024 tokens and more takes two of an expert's row tiles a grid step, its gate-up
# kernel landing the GLU: Qwen3.6-35B-A3B's 16-expert cut 2176 tokens 1043 -> 959 us, 1792 819 -> 802;
# Gemma-4-26B-A4B's 32-expert cut 1792 1702 -> 1532, 1024 984 -> 931 (at four a step its gate-up is twice as slow)
moe.gmm_run = 2
moe.gmm_run_from = 1024
moe.gmm_glu = 1
# and runs both legs as one kernel there, the GLU rows staying in VMEM: Qwen3.6's 16-expert cut 1024 tokens
# 497 -> 443 us, 1792 803 -> 762 (2176: 958 -> 1005); Gemma's 1792 1532 -> 1522, 2176 1888 -> 1868 (1024: 929 -> 960)
moe.gmm_fuse_from = 1024
# a row norm 3072 wide and more, from 1152 rows to under 2048, lands a gemm's rows before it and its own rows
# after it: its sum of squares fused into the dot before slowed that dot (Gemma-4-31B cut's 1664-row down dot
# 2.46 -> 2.20 ms; 1152 rows 1.64 -> 1.47; at 2048 the fused one is faster, 2.66 against 2.85), and so did the
# norm fused into the dots after (pf32-512: 31B cut 25.8k -> 26.6k, 12B cut 28.6k -> 29.4k)
norm.land_from = 1152
norm.land_below = 2048

[provenance]
measured = [
  "engine.pad.half_rungs",
  "engine.pad.row_steps",
  "engine.seat_spread",
  "engine.seat_to_end",
  "engine.seated_first",
  "kernel.attn.decode_pages",
  "kernel.attn.flash_narrow_rows",
  "kernel.attn.unrolled_blocks",
  "kernel.linear.dot_barrier_rows",
  "kernel.moe.cost.onehot_mi",
  "kernel.moe.gmm_fuse_from",
  "kernel.moe.gmm_glu",
  "kernel.moe.gmm_run",
  "kernel.moe.gmm_run_from",
  "kernel.moe.segment_from",
  "kernel.moe.segment_tokens",
  "kernel.norm.land_below",
  "kernel.norm.land_from",
  "kernel.ssm.row_blocks",
  "kernel.ssm.step_mxu",
]
