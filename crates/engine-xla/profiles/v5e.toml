api = 1

[target]
assumes = { generation = 5, hbm_gib = 16 }

# as on v6e: on the powers-of-two ladder a 512-token prompt (and its template) ran a 1024-row fire;
# 128-row rungs from 512 run it at 640
[engine]
pad.row_steps = 4

# a blocked attention's row blocks as a loop: in line, DeepSeek-V4's 1792-row prompt programs ran a v5e
# host's 47 GiB out compiling them
[kernel]
attn.unrolled_blocks = 1

[provenance]
measured = ["engine.pad.row_steps", "kernel.attn.unrolled_blocks"]
