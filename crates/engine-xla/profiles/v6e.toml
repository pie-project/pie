api = 1

[target]
assumes = { generation = 6 }

# a 512-token prompt (and its template) ran a 1024-row fire: 128-row rungs between the powers of two
# from 512 up (#1184, Gemma-4-31B cut Raw prefill 8.8k vs vLLM-TPU 12.8k tok/s)
[engine]
pad.row_steps = 4

# 256-row blocks of the blocked prefill walk against its 512-key chunks: a block spans fewer lanes
# and fewer of their chunks (Qwen3-0.6B pf256-512 103.6k -> 109.2k tok/s, Raw prefill 54.0k -> 55.5k;
# Gemma-4-E4B Raw prefill 25.2k -> 26.2k; c256 decode no slower)
[kernel]
attn.block_rows = 256
# a prompt's narrow-head rope turns the row as it lies, no `[rows, heads, 64]` relayouts (gpt-oss-20b
# 4096-row pf256 fire 125.5 -> 123.4 ms; a v5e loses by as much, so it stays off there)
rope.flat_rows = 1024
# a routed MLP's grouped matmul takes up to four of an expert's row tiles a step through one dot
# (Gemma-4-26B-A4B's 32-expert cut, 1792-row fire: 1228 -> 1022 us a layer, bit for bit)
moe.gmm_run = 4
# a routed MLP's prompt sums each block of 256 tokens' runs of expert rows by its own dot, not one one-hot dot
# over every row (Gemma-4-26B-A4B's 32-expert cut, 1792-row fire: the sum 288 us a layer; 128-token blocks copy
# their runs' partial chunks twice as often: 2176 tokens 763 -> 753 us a layer at 256)
moe.segment_tokens = 256
# a routed MLP's gate-up kernel lands its rows' GLU, each times its weight, at 64-row tiles and more (Gemma-4-26B-
# A4B's cut, 1792 rows: 833 -> 788 us; Qwen3.6-35B-A3B's 660 -> 618; its 256-lane decode 359 -> 337)
moe.gmm_glu = 1
# a routed MLP's prompt of 1024 tokens and more runs its gate-up and down legs as one kernel, the GLU rows staying in
# VMEM between them (Gemma-4-26B-A4B's 32-expert cut, 2176 tokens: 761 -> 736 us a layer, 1024: 514 -> 493;
# Qwen3.6-35B-A3B's 2176: 523 -> 504, 1792 equal; at 640 tokens one kernel is 10% slower)
moe.gmm_fuse_from = 1024
# a decode of 64 rows and more reads each row's own pages through the page-copy kernel
attn.decode_pages = 64
# a prompt's GeGLU rows land before the down dot reads them, not fused into its operand (Gemma-4-31B cut's
# 2304-row fire 74.8 -> 72.2 ms, pf256-512 28.3k -> 29.3k tok/s)
glu.land_from = 1024

