[package]
name = "engine-xla"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The XLA engine: a PJRT client (libtpu or any PJRT plugin, dlopened at runtime) that answers every Dispatch* trait by emitting kernels-xla StableHLO, tracing one fire into one executable and running it."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "engine_xla"
path = "src/lib.rs"

[dependencies]
dtype = { package = "pie-dtype", path = "../dtype" }
kernels-xla = { path = "../kernels-xla" }
libloading = "0.9"
libc = "0.2"
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }

toml = "1.1"
poem-ir = { package = "pie-poem-ir", path = "../poem-ir" }
engine = { path = "../engine" }
poem-exec = { package = "pie-poem-exec", path = "../poem-exec" }
poem-compiler = { package = "pie-poem-compiler", path = "../poem-compiler" }
eta-ir = { package = "pie-eta-ir", path = "../eta-ir" }
eta-exec = { path = "../eta-exec" }
eta-compiler = { path = "../eta-compiler" }
checkpoint = { path = "../checkpoint" }
tracing = "0.1"
blake3 = "1"
serde_json = "1"

[dev-dependencies]
poem = { package = "pie-poem", path = "../poem" }
models = { path = "../models" }
tokenizer = { path = "../tokenizer" }
serde_json = "1"
ztensor-compat = { workspace = true }
ztensor = { workspace = true }
