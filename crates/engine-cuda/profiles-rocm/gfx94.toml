api = 1

# CDNA 3: MI300X, MI300A, MI325X (gfx942). The registry defaults, but for
# the decisions measured below.
[target]
tier    = "gfx94"
assumes = { cc = 94 }

# The routed swiglu MLP of a prefill (MI300X, random bf16 weights; µs for the
# MLP).
#
# Kept by expert from the gate-up to the fold over hipBLASLt's grouped GEMM
# (`lt_mlp_from` routes an expert, both contractions at least `lt_deep_k`):
# GLM-5.3-Flash (32 experts, top 8, 4096 / 2048) at 512 / 1024 / 2048 / 4096
# / 8192 tokens 954 / 1955 / 2715 / 4713 / 8599 -> 868 / 1458 / 2214 / 4122 /
# 7733, at 256 tokens (64 an expert) 703 -> 811; GLM-5.3 (8, top 8, 6144 /
# 2048) at 256 / 1024 / 8192 tokens 822 / 1960 / 12199 -> 623 / 1578 / 10994.
# Over Qwen3.8-Flash-Next's 640-deep down projection it loses at every size
# (2048 tokens 736 -> 775), hence the depth.
#
# The native legs in expert order (`ordered_from` routes an expert), where
# the above does not take the MLP: Qwen3.8-Flash-Next at 512 / 2048 / 8192
# tokens (320 / 1280 / 5120 an expert) 229 / 736 / 2687 -> 227 / 680 / 2516,
# at 256 tokens (160) 167 -> 187; GLM-5.3-Flash at 128 an expert 954 -> 1421.
#
# Tiles: MT256x192x64 over the deep contractions (the leg's best, or within
# 4% of it, on GLM's gate-up and down at 2048 and 8192 tokens), MT128x288x32
# below.
[kernel]
moe.lt_grouped = true
moe.lt_mlp_from = 128
moe.lt_tile_deep = 256_192_064
moe.lt_tile_shallow = 128_288_032
moe.lt_deep_k = 2048
moe.ordered_from = 256

# A fire of 10240 rows where `max_forward_tokens` is unstated, measured
# against vLLM's 16K-token steps (GLM-5.3-Flash and Qwen3.8-Flash-Next minis,
# 2K x 8 and 1K x 64 prompts): 8192 left the first prompts' decodes waiting
# out a second prefill fire, and 12K to 16K made the prompts queued behind
# them wait (GLM 1K x 64 TTFT 665 ms at 10K, 916 at 12K, 984 at 16K). Past
# 2048 rows, four buckets a doubling: a 2K prompt padded to 4096 cost a
# second prompt.
[engine]
forward_tokens = 10240
prefill_lattice_from = 2048
