# sm_101 (Thor before CUDA 13 renamed it sm_110): what every GPU of compute capability 10.1 runs over the registry defaults.
api = 1

[target]
tier    = "sm_101"
assumes = { cc = 101 }

[provenance]
source = "the profile pie derived for compute capability 10.0 and up before family files: the narrow bf16 GEMV, and the naive MLA kernel, whose FA2 arms were sized for Ada's shared memory"

[kernel]
gemv.bf16 = "narrow"
mla.path  = "naive"
