api = 1

[target]
device = "NVIDIA H100 PCIe"

# pie tune (quick) on a RunPod NVIDIA H100 PCIe, each line's win end to end on gpt-oss-20b.
[kernel]
gemm.heuristics = 4  # 1.7% faster end to end
gemm.workspace_mb = 64  # 1.4% faster end to end
sdpa.prefill.ctas_per_sm = 3  # 1.2% faster end to end
# as on the H100 SXM: DSA index scores on tensor cores, the radix top-k, FP8 dense shadows
sdpa.index_mma = true
sdpa.index_radix = true
gemm.fp8_shadow = true

[engine]
prefill_lattice_from = 160  # 1.0% faster end to end
# two recurrent-state slots a lane, as on the H200

[compiler]
dag_streams = true  # 2.6% faster end to end

[provenance]
source = "pie tune (quick, gptoss-20b) on RunPod; 512-token prompt 31.7 -> 32.2 ms, 1-lane step 3.92 -> 3.68 ms, 4-lane step 6.54 -> 6.30 ms, 8-lane step 8.86 -> 8.79 ms, readout cosine 1.0000"
# `measured` names only what gpt-oss-20b, the tune's model, reads on this device: the tune once listed
# every decision, since a load counted each as read; those it cannot read are dropped (and reset where set).
