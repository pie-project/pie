api = 1

[target]
device = "NVIDIA H100 80GB HBM3"

# pie tune (quick) on a RunPod NVIDIA H100 80GB HBM3, each line's win end to end on gpt-oss-20b.
[kernel]
attn.qkv_rows_from = 48  # 1.8% faster end to end
gemm.rows_m = 4  # 1.7% faster end to end
mla.expanded_from = 49152  # 1.5% faster end to end
qmm.split_warps_per_sm = 29  # 3.4% faster end to end
sdpa.decode.split_small = true  # 1.7% faster end to end
sdpa.decode.static_max_requests = 256  # 1.8% faster end to end
sdpa.index_split_until = 512  # 4.3% faster end to end
ssm.gdn_scan_until = 56  # 4.3% faster end to end
sdpa.index_mma = true
sdpa.index_radix = true
# a paged decode of a group of at most eight query heads on the tensor-core kernel, as the H200 and B200:
# gpt-oss-20b c1024 20.0k -> 20.5k, c512 17.3k -> 17.9k tok/s
sdpa.decode.gqa = true
# from groups of two query heads a KV head, as the H200 (MiniMax's single-head groups read slower so)
sdpa.decode.gqa_min_group = 2
gemm.fp8_shadow = true
# MXFP4 gate-up banks kept as an exact bf16 copy, read past 1024 routes a fire by the
# warp-specialized wgmma GEMM (the register-dequant select ran ~330 TFLOP/s): gpt-oss-20b
# pf64-512 53.3k -> 60.4k, c1024 18.3k -> 20.4k, raw prefill 20.6k -> 22.4k; DeepSeek-V4 mini
# pf32 99.6k -> 108.8k; MiMo mini pf32 103.9k -> 113.3k; Kimi-K3 mini8 pf32 24.3k -> 25.8k
moe.mxfp4_bf16_from = 1024
# as the H200 profile: gpt-oss-20b raw decode 352 -> 383 tok/s
moe.mxfp4_grouped_reuse = 3
moe.mxfp4_select_lean = true
# MXFP4 banks whose release quantizes the rows to e4m3 (W4A8) keep a block-FP8 copy, read past 256 routes
# a fire by the wgmma FP8 selects, as the L40S: DeepSeek-V4 mini pf32-512 109.1k -> 121.0k, c512 44.0k ->
# 50.0k; MiMo-V2.6 mini pf32-512 113.4k -> 134.0k, c512 40.3k -> 43.5k tok/s
moe.mxfp4_fp8_from = 256
# NVFP4 experts against bf16 rows on the register-dequant mma.sync kernel past one token, as the
# RTX PRO 6000 and L40S: MiniMax-M3.1-Flash mini pf32-512 4.7k -> 8.5k tok/s (prefill-only job),
# Qwen3.8-Flash-Next mini unchanged, MiniMax parity KL unchanged
moe.nvfp4_mma_from = 17
moe.nvfp4_mma_until = 65536
# two warpgroups on 128-route slices from 128 routes an expert, as the H200: MiniMax-M3.1-Flash mini60
# pf64-512 8.58k -> 10.28k tok/s (prefill-only job)
moe.nvfp4_wide_from = 128
# block-FP8 selects of 64 routes an expert and more on the warp-specialized wgmma GEMM, and a decode's
# W8A16 block-FP8 select split toward 16 CTAs' warps an SM, as the H200: GLM-5.3-Flash mini8
# pf128-512 59.8k -> 77.7k, c256 17.7k -> 19.3k, raw decode 413 -> 423, raw prefill 30.2k -> 33.2k tok/s
moe.fp8a8_ws_from = 64
moe.fp8_mma_fill = 16
# and two chunks in flight a warp, not four; GLM-5.3's DSA attention 64 heads a CTA on wgmma, from 64
# rows, as the H200: GLM-5.3 mini78 pf32-512 5.80k -> 6.61k, c256 2.32k -> 2.50k, raw decode 43 -> 46, raw prefill 4.33k -> 4.79k tok/s
moe.fp8_mma_depth = 2
sdpa.mla_wgmma = true
sdpa.mla_wgmma_rows = 64
# the block-FP8 select's warp-specialized GEMM persistent, its weight rows landed by TMA and its jobs
# taken off a ticket: GLM-5.3 mini78-e12 c256 2.55k -> 3.30k, c512 2.69k -> 3.49k, GLM-5.3-Flash mini8
# c256 19.4k -> 20.8k, c512 22.1k -> 24.0k tok/s, the same sums bit for bit (parity KL unchanged)
moe.fp8a8_tma = true

[engine]
working_set_percent = 90  # 1.9% faster end to end
# a Gemma-4 process starts only while the pools hold the started ones to the end, a decoding lane's
# pages before a waiting prompt's, as the H200 and RTX PRO 6000 profiles: gemma-4-26b-a4b mini c512
# 9.6k -> 11.3k, c1024 4.4k -> 8.7k tok/s; gemma-4-E4B unchanged
seated_first = true
seat_to_end = true
# two recurrent-state slots a lane, so a hybrid trunk seats past the fixed 256, as the H200:
# GLM-5.3-Flash mini8 c512 18.6k -> 22.3k, c1024 14.5k -> 23.1k (with the decode groups above);
# Qwen3.8-27B c256 2.29k -> 2.32k, DeepSeek-V4 mini c512 45.0k -> 46.0k tok/s
state_slots_per_lane = 2

[compiler]
synth_regions = false  # 1.2% faster end to end
# independent chains (a shared expert beside the routed ones, a gate beside its trunk) on side
# streams, as sm100 and the RTX PRO 6000 run them: single-request decode Qwen3.6-35B-A3B mini
# 246 -> 260, Gemma-4-E4B 178 -> 197, Hy4 mini 270 -> 281 tok/s; Qwen3.8-27B c128 2.22k -> 2.48k;
# greedy tokens unchanged on gpt-oss-20b, Gemma-4-E4B, Hy4, Qwen3.6 and Qwen3.8-27B
branches = true
dag_streams = true
dag_streams_until = 256

