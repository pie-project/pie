api = 1

[target]
device = "NVIDIA H200"

# pie tune (quick) on a RunPod NVIDIA H200, each line's win end to end on gpt-oss-20b.
[kernel]
moe.mxfp4_grouped_reuse = 3  # 2.1% faster end to end
moe.mxfp4_select_lean = true  # 1.9% faster end to end
qmm.gemm_from = 12  # 2.1% faster end to end
qmm.split_thin_max = 16  # 1.2% faster end to end
qmm.split_warps_per_sm = 80  # 2.3% faster end to end
ssm.gdn_scan_until = 48  # 1.9% faster end to end
sdpa.index_mma = true
sdpa.index_radix = true
# MXFP4 banks kept as an exact bf16 copy, read past 1024 routes a fire by the warp-specialized wgmma
# GEMM as on the H100, the down banks too, all copies or none, leaving a quarter of the free memory to the
# cache rows (MiMo-V2.6 mini48's 87 GB keep their MXFP4 banks):
# gpt-oss-20b pf64-512 51.5k -> 65.2k, c1024 19.2k -> 22.6k, raw prefill 23.2k -> 28.2k tok/s
moe.mxfp4_bf16_from = 1024
moe.mxfp4_bf16_down = true
moe.mxfp4_bf16_keep = 25
# block-FP8 selects of 64 routes an expert and more on the warp-specialized wgmma GEMM:
# GLM-5.3 mini78 pf16-512 4.06k -> 6.04k, c1024 2.42k -> 3.49k, raw prefill 3.42k -> 4.67k tok/s
moe.fp8a8_ws_from = 64
# a decode's W8A16 block-FP8 select split toward 16 CTAs' warps an SM: GLM-5.3 mini78 raw decode 45 -> 50 tok/s
moe.fp8_mma_fill = 16
# NVFP4 selects of 16 routes and more on the staged wgmma select (W4A16), not the grouped mma.sync one:
# MiniMax-M3.1 mini60 pf32-512 GPU time 14.6 -> 7.9 s
moe.nvfp4_mma_from = 16
moe.nvfp4_mma_until = 16777216

[engine]
prefill_lattice_from = 192  # 2.0% faster end to end
# two recurrent-state slots a lane, so a hybrid trunk seats past the fixed 256, as on the RTX PRO 6000:
# Qwen3.8-Flash-Next mini c512 54.4k -> 65.8k tok/s, single-stream greedy tokens unchanged
state_slots_per_lane = 2
# a Gemma-4 process starts only while the pools hold the started ones to the end, a decoding lane's pages
# before a waiting prompt's, the windowed ring a page a lane past its kv pages, as on the RTX PRO 6000:
# gemma-4-26b-a4b c1024 10.7k -> 12.7k tok/s, single-request decode 264 -> 279 tok/s
seated_first = true
seat_to_end = true
window_spare = true

[compiler]
# independent chains on side streams, as on the H100
branches = true
dag_streams = true
dag_streams_until = 256

[provenance]
source = "pie tune (quick, gptoss-20b) on RunPod; 512-token prompt 26.2 -> 26.2 ms, 1-lane step 3.06 -> 2.87 ms, 4-lane step 5.16 -> 4.85 ms, 8-lane step 6.21 -> 6.12 ms, readout cosine 1.0000"
