api = 1

[target]
device = "NVIDIA GeForce RTX 4090"

# pie tune (quick) on a RunPod NVIDIA GeForce RTX 4090, each line's win end to end on gpt-oss-20b.
[kernel]
gemm.heuristics = 4  # 1.5% faster end to end
mla.expanded_from = 40960  # 1.4% faster end to end
moe.group_at = 3  # 1.4% faster end to end
qmm.split_thin_max = 16  # 1.0% faster end to end
qmm.split_warps_per_sm = 36  # 1.0% faster end to end
sdpa.decode.static_max_requests = 320  # 2.5% faster end to end
sdpa.merge_warp = true  # 1.4% faster end to end
ssm.kda_step_fused = true  # 1.0% faster end to end

# The L40S's sm_89 kernel lines (tensor-core attention, hyper-connection,
# indexer and MoE paths), the same chip: DeepSeek-V4-Flash's mini raw decode
# 288 to 336 tok/s and pf16-512 19.5k to 45.6k, Qwen3.8-Flash-Next's mini
# pf16-512 62k to 83k, gpt-oss-20b c256 5.1k to 5.7k on an RTX 4090.
gemm.rows_m = 16
moe.nvfp4_mma_from = 17
moe.nvfp4_mma_until = 65536
gemm.fp8_shadow = true
sdpa.decode.grouped_prefill_from = 8
sdpa.decode.grouped_prefill_lse = true
sdpa.decode.grouped_prefill_window = true
sdpa.fa2_live = true
sdpa.index_mma = true
sdpa.index_radix = true
elemwise.hc_tile = true
elemwise.hc_mma = true
elemwise.norm_emit = true
elemwise.rows_vec = true
sdpa.pool_mma = true
sdpa.selected_mma = true
sdpa.compressed_replay = true
moe.bf16_mma_from = 16
moe.bf16_mma_until = 65536
moe.mxfp4_fp8_from = 256
moe.mxfp4_mma_per_from = 4

# gpt-oss-20b's c256 decode (32 routes an expert) on the run kernel's
# 32-route slices, not the staged kernel's half-filled 64-route ones: c256
# 5.97k to 6.56k tok/s.
moe.mxfp4_run_until = 32

# A prefill's wide bf16 products (from 1024 rows) on cuBLAS's own algorithm
# with a split's partials summed in bf16, as torch runs them for vLLM and
# SGLang: gemma-4-31b mini12 pf16-512 10.8k -> 11.3k, kimi-k3 mini4
# 13.7k -> 14.2k, qwen3.8-27b mini12 pf32-512 14.3k -> 14.7k tok/s.
gemm.bf16_split_from = 1024

# A prefill's block-FP8 projections W8A8 on the wide fp8 tiles, as the
# deployment quantizes them, not bf16 on the widened copy: MiMo-V2.6-Flash's
# mini pf16-512 45.4k to 49.2k tok/s.
gemm.fp8_wide_from = 257

# A fire's working set may take 65% of the 24 GB card past the weights, not
# half: at 50% gpt-oss-20b's 8192-token fires were served at 1024 and c256 at
# 128 lanes; at 65% pf16-512 15.9k to 22.5k tok/s and c256 5.7k to 6.1k.
[engine]
working_set_percent = 65
# A process starts only while the pools hold the started ones to the end, a
# decoding lane's pages before a waiting prompt's, as the A40, H100, H200 and
# RTX PRO 6000 profiles: gemma-4-31b mini12 c256 2.01k -> 2.70k,
# gemma-4-26b-a4b mini c256 1.82k -> 2.59k tok/s. Graph bodies keep their
# quarter: held to 512 MiB, gpt-oss-20b armed 12 of its 106 compositions,
# and at 640-768 MiB a guest program's scratch found no room mid-run.
seated_first = true
seat_to_end = true
# Eight lattice buckets a doubling past 256 rows, as the L40S: a fire of a
# batch's prompts pads less (gemma-4-E4B pf16-512 at 4480-row fires 16.6k ->
# 17.1k tok/s).
prefill_lattice_steps = 8

# Independent chains on side streams, as the H100, sm100 and the RTX PRO 6000
# run them: single-request decode Qwen3.5-0.8B 456 -> 464, Qwen3-0.6B 513 ->
# 523, gpt-oss-20b 201.3 -> 203.3 tok/s; greedy tokens unchanged.
[compiler]
dag_streams = true
dag_streams_until = 256

