rates = "pie tune cuda --rates on 2026-11-16 (pie 0.6.0): NVIDIA L40S; the matmul through cuBLASLt under serving's GEMM tactics, each rate a 20 ms burst on the stream timed by events, the median of 5 (the launch of 15); at commit 2227ac6cf; at engine::rates' lattice (matmul m x 4096 x 4096, m 16..8192; attention 2048x2048 keys, 16/8 heads of 128; scan 2048 tokens, 16/16 heads of 128x128, conv 4)"
