api = 1

[target]
device = "NVIDIA L40S"

# Bf16 products of 2 to 16 rows may time the few-rows kernel beside
# cuBLAS's algorithms: a decode's projections of 2 to 8 rows over the
# catalog's dense models 2-8% faster on it where the tuner picks it.
[kernel]
gemm.rows_m = 16
moe.nvfp4_mma_from = 17
moe.nvfp4_mma_until = 65536
gemm.fp8_shadow = true
# A single-token row of a 16-query-head group (Muse Glimmer) reads the cache
# through the prefill kernel: c256 decode 3118 to 3173 tok/s.
sdpa.decode.grouped_prefill_from = 8
sdpa.decode.grouped_prefill_lse = true
sdpa.decode.grouped_prefill_window = true
sdpa.fa2_live = true
sdpa.index_mma = true
sdpa.index_radix = true
elemwise.hc_tile = true
elemwise.hc_mma = true
elemwise.norm_emit = true
elemwise.rows_vec = true
sdpa.merge_warp = true
sdpa.pool_mma = true
sdpa.selected_mma = true
# DeepSeek-V4.1 bounded replay, as vLLM prefills it (its decoder layers
# route a quarter of a 2048-token batch): pf16-512 prefill 19.8k to ~29.8k tok/s.
sdpa.compressed_replay = true
moe.bf16_mma_from = 16
moe.bf16_mma_until = 65536
moe.mxfp4_fp8_from = 256
# MXFP4 experts averaging 4 to 16 routes on the 512-code-run select, past
# them the staged one (gpt-oss-120b's miniature at c128: 2490 to 2645 tok/s).
moe.mxfp4_mma_per_from = 4

[engine]
seated_first = true
recording = { use = "bodies", mem_mb = 1024 }
prefill_lattice_steps = 8

# Independent chains on side streams, as the RTX 4090, H100, sm100 and the RTX PRO 6000 run them:
# Gemma-4-26B-A4B mini c128 2,211 -> 2,271 tok/s (vLLM 2,298), gemma-4-E4B c256 6,282 -> 6,353,
# gpt-oss-20b c256 6,929 -> 6,971, Gemma-4-31B mini c32 543 -> 545, pf8-512 6,073 -> 6,110;
# Gemma-4-26B-A4B mini pf8-512 unchanged (18.6k), its fires past 256 rows.
[compiler]
dag_streams = true
dag_streams_until = 256

[rates]
# `pie tune cuda --rates` on this L40S at engine::rates' lattice, each rate a
# 20 ms burst of its kernel back to back, the median of 5, its dispatches'
# launches taken off (engine::rates::rate_from); every float operand
# engine::rates' random pattern (zeros ran the large matmuls up to 42% faster:
# the L40S holds its 350 W cap on real data by its clock), after
# engine::rates::warm_up (4 rotations of the 8192^3 matmul, settled at 198
# TFLOP/s) and over the grid in its spread order. The matmul m x n x k through
# cuBLASLt under serving's GEMM tactics, rotating 768 MiB of weight planes at
# each (n, k); the attention and the scan rotate 768 MiB of cold sets the same
# way. The launch: 889 ns a dispatch over a chain of 64, 904 over 1024. Two
# runs (the second here) agree within 2% on 188 of 225 matmul points from 32
# rows and within 5% on 222, at most 10%; attention within 2% on 17 of 18, at
# most 2.5%; the scan within 0.5% but at 512 tokens (5%).
