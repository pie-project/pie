api = 1

[target]
device = "NVIDIA L40S"

# Bf16 products of 2 to 16 rows may time the few-rows kernel beside
# cuBLAS's algorithms: a decode's projections of 2 to 8 rows over the
# catalog's dense models 2-8% faster on it where the tuner picks it.
[kernel]
gemm.rows_m = 16
sdpa.index_mma = true
sdpa.index_radix = true
sdpa.selected_mma = true
[engine]
forward_tokens = 2048

