api = 1

# Every MI300X, the virtual function a cloud instance exposes ("AMD Instinct
# MI300X VF") as the card itself; the rest of the family (MI300A, MI325X)
# states its own rates.
[target]
match = { name_contains = ["MI300X"] }

[rates]
# `pie tune cuda --rates` on this MI300X VF at engine::rates' lattice, over
# engine::rates' operand pattern (random bf16, not zeros: this card runs a
# compute-bound kernel 15-25% faster on zeros), after the warm-up, the grid
# in spread order; each key here the median of three runs back to back,
# which lie within 5% of it on 267 of 276 keys. The launch is a dispatch's
# gap in a captured chain of dependent kernels (chains of 64 and 1024
# agree, 1516 / 1535 ns); on this card it adds to a kernel's work rather
# than hiding under it. The matmul through hipBLASLt under serving's GEMM
# tactics at each (rows, n, k); attention on cold q and kv sets, keys x keys
# causal, at heads of 64, 128 and 256; the gated delta scan on cold sets at
# each token count; the copy against 5.3 TB/s of HBM3.
