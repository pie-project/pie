api = 1

# Every MI300X, the virtual function a cloud instance exposes ("AMD Instinct
# MI300X VF") as the card itself; the rest of the family (MI300A, MI325X)
# states its own rates.
[target]
match = { name_contains = ["MI300X"] }

[rates]
# `pie tune cuda --rates` on this MI300X VF at engine::rates' lattice, each
# rate a 20 ms burst of its kernel back to back, the median of 5 (the launch
# of 15). The matmul through hipBLASLt under serving's GEMM tactics over 12
# rotating k x k planes a depth; the vendor's 1307 TFLOPS dense bf16 (AMD
# Instinct MI300X data sheet) is the bound (~63% at its best). Attention
# over pages in engine::rates::attn_page_order, keys x keys causal; the copy
# against 5.3 TB/s of HBM3 (~77%); the launch a kernel's inside a captured
# hipGraph, as serving replays its bodies. Two runs agree within 7% on every
# key (the scan 7%, the 16-row k=1024 matmul 5.6%, the rest under 4.2%).
