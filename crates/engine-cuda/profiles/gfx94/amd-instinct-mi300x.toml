api = 1

# Every MI300X, the virtual function a cloud instance exposes ("AMD Instinct
# MI300X VF") as the card itself; the rest of the family (MI300A, MI325X)
# states its own rates.
[target]
match = { name_contains = ["MI300X"] }

[rates]
# `pie tune cuda --rates` on this MI300X VF at engine::rates' lattice, over
# engine::rates' operand pattern (random bf16, not zeros: this card runs a
# compute-bound kernel 15-25% faster on zeros), each rate a 20 ms burst of
# its kernel back to back, the median of 5 (the launch of 15); each key here
# the median of three runs, which lie within 5% of it on 206 of 208 keys.
# The matmul through hipBLASLt under serving's GEMM tactics over 12 rotating
# k x k planes a depth; attention over pages in
# engine::rates::attn_page_order, keys x keys causal, at heads of 64, 128 and
# 256; the copy against 5.3 TB/s of HBM3 (~77%); the launch a kernel's
