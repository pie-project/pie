api = 1

[target]
device = "NVIDIA RTX PRO 6000 Blackwell Server Edition"

# pie tune (quick) on a RunPod NVIDIA RTX PRO 6000 Blackwell Server Edition, each line's win end to end on gpt-oss-20b.
[kernel]
attn.qkv_rows_from = 88  # 1.4% faster end to end
moe.mxfp4_mma_from = 49  # 2.9% faster end to end
moe.mxfp4_select_lean = true  # 1.7% faster end to end
# bf16 MoE routes past one token on the grouped mma.sync kernel: Qwen3.6-35B-A3B c128 1,489 -> 3,590 tok/s
moe.bf16_mma_from = 16
moe.bf16_mma_until = 65536
# NVFP4 experts against bf16 rows on the register-dequant mma.sync kernel past one token, as L40S:
# MiniMax-M3.1-Flash mini pf32-512 70.8k -> 94.3k, c512 23.4k -> 28.2k tok/s
moe.nvfp4_mma_from = 17
moe.nvfp4_mma_until = 65536
# a single-row block-FP8 projection as the GEMV over bf16 rows, the codes streamed once, as sm_90/sm_100:
# MiniMax-M3.1-Flash mini raw decode 285 -> 304 tok/s, greedy tokens unchanged
gemm.fp8_gemv_until = 1
# the tensor-core attention, hyper-connection and KDA kernels A100, H100 and L40S run: DeepSeek-V4.1 mini
# raw decode 106 -> 239 tok/s, pf16-512 5.2k -> 33.6k; DeepSeek-V4 mini pf16 32k -> 72k; Qwen3.8-Flash-Next
# mini raw decode 455 -> 501, pf16 108k -> 140k; Kimi-K3 mini raw prefill 8.4k -> 13.4k
elemwise.rows_vec = true
elemwise.hc_tile = true
elemwise.hc_mma = true
elemwise.norm_emit = true
sdpa.merge_warp = true
sdpa.selected_mma = true
sdpa.pool_mma = true
sdpa.index_mma = true
sdpa.index_radix = true
ssm.kda_chunked = true
ssm.kda_step_fused = true
ssm.conv_vec4 = true
ssm.gdn_out_bf16 = true
attn_res.fused_norm = true
gemm.fp8_shadow = true
# kernels launch as programmatic dependents, as on the RTX 5090: Qwen3-0.6B single-request decode
# 1.58 -> 1.50 ms a token, greedy tokens unchanged
pdl = true
# MiMo's wide-group decode rows (and its sink layers' windowed ones) read the cache through the
# prefill kernel at their live head widths, as on the A100 and L40S
sdpa.decode.grouped_prefill_from = 8
sdpa.decode.grouped_prefill_lse = true
sdpa.decode.grouped_prefill_window = true
sdpa.fa2_live = true
# wide MXFP4 selects of a release that asks for e4m3 activations (DeepSeek-V4, V4.1, MiMo) run W4A8
# on the block-scaled mma.sync, as SGLang reads them (no block-FP8 copy of the bank)
moe.mxfp4_w4a8_from = 256
moe.mxfp4_w4a8_tma = true

# independent chains (shared expert beside the routed ones) on side streams, as sm100 runs them:
# Qwen3.6-35B-A3B single-request decode 170 -> 179 tok/s, greedy tokens unchanged, c128 unchanged
[compiler]
branches = true
dag_streams = true
dag_streams_until = 256

# fires of three lanes' 1024 prompt rows over a gated delta trunk (5 of a batch's 556-token prompts) keep
# the card fed while the next prompts arrive: Qwen3.8-Flash-Next mini pf16-512 142k -> 160k tok/s
[engine]
walk_fire_rows = 1024
# two recurrent-state slots a lane, so a hybrid trunk seats past the fixed 256: Nemotron-3-Super mini
# c512 4,749 -> 5,028 tok/s (slots cut to fit the card), greedy tokens unchanged
state_slots_per_lane = 2
# prompt fires pad to 64 lanes, not the 512 decoding lanes two slots seat: Qwen3.8-Flash-Next mini
# raw prefill 58.9k -> 68.7k, pf16-512 150.1k -> 160.5k tok/s, c512 unchanged, greedy parity unchanged
prefill_lanes = 64

[provenance]
source = "pie tune (quick, gptoss-20b) on RunPod; 512-token prompt 20.5 -> 20.5 ms, 1-lane step 2.99 -> 2.93 ms, 4-lane step 4.11 -> 4.06 ms, 8-lane step 6.36 -> 5.33 ms, readout cosine 1.0000"
