api = 1

[target]
tier    = "sm_89"
assumes = { cc = 89 }

# The gated delta rule's prefill on the two-launch scan (a quarter head a
# block where a block holds 99 KiB): Qwen3.5-0.8B's prefill fire 23% to
# 57% less GPU time than on the three wmma launches.
[kernel]
ssm.gdn_fused_scan = true

# MXFP4 selects on the register-dequant mma.sync from 28 routes up: a
# prefill's 2,200 routes (gpt-oss-20b, 541 rows) ran the grouped wmma kernel
# before, its TTFT 19% (RTX 4090), 27% (PRO 6000) and 73% (A40) longer.
moe.mxfp4_mma_from = 28
moe.mxfp4_mma_until = 16777216
# Experts averaging 32 routes or fewer (gpt-oss-120b's 128 at a prefill)
# keep the grouped wmma: its register-held mma ran 5% longer on an L40S.
moe.mxfp4_mma_per_from = 33

# A prefill's fire on eight buckets a doubling from 256 rows: its GEMMs run
# its bucket's rows, and a 556-row prompt padded to 1024 ran 84% more of
# them (Qwen3.6-27B's prefill 30-35% faster on an H100, an A100 and an RTX
# PRO 6000).
[engine]
prefill_lattice_from = 256
prefill_lattice_steps = 8
