# sm_121 (GB10, DGX Spark): what every GPU of compute capability 12.1 runs over the registry defaults.
api = 1

[target]
tier    = "sm_121"
assumes = { cc = 121 }

[provenance]
source = "the profile pie derived for compute capability 10.0 and up before family files: the narrow bf16 GEMV, and the naive MLA kernel, whose FA2 arms were sized for Ada's shared memory"

[kernel]
gemv.bf16 = "narrow"
mla.path  = "naive"
