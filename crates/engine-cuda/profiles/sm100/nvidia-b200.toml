api = 1

[target]
device = "NVIDIA B200"

# Each line's measured win is in the commit that set it.
# cuBLAS over the fused skinny GEMM; selected attention and its index on
# the tensor cores; MXFP4 experts' W4A16 GEMMs in fp16.
[kernel]
gemm.narrow_n = 8
gemm.skinny_rows = 0
sdpa.index_mma = true
sdpa.selected_mma = true
# A decode's selected attention over a cluster of eight blocks a kv head, the slices folded in
# distributed shared memory (MiniMax-M3.1-Flash's four kv heads ran on four blocks):
# MiniMax-M3.1-Flash mini60 raw decode 111 -> 116 tok/s
sdpa.selected_cluster = 8
moe.mxfp4_f16 = true

# Host-mapped `host` planes, a lattice bucket between powers of two (four
# from 4096 rows), and a gated delta fire at most 4096 rows.
[engine]
lattice_steps = 2
prefill_lattice_from = 4096
host_planes = true
walk_fire_rows = 4096

[provenance]
source = "pie tune (quick, gemma4-31b) and the fixed points, end to end"
# `measured` names only what dense gemma4-31b, the tune's model, reads: no routed decision.
measured = [
  "kernel.gemm.heuristics",
  "kernel.gemm.narrow_n",
  "kernel.gemm.skinny_rows",
  "kernel.gemm.workspace_mb",
  "kernel.gemv.bf16",
  "kernel.gemv.splitk_max_n",
  "kernel.qmm.gemm_from",
  "kernel.qmm.long_rows",
  "kernel.qmm.split_thin_max",
  "kernel.qmm.split_warps_per_sm",
  "kernel.qmm.split_wide_max",
  "kernel.sdpa.index_mma",
  "kernel.sdpa.prefill.ctas_per_sm",
  "kernel.sdpa.selected_mma",
  "engine.copies",
  "engine.host_planes",
  "engine.lattice_steps",
  "engine.walk_fire_rows",
  "engine.working_set_percent",
]
