api = 1

[target]
tier    = "sm_90"
assumes = { cc = 90 }

# The sm_100 tier's arch-generic arms (mma.sync, clusters, PDL), measured on
# an H100 80GB HBM3: DeepSeek-V4-Flash's miniature +25% at one request and
# +67% at 64, Qwen3.6-27B +3% at one request and +6% at 64.
[kernel]
pdl = true
# Gated delta: the two-launch chunked scan and a bf16 output.
ssm.gdn_fused_scan = true
ssm.gdn_out_bf16 = true
ssm.conv_vec4 = true
# KDA's prefill chunked on the tensor cores (GLM-5.3-Flash, Kimi-K3).
ssm.kda_chunked = true
# Row kernels 16 bytes a lane; hyper-connection kernels tiled and on mma.sync.
elemwise.rows_vec = true
elemwise.hc_tile = true
elemwise.hc_mma = true
# Qwen3.5's attention prologue in one launch up to 64 rows.
elemwise.qg_prologue_until = 64
# A wide decode's split partials fold a warp a row.
sdpa.merge_warp = true
# Selected (sparse) attention on the tensor cores, a kv head's query group a
# walk: Qwen3.8-Flash-Next's miniature 11% less GPU time at 64.
sdpa.selected_mma = true
# A selected MLA row that sees no more keys than its selection holds reads
# them dense, in order (GLM-5.3-Flash's miniature +4% at 64).
sdpa.mla_dense_short = true
# DeepSeek-V4's attention: pool on mma.sync, decode up to 64 in one launch.
sdpa.pool_mma = true
sdpa.dsv4_decode_until = 64
# A dense bias from the cuBLASLt epilogue.
gemm.bias_epilogue = true
# Bf16 products of 2 to 8 rows may time the few-rows kernel.
gemm.rows_m = 8
# cuBLAS, not the fused skinny GEMM, for Gemma's GEGLU and soft-capped
# head (Gemma 4 26B-A4B +4% at one request, +2% at 64).
gemm.skinny_rows = 0
# AttnRes's blend and its row's norm in one pass.
attn_res.fused_norm = true
# MXFP4 selects on the register-dequant mma.sync from 28 routes up (a
# prefill's on the wgmma slice: gpt-oss-20b's TTFT 24% shorter than on the
# grouped wmma past 1024), W4A16 NVFP4 ones from 32 to 8192.
moe.mxfp4_mma_from = 28
moe.mxfp4_mma_until = 16777216
moe.nvfp4_mma_from = 32
moe.nvfp4_mma_until = 8192
# Bf16 routed experts (Hy4, GLM-5.3-Flash served bf16): the graph-safe grouped
# mma.sync kernel from 16 routes, where the per-route GEMV re-reads each expert.
moe.bf16_mma_from = 16
moe.bf16_mma_until = 65536
# A block-FP8 projection's decode rows (to 4) on the GEMV over bf16 rows,
# ahead of the W8A16 mma.sync kernel (GLM-5.3-Flash's dense layers).
gemm.fp8_gemv_until = 4

# A prefill's fire on eight buckets a doubling from 256 rows: its GEMMs run
# its bucket's rows, and a 556-row prompt padded to 1024 ran 84% more of
# them (Qwen3.6-27B's prefill 30-35% faster on an H100, an A100 and an RTX
# PRO 6000).
[engine]
prefill_lattice_from = 256
prefill_lattice_steps = 8

[compiler]
# A taken conditional node costs about 12 us on an H100, past the launches it
# skips at decode: priced out, every region launches (DeepSeek-V4.1-Flash's
# miniature +5% at one request, MiMo-V2.6-Flash's +7% at 64, six others even).
cond_fixed_us = 1000000
