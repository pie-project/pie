[package]
name = "engine-cuda"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The menlo CUDA engine's dispatch layer: a Run that resolves plan ids to device handles and answers every Dispatch* trait by calling kernels-cuda entries on the stream Ctx. Merges into engine-cuda when the old stack is deleted."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "engine_cuda"
path = "src/lib.rs"

[dependencies]
state = { path = "../state" }
memmap2 = "0.9"
toml = "1.1"
tracing = "0.1"
libc = "0.2"
poem-ir = { package = "pie-poem-ir", path = "../poem-ir" }
kernels-cuda = { path = "../kernels-cuda", optional = true }
kernels-ir = { path = "../kernels-ir" }
kernels-rocm = { path = "../kernels-rocm", optional = true }

engine = { path = "../engine" }

poem-exec = { package = "pie-poem-exec", path = "../poem-exec" }

eta-exec = { path = "../eta-exec" }

eta-ir = { package = "pie-eta-ir", path = "../eta-ir" }
eta-compiler = { path = "../eta-compiler" }
poem-compiler = { package = "pie-poem-compiler", path = "../poem-compiler" }
profile = { package = "pie-profile", path = "../profile" }
checkpoint = { path = "../checkpoint" }
poem = { package = "pie-poem", path = "../poem" }
ztensor-compat = { workspace = true }

cudarc = { version = "0.19.8", optional = true, default-features = false, features = [
    "std",
    "driver",
    "runtime",
    "nvrtc",
    "nccl",
    "fallback-dynamic-loading",
] }

[features]
# Without a device runtime the engine builds over kernels-cuda, as a
# runtimeless build.
default = ["probe", "dep:kernels-cuda"]

probe = []

cuda = ["device", "dep:cudarc", "dep:kernels-cuda", "kernels-cuda/cuda", "cudarc/cuda-13000", "cudarc/cupti"]

# The same engine on AMD GPUs over HIP: kernels-rocm's kernels, hiprtc and
# the HIP runtime in place of kernels-cuda, NVRTC and the CUDA runtime.
rocm = ["device", "dep:kernels-rocm", "kernels-rocm/rocm"]

# A device runtime, either one; enable `cuda` or `rocm`.
device = []

# Fills memory nothing should read before a launch (a guest lane's dummy
# bytes), so a kernel that does read it answers wrongly where a golden
# sees it. Off, no build writes those bytes.
test-slot-fill = []

# A test build's pins (`Knobs::pin`, `Knobs::weights`): fires launched
# eagerly, or a load with no weight shape. No profile or config reaches them;
# serving captures every fire. The crate's own tests turn it on below.
test-pins = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
engine-cuda = { path = ".", features = ["test-pins"] }
eta-dsl = { package = "pie-eta-dsl", path = "../eta-dsl" }
inferlet = { path = "../inferlet" }
poem = { package = "pie-poem", path = "../poem" }
ztensor = { workspace = true }
ztensor-compat = { workspace = true }
tempfile = "3"
engine-cpu = { path = "../engine-cpu" }

[lints]
workspace = true
