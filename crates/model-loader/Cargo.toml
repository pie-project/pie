[package]
name = "model-loader"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Typed weight-loading compiler: checkpoints to verified device-memory layouts."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "model_loader"
crate-type = ["rlib"]
path = "src/lib.rs"

# This crate is the compiler alone. There is no C ABI and no sibling
# `-capi` crate: the drivers link the rlib and pass Rust types, and executing a
# plan is `executor`'s — see `src/executor/arena.rs` for why the device half is
# an `ArenaBacking` the consumer supplies rather than a second executor inside
# each driver.

[features]
default = ["testkit"]

# The parts of this crate that exist to *check* the loader rather than to be
# the loader: the differential oracle and the CPU plan executor the
# `model-loader` tool replays with.
#
# On by default so `cargo build` and `cargo test` work unasked.
# `worker/Cargo.toml` turns it off, which is also the check: if the load path
# ever grows a route into the oracle, the worker stops compiling.
testkit = []

# The device half of the loader: `executor::cuda::CudaArena`, which runs a
# plan's `Cast`/`Scale`/`Encode` on the GPU instead of staging them back to
# the host to compute in a loop.
#
# OFF by default, and the default is the load-bearing one: without it this
# crate's whole dependency set is `half`/`ztensor`/`serde`/`thiserror`, and
# `pie model convert` builds and runs on a machine with no CUDA toolkit. That
# is not a nicety — it is what makes the host executor the reference the
# device answer is checked against.
#
# **NO `kernels-cuda/native`, AND THAT IS THE POINT OF THIS FEATURE NOW.** The
# feature belonged to the ahead-of-time archive crate, deleted at `85c6c674b`.
# It was here because the four transforms were `extern "C" pie_k_*` symbols
# that only `libpie_kernels_cuda.a` defined, so turning device transforms on
# meant turning nvcc and CMake on with them — in the one crate whose
# toolkit-free build is what makes `pie model convert` portable, and whose
# every consumer therefore inherited a CUDA toolchain requirement it had no
# use for. The four call sites now go through `kernels-cuda`'s generated
# `api`, which is NVRTC at run time and a text file at build time, so
# `--features cuda-13` needs a driver and no toolkit. Nothing in this crate's
# graph builds an archive any more.
cuda = ["dep:kernels-cuda", "dep:cudarc"]

# WHICH CUDA RUNTIME, and now there are TWO crates voting rather than one.
# This crate still names no version of its own — `driver-cuda` offers
# `cuda-12`/`cuda-13` and a binary picks one — but a version chosen here must
# reach `kernels-cuda` as well, because that crate loads a libcudart of
# its own to compile and fire the rows this loader calls. Two crates in one
# process disagreeing about which is the `cudaGraphAddNode` arity trap
# `driver-cuda/Cargo.toml` describes, reached from a third direction.
#
# That is not hypothetical. `cudarc/cuda-12080` was pinned here while
# `driver-cuda` selected `cuda-13000`; the two unified, cudarc's cublas
# `sys` module declared every enum twice, and the failure surfaced in
# `cargo test --doc` rather than anywhere that named a version. The rule the
# episode leaves behind is that a version is selected in ONE place and
# inherited everywhere — `driver-cuda`'s `cuda-13` already says
# `model-loader?/cuda-13`, and these lines pass the same choice on.
cuda-12 = ["cuda", "cudarc/cuda-12080", "kernels-cuda/cuda-12"]
cuda-13 = ["cuda", "cudarc/cuda-13000", "kernels-cuda/cuda-13"]

[dependencies]
half = "2"
# The four rows this crate fires at load time, as generated typed functions —
# `api::quant_cast_fp32_to_bf16` and its three siblings — plus the `Dims`,
# `Stream` and `Error` their signatures are written in.
#
# kernels-cuda was here and is not — the ahead-of-time archive crate of that
# name, deleted at `85c6c674b`. It carried the `pie_k_*` declarations, which
# are `extern "C"` symbols defined by that archive; the archive is what dragged
# nvcc into every build of this crate that wanted
# device transforms. The typed entry points come from the SAME ROWS through
# `kernels-cuda`'s `emit::emit_rust_api`, which is the replacement for
# the generator that emitted the C shim — so a row that changes its operands
# still changes this call site or fails to compile, which was the only
# property the shim was worth having for.
#
# `default-features = false` is the table alone; `cuda-12`/`cuda-13` above
# add the runtime that compiles and fires. Nothing links: NVRTC turns the
# device text carried in the binary into a cubin at run time.
kernels-cuda = { path = "../kernels-cuda", default-features = false, optional = true }
# Runtime only: the arena needs `cudaMemcpyAsync`, `cudaMemsetAsync`,
# `cudaHostAlloc` and an event. No `driver`, no cublas, no nvrtc — a loader
# that reached for those would be doing something other than loading.
#
# `fallback-dynamic-loading` for the reason `driver-cuda` states: symbols
# resolve through `dlopen` on first call, so nothing is linked and a build
# needs no CUDA libraries present.
# NO VERSION FEATURE HERE — see `cuda-12`/`cuda-13` above.
cudarc = { version = "0.19.8", optional = true, default-features = false, features = [
    "std",
    "runtime",
    "fallback-dynamic-loading",
] }
# The checkpoint readers; the requirement itself lives in the workspace
# manifest, because releasing them is a two-repo dance.
ztensor = { workspace = true, features = ["zstd"] }
ztensor-compat = { workspace = true, features = [
    "safetensors",
    "gguf",
    "npz",
    "pickle",
    "hdf5",
    "onnx",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
ztensor = { workspace = true }
# A dev-only cycle, which cargo permits: the golden and verifier tests check
# the *marshalled* view of a plan, and the marshalling lives in the ABI crate
# above this one. The lib itself must never depend on it — that is the whole
# point of the split.
