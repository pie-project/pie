[package]
name = "tensor-ir"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
authors = ["In Gim <in.gim@yale.edu>"]
description = "PTIR — the Pie Tensor IR: the shape-typed op vocabulary, the stage-tagged channel-carrying trace container and its canonical wire format, shape/dtype inference, and the bind-time validator. The representation layer every other compiler crate builds on."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
keywords = ["pie", "tensor", "ir", "ptir"]

[lib]
name = "tensor_ir"
crate-type = ["rlib"]
path = "src/lib.rs"

# `std` (default) is host-side and only adds the `std::error::Error` impls on the
# decode/validate error types. The wasm SDK depends on this crate with
# `default-features = false` to keep the IR core `no_std` (+ `alloc`).
[features]
default = ["std"]
std = []

# `serde` is OFF by default and exists for ONE consumer: `engine-api`, whose
# nouns all have to serialize (palo design §7, decision 4 — "remote is a
# property, not an encoding"). The contract's guest-program half is spelled in
# THIS crate's vocabulary rather than in a second copy of it — `DType`,
# `ChanDType`, `HostRole`, `ExternDir`, `Port`, `Stage`, `IntrinsicId` — and a
# type you cannot serialize is a type a contract has to re-spell. That
# re-spelling is exactly what the rewrite deleted.
#
# Off by default because the guest half of this crate is `no_std` wasm reached
# through `tensor-dsl`, and it has no business carrying a serialization
# framework it never calls. The derives are `cfg_attr`-gated, so the guest
# build is byte-identical to what it was before this feature existed.
serde = ["dep:serde"]

[dependencies]
# See the `serde` feature. `default-features = false` + `alloc` keeps the
# `no_std` promise in the lib.rs header true even when the feature is on.
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
], optional = true }

# Shared ratchet from the root manifest. The toolchain's three crates are gated
# with `-D warnings` in CI; see `[workspace.lints]` in the workspace `Cargo.toml`.
[lints]
workspace = true
