[package]
name = "eta-compiler"
version.workspace = true
edition = "2024"
rust-version.workspace = true
authors = ["In Gim <in.gim@yale.edu>"]
description = "The host toolchain for guest tensor programs: ETA execution planning, the tier-0 reference interpreter every backend diffs against, and CUDA/Metal source emission, with the conformance battery that holds the three to one another."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
keywords = ["pie", "eta", "tensor", "ir", "compiler"]

[lib]
name = "eta_compiler"
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
eta-ir = { package = "pie-eta-ir", path = "../eta-ir", features = ["serde"] }
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
    "rc",
] }

[features]
# The guest-program contract cases (`contract`) every guest-capable
# backend's tests run; test support, off in a serving build.
contract = []

[dev-dependencies]
eta-compiler = { path = ".", features = ["contract"] }
naga = { version = "30", default-features = false, features = [
    "wgsl-in",
    "spv-out",
] }

[lints]
workspace = true
