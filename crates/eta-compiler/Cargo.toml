[package]
name = "eta-compiler"
version.workspace = true
edition = "2024"
rust-version.workspace = true
authors = ["In Gim <in.gim@yale.edu>"]
description = "The host toolchain for guest tensor programs: ETA execution planning, the tier-0 reference interpreter every backend diffs against, and CUDA/Metal source emission, with the conformance battery that holds the three to one another."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
keywords = ["pie", "eta", "tensor", "ir", "compiler"]

[lib]
name = "eta_compiler"
crate-type = ["rlib"]
path = "src/lib.rs"

# Host-only by construction: `eval`'s extern channels are `std::sync` and
# `codegen` writes files. The guest imports `eta-ir` and `eta-dsl`, which keep
# their `no_std` modes.
[dependencies]
# `serde` is on, and `eta-ir` is taken with its `serde` feature, because this
# crate declares the launch package an engine executes and every noun in it
# serializes. `default-features = false` + `alloc` on serde because a `std`
# serde in the graph is a `std` serde for everyone Cargo unifies with.
eta-ir = { path = "../eta-ir", features = ["serde"] }
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
] }

# The toolchain's three crates are the ones CI gates with `-D warnings`.
[lints]
workspace = true
