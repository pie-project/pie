[package]
name = "pie-poem-compiler"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Bakes a traced Plan once: class resolution, region coalescing and the arena carve, into the backend-neutral CompiledModel artifact an engine records and replays. Pure functions — no device, no I/O."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "poem_compiler"
path = "src/lib.rs"

[dependencies]
poem-ir = { package = "pie-poem-ir", path = "../poem-ir" }
thiserror = "2.0"

[dev-dependencies]
models = { path = "../models" }
poem-dsl = { package = "pie-poem-dsl", path = "../poem-dsl" }

[lints]
workspace = true
