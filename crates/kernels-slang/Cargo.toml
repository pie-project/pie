[package]
name = "kernels-slang"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "One Slang kernel tree for Vulkan and WebGPU: build.rs compiles every instantiation to SPIR-V (`spirv`) and WGSL (`wgsl`), and the host side names each entry once, for any engine that implements `Encode`."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
links = "pie_kernels_slang"
build = "build.rs"

[lib]
name = "kernels_slang"
path = "src/lib.rs"

[features]
default = []

# SPIR-V modules (engine-vulkan).
spirv = []

# WGSL modules (engine-wgpu).
wgsl = []

# `cores`: the device's core count, read through Vulkan (ash).
probe = ["dep:ash"]

[dependencies]
dtype = { package = "pie-dtype", path = "../dtype" }
ash = { version = "0.38", default-features = false, optional = true }

[lints]
workspace = true
