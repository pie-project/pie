[package]
name = "driver-vulkan"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "The Vulkan execution shell, in Rust: instance and device objects, descriptor sets, SPIR-V pipelines and command recording. Grows beside driver-metal, sharing its launch vocabulary."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

[lib]
name = "driver_vulkan"
path = "src/lib.rs"

# NOT `[lints] workspace = true`, for the reason `driver-metal/Cargo.toml`
# gives: that table sets `unsafe_code = "forbid"`, and every `ash` entry point
# is unsafe by construction. The rest of it -- `missing_docs`, the clippy
# ratchets -- is worth having and is set in `lib.rs`, where `unsafe_code` can be
# left out of the list rather than forbidden and then overruled.

[features]
# No default, for the reason `driver-metal/Cargo.toml` states at length: a
# default has to be turned OFF to reach the portable half, and a check that can
# be skipped will be.
#
# The split is NOT the same one, though, and the difference is worth stating
# because it changes what each half is for. `driver-metal` splits on what a
# COMPILER will accept -- no Linux box can build an `objc2` message send -- so
# its portable half exists to be buildable at all. Vulkan is a loader, not a
# platform: every line of this crate compiles anywhere. `native` gates what
# needs a GPU to be PRESENT, so the portable half here is about what can be
# proved without one.
default = []

# The device half: `ash`, an instance, a queue, real pipelines.
native = ["dep:ash", "kernels-vulkan/native"]

[dependencies]
# The handshake the engine's seam speaks: `DeviceFacts` and the ABI version.
# Pure serde and tarpc, so `tests/pure.rs` stays green -- checked rather than
# assumed, which is the whole point of that test.
# `default-features = false` drops the tarpc service, which is the only thing
# in that crate this one does not want: tokio's platform closure carries
# `windows-sys` and `js-sys`, and `tests/pure.rs` is not going to be taught to
# ignore a `-sys` crate.
driver-api = { path = "../driver-api", default-features = false }

# The launch vocabulary. `LaunchRule` is the same enum `driver-metal` matches
# on, and that sharing is load-bearing rather than tidy: the two shells
# disagree about the GRID and must not disagree about which rule a row names.
kernels = { path = "../kernels" }

# The Vulkan signature table, and the SPIR-V it builds. `default-features =
# false` keeps the portable half to the table -- host-portable, no `slangc` --
# and `native` turns the shader build on, because that half is the one that
# means to RUN and `vkCreateShaderModule` takes words rather than source.
#
# This edge used to be `default-features = false` at BOTH halves, on the
# grounds that "a driver consumes modules rather than producing them". The
# boundary was right and the conclusion drawn from it was wrong: declining to
# enable the feature did not stop the modules being produced, it only moved
# who asked for them to a build script the deployment could not see, and left
# this crate reading them back out of an `OUT_DIR` path relayed through two
# environment variables. `slangc` still runs in `kernels-vulkan`'s build and
# nowhere else; what changed is that its output arrives as data in an rlib
# rather than as a directory a server has to be told about.
kernels-vulkan = { path = "../kernels-vulkan", default-features = false }

# The plan a driver executes: `Lowered`, `Launch`, `Arg`. `src/binding.rs`
# turns those into descriptor ranges, so this is a real dependency and not a
# testing one -- the same shape `driver-metal` has, for the same reason.
# `model-ir` beside it for the traced form those name.
model-compiler = { path = "../model-compiler" }
model-ir = { path = "../model-ir" }

# The PTIR channel plane: the program/channel/instance registry, the ring and
# every bind-time derivation. A REAL dependency and not a dev one, unlike
# `model-loader` and `model`, and the difference is the point -- this is not a
# checkpoint format, it is the plane the engine registers work on, and
# `src/programs.rs` serves it.
#
# It costs `tests/pure.rs` nothing, but only after the edge was narrowed:
# `driver` depends on `driver-api` and `tensor-ir`, both already in this
# crate's closure, but it took `driver-api`'s DEFAULT features, and `rpc`
# reaches `js-sys` and `wasm-bindgen-shared` through tokio. `driver` names no
# `tarpc`, so its edge is `default-features = false` now.
driver = { path = "../driver" }

ash = { version = "0.38", default-features = false, features = [
    "loaded",
    "std",
], optional = true }

[dev-dependencies]
# TEST-ONLY: `tests/device.rs` writes a declaration to lower. `src/` names
# nothing from the authoring surface, which is what makes this a dev edge --
# and what it was before the toolchain split is the same 4,469-line
# `dsl::cuda` surface, linked into a VULKAN driver on every build.
model-dsl = { path = "../model-dsl" }

# `tests/checkpoint.rs` only: the tensor names and extents a real `.zt` states,
# which is the one place a weight's SIZE exists -- `Arg::Weight` carries a name
# and no width. A dev-dependency and not a real one on purpose: a driver that
# depended on a checkpoint FORMAT would be a driver that could not be handed
# bytes, and `tests/pure.rs` drops dev kinds so this does not widen the closure
# it checks.
model-loader = { path = "../model-loader" }

# `tests/arena.rs` only: a real model to lower, so the offsets under test are
# the ones a compiler actually assigns rather than ones a test invented.
# `contract` is here for `tests/checkpoint.rs` and not for `tests/arena.rs`:
# it is what carries `catalog::identify`, `contract::author` and
# `boot::compile_load_plan_for` -- the conversion from a publisher's tensor
# names to the ones a plan states. Measuring that the conversion already
# produces this driver's 704 names is the whole content of
# `the_loader_states_the_names_this_driver_binds`, and it cannot be measured
# without compiling a real contract. Still dev-only: nothing in `src/` reads
# a checkpoint.
model = { path = "../model-legacy", package = "model-legacy", default-features = false, features = [
    "contract",
] }

# `tests/pure.rs` only: reading what `cargo metadata` says the resolver did,
# so that "this crate is pure Rust" is asked of the closure rather than of a
# reading of the manifests.
serde_json = "1.0"

# The device tests read the modules `kernels-vulkan` compiles, so the test
# build is the one that needs `slangc`.
kernels-vulkan = { path = "../kernels-vulkan", default-features = false, features = [
    "native",
] }

# The device tests need a GPU to be present, so they are the one target the
# `native` feature gates.
[[test]]
name = "device"
required-features = ["native"]

# The rule cross-check reads `.spv` FILES. That needs `slangc` to have run, and
# it does not need a GPU -- so it is not gated on `native`, and a machine with
# no Vulkan device at all still gets the check that carries the defects.
[[test]]
name = "rules"

# GPU-free -- it lowers a text and looks at byte offsets -- but it reads
# `dispatch::Geometry`, which IS `native`-gated, so the portable build of this
# target does not compile at all. That is worse than gating it: the whole
# point of `default = []` is that the portable half builds, and a test target
# that cannot be built is not a check that can be skipped, it is a build
# failure in `cargo build --workspace --all-targets`.
[[test]]
name = "arena"
required-features = ["native"]

# Neither a GPU nor a shader compiler: it asks the resolver what this crate
# depends on. Ungated on purpose -- the constraint it checks is about the
# builds that DO NOT have a toolchain.
[[test]]
name = "pure"
