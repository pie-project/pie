# ── BOTH HALVES OF THIS CRATE COMPILE, AND ONE OF THEM IS NEW ──────────
#
# THE QUARANTINE (R3) STOOD HERE and said "this manifest does not resolve":
# `driver-vulkan` was in the root workspace's `exclude` list, no member
# path-depended on it, and two `[dev-dependencies]` edges -- `model-legacy`
# and `model-dsl-legacy` -- pointed at directories that were not there. It
# rejoined at `f80332be8` with those edges deleted, and the one sentence worth
# carrying forward is its last: a manifest that resolves over a build that does
# not is a worse lie than a dangling path.
#
# THE FIFTY ERRORS STOOD HERE TOO, and they are the paragraph this replaces.
# `native` did not compile at all: `kernels::routine` and
# `kernels_vulkan::{routine, ROUTINES, routines}` went with the floor's
# refactor, `model_compiler::lower` and `model::shared` with R3, and
# `model_ir::trace::{ForwardPlan, Dim}` with the traced form, and eleven
# modules named one of them. P5c is the commit that fixed it, on the terms
# `driver-metal` set at P5a and `driver-wgpu` at P5b: the pre-baker execution
# path is DELETED rather than patched -- `bind`, `dispatch`, `encode`, `hold`,
# `replay`, `runtime`, `shell` and `views` as whole modules, `binding`,
# `serve`, `turns`, `frames` and `resources` split -- and what replaces it is
# `src/baker/` over `src/walk/`.
#
# WHAT EACH FEATURE NOW BUYS, because three of them is two more than most
# crates have and the difference is measurable:
#
# * `default = []` -- no `ash` at all. `facts`, `geometry`, `phase`,
#   `programs`, `rope`, `spirv`, and the whole of `baker`/`walk`, which is the
#   part that matters: a `Program` walk is checkable with no adapter in the
#   process, and `tests/the_walk_is_the_program.rs` and `tests/arena.rs` both
#   run in this configuration.
# * `device` -- `ash` and the compiled SPIR-V. `device.rs` opens a card and
#   builds pipelines; `tests/device_fire.rs` is the target that needs exactly
#   this and nothing more.
# * `native = ["device"]` -- the serving half: `binding`, `envelope`, `frames`,
#   `pages`, `resources`, `serve`, `turns`. Every one of them names a
#   `device::Buffer`, which is the whole of why the gate is not narrower.
[package]
name = "driver-vulkan"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "The Vulkan execution shell, in Rust: instance and device objects, descriptor sets, SPIR-V pipelines and command recording. Grows beside driver-metal, sharing its launch vocabulary."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

[lib]
name = "driver_vulkan"
path = "src/lib.rs"

# NOT `[lints] workspace = true`, for the reason `driver-metal/Cargo.toml`
# gives: that table sets `unsafe_code = "forbid"`, and every `ash` entry point
# is unsafe by construction. The rest of it -- `missing_docs`, the clippy
# ratchets -- is worth having and is set in `lib.rs`, where `unsafe_code` can be
# left out of the list rather than forbidden and then overruled.

[features]
# No default, for the reason `driver-metal/Cargo.toml` states at length: a
# default has to be turned OFF to reach the portable half, and a check that can
# be skipped will be.
#
# The split is NOT the same one, though, and the difference is worth stating
# because it changes what each half is for. `driver-metal` splits on what a
# COMPILER will accept -- no Linux box can build an `objc2` message send -- so
# its portable half exists to be buildable at all. Vulkan is a loader, not a
# platform: every line of this crate compiles anywhere. `native` gates what
# needs a GPU to be PRESENT, so the portable half here is about what can be
# proved without one.
default = []

# The device half: `ash`, an instance, a queue, real pipelines, and the
# compiled SPIR-V to build them from. What it does NOT bring is the walk that
# executes a model's plan on them, and the split is not a taste -- it is the
# only reason anything in this crate can be run today.
#
# `native` used to be both at once. R5 deleted `model_compiler::lower`,
# `model_ir::trace::ForwardPlan` and `kernels_vulkan::routine`, and the walk
# names all three: `cargo check -p driver-vulkan --features native` is 40
# resolution errors across eleven modules, every one of them a reference into
# an IR that is not there. None of them is in `device`, `spirv`, `geometry`,
# `facts` or `phase` -- `device.rs` imports exactly `geometry` and `spirv`, and
# names `resources` and `binding` only in doc links -- so the half that OPENS
# the card was never broken and was merely unbuildable, standing behind one
# feature with the half that was.
#
# So `device` is that half named separately, and it is the one this crate's own
# `tests/device_fire.rs` runs on. Nothing that existed before this line changes
# meaning: `native` still turns on everything it turned on, because it forwards
# to here.
device = ["dep:ash", "kernels-vulkan/native"]

# The device half plus the plan walk. Unchanged as a request -- and still 40
# errors until the walk is rebuilt on `model_compiler::program::Program`, which
# is a rewrite in progress and not this feature's business.
native = ["device"]

[dependencies]
# The handshake the engine's seam speaks: `DeviceFacts` and the ABI version.
# Pure serde and tarpc, so `tests/pure.rs` stays green -- checked rather than
# assumed, which is the whole point of that test.
# `default-features = false` drops the tarpc service, which is the only thing
# in that crate this one does not want: tokio's platform closure carries
# `windows-sys` and `js-sys`, and `tests/pure.rs` is not going to be taught to
# ignore a `-sys` crate.
driver-api = { path = "../driver-api", default-features = false }

# The launch vocabulary. `LaunchRule` is the same enum `driver-metal` matches
# on, and that sharing is load-bearing rather than tidy: the two shells
# disagree about the GRID and must not disagree about which rule a row names.
kernels = { path = "../kernels" }

# The Vulkan signature table, and the SPIR-V it builds. `default-features =
# false` keeps the portable half to the table -- host-portable, no `slangc` --
# and `native` turns the shader build on, because that half is the one that
# means to RUN and `vkCreateShaderModule` takes words rather than source.
#
# This edge used to be `default-features = false` at BOTH halves, on the
# grounds that "a driver consumes modules rather than producing them". The
# boundary was right and the conclusion drawn from it was wrong: declining to
# enable the feature did not stop the modules being produced, it only moved
# who asked for them to a build script the deployment could not see, and left
# this crate reading them back out of an `OUT_DIR` path relayed through two
# environment variables. `slangc` still runs in `kernels-vulkan`'s build and
# nowhere else; what changed is that its output arrives as data in an rlib
# rather than as a directory a server has to be told about.
kernels-vulkan = { path = "../kernels-vulkan", default-features = false }

# The plan a driver executes: `Lowered`, `Launch`, `Arg`. `src/binding.rs`
# turns those into descriptor ranges, so this is a real dependency and not a
# testing one -- the same shape `driver-metal` has, for the same reason.
# `model-ir` beside it for the traced form those name.
model-compiler = { path = "../model-compiler" }
model-ir = { path = "../model-ir" }

# The PTIR channel plane: the program/channel/instance registry, the ring and
# every bind-time derivation. A REAL dependency and not a dev one, unlike
# `model-loader` and `model`, and the difference is the point -- this is not a
# checkpoint format, it is the plane the engine registers work on, and
# `src/programs.rs` serves it.
#
# It costs `tests/pure.rs` nothing, but only after the edge was narrowed:
# `driver` depends on `driver-api` and `tensor-ir`, both already in this
# crate's closure, but it took `driver-api`'s DEFAULT features, and `rpc`
# reaches `js-sys` and `wasm-bindgen-shared` through tokio. `driver` names no
# `tarpc`, so its edge is `default-features = false` now.
driver = { path = "../driver" }

# THE CATALOG, and the edge that finishes what R3's quarantine started.
# `src/walk/lane.rs` reads a row (`model::serve::row`), traces it for THIS
# PLANE (`model::trace_of(sku)(Backend::Vulkan)`), sizes the tower off the same
# plan (`model::deployment::Deployment::of`) and names the element a bank is
# stored at (`model::produce::Dtype`). This is `driver-metal`'s edge and
# `driver-wgpu`'s, taken for their reason: one catalog, and a driver that NAMES
# a plane rather than observing a binding.
#
# IT STOOD IN `[dev-dependencies]` UNTIL THE WALK LANDED, beside the note that
# said what it was standing in for -- `model-dsl-legacy` and `model-legacy`,
# both deleted, both still named, which is why this package would not resolve
# at all. The note's own last sentence is what moved it up here: *"a baker
# executor needs neither: it walks a `model_compiler::program::Program`."* It
# does, and `model` is the crate that hands it one.
model = { path = "../model" }

ash = { version = "0.38", default-features = false, features = [
    "loaded",
    "std",
], optional = true }

[dev-dependencies]
# TEST-ONLY: `tests/device.rs` writes a declaration to lower. `src/` names
# nothing from the authoring surface, which is what makes this a dev edge --
# and what it was before the toolchain split is the same 4,469-line
# `dsl::cuda` surface, linked into a VULKAN driver on every build.

# The tensor names and extents a real `.zt` states, which is the one place a
# weight's SIZE exists -- `Arg::Weight` carries a name and no width. A
# dev-dependency and not a real one on purpose: a driver that depended on a
# checkpoint FORMAT would be a driver that could not be handed bytes, and
# `tests/pure.rs` drops dev kinds so this does not widen the closure it checks.
#
# `tests/checkpoint.rs` was its first reader and is DELETED; the edge stays
# because `tests/{device,hostprof,replay}.rs` each run a real
# `model_loader::executor::Execution` behind `cfg(feature = "native")`. When
# the baker executor lands, `model::produce` is what replaces all three, and
# this edge goes with them.
model-loader = { path = "../model-loader" }

# `tests/arena.rs` only: a real model to lower, so the offsets under test are
# the ones a compiler actually assigns rather than ones a test invented.
#
# IT USED TO CARRY A SECOND READER. `tests/checkpoint.rs` took
# `catalog::identify`, `contract::author` and `boot::compile_load_plan_for`
# from here -- the conversion from a publisher's tensor names to the ones a
# plan states -- and measuring that conversion was the whole content of
# `the_loader_states_the_names_this_driver_binds`. R3 deleted all three, so
# the test went with them and only `tests/arena.rs` is left. Still dev-only:
# nothing in `src/` reads a checkpoint.
# `model-dsl-legacy` AND `model-legacy` STOOD HERE, and R3 deleted both
# crates while this manifest went on naming them. That is why cargo could not
# resolve this package at all for the whole of the quarantine: not one edge
# was merely unused, two pointed at directories that are not there.
#
# `model` is the catalog now, singular, and it is a REGULAR dependency above,
# because `src/walk/lane.rs` traces a row with it. What stood here is not
# needed twice.

# `tests/pure.rs` only: reading what `cargo metadata` says the resolver did,
# so that "this crate is pure Rust" is asked of the closure rather than of a
# reading of the manifests.
serde_json = "1.0"

# The device tests read the modules `kernels-vulkan` compiles, so the test
# build is the one that needs `slangc`.
#
# IT DOES NOT ASK FOR `native` HERE, and that line cost the whole workspace
# its default build for as long as this crate was a member. A dev-dependency
# takes part in feature unification, so `cargo check --workspace
# --all-targets` on a box with no Slang compiler failed inside
# `kernels-vulkan`'s BUILD SCRIPT -- nowhere near this crate, and nowhere
# near a message that names it. The two targets that need compiled SPIR-V
# say `required-features = ["native"]` below, and this crate's own `native`
# already forwards to `kernels-vulkan/native`, which is the one place that
# edge belongs.
kernels-vulkan = { path = "../kernels-vulkan", default-features = false }

# The device tests need a GPU to be present, so they are the one target the
# `native` feature gates.
[[test]]
name = "device"
required-features = ["native"]

# The rule cross-check reads compiled MODULES and no GPU, so it is not gated on
# `native` and a machine with no Vulkan device still gets the check that carries
# the defects.
#
# NOT `required-features = ["native"]`, and that is deliberate rather than an
# omission -- but the reason has moved and the invocation is worth writing
# down, because without it this target passes while measuring nothing.
#
# It once read `.spv` FILES out of an `OUT_DIR`, which would have needed
# `slangc` at build time. It reads `kernels_vulkan::MODULES` now, which is an
# EMPTY TABLE without the feature rather than a missing path, and its
# `modules!()` macro turns an empty table into a printed skip. So the target
# builds everywhere -- which is what lets CI compile it on a box with no Slang
# compiler -- and on that box all five tests pass having looked at nothing.
#
# WHERE IT ACTUALLY MEASURES, verified:
#
#     PIE_SLANGC=... cargo test -p driver-vulkan \
#         --features kernels-vulkan/native --test rules
#
# `kernels-vulkan/native` and NOT this crate's `native`: the modules are the
# dependency's build product, and gating on the driver's own feature would drag
# in `ash` and the whole device half for a test that opens no device. 480
# entrypoints, ~3m20s cold for the shader tree, no GPU touched.
[[test]]
name = "rules"

# GPU-free, and UNGATED NOW, which it could not be before.
#
# It carried `required-features = ["native"]` because it read
# `dispatch::Geometry` -- a `native` type, in a test whose whole subject is
# byte offsets a compiler chose. `dispatch` is deleted and the file is
# rewritten against `model_compiler::program::carve` and
# `baker::{BANK_ALIGN, arena_of}`, which are ungated, so the target now builds
# and RUNS in the configuration its own header claims: no card, no Slang, no
# `ash` in the closure.
#
# That matters beyond tidiness. The question this target asks is whether the
# offsets a compiler assigns are ones a Vulkan descriptor can be built at, and
# the answer CHANGED when `lower` was replaced by `carve` -- 256 to 16. A check
# that only ran in the heaviest build configuration is one the commit that
# changes the number will not run.
[[test]]
name = "arena"

# The three claims on a real card: a device opens, every module in the tree
# becomes a pipeline, one kernel fires and the numbers are right.
#
# `device` and not `native`, and that is the whole reason the feature exists:
# this target needs a GPU and the compiled SPIR-V, and needs nothing at all
# from the plan walk that does not currently build. It is the one device target
# in this crate that can be RUN today.
[[test]]
name = "device_fire"
required-features = ["device"]

# The ssm family on a real card: the two conv arms, the `[b | a]` gate row and
# the two delta scans, each against an `f64` model of its own arithmetic, plus
# the mutations that make those comparisons falsifiable.
#
# `device` and not `native` for `device_fire`'s reason, and for one more that is
# this family's: `baker::views::recurrent` answers `None` for every layer today
# because nothing in this driver allocates a recurrent slab, so a plan walk
# could not reach these points even if the walk built. The claim bodies' own
# argument lists are held against the same modules in `tests/doors.rs`.
[[test]]
name = "device_ssm"
# The gemm/layout/norm wave on the same card: both dense-matmul arms over
# twelve ragged shapes, both row cuts, and `norm.mul_scalar`'s rounding trip,
# each with the mutation that shows its comparison can fail. Gated exactly as
# `device_fire` is, and for the same reason.
[[test]]
name = "device_gemm"
required-features = ["device"]

# The lse plane and the sink rescale on the same card: both `_lse` arms against
# an `f64` softmax model, the empty row's `-inf`, `attention.sink` against the
# bf16 bytes `pie::attn::attn_sink_rescale` writes on this same L40S, and the
# decomposition that says a published lse rescaled IS the folded arm. Two of its
# tests are fault injections that rebuild a pipeline from the shipped module with
# one `OpConstant %float` changed, so the mutations need no `slangc` in this
# crate's closure. Gated exactly as `device_fire` is, and for the same reason.
[[test]]
name = "device_sink"
required-features = ["device"]

# The whole chain on a real card: a cached 20B checkpoint through `serve::run`
# to the argmax cuda banked. Needs BOTH gates -- a device and a compiled shader
# tree -- and the checkpoint besides, which is why its one test is `#[ignore]`d
# on top of them.
[[test]]
name = "banked_argmax"
required-features = ["device", "native"]

# Neither a GPU nor a shader compiler: it asks the resolver what this crate
# depends on. Ungated on purpose -- the constraint it checks is about the
# builds that DO NOT have a toolchain.
[[test]]
name = "pure"
