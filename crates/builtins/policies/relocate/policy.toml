# Places a launch on the worker its `worker` prop names, then, once it has
# run `move-after-ms`, moves it to `move-to`, where it runs again from the
# start. The gateway moves a turn only while it has sent no output; one it
# refuses stays where it runs. For tests of migration.
plane = "cluster"
subscribe = ["arrived", "dispatched", "exited", "migrated", "migration-failed"]
grants = ["placement"]
uses = ["placement.migrate"]
gate-ms = 20

[props.worker]
type = "int"
doc = "Where it starts."

[props.move-to]
type = "int"
doc = "Where it moves."

[props.move-after-ms]
type = "int"
doc = "How long after it arrives it moves."
