# Keeps running turns even across the serving workers, after Llumnix: when
# one worker runs at least two more than another, the youngest of its turns
# moves to the idlest, one a call and each turn at most once. A turn moves
# only while it has sent no output, by running again there; one the gateway
# refuses stays. A launch with a `worker` prop starts there.
plane = "cluster"
subscribe = ["arrived", "dispatched", "exited", "migrated", "migration-failed", "worker-removed"]
grants = ["placement"]
uses = ["placement.migrate"]
gate-ms = 20

[props.worker]
type = "int"
doc = "Where it starts."
