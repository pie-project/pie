# Sends a launch to the worker that holds the most of its prompt, as far as
# the gateway routed it, unless that piles turns on one worker; then to the
# least loaded (after SGLang's cache-aware router). A launch with a `worker`
# prop starts there.
plane = "cluster"
subscribe = ["arrived", "dispatched", "exited", "worker-removed"]
grants = ["placement"]
# Long enough for the call that places a new arrival to answer.
gate-ms = 20

[props.worker]
type = "int"
doc = "Where it starts."
