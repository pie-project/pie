# Pauses each process once, mid-run, and resumes it: what parks a running
# process's state below the device and brings it back, for the hosts' tests
# of state that must survive the move (a beam group's page lists).
plane = "worker"
subscribe = ["arrived", "timer"]
grants = ["schedule"]

[props.pause-at-ms]
type = "int"
doc = "Paused this many ms after arriving. Without one, never paused."

[props.pause-for-ms]
type = "int"
doc = "Held paused this many ms, then resumed. Without one, 1000."
