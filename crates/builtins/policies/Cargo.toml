# The PLEX 1.1 policies built into the pie binary, one cargo workspace
# targeting wasm32-unknown-unknown, each a component (crates/plex-sdk).
# `test-*` policies misbehave on purpose; they are embedded only with the
# `test-policies` feature, for the hosts' own tests. Real policies are the
# PLEX corpus (plex `policies-1.1`), loaded by `.wasm` path.
[workspace]
resolver = "2"
members = [
    "noop",
    "test-route",
    "test-trap",
]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
