# The PLEX policies built into the pie binary, one cargo workspace targeting
# wasm32-wasip3. `test-*` policies misbehave on purpose; they are embedded
# only with the `test-policies` feature, for the hosts' own tests.
[workspace]
resolver = "2"
members = [
    "noop",
    "priority",
    "fair",
    "deadline",
    "keep-session",
    "offload",
    "session-affinity",
    "cache-aware",
    "cluster-priority",
    "pin",
    "rebalance",
    "drain-migrate",
    "relocate",
    "pool-replicate",
    "replicate",
    "disaggregate",
    "test-spin",
    "test-trap",
    "test-route",
]

[profile.release]
lto = true
