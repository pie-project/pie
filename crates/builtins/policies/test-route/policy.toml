plane = "cluster"
subscribe = ["arrived", "dispatched", "exited", "published"]
grants = ["schedule", "placement", "executors", "terminate"]
gate-ms = 50

[props.key]
type = "int"
doc = "The process's key; below 1 holds it. Absent is 1."

[props.worker]
type = "text"
doc = "The worker to send it to."

[props.refuse]
type = "text"
doc = "Terminate it while it waits, for this reason."

[props.stop]
type = "boolean"
doc = "Terminate it once it runs."

[props.publish]
type = "text"
doc = "Publish it as `mark`; refused, for this program is not granted `publish`."
