# Orders processes by priority: the cluster's `cluster/priority` where a
# cluster policy passed one on, else the client's own `priority`.
plane = "worker"
subscribe = ["arrived", "exited", "prop-changed"]
grants = ["schedule"]

[props.priority]
type = "int"
doc = "Larger runs first; a process without one is 0. `cluster/priority`, when present, wins."
