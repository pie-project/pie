# Runs every process's passes on the cluster's prefill workers, the least
# loaded first. It writes only executors, so a policy that places processes
# (`cache-aware`) runs beside it.
plane = "cluster"
subscribe = ["arrived", "worker-removed", "worker-draining"]
grants = ["executors"]
requires = ["placement.executors"]
# Long enough for the call that names a new arrival's executors to answer.
gate-ms = 20
