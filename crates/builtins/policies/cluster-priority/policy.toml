# Priority at the gateway: launches leave its queue by their `priority`,
# and pass it on as `cluster/priority` for the worker's `priority` policy.
plane = "cluster"
subscribe = ["arrived", "prop-changed"]
grants = ["schedule", "placement"]
gate-ms = 20

[props.priority]
type = "int"
doc = "Larger leaves the gateway first; a process without one is 0."
