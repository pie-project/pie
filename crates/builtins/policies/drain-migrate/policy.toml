# Moves every turn running on a draining worker to the least loaded worker
# that is not, so a worker leaves without ending what it runs. A launch's
# `worker` prop places it, as `pin` does; launches otherwise go by the
# gateway's default.
plane = "cluster"
subscribe = ["arrived", "worker-draining", "dispatched", "exited", "worker-removed"]
grants = ["placement"]
uses = ["placement.migrate"]
# Long enough for the call that places a new arrival to answer.
gate-ms = 20

[props.worker]
type = "int"
doc = "The worker to start it on, by number; a drain still moves it."
