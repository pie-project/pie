# Moves the turns on a draining worker that have sent no output to the least
# loaded worker that is not, where they run again from the start; the rest
# finish where they run, which the drain waits for. A launch's `worker` prop
# places it, as `pin` does; launches otherwise go by the gateway's default.
plane = "cluster"
subscribe = ["arrived", "worker-draining", "dispatched", "exited", "worker-removed", "migration-failed"]
grants = ["placement"]
uses = ["placement.migrate"]
# Long enough for the call that places a new arrival to answer.
gate-ms = 20

[props.worker]
type = "int"
doc = "The worker to start it on, by number; a drain moves it while it has sent no output."
