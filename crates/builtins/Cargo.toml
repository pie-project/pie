[package]
name = "builtins"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "The built-in inferlets and PLEX policies, compiled to wasm and embedded: what serves pie's OpenAI / Anthropic / Gemini routes, and the stock policies"
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[features]
# Also embed the `test-*` policies, which misbehave on purpose: for the
# policy hosts' own tests.
test-policies = []

[build-dependencies]
# Makes the built PLEX 1.1 policies components (they target
# wasm32-unknown-unknown); the version wit-bindgen 0.58 embeds for.
wit-component = "0.251"

[dev-dependencies]
plex-host = { path = "../plex-host" }

[lints]
workspace = true
