[package]
name = "prefill"
version = "0.1.0"
edition = "2024"
description = "Prefills token ids and exits, leaving their sealed pages in the worker's cache: how a worker runs a pass another worker offloaded to it"

[lib]
crate-type = ["cdylib"]

[dependencies]
inferlet = { path = "../../../../crates/inferlet" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
