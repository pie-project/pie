[package]
name = "kernels-rocm"
version.workspace = true
rust-version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Pure HIP kernel definitions for AMD GPUs: hiprtc unit names, argument marshalling, and launch geometry over a stream. The ROCm counterpart of kernels-cuda; knows nothing about the IR."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

[lib]
name = "kernels_rocm"
path = "src/lib.rs"

[features]
default = []

rocm = ["dep:libloading", "dep:miniz_oxide", "dep:zstd", "dep:tracing"]
# The references and counters only the crate's own tests read: the serial
# scans the chunked passes answer to, the tiled product at a stated tuple,
# the hipBLASLt leg's launch count.
test-support = []

[dependencies]
dtype = { package = "pie-dtype", path = "../dtype" }
kernels-ir = { path = "../kernels-ir" }
profile = { package = "pie-profile", path = "../profile" }

libloading = { version = "0.9", optional = true }
miniz_oxide = { version = "0.9", optional = true }
zstd = { version = "0.14", optional = true }

tracing = { version = "0.1", optional = true }

[dev-dependencies]
engine = { path = "../engine" }
kernels-rocm = { path = ".", features = ["test-support"] }

[lints]
workspace = true
