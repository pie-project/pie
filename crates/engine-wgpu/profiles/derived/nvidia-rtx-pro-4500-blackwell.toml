api = 1

# The RTX PRO 4500 Blackwell runs no checked-in profile on wgpu; this file
# carries only what is its own: its rates, as `pie tune --rates` measured
# them on it.
[target]
device = "NVIDIA RTX PRO 4500 Blackwell"

[rates]
# engine_wgpu::rates::measure (the engine_wgpu suite's rates test, the
# function `pie tune wgpu --rates` calls) at 27955c910 on this card through
# wgpu over Vulkan, in one quiet hold (nr_throttled +0): the matmul through
# WGSL's tiled kernel, timed by the adapter's timestamps, 14.1 TFLOPS; the
# 256 MiB copy 756 GB/s; the launch a dispatch's own cost inside one frame
# (1024 of the narrowest matmul against one, in-graph), 4.12 us.
gemm_tflops = 14.1
hbm_gbps = 756.0
launch_ns = 4120
# Vendor peaks, bounds and not rates: dense bf16 about 202 TFLOPS (NVIDIA
# and Lenovo publish no bf16 or FP16 tensor figure for this card; 1617
# TFLOPS of FP4 with sparsity, Lenovo Press LP2443, is 808 dense, and
# Blackwell's fifth generation tensor cores run bf16 at a quarter of FP4's
# rate), and 896 GB/s of GDDR7 (nvidia.com, RTX PRO 4500 Blackwell
# specifications).

[provenance]
rates = "engine_wgpu::rates::measure at 27955c910 on 2026-11-16 through wgpu over Vulkan: the matmul by WGSL's kernel, the launch inside one frame (in-graph)"
