api = 1

[target]
device = "NVIDIA RTX PRO 4500 Blackwell"

[provenance]
rates = "pie tune wgpu --rates on 2026-11-19 (pie 0.6.0, commit 0e6cf65bb), NVIDIA RTX PRO 4500 Blackwell through wgpu's Vulkan backend, driver 595.112.07: the median of five runs, each its own process on a fresh PIE_HOME and shader cache, under the GPU lock with no build running (nr_throttled +0 in every run); each kernel through the dispatch serving runs, frames doubled until two successive doublings agree within AGREEMENT; the matmul at n = k = 1024, 2048, 4096 by half octaves of rows, 256 to 8192; the few-row matmul at 4 to 256 rows on the kernel serving picks there, the median rate past its weight reads; the tiled attention by keys at head widths 64, 128 and 256; the conv and the gated-delta scan each timed on its own; workgroups a core from one 16-row tile a head of 16 over 8192 keys against the curve's rate there, over the 16 cores wgpu sizes an adapter that reports no count by (UNREPORTED_CORES: 39.1 a core is 625 workgroups for the device); operands: engine::rates' pattern. Spread over the five runs: matmul and attention points at most 3.7%, launch 4.4%, copy 9.4% (one run 719, the others 749-792 GB/s), per-row ops 2.6%, scan 0.3%, few-row 1.1%, workgroups a core 0.3%"

