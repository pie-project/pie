[package]
name = "engine-wgpu"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The WebGPU engine's dispatch layer: a Run that resolves plan ids to device handles and answers every Dispatch* trait by calling kernels-wgpu entries through dyn Encode."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "engine_wgpu"
path = "src/lib.rs"

[dependencies]
toml = "1.1"
model-ir = { path = "../model-ir" }
kernels-wgpu = { path = "../kernels-wgpu" }
engine = { path = "../engine" }
model-exec = { path = "../model-exec" }
model-compiler = { path = "../model-compiler" }
eta-ir = { path = "../eta-ir" }
eta-exec = { path = "../eta-exec" }

eta-compiler = { path = "../eta-compiler" }
checkpoint = { path = "../checkpoint" }
tracing = "0.1"

naga = { version = "30", default-features = false, features = ["wgsl-in"], optional = true }

# The native arm: wgpu over Vulkan/Metal/DX12, raw Vulkan facts through ash,
# and files through libc/memmap2. Waits are callbacks on both hosts (see
# `device::host`), so nothing here blocks the device.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"
libc = "0.2"
wgpu = { version = "30", default-features = false, features = [
    "wgsl",
    "vulkan",
    "metal",
    "dx12",
], optional = true }
ash = { version = "0.38", default-features = false, optional = true }

# The browser arm: wgpu over the tab's own WebGPU. The host is single-threaded,
# so wgpu's web types may claim `Send + Sync` without atomics.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The engine lane is a green thread in a tab; a wait for the device parks it.
web-rt = { path = "../web-rt" }
wgpu = { version = "30", default-features = false, features = [
    "wgsl",
    "webgpu",
    "fragile-send-sync-non-atomic-wasm",
], optional = true }

[features]
default = []
wgpu = ["dep:wgpu", "dep:naga", "dep:ash"]
