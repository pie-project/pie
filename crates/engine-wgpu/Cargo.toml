[package]
name = "engine-wgpu"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The WebGPU engine's dispatch layer: a Run that resolves plan ids to device handles and answers every Dispatch* trait by calling kernels-slang entries through dyn Encode."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "engine_wgpu"
path = "src/lib.rs"

[dependencies]
toml = "1.1"
poem-ir = { package = "pie-poem-ir", path = "../poem-ir" }
kernels-slang = { path = "../kernels-slang" }
engine = { path = "../engine" }
engine-gpu = { path = "../engine-gpu" }
poem-exec = { package = "pie-poem-exec", path = "../poem-exec" }
poem-compiler = { package = "pie-poem-compiler", path = "../poem-compiler" }
profile = { package = "pie-profile", path = "../profile" }
eta-ir = { package = "pie-eta-ir", path = "../eta-ir" }
eta-exec = { path = "../eta-exec" }

eta-compiler = { path = "../eta-compiler" }
checkpoint = { path = "../checkpoint" }
tracing = "0.1"

naga = { version = "30", default-features = false, features = ["wgsl-in"], optional = true }

# Native builds exist only for the gate tests, on wgpu's Vulkan backend.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30", default-features = false, features = [
    "wgsl",
    "vulkan",
], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-std = { path = "../web-std" }
wgpu = { version = "30", default-features = false, features = [
    "wgsl",
    "webgpu",
    "fragile-send-sync-non-atomic-wasm",
], optional = true }

[dev-dependencies]
poem = { package = "pie-poem", path = "../poem" }
ztensor = { workspace = true }

[features]
default = []
wgpu = [
    "dep:wgpu",
    "dep:naga",
    "kernels-slang/wgsl",
    "kernels-slang/probe",
]

[lints]
workspace = true
