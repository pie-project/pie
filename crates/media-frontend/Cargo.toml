[package]
name = "media-frontend"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The media front-end contract: encoded bytes in, one EncodedSpan out. Per-architecture preprocessing (decode, resize, patchify, interpolation taps, log-mel) implements the traits here; the runtime's media host dispatches to them on the bound model's arch and never names an architecture of its own."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

[lib]
name = "media_frontend"
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
# The span digest (§5's cache statute). Already this workspace's content
# addresser (`worker`, `gateway`, `client`, `runtime`), so a span's digest and
# a blob's are the same 32 bytes computed the same way.
blake3 = "1.8.5"
# **DECODE ONLY, AND THE ARGUMENT IS IN `decode.rs`.** `image` is already this
# workspace's decoder (`runtime` pulled it for the very module this crate
# promotes), so a front-end crate that reads PNG/JPEG/GIF adds zero new crates
# to the lockfile and zero new licences to review. `default-features = false`
# keeps the twenty-format matrix, `rayon`, and the exr/avif/webp trees out;
# the three formats left are the three a guest sends. GIF is here because
# media-door §7 keeps video-as-frames alive and a clip arrives as one.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
] }
