[package]
name = "waker"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "X0 tensor-waker substrate (Runtime–Engine Boundary B9–B12): the Rust-owned waker slot table + pie_wake FFI the direct-call transport parks on. A leaf crate (std + loom only) so the register/commit race is model-checked under `--cfg loom` without dragging the runtime's dependency graph into the loom build."
license = "Apache-2.0"

[lib]
name = "waker"
path = "src/lib.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[target.'cfg(not(loom))'.dev-dependencies]
tokio = { version = "1", features = ["rt", "time", "macros"] }
