# The dispatch generator, as a tool rather than a test.
#
# IT USED TO BE `kernels-cuda/tests/points_dispatch_is_current/generator.rs`
# with a thin harness per plane, and it went with the tests when the user
# had every comment and every test removed from `kernels*` (`e77f3ce82`).
# That left three generated `points_dispatch.rs` files hand-maintained with
# nothing checking them against the claim tables they are supposed to be a
# function of -- which is the one thing a generated file must never be.
#
# It is a bin and not a test because `kernels*` carries no tests: the check
# has to live somewhere that is allowed to have one. `--check` is the gate
# (CI runs it) and `--write` is the generator; the same code answers both,
# so the file cannot drift from the thing that writes it.
#
# A DEFAULT MEMBER. It names every plane crate and not one device API:
# `kernels-cuda` builds on a box with no CUDA (`cudarc` is
# fallback-dynamic-loading and this tool never launches anything), and the
# two shader planes need no toolchain to hand over a `&'static` table.
[package]
name = "points-dispatch"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Generates and checks the per-plane `points_dispatch.rs` against the claim tables the `#[claims]` macro emits."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

[[bin]]
name = "points-dispatch"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
kernels = { path = "../kernels" }
kernels-cuda = { path = "../kernels-cuda" }
kernels-metal = { path = "../kernels-metal", default-features = false }
kernels-wgpu = { path = "../kernels-wgpu" }
