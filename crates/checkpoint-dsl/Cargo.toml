[package]
name = "checkpoint-dsl"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The checkpoint-provenance authoring eDSL over the typed load contract: a Builder that reads each declared weight out of a checkpoint's stored tensors and finishes as the ModelContract the loader checks and runs. What a family's import is WRITTEN IN; it knows no family and traces no forward pass."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "checkpoint_dsl"
path = "src/lib.rs"

[dependencies]
# The IR this surface authors onto: `contract::Expr`/`ModelContract`, plus the
# `infer`/`compile`/`executor` that check and run it.
checkpoint = { path = "../checkpoint" }
# The noun both surfaces share: a `Weight` is declared by the forward text and
# read here. It stays `model-dsl`'s; this crate is a second reader, not a home.
model-dsl = { path = "../model-dsl" }
# The container a checkpoint is: a `Builder` reads the file's own stored facts
# before choosing between an identity read, a cast, and a refusal.
ztensor = { workspace = true }
