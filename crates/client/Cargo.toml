[package]
name = "client"
version = "0.4.0"
edition = "2024"
authors = ["Pie Team"]
description = "Pie Client"
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]

[dependencies]
anyhow = "1.0.104"
# Floor: the client/server `message` vocabulary lives in pie-client-api (the
# client-facing interface crate) so the floor-resident `edge` frames can embed
# it; this crate re-exports it. Edge points downward (pie-client -> pie-client-api).
client-api = { path = "../client-api" }
rmp-serde = "1.3.1"
num-traits = "0.2.19"
bytes = "1.12.1"
blake3 = "1.8.5"
dashmap = "6.2.1"
tokio = { version = "1.53.1", features = ["full"] } # ["full", "tracing"]
tokio-tungstenite = "0.30.0"
futures = "0.3.33"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
ring = "0.17"
rsa = { version = "0.9", default-features = false, features = ["pem", "sha2"] }
ssh-key = { version = "0.6", features = ["rsa", "ed25519", "ecdsa"] }
pem = "3.0"
p256 = { version = "0.14", features = ["pkcs8"] }
p384 = { version = "0.14", features = ["pkcs8"] }
base64 = "0.22"
regex = "1"
