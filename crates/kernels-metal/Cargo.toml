[package]
name = "kernels-metal"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Pure Metal kernel definitions: shader entry names, argument marshalling, and dispatch geometry. Knows nothing about the IR; an engine Run resolves plan ids to handles and calls these entry functions."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "kernels_metal"
path = "src/lib.rs"

[dependencies]
# The whole floor: one enum, serde and nothing under it. Not `model-ir` — a
# crate that knows no IR must not carry its op enums, validator and `Trace` in
# reach for the sake of one `Dtype`.
dtype = { path = "../dtype" }
