[package]
name = "kernels-metal"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Pure Metal kernel definitions: shader entry names, argument marshalling, and dispatch geometry. Knows nothing about the IR; an engine Run resolves plan ids to handles and calls these entry functions."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "kernels_metal"
path = "src/lib.rs"

[dependencies]
# `KernelError` — the shared answer vocabulary every kernel entry returns
# (design §8: `Unsupported`/`DtypeUnsupported` exist exactly for these fns).
kernels = { path = "../kernels" }
# `Dtype` only. kernels does not re-export it, so this edge is named
# directly — it adds a name, not a dependency: kernels already carries
# model-ir into the tree. Nothing else of the IR is spoken here.
model-ir = { path = "../model-ir" }
