[package]
name = "kernels-metal"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Pure Metal kernel definitions: shader entry names, argument marshalling, and dispatch geometry. Knows nothing about the IR; an engine Run resolves plan ids to handles and calls these entry functions."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "kernels_metal"
path = "src/lib.rs"

[dependencies]
# TWO LINES STOOD HERE AND ONE REPLACES THEM. `kernels` carried `KernelError`,
# the answer vocabulary every entry function returns; `model-ir` was named for
# the single word `Dtype`, which it re-exports from the `dtype` leaf, and the
# comment on that line said it added "a name, not a dependency" precisely
# because `kernels` had already dragged the whole IR in behind it.
#
# `kernels` is gone -- its dispatch traits went to `model-exec`, beside the one
# walk that calls them, and the error is `src/error.rs` here, an `Error` of
# this crate's own named for the crate that owns it rather than for the
# contract it used to be. With nothing else pulling `model-ir` in, the `Dtype`
# line could stop going the long way round. `engine-metal` translates this
# crate's `Error` at five points -- one per `Dispatch*` impl that calls in
# here, the CustomCuda one being a refusal that never does -- in a total match
# that cannot go stale in silence.
#
# So this is the whole floor: one enum, serde and nothing else under it. No op
# enums, no validator, no `Trace` in reach of a crate that knows no IR.
dtype = { path = "../dtype" }
