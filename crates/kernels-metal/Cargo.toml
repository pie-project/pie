[package]
name = "kernels-metal"
version = "0.4.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "Metal kernel implementations (.metal shaders + PSO construction) and the signature table that declares them."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

# The shader directory, published as DEP_PIE_KERNELS_METAL_KERNELS_DIR and
# baked in as the runtime shader path. There was a second key, DEP_..._INCLUDE,
# for a host C++ header library; it went with the C++ driver that was its only
# reader. The `*_params.h` it also covered are inside the shader tree, where
# the `.metal` files that `#include` them can reach them.
links = "pie_kernels_metal"
build = "build.rs"

[lib]
name = "kernels_metal"
path = "src/lib.rs"

[features]
# `native` means something quieter here than on the CUDA side, because Metal
# compiles its shaders at RUN time: there is no build to gate, only the
# staging of `ptir_rng.generated.metal` out of `tensor-compiler`. Off by
# default for the same reason regardless -- `model-ir` takes the
# signature table and should reach nothing else.
default = []
native = []

[dependencies]
# `linkme` AND `inventory` STOOD HERE, and they were the routine registry: a
# `distributed_slice` of `Routine<Metal>` filled by 99 `#[routine]` fns. The
# launches are `#[claims]` methods now, and the two `canon` rows that
# outlived them are `CANON`, four lines in `src/lib.rs`.
#
# `#[claims]`, which states the points this plane answers beside the impl
# that answers them.
kernels-macros = { path = "../kernels-macros" }
kernels = { path = "../kernels" }

[dev-dependencies]
# The table test resolves through `sig_in`, which is the shared crate's, to
# check the lookup `model-ir` actually calls rather than a copy of it.
kernels = { path = "../kernels" }

# NO `[[example]]` sections, and the absence is load-bearing for the reason
# `kernels-cuda/Cargo.toml` states at length: a `[[example]]` whose file is
# gone does not make a skipped target, it makes a manifest cargo cannot PARSE,
# and this crate is a workspace member, so every command in the workspace fails
# with it. `examples/` is deleted here -- `entrypoints.rs` printed the table's
# entrypoint product for `scripts/metal-kernel-audit.py --table`, and that mode
# is retired with it -- so there is no file for such a section to name.
