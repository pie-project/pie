name: cache
description: A build cache main writes and every other ref only reads, so a pull request costs no cache storage of its own.

inputs:
  path:
    description: The paths to cache, one per line.
    required: true
  key:
    description: The cache key.
    required: true
  restore-keys:
    description: Prefixes to fall back to, one per line.
    default: ''

runs:
  using: composite
  steps:
    - if: github.ref == 'refs/heads/main'
      uses: actions/cache@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
    - if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
