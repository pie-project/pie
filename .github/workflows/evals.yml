name: evals

on:
  push:
    branches: [main]

permissions: {}

jobs:
  dispatch:
    name: "evals: send to pie-evals"
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.PIE_EVALS_DISPATCH_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::warning::PIE_EVALS_DISPATCH_TOKEN is not set"; exit 0; }
          gh api repos/pie-project/pie-evals/dispatches -f event_type=pie-eval -f "client_payload[pie_commit]=$GITHUB_SHA"
