name: Release npm Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release'
        required: true
        type: choice
        options:
          - pie-client (client/javascript/)
          - inferlet (sdk/javascript/)
      dry_run:
        description: 'Dry run (build but do not publish)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Determine package path
        id: info
        run: |
          case "${{ inputs.package }}" in
            "pie-client (client/javascript/)")
              echo "path=client/javascript" >> $GITHUB_OUTPUT
              ;;
            "inferlet (sdk/javascript/)")
              echo "path=sdk/javascript" >> $GITHUB_OUTPUT
              ;;
          esac
      
      # The generated bindings under src/bindings are not checked by
      # `npm run build`, so an interface the runtime no longer offers would
      # publish silently. This needs no toolchain and is what would have caught
      # the actual drift; it also refuses to pass while the SDK reaches no
      # forward-pass surface at all, which is the state today. See
      # forward_refactor.md 10.4.
      - name: Check SDK targets a live WIT surface
        if: steps.info.outputs.path == 'sdk/javascript'
        run: scripts/check-sdk-interfaces.sh

      - name: Install dependencies
        working-directory: ${{ steps.info.outputs.path }}
        run: npm ci

      # Regenerate and diff, rather than trusting what is checked in. The
      # committed bindings are an artifact of whatever world they were last
      # generated from, and `tsc` is happy to typecheck against a stale one --
      # every specifier still resolves, just to the wrong shapes. This is the
      # step that makes the build below mean something.
      - name: Bindings are current with interface/inferlet
        if: steps.info.outputs.path == 'sdk/javascript'
        working-directory: ${{ steps.info.outputs.path }}
        run: |
          npm run generate-bindings
          git diff --exit-code -- src/bindings tsconfig.json

      - name: Build
        working-directory: ${{ steps.info.outputs.path }}
        run: npm run build --if-present

      - name: Test
        if: steps.info.outputs.path == 'client/javascript' || steps.info.outputs.path == 'sdk/javascript'
        working-directory: ${{ steps.info.outputs.path }}
        run: npm test

      - name: Dry run - publish
        if: inputs.dry_run == true
        working-directory: ${{ steps.info.outputs.path }}
        run: |
          set +e
          npm publish --dry-run --access public 2>&1 | tee "$RUNNER_TEMP/npm-publish-dry-run.log"
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ] && ! grep -q "previously published versions" "$RUNNER_TEMP/npm-publish-dry-run.log"; then
            exit "$status"
          fi
      
      - name: Publish to npm
        if: inputs.dry_run == false
        working-directory: ${{ steps.info.outputs.path }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
