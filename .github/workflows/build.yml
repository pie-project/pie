name: Publish Nightly

# Rewrites the rolling pre-release: every asset is uploaded with --clobber,
# so download URLs stay stable. `targets` filters the binary matrix by label
# substring (`cuda`, `macos`, `x86_64-linux-vulkan`, ...).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update
        type: string
        default: nightly
      targets:
        description: Binary targets to build (comma-separated label substrings; `all`; `none`)
        type: string
        default: all
      languages:
        description: Build pie-language-python.tar.gz and pie-language-javascript.tar.gz
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  plan:
    name: "release: plan"
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/release.sh ensure "${{ inputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        shell: python
        run: |
          import json, os
          # Linux CUDA builds in the manylinux_2_28 container (glibc 2.28 floor);
          # device code is NVRTC-compiled at run time, so one build per
          # architecture serves every compute capability.
          cuda = "nvidia/cuda:13.0.0-devel-rockylinux8"
          rows = [
            dict(label="aarch64-macos-metal",    runner="macos-15",           triple="aarch64-apple-darwin",       features="metal"),
            dict(label="aarch64-macos-wgpu",     runner="macos-15",           triple="aarch64-apple-darwin",       features="wgpu"),
            dict(label="x86_64-windows-cuda",    runner="windows-large-x64",  triple="x86_64-pc-windows-msvc",     features="cuda"),
            dict(label="x86_64-windows-vulkan",  runner="windows-latest",     triple="x86_64-pc-windows-msvc",     features="vulkan"),
            dict(label="x86_64-linux-vulkan",    runner="ubuntu-latest",      triple="x86_64-unknown-linux-gnu",   features="vulkan"),
            dict(label="x86_64-linux-wgpu",      runner="ubuntu-latest",      triple="x86_64-unknown-linux-gnu",   features="wgpu"),
            dict(label="aarch64-linux-vulkan",   runner="ubuntu-large-arm64", triple="aarch64-unknown-linux-gnu",  features="vulkan"),
            dict(label="x86_64-linux-cuda13.0",  runner="ubuntu-large-x64",   triple="x86_64-unknown-linux-gnu",   features="cuda", container=cuda),
            dict(label="aarch64-linux-cuda13.0", runner="ubuntu-large-arm64", triple="aarch64-unknown-linux-gnu",  features="cuda", container=cuda),
          ]
          want = [w.strip() for w in "${{ inputs.targets }}".split(",") if w.strip()]
          if want == ["all"]:
              chosen = rows
          elif want == ["none"]:
              chosen = []
          else:
              chosen = [r for r in rows if any(w in r["label"] for w in want)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"targets={json.dumps(chosen)}\n")

  binaries:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    name: "pie: ${{ matrix.target.label }}"
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ${{ matrix.target.runner }}
    container: ${{ matrix.target.container }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          triple: ${{ matrix.target.triple }}
          features: ${{ matrix.target.features }}
          manylinux: ${{ matrix.target.container && 'true' || 'false' }}
          cache-key: build-${{ matrix.target.label }}
      - shell: bash
        run: cargo build --profile release-min --target ${{ matrix.target.triple }} -p pie --features ${{ matrix.target.features }}
      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bin="${CARGO_TARGET_DIR:-target}/${{ matrix.target.triple }}/release-min"
          if [[ "$RUNNER_OS" == Windows ]]; then
            asset="pie-${{ matrix.target.label }}.zip"; 7z a "$asset" "$bin/pie.exe"
          else
            asset="pie-${{ matrix.target.label }}.tar.gz"; tar -C "$bin" -czf "$asset" pie
          fi
          ls -la "$asset"
          bash scripts/ci/release.sh upload "${{ inputs.tag }}" "$asset"

  # Pure wasm: one asset per language serves every platform. install.sh
  # extracts them into PIE_HOME; the built-in inferlets need none, being
  # in the binary.
  languages:
    name: "languages: assets"
    needs: plan
    if: inputs.languages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install componentize-py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: bash scripts/build-languages.sh target/languages
      - run: bash scripts/ci/release.sh upload "${{ inputs.tag }}" target/languages/pie-language-python.tar.gz target/languages/pie-language-javascript.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The installers against what was just uploaded.
  install:
    name: "install: ${{ matrix.os }}"
    needs: [binaries, languages]
    if: always() && !cancelled() && needs.binaries.result == 'success' && needs.languages.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          PIE_VERSION="${{ inputs.tag }}" PIE_FLAVOR="${{ runner.os == 'macOS' && 'metal' || 'wgpu' }}" bash scripts/install.sh
          export PATH="$HOME/.local/bin:$PATH"
          pie --version && pie doctor || true
          pie language list
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PIE_VERSION = "${{ inputs.tag }}"; $env:PIE_FLAVOR = "vulkan"
          ./scripts/install.ps1
          $env:PATH = "$env:LOCALAPPDATA\Pie\bin;$env:PATH"
          pie --version
          pie language list

  notes:
    name: "release: notes"
    needs: [binaries, languages, install]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/release.sh ensure "${{ inputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
