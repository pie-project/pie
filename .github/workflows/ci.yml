name: CI

# Toolchain note: the `dtolnay/rust-toolchain@<rev>` steps below only decide
# what the action downloads. `rust-toolchain.toml` at the repo root is what
# cargo actually resolves to (1.97.1), and rustup auto-installs it — with the
# components and targets that file declares — on the first cargo invocation.

on:
  push:
    branches: [main]
  pull_request:
  # So a long-lived branch can be built on demand rather than finding out what
  # CI thinks at merge time. A dispatch trigger is only selectable once this
  # file is on the default branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-check:
    name: cargo check / test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Cheap structural check on the composition root and the client edge.
      # `pie --no-default-features` is the build with no engine behind it.
      - name: cargo check (pie, client)
        run: |
          cargo check -p pie
          cargo check -p pie --no-default-features
          cargo check -p client

      - name: cargo test (pie, client)
        run: |
          cargo test -p pie --lib
          cargo test -p client --lib

      # `eta-ir` and `eta-dsl` declare `#![no_std]` behind `not(feature =
      # "std")`, and a declared `no_std` that is never compiled is not a
      # `no_std` crate: the `std` prelude once covered a missing
      # `alloc::string::String` import here for months.
      - name: cargo check (compiler IR core, no_std)
        run: |
          cargo check -p eta-ir --no-default-features
          cargo check -p eta-dsl --no-default-features

      # `models` declares no features at all, so there is one configuration
      # and this is it. `--all-targets` because a test is where a gate comes
      # apart first.
      - name: cargo check (models)
        run: cargo check -p models --all-targets

      # These crates are at zero clippy warnings, so they are the only part of
      # the workspace that can be gated; the rest still carries warnings.
      # Widen the `-p` list as crates are cleaned rather than switching to
      # `--workspace` and reaching for `-A` to hold it up.
      #
      # `--no-deps` matters: cargo drives clippy through
      # RUSTC_WORKSPACE_WRAPPER, which lints every *path* dependency that gets
      # built, not just the selected packages.
      #
      # `--all-targets` compiles the `#[cfg(test)]` modules, which `cargo
      # check` and a bare `cargo clippy` do not — a test that does not compile
      # is a check that is not running.
      #
      # `kernels-cuda` is here at its default features: the row table and the
      # planners are pure Rust and lint on a runner with no CUDA and no nvcc.
      # Only its `cuda` half reaches a device binding, and nothing here turns
      # that on. `engine-metal`'s Apple half is likewise not reached from this
      # runner; `workspace-verify` cross-checks it for `aarch64-apple-darwin`.
      - name: cargo clippy (deny warnings)
        run: |
          cargo clippy --no-deps --all-targets \
            -p eta-ir -p eta-compiler -p eta-dsl \
            -p checkpoint -p model-compiler \
            -p worker-api -p client-api -p controller-api \
            -p ids -p waker -p transport \
            -p bootstrap -p client -p controller -p engine \
            -p model-exec -p eta-exec \
            -p runtime -p gateway -p grammar -p inferlet \
            -p inferlet-macros -p pie -p tokenizer -p worker \
            -p kernels-metal -p kernels-cuda -p kernels-vulkan -p kernels-wgpu \
            -p engine-metal -p engine-vulkan -p engine-wgpu \
            -p model-dsl -p model-ir \
            -- -D warnings

      # `models` runs as its own command, which is also how
      # `scripts/ci-gate-audit.py` reads it: the crate declares no features,
      # so this is its one configuration and there is nothing to widen it to.
      - name: cargo clippy (model, deny warnings)
        run: cargo clippy --no-deps --all-targets -p models -- -D warnings

      # Same scope, same reason: these crates are rustfmt-clean, the rest of
      # the workspace is not. rustfmt parses and never type-checks, so it
      # gives the same answer on any host — which is why crates whose clippy
      # needs a Mac or a device can still be fmt-gated here.
      - name: cargo fmt (compiler crates)
        run: |
          cargo fmt --check \
            -p eta-ir -p eta-compiler -p eta-dsl \
            -p checkpoint -p models -p model-compiler \
            -p worker-api -p client-api -p controller-api \
            -p ids -p waker -p transport \
            -p runtime -p worker \
            -p bootstrap -p client -p controller -p engine \
            -p model-exec -p eta-exec \
            -p gateway -p grammar -p inferlet \
            -p inferlet-macros -p kernels-metal -p kernels-vulkan -p kernels-wgpu \
            -p pie -p pie-server-py -p tokenizer \
            -p engine-metal -p engine-vulkan -p engine-wgpu \
            -p model-dsl -p model-ir

  # Full-workspace verification — the guardrail + anti-bitrot net. The
  # dedicated jobs only build a curated subset, so new crates and the benches
  # would be compiled by nothing. This job compiles EVERY target and runs the
  # workspace test set.
  #
  #   --exclude pie-server-py : links engine-cuda (needs a CUDA feature).
  #   --exclude engine-cuda   : no default engine feature; built explicitly
  #                             below, once per configuration.
  #   --exclude worker (test step): worker's binary-facing tests need an
  #     engine feature and are exercised by the dedicated jobs. Its *library*
  #     tests are pure Rust and ARE run here explicitly.
  workspace-verify:
    name: workspace verify (all crates + all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache python3-yaml

      # `aarch64-apple-darwin` is here for `engine-metal`'s Apple half and
      # needs no Apple machine: `cargo clippy` type-checks and does not link,
      # so the target's prebuilt `rust-std` is the whole requirement. See the
      # step at the bottom of this job.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2, aarch64-apple-darwin

      - name: Cache cargo + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/ccache
            target
          key: ${{ runner.os }}-workspace-verify-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-workspace-verify-

      # Compile every target — benches and the not-yet-consumed data-plane
      # crate `transport` included — so they cannot silently bitrot.
      - name: cargo build (workspace, all targets)
        run: |
          cargo build --workspace --all-targets \
            --exclude pie-server-py --exclude engine-cuda

      # Run the workspace test set (benches are compiled above, not executed).
      # `cargo check --workspace` DOES NOT BUILD TEST TARGETS, so a `tests/*.rs`
      # that stopped compiling stays green everywhere else; this step is what
      # says so.
      - name: cargo test (workspace + worker lib)
        run: |
          cargo test --workspace \
            --exclude pie-server-py --exclude worker --exclude engine-cuda
          cargo test -p worker --lib

      # The catalog sweeps, which the step above does not run: sixteen
      # `model-compiler` tests bake every SKU on every platform, and one
      # re-bakes each text once per permutation of its fact bits. Minutes
      # rather than seconds, and exhaustive on purpose — so they run here,
      # where minutes are affordable, rather than being weakened to fit
      # somewhere they are not.
      - name: cargo test (model-compiler catalog sweeps)
        run: cargo test -p model-compiler -- --ignored

      # A file no `mod` declares is INVISIBLE, not dead: rustc never reads it,
      # clippy does not lint it, no test covers it, and nothing reports it.
      # Dead code the compiler CAN see is already a warning; this is the other
      # half.
      - name: module reachability audit
        run: python3 scripts/mod-reachability-audit.py

      # The `-p` lists above are a CLAIM about the workspace. A crate that is
      # merely absent from one is indistinguishable, in CI's output, from a
      # crate that passes.
      - name: gate coverage audit
        run: python3 scripts/ci-gate-audit.py

      # The audit above asks whether the gate lists are COMPLETE. This one
      # asks whether they RESOLVE: a `-p` naming a crate cargo cannot see is
      # not a narrower gate, it is a hard error that kills the step and every
      # step under it, and the same is true of a `--features` naming a feature
      # no manifest declares and a `--test` naming a target that is not in the
      # tree. It reads both workflows, resolves `${{ matrix.… }}` against each
      # job's own matrix, and needs `python3-yaml` — installed at the top of
      # this job rather than by `pip`.
      - name: workflow reference audit
        run: python3 scripts/workflow-ref-audit.py

      # A `#[cfg(feature = "x")]` whose `x` no package declares is not an
      # error — it is a condition that is always false, so the code under it
      # compiles nowhere while reading as code that is merely off. This audit
      # needs no compiler and no GPU, so it also covers the crates the gates
      # cannot build here — which are exactly the crates that have optional
      # backends to `cfg` on.
      - name: cfg feature audit
        run: python3 scripts/cfg-feature-audit.py

      # THE HALF OF `engine-metal` NO LINUX BUILD COMPILES. The crate's device
      # modules are behind `cfg(target_vendor = "apple")`, so every step above
      # type-checks its portable half and none of them sees the other one.
      #
      # CHECK-ONLY, AND ON THIS RUNNER: clippy does not link, so
      # `--target aarch64-apple-darwin` needs that target's `rust-std` and
      # nothing else — no Xcode, no SDK, no Mac. `--all-targets` is the point
      # of it: a device test target can stop compiling while the library still
      # builds. It runs nothing; the `device_*` targets are compiled here and
      # executed nowhere.
      - name: engine-metal, Apple half (type-check only, no device)
        run: |
          cargo clippy --no-deps -p engine-metal \
            --target aarch64-apple-darwin --all-targets -- -D warnings

      # engine-cuda is excluded from the two sweeps above because it has no
      # default engine feature. That is deliberate: the CUDA runtime API is
      # not ABI-stable across major versions (`cudaGraphAddNode` takes five
      # arguments in libcudart.so.12 and six in .so.13), and since this crate
      # resolves symbols by name at run time, a wrong guess is a segfault
      # inside the driver rather than a build error. So it is built here
      # explicitly instead.
      #
      # No CUDA toolkit and no GPU are needed: cudarc is pinned to a named
      # version with fallback dynamic loading, so nothing is linked, and the
      # GPU tests are `#[ignore]`d. What runs is the host logic the crate is
      # mostly made of.
      - name: cargo test (engine-cuda, the CUDA ABI this repo ships)
        run: cargo test -p engine-cuda --features cuda

      # The half of engine-cuda that is correct without a GPU. This is the
      # only step that compiles the other side of the `_cuda` cfg, and without
      # it the gate drifts back to a subsystem boundary — which is how three
      # geometry modules sat parity-tested with zero callers for months. Cut
      # by "is this correct without a GPU?", not by subsystem.
      - name: cargo test (engine-cuda, portable half, no engine feature)
        run: cargo test -p engine-cuda

      # Python over the published kernel headers; needs no CUDA. It is RED
      # today, on purpose: the host C++ tree it reads was deleted rather than
      # moved, and the crate that took its name compiles device text at run
      # time and launches it by name from Rust, so there is no host
      # declaration left to scan. Its own header forbids repointing the glob —
      # that would swap an honest failure for a silent pass — and its refusal
      # carries the measurement a redesign needs. Read
      # `scripts/kernel-vocabulary-audit.py` before touching this.
      #
      # LAST IN THE JOB because a failed step ends the job: a deliberately red
      # step in the middle costs every check after it.
      - name: kernel vocabulary audit
        run: python3 scripts/kernel-vocabulary-audit.py

  metal-kernel-boundary:
    name: metal kernel boundary (kernels-metal reaches nothing above it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # `kernels-metal` depends on nothing above it, and nothing in its shader
      # tree is host C++. Both halves are one walk: a `#include` of a driver
      # header, or a mention of a driver TYPE, is the arrow turning around.
      # A header no shader includes is host C++ sitting in the runtime search
      # path. `--one-way` is a directory walk and needs no cargo.
      - name: Check kernels-metal reaches nothing above it
        run: python3 scripts/metal-kernel-audit.py --one-way

  # Guest bitrot — `tests/inferlets` is its own cargo workspace (excluded from
  # the root manifest on purpose, as a fixture of a published guest contract),
  # so `cargo build --workspace` never touches it and an SDK change that
  # breaks every guest still goes green. That is not hypothetical: nine
  # commits of SDK work silently broke 13 of 37 guest crates before anyone
  # built them (c82e06bba). These are the SDK's only consumers; if they do not
  # compile, the SDK's public surface is whatever the last refactor happened
  # to leave behind.
  guest-inferlets:
    name: guest inferlets (wasm32-wasip2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tests/inferlets/target
          key: ${{ runner.os }}-guest-inferlets-${{ hashFiles('tests/inferlets/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-guest-inferlets-

      # Warnings are denied: an unused import or a stale `mut` in a guest is
      # usually the visible end of an SDK surface that moved.
      - name: cargo check (tests/inferlets)
        run: cargo check --target wasm32-wasip2 --manifest-path tests/inferlets/Cargo.toml
        env:
          RUSTFLAGS: -D warnings

  # WIT drift — the canonical inferlet interface (crates/inferlet/wit) is
  # vendored into ONE remaining copy, bakery's
  # (sdk/inferlet/tools/bakery/src/bakery/wit), which is a Python package and
  # so cannot reach the WIT through a cargo dependency. The Rust guest needs
  # no copy: `inferlet` owns the WIT and runs `wit_bindgen::generate!` over it
  # in the same package. Manual editing of both has regressed twice (commit
  # 94043eb1). scripts/sync-wit.sh regenerates the copy from source; this job
  # fails if a PR edited the interface without re-syncing.
  wit-drift:
    name: wit drift (sync-wit.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install wit-deps
        run: cargo install --locked wit-deps-cli

      - name: Regenerate vendored WIT copies
        run: ./scripts/sync-wit.sh

      - name: Fail if the vendored WIT copy is stale
        run: |
          if ! git diff --exit-code -- sdk/inferlet/tools/bakery/src/bakery/wit; then
            echo "::error::The vendored WIT copy is out of sync with crates/inferlet/wit."
            echo "Regenerate with: ./scripts/sync-wit.sh   (then commit)"
            exit 1
          fi

  # NO engine feature — pure Rust, builds on every OS we support. Cheapest
  # gate for "did the standalone wiring break end to end". Runs the full unit
  # suite too, since without an engine feature nothing pulls in a device
  # toolchain.
  pie-worker-no-engine:
    name: pie-worker (no engine feature)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pie-worker-no-engine-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo build (no engine feature)
        run: |
          cargo build -p worker --no-default-features

      - name: cargo test (worker, no engine feature)
        run: |
          cargo test -p worker --no-default-features

      # The `pie` command is the root package's own binary; `worker` is a
      # library with no `[[bin]]`, so building the worker alone never covered
      # the composition root.
      - name: cargo build (pie binary, no engine feature)
        run: |
          cargo build -p pie --no-default-features

  pie-worker-cuda:
    name: pie-worker (engine-cuda)
    runs-on: [self-hosted, cuda]
    if: contains(github.event.pull_request.labels.*.name, 'ci-cuda')
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # A TEST TARGET IS A CONFIGURATION NOBODY BUILT: `cargo check` does not
      # build test targets, so a `tests/*.rs` that stopped compiling stays
      # green everywhere. `cargo test --no-run` rather than `cargo build
      # --all-targets` — they compile the same set, and the first says what
      # the compile is FOR.
      - name: cargo build (engine-cuda, every target)
        run: |
          cargo test -p engine-cuda --features cuda --no-run --all-targets

      # AND NOW IT RUNS THEM, which the step above does not.
      #
      # The `engine-cuda` test binaries that need a CUDA device and a local
      # model snapshot are `#[ignore]`d, so that a developer's `cargo test` is
      # seconds rather than the 31 minutes they used to cost. This is the one
      # box in the fleet with a GPU, and this step is where they run: the gate
      # did not weaken, it moved to the hardware, and a step that names it can
      # be seen to be red.
      - name: cargo test (engine-cuda, the real-hardware gates)
        run: cargo test -p engine-cuda --features cuda -- --ignored

      # `-p pie`, not `-p worker`: the root package carries the `[[bin]]`, and
      # the linkage check below reads that binary.
      - name: cargo build (pie, cuda)
        run: |
          cargo build -p pie --features cuda

      - name: Verify no CUDA shared deps
        run: |
          ldd target/debug/pie
          ldd target/debug/pie | grep -E "libcudart|libcublas|libcublasLt" \
            && { echo "FAIL: CUDA shared lib leaked into binary"; exit 1; } \
            || echo "OK: no CUDA shared deps"
