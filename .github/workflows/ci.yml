name: CI

# Toolchain note: the `dtolnay/rust-toolchain@<rev>` steps below only decide
# what the action downloads. `rust-toolchain.toml` at the repo root is what
# cargo actually resolves to (1.97.1), and rustup auto-installs it — with the
# components and targets that file declares — on the first cargo invocation.

on:
  push:
    branches: [main]
  pull_request:
  # Long-lived rewrite branches are neither. `rewrite` has carried months
  # of work -- a whole Metal driver, a kernel table, a catalog refactor --
  # without one commit on it ever being built by this file, and the branch
  # found out what CI thought only at merge time. That is how four cargo
  # commands here ended up naming a `--features forward` the same branch
  # had deleted: the step was a hard error, and no machine ever reached it.
  #
  # This does not put every push to those branches on the runners, which
  # would make someone else's in-flight work red for reasons that are not
  # theirs. It asks for the branch to be RUNNABLE on demand, by whoever
  # wants the answer before the merge rather than after it.
  #
  # Whether that works from here is NOT established. GitHub's own docs say
  # a `workflow_dispatch` workflow must be present on the DEFAULT branch to
  # be dispatchable, and `main`'s copy of this file does not have this
  # trigger; reports differ on whether selecting a non-default branch works
  # anyway. So this line is either already live or arrives the moment the
  # file reaches `main`, and nobody here can tell which without a token.
  # It is written down rather than tested because the untested half is
  # harmless: worst case it is inert, and it is inert TODAY.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-check:
    name: cargo check / test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Cheap structural check: every workspace member compiles. Skips
      # the cmake-driven C++ build by checking worker with
      # `--no-default-features` (the default features pull in ggml).
      - name: cargo check (runtime, client, no-driver worker)
        run: |
          cargo check -p pie
          cargo check -p pie --no-default-features
          cargo check -p client

      - name: cargo test (runtime, client)
        run: |
          cargo test -p pie --lib
          cargo test -p client --lib

      # `tensor-ir` and `tensor-compiler` declare `#![no_std]` behind `not(feature =
      # "std")` and the wasm SDK depends on them that way, but nothing ever
      # built that configuration -- the `std` prelude was covering a missing
      # `alloc::string::String` import, so `--no-default-features` had been
      # broken without failing anything. A declared `no_std` that is never
      # compiled is not a `no_std` crate.
      - name: cargo check (compiler IR core, no_std)
        run: |
          cargo check -p tensor-ir --no-default-features
          cargo check -p tensor-compiler --no-default-features

      # Same defect, one crate over. `model` declares ONE FEATURE PER ASPECT
      # -- a driver links `contract` without a chat template, an authoring
      # pass links it without the tracer -- and that is a claim about what
      # links alone, so it is only true if something builds it that way.
      #
      # Nothing did, and it had not been true for the length of the catalog
      # refactor: `RowScalars` kept a `forward` gate after `deployment`
      # (ungated, and on the ungated part of `Variant`) started reading it,
      # so `--features contract` did not compile AT ALL -- sixteen
      # unresolved names. `cargo test -p model`, the plainest command in the
      # crate, was among the things that did not run. It went unseen because
      # every consumer pulls `forward` transitively and feature unification
      # handed one to every build that asked.
      #
      # `--all-targets` because a test is where the gates come apart first:
      # a `chat`-only vision table named from an ungated test is the same
      # defect one layer down, and was also present.
      #
      # `forward` is GONE -- the aspect that "will need the DSL" was
      # deleted along with the code behind it -- and the two lines naming
      # it stayed here afterwards, so this step began with
      # `the package 'model' does not contain this feature` and checked
      # NOTHING. It went unseen for the same reason as everything above:
      # this workflow fires on `main` and on pull requests, and the branch
      # the deletion happened on is neither. The aspects are now `chat` and
      # `contract`, and the last line is the pair, which is what
      # `contract,forward` was there to be.
      - name: cargo check (model, one aspect at a time)
        run: |
          cargo check -p model --no-default-features --all-targets
          cargo check -p model --no-default-features --all-targets --features chat
          cargo check -p model --no-default-features --all-targets --features contract
          cargo check -p model --no-default-features --all-targets --features chat,contract

      # The compiler crates are at zero clippy warnings, so they are the only
      # part of the workspace that can be gated. The rest still carries ~240
      # warnings (167 in crates/engine alone); widen the `-p` list as crates
      # are cleaned rather than switching this to `--workspace` and reaching
      # for `-A` to hold it up.
      #
      # Four of these were already clean and gated by nothing, which is the
      # worse half of a partial gate: `worker-api`, `ids`, `client-api` and
      # `controller-api` cost nothing to add and had nothing holding them
      # there. `model-compiler`, `waker` and `transport` were between one and
      # twelve findings away.
      #
      # The list named `tensor-compiler` four times until now. Six crates were
      # merged into three by a rename (`pie-ir`/`pie-plan`/`pie-eval`/
      # `pie-codegen`/`pie-dsl`/`pie-compiler-tests`), and the rename rewrote
      # each `-p` in place, so the repeats were the merge's shadow rather than
      # anything cargo needed. Checked against the workspace members before
      # deduplicating: no crate had fallen out of the gate by losing its name.
      #
      # `--no-deps` matters: cargo drives clippy through
      # RUSTC_WORKSPACE_WRAPPER, which lints every *path* dependency that gets
      # built, not just the selected packages. Without it this step fails on
      # the driver crate's 13 warnings, which are not the compiler's to fix.
      # `kernels-metal` and `kernels-vulkan` joined for a reason worth writing
      # down: `b45970b5e` gave `kernels-metal`'s signatures typed handles and
      # updated the bodies but not `ssm.rs`'s own `#[cfg(test)]` module, so
      # `cargo test -p kernels-metal` did not BUILD for a day -- sixteen
      # `arguments to this function are incorrect` -- and nothing in this file
      # said so. A test that does not compile is a check that is not running,
      # and it is the quietest kind of gap there is.
      #
      # `kernels-cuda` is the third, and it is the one that looked impossible.
      # It has NO build script, no `links` key, and `cudarc` behind
      # `dep:cudarc` -- so its default feature set is the row table and the
      # planners, which are pure Rust and lint on a runner with no CUDA and no
      # nvcc. Only `_cuda` reaches a device binding, and nothing in this `-p`
      # list turns it on. The twelve findings that had to go first were
      # mechanical but not all of them: two `if` chains are the archive's own
      # duplicated arms (`prefill.cuh`'s `get_num_warps_q` and `get_num_mma_q`
      # both special-case `cta_tile_q == 32` for `HEAD_DIM_VO >= 512`), so
      # they carry an `#[allow]` and the archive's comment rather than a fold
      # that would stop matching the C++. Its `_cuda` half is NOT gated here
      # and still carries 32 `not_unsafe_ptr_arg_deref`, which is a signature
      # decision across the whole crate and not a lint fix.
      #
      # `--all-targets` is what closes it: it compiles the `#[cfg(test)]`
      # modules, which `cargo check` and a bare `cargo clippy` do not. Both
      # crates are Rust plus a shader tree and both compile and lint clean on
      # a Linux host with no device -- checked before adding them, because a
      # gate that cannot run is worse than none.
      #
      # The rustfmt step below has listed both for a while, which is why the
      # gap was easy to miss: they WERE gated, by the check that reads the
      # source without compiling it.
      #
      # Their two drivers cannot join, and the reasons are worth having:
      # `driver-vulkan` makes `kernels-vulkan`'s build script emit SPIR-V,
      # which needs `slangc` on the runner; `driver-metal` has a real
      # `type_complexity` error in its lib and a macOS-only device half. Both
      # remain uncovered here.
      - name: cargo clippy (deny warnings)
        run: |
          cargo clippy --no-deps --all-targets \
            -p tensor-ir -p tensor-compiler -p tensor-dsl \
            -p model-loader -p model-compiler \
            -p worker-api -p client-api -p controller-api \
            -p ids -p waker -p transport \
            -p bootstrap -p client -p controller -p driver -p driver-api \
            -p engine -p gateway -p grammar -p inferlet \
            -p inferlet-macros -p kernels -p pie -p tokenizer -p worker \
            -p driver-wgpu -p kernels-wgpu \
            -p kernels-metal -p kernels-vulkan -p kernels-cuda \
            -p model-dsl -p model-ir \
            -- -D warnings

      # The WebGPU pair's second half. Both halves of `driver-wgpu` compile on
      # any host -- `naga` is Rust and `wgpu`'s device calls are behind
      # `native` -- so unlike `driver-metal` this needs no second RUNNER, only
      # a second invocation. The step above lints the portable half; without
      # this one, `envelope`, `frames`, `serve`, `shell` and `turns` are gated
      # out of the build that lints and nothing covers them.
      - name: cargo clippy (driver-wgpu, device half)
        run: |
          cargo clippy --no-deps --all-targets -p driver-wgpu --features native \
            -- -D warnings

      # `model` runs as its own command because it needs `--all-features`.
      # Its default feature set is `chat` alone, so gating it alongside the
      # crates above would leave every `contract` and `forward` item — which
      # is most of the crate — unlinted. The step above this one already
      # compiles each aspect separately; this one lints all of them at once.
      - name: cargo clippy (model, deny warnings)
        run: cargo clippy --no-deps --all-targets -p model --all-features -- -D warnings

      # Same scope, same reason: these crates are rustfmt-clean, the rest of
      # the workspace is not.
      #
      # `model-loader` joined the list because it is what a formatter gate is
      # FOR. Four doc comments in `executor/host.rs` had come apart — one
      # function's documentation sitting on another, a `///    ///` doubled
      # prefix, a body on its signature line — and each was one `cargo fmt`
      # away from visible for however long it stood.
      #
      # `model` joined for the same reason and proved it on the way in: three
      # files had drifted — a call folded onto one over-long line, a struct
      # literal written flat — and each had been committed by someone who
      # believed the crate was clean. Checking a `mod.rs` recurses into its
      # submodules, so a per-file check had reported a parent's name for a
      # child's drift, and the drift read as noise.
      #
      # `driver-metal` is here and not on the macOS job on purpose. Its CLIPPY
      # runs there, because a lint can depend on `cfg(target_os)` and only a
      # Mac compiles both feature halves. rustfmt cannot: it parses and never
      # type-checks, so it gives the same answer on either host. Leaving it on
      # the Mac would have meant the only fmt check for the crate sat behind a
      # runner this branch does not reach — which is how `weights/stage.rs`
      # and `tests/geometry_is_stated.rs` came to carry a mis-sorted import
      # and a body opened on its signature's line.
      #
      # `worker` is here for the plainer reason that it was never checked
      # anywhere and had drifted in fifteen files. Its CLIPPY cannot join yet
      # -- it carries 76 warnings, and a gate is worth nothing until the
      # crate is at zero -- but fmt is at zero now, and the cheap half of a
      # gate is still worth having when the alternative is neither half.
      #
      # `driver-vulkan` joins on exactly the `driver-metal` argument above.
      # Its exclusion read "being rewritten wholesale ... the only thing
      # adding it buys today is a merge conflict", which was true of the crate
      # while it was being written and stopped being true when it landed. Its
      # CLIPPY used to stay out because `kernels-vulkan`'s build script shells
      # out to a shader compiler and panics without it, so linting the crate
      # needs one on the runner. That turned out to be one download, and the
      # `driver-vulkan` job below now installs `slangc` and runs clippy over
      # both Vulkan crates with `-D warnings`. This line stays for `cargo
      # fmt`, which needs neither a compiler nor a GPU.
      - name: cargo fmt (compiler crates)
        run: |
          cargo fmt --check \
            -p tensor-ir -p tensor-compiler -p tensor-dsl \
            -p model-loader -p model -p model-compiler \
            -p worker-api -p client-api -p controller-api \
            -p ids -p waker -p transport \
            -p driver-metal -p engine -p worker \
            -p bootstrap -p client -p controller -p driver -p driver-api \
            -p gateway -p grammar -p inferlet \
            -p inferlet-macros -p kernels -p kernels-metal -p kernels-vulkan \
            -p pie -p pie-gpu-tests -p pie-server-py -p tokenizer \
            -p driver-wgpu -p kernels-wgpu -p driver-vulkan \
            -p model-dsl -p model-ir

  # Full-workspace verification — the guardrail + anti-bitrot net. Closes the
  # gap that let the runtime benches rot unseen: the dedicated jobs only build a
  # curated subset, so new crates (`transport`) and the benches were
  # compiled by nothing. This job compiles EVERY target and runs the workspace
  # test set.
  #
  #   --exclude pie-server-py : links driver-cuda (needs nvcc) → cuda job only.
  #   --exclude worker (workspace test step): worker's `--bin pie` tests
  #     need a driver feature (dummy/metal/cuda) and are exercised by the four
  #     dedicated jobs below. Its *library* tests are pure-Rust (default
  #     features = no cmake/cuda) and ARE run here explicitly via the
  #     `cargo test -p worker --lib` step so worker library test-rot is
  #     caught in the full battery — those lib tests previously ran in NO job at
  #     all. (The two former failures — the filesystem-coupled
  #     `translate::translates_minimal_config` and
  #     `config::rejects_public_driver_capacity_knobs` — are now fixed, so the
  #     exclusion no longer applies to `--lib`.)
  workspace-verify:
    name: workspace verify (all crates + all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache cargo + cmake build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/ccache
            target
          key: ${{ runner.os }}-workspace-verify-${{ hashFiles('**/Cargo.lock', 'driver/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-workspace-verify-

      # Compile every target — including benches and the not-yet-consumed
      # data-plane crate `transport` — so they cannot silently bitrot.
      - name: cargo build (workspace, all targets)
        run: |
          cargo build --workspace --all-targets \
            --exclude pie-server-py --exclude driver-cuda

      # Run the workspace test set (benches are compiled above, not executed).
      # worker's library tests are pure-Rust, so run them explicitly here to
      # keep worker test-rot inside the full battery; its `--bin pie` tests need
      # a driver feature and stay in the dedicated jobs below.
      - name: cargo test (workspace + worker lib)
        run: |
          cargo test --workspace \
            --exclude pie-server-py --exclude worker --exclude driver-cuda
          cargo test -p worker --lib

      # Neither of these needs CUDA -- the audit is Python over the published
      # headers, the table test is pure Rust -- and until now neither ran in
      # ANY job. Both had rotted in place: the audit globbed `csrc/src/ops` and
      # `csrc/src/kernels`, which the kernels split deleted, so it examined
      # five launchers against a 192-row table and reported ZERO UNDECLARED for
      # weeks. A check nobody runs is indistinguishable from a check that
      # passes.
      - name: kernel vocabulary audit
        run: python3 scripts/kernel-vocabulary-audit.py

      # A file no `mod` declares is INVISIBLE, not dead. rustc never reads
      # it, so clippy does not lint it, no test covers it, and nothing
      # reports it — `a86d6478d` deleted 886 lines of `metal/bind.rs` that
      # the compiler had never once seen, left behind when a module list
      # was trimmed. Dead code the compiler CAN see is already a warning;
      # this is the other half.
      - name: module reachability audit
        run: python3 scripts/mod-reachability-audit.py

      # The gate lists above are a CLAIM about the workspace, and nothing
      # checked it. Both ways it can be wrong have already happened here: a
      # crate listed four times (harmless, but the reason nobody spotted it
      # is the reason nobody would spot a crate going missing), and sixteen
      # crates that had never been listed at all and had drifted out of
      # rustfmt unremarked. A crate that is merely absent from a `-p` list
      # is indistinguishable, in CI's output, from a crate that passes.
      - name: gate coverage audit
        run: python3 scripts/ci-gate-audit.py

      # A `#[cfg(feature = "x")]` whose `x` no package declares is not an
      # error -- it is a condition that is always false, so the code under
      # it compiles nowhere while reading as code that is merely off. The
      # root package lost its `driver-metal` forward when the C++ Metal
      # driver was retired and never got it back, leaving five dead blocks
      # in `pie init`'s config template: on a Mac the generated default
      # named a bf16 repo that Metal's 4-bit-only llama path cannot bind.
      # `unexpected_cfgs` did fire, into the warnings of a package no gate
      # lints. This audit needs no compiler, no CUDA and no GPU, so it also
      # covers the nine crates the gates cannot build here -- which are
      # exactly the crates that have optional backends to `cfg` on.
      - name: cfg feature audit
        run: python3 scripts/cfg-feature-audit.py

      # The three audits above are static, and all three were green on
      # 3,108 lines of `crates/model` that nothing could reach: the
      # `emit-cuda` machinery, left behind when the commit that retired
      # its binary and its check deleted only those two. `dead_code` does
      # not fire on `pub` items, and the module audit correctly called the
      # files reachable -- they were, from a `pub mod` nobody called.
      # Running the tests and asking which files never executed found it
      # in one line: three at exactly 0.00%, half the crate's uncovered
      # total. This asks that one question, not for a percentage.
      - name: coverage audit (no file where nothing runs)
        run: python3 scripts/coverage-audit.py

      - name: kernel table (every symbol carries its family)
        run: cargo test -p model --test kernels_table

      # The SEAM between the two vocabularies that name the same tensors:
      # the trace names a forward pass invents, and the published names a
      # load contract invents. `weight_names::wire()` is the only bridge,
      # and it fails SILENTLY by construction -- `Wiring::alias` records a
      # row only if the name was published, so a name the contract never
      # published is dropped with no diagnostic and surfaces one at a time
      # at FIRE time as `UnknownWeight`. Detecting drift one request too
      # late is what this moves to CI.
      #
      # It needs `contract` because it reaches the
      # descriptor schema `HfConfig` lives in.
      #
      # THIS RAN ONE FILE UNTIL NOW, and the aspect it enables has six.
      # `contract` is not a default feature and `cargo test --workspace`
      # above runs with defaults, so the other five built their binaries,
      # reported `0 passed; 0 failed; 0 filtered out`, and executed
      # forty-two tests in no job at all -- thirty of them in
      # `family_contracts.rs`. The `cargo check --features contract` steps
      # near the top compiled every one of them, which is exactly why this
      # lasted: what rots in an unrun test is the ASSERTION, and a check
      # never reads one. Same lesson as the kernel vocabulary audit below,
      # through a different door.
      #
      # So the step is the aspect now rather than one file of it. It
      # re-runs the default half as well, which is duplicated work and
      # cheaper than a second binary's worth of argument about it.
      # `every_cfg_names_a_real_feature.rs` fails if a `#![cfg(feature)]`
      # test file is ever again left with no command that reaches it.
      - name: model contract aspect (weight-name seam, load contracts, name maps)
        run: cargo test -p model --features contract

      # driver-cuda is excluded from the two sweeps above because it has no
      # default feature and refuses to build until one of `cuda-12` / `cuda-13`
      # is chosen. That is deliberate: the CUDA runtime API is not ABI-stable
      # across major versions (`cudaGraphAddNode` takes five arguments in
      # libcudart.so.12 and six in .so.13), and since this crate resolves
      # symbols by name at run time, a wrong guess is a segfault inside the
      # driver rather than a build error. So it is built here explicitly
      # instead, which is also the only way to cover BOTH ABIs.
      #
      # No CUDA toolkit and no GPU are needed for either: cudarc is pinned to a
      # named version with `fallback-dynamic-loading`, so nothing is linked,
      # and the GPU tests skip themselves when no device is present. What runs
      # is the host logic the crate is mostly made of -- including the
      # differential goldens pinned against the C++ in `tests/oracle/`.
      #
      # `launch_abi` is the exception to "pure Rust" and NOT an exception to the
      # line above: it shells out to g++ (present on every ubuntu runner) to
      # compile a shim generated from the kernel table against the real
      # `rope.hpp` -- a header of the ahead-of-time ARCHIVE crate, which held
      # the name `kernels-cuda` until `85c6c674b` and is not the JIT crate
      # that holds it now. That is how a wrong operand row becomes a build
      # error rather than a golden nobody can regenerate. It takes `cudaStream_t`
      # from `tests/oracle/launch_abi/stub/`, so it still asks for no toolkit --
      # deliberately, since a proof whose answer depends on which CUDA is
      # installed is not one.
      - name: cargo test (driver-cuda, both CUDA ABIs)
        run: |
          cargo test -p driver-cuda --features cuda-12
          cargo test -p driver-cuda --features cuda-13


      # The half of driver-cuda that is correct without a GPU. No feature
      # at all now BUILDS rather than refusing — the `compile_error!` is
      # down to the one case it was ever about, both CUDA versions at
      # once. This is the only job that compiles the other side of the
      # `_cuda` cfg, and without it the gate drifts back to the
      # subsystem boundary it started at -- which is how `memory_planner`,
      # `mla_geometry` and `dsv4_geometry` sat parity-tested with zero callers
      # for months. North-star rule 2: cut by "is this correct without a GPU?",
      # not by subsystem. The BUILD is the test; the five assertions only
      # demonstrate that each module is usable rather than merely reachable.
      - name: cargo test (driver-cuda, portable half, no feature at all)
        run: cargo test -p driver-cuda

      # THE GATE THAT WOULD HAVE CAUGHT A DEAD KERNEL, and did not exist until
      # one shipped. Every kernel in `kernels-cuda` is TEXT that NVRTC compiles
      # at run time, so a root that stops compiling is not a failing test
      # anywhere -- it is a kernel that silently does not exist until something
      # fires it and the request errors. `attn/attention_mla_fa2` shipped that
      # way: one `template` keyword on a non-template member of vendored
      # FlashInfer, behind `__CUDA_ARCH__ >= 900`, invisible to every job in
      # this file because nothing here runs this crate with a CUDA feature at
      # all. The workspace sweep builds it with default features, where layer 3
      # is cfg'd out entirely.
      #
      # `libnvrtc` is the whole of what this needs. The crate links nothing,
      # carries its own headers and shims, and NVRTC targets an architecture
      # rather than talking to one -- so no toolkit, no driver and no GPU are
      # involved, exactly like the two steps above. The wheel is the delivery
      # that does not drag a toolkit behind it; `LD_LIBRARY_PATH` has to name
      # its directory because `libnvrtc.so.13` loads `libnvrtc-builtins.so`
      # beside itself and reports a "corrupted" builtins if it cannot.
      #
      # WHAT IT COVERS AND WHAT IT DOES NOT, measured rather than assumed. It
      # compiles 126 of 127 roots and 792 instantiations for real. The 127th is
      # cooperative: `grid.sync()` leaves an extern that `cuLink` resolves and
      # `cuLinkCreate` is a context call, so it names itself as skipped and is
      # covered only where a device exists. And with no device to ask,
      # `cache::arch()` falls back to `sm_89` -- the floor the fp8 shim sets --
      # so code gated above that, which is where the bug above lived, still
      # needs real hardware to see. This is a net, not a proof: it catches the
      # arch-independent breakage, which is most of it.
      #
      # `typecheck_tu` is the second half of the step and used to be none of
      # it. It compiles a unit per measured `LAYOUTS` static, and one of its
      # four roots device-links -- which it treated as grounds to return,
      # dropping all four. So on THIS runner, the one the step was written for,
      # it finished in 0.01 s having asserted nothing, and read green. It now
      # partitions the way its sibling does: 3 of 4 roots, 6 aggregates, 40
      # assertions, and the 4th named as skipped. Confirmed to still bite by
      # planting a wrong field offset, which fails the step here.
      - name: cargo test (kernels-cuda, JIT roots against real NVRTC)
        run: |
          python3 -m venv /tmp/nvrtc
          /tmp/nvrtc/bin/pip install --quiet nvidia-cuda-nvrtc
          export LD_LIBRARY_PATH="$(echo /tmp/nvrtc/lib/python*/site-packages/nvidia/cu13/lib):$LD_LIBRARY_PATH"
          cargo test -p kernels-cuda --features cuda-13 \
            --test every_instantiation_compiles --test typecheck_tu -- --nocapture

      # The test that fires a REAL PTIR program: register bytecode, publish a
      # seed into a channel, read the program's own answer back out. It is the
      # only thing in the tree that covers that path -- `driver-cuda`'s
      # `serve.rs` registers `ProgramRegistration { program_hash, ..Default }`,
      # a descriptor with NO bytecode, so `plan.executable` is false and
      # `run_program` returns early in every one of its cases; and
      # `gpu_ptir_emitted.rs` says in its own header that it does not claim a
      # program runs.
      #
      # This step used to read `cargo test -p engine --features
      # driver-cuda-13 --test ptir_shell`, and that command had stopped
      # COMPILING. The C ABI it was written against -- `pie_cuda_create`,
      # `pie_cuda_register_program`, the `driver_api::local::Pie*` descriptors
      # -- was deleted when the driver became a Rust `Shell`; the sibling
      # `driver-cuda/tests/serve.rs` was ported with it and this file was not.
      # Eighteen errors. Nothing caught it because this branch has never run
      # CI, so the step has never once executed.
      #
      # It now lives beside the driver, which is also where the reason it did
      # not went: it sat in `engine` because building a registerable program
      # needs `tensor_compiler`'s bind/compile/emit chain and "a dev-dependency
      # the other way would be a cycle". `driver-cuda` already has
      # `tensor-compiler` and `tensor-ir` as dev-dependencies and two of its
      # tests already drive that exact chain.
      #
      # `abi` is not optional in the spelling: `Shell` and `driver_api::local`
      # are behind it, which is why the driver-cuda steps above -- which do not
      # pass it -- do not build this target.
      #
      # It skips without a device or without the cached Qwen3-0.6B, like every
      # GPU-touching test there, so on this runner it compiles and skips. That
      # is what this step is for. Where a card exists it takes 15 s and it
      # earns them: it caught a `Shell::drop` that released two of its three
      # attention workspaces and debug-asserted on the third.
      - name: cargo test (the PTIR program path, through the driver shell)
        run: cargo test -p driver-cuda --features cuda-13,abi --test gpu_ptir_shell

  metal-kernel-boundary:
    name: metal kernel boundary (kernels-metal reaches nothing above it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # This job was `metal-kernel-table` and ran two steps. The first is gone
      # and the rename is deliberate: a job called "shaders vs the Rust table"
      # that no longer compares them is the green check the `--cpp` paragraph
      # below warns about. If a branch protection rule names the old check, it
      # needs updating -- loudly, which is the point.
      #
      # What went was invariant (1): every entrypoint in `kernels/` resolves to
      # exactly one (row, axis point), and every (row, axis point) to exactly
      # one entrypoint. It ran as `scripts/metal-kernel-audit.py --table`,
      # which expanded the `instantiate_*` macros with the C preprocessor for
      # the shader half and ran `cargo run -p kernels-metal --example
      # entrypoints` for the table half. That example is deleted with the rest
      # of `examples/`, so the mode is retired and the step with it -- and no
      # `#[test]` picked it up, because the shader half needs a preprocessor.
      # `kernels-vulkan` and `kernels-wgpu` still hold their copy of the
      # invariant inside `cargo test`, since a Slang or WGSL variant is
      # DECLARED on a `// pie:instantiate` line and reading the set is a parse.
      #
      # The Rust toolchain install went with it. `--one-way` is a directory
      # walk and needs no cargo; the toolchain was there for the example.

      # Four flags used to run here and all four served the C++ Metal driver,
      # which the Rust port removed. `--no-concat` (invariant (2) -- the driver
      # NAMES a kernel, it does not spell one), `--paths` and
      # `--dead-paths-unused` (invariant (4) -- every `.metal` literal
      # resolves) all walked `crates/driver-metal/csrc`, so all three reported
      # success over an empty set.
      #
      # `--cpp` was the last to go and the one worth naming, because it never
      # reported a false success: it compiled `csrc/tests/entrypoint_test.cpp`
      # against `include/pie/kernels/entrypoint.h` and both were real, so it
      # passed honestly right up until they were deleted. A green check does
      # not say the thing it checks still has callers. The launch shapes those
      # headers carried are Rust now, in `driver-metal/src/lowering/grid.rs`.
      #
      # The script FAILS on all four rather than passing, so none can come
      # back quietly -- and `--table`, `--check` and `--write` now fail the
      # same way for the same reason. No invariant went unheld when the C++
      # left:
      #
      #   * `model-compiler`'s `kernels::check_plan` runs from `trace::finish`
      #     on every plan and refuses any launched symbol no row declares --
      #     which checks the RESULT, so it catches a name built by any means.
      #   * `driver-metal`'s `every_file_a_kernel_row_states_is_a_file_
      #     that_exists` holds every `KernelSig::file` against the shader tree.
      #   * `kernels-metal`'s `tests/entrypoints.rs` holds the name grammar
      #     against the same 481 entrypoints `--cpp` read, in the language the
      #     driver is written in.

      # Invariant (3): kernels-metal depends on nothing above it, and now also
      # that nothing in its shader tree is host C++. Both halves are one walk:
      # a `#include` of a driver header, or a mention of a driver TYPE, is the
      # arrow turning around -- that is how `runahead.hpp` ended up in the
      # ahead-of-time archive crate, which held the name kernels-cuda until it
      # was deleted at `85c6c674b`. And a header no shader includes is host C++
      # sitting in the runtime search path, which is what `affine_format.hpp`
      # was until it was deleted with the library that included it.
      - name: Check kernels-metal reaches nothing above it
        run: python3 scripts/metal-kernel-audit.py --one-way


  # WIT drift — the canonical inferlet interface (crates/inferlet/wit) is
  # vendored into ONE remaining copy, bakery's
  # (sdk/inferlet/tools/bakery/src/bakery/wit), which is a Python package and
  # so cannot reach the WIT through a cargo dependency. The Rust guest needs no
  # copy: `inferlet` owns the WIT and runs the `wit_bindgen::generate!` over it
  # in the same package. Manual three-way
  # editing has regressed twice (commit 94043eb1). scripts/sync-wit.sh
  # regenerates the copy from source; this job fails if a PR edited the
  # interface without re-syncing.
  # Guest bitrot — the two inferlet trees are their own cargo workspaces, so
  # `cargo build --workspace` above never touches them and an SDK change that
  # breaks every guest still goes green. That is not hypothetical: nine
  # commits of SDK work silently broke 13 of the 37 crates under
  # crates/engine/tests/inferlets before anyone built them (c82e06bba).
  # These are the SDK's only consumers; if they do not compile, the SDK's
  # public surface is whatever the last refactor happened to leave behind.
  guest-inferlets:
    name: guest inferlets (both trees, wasm32-wasip2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tests/inferlets/target
            crates/engine/tests/inferlets/target
          key: ${{ runner.os }}-guest-inferlets-${{ hashFiles('tests/inferlets/Cargo.lock', 'crates/engine/tests/inferlets/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-guest-inferlets-

      # Warnings are denied: an unused import or a stale `mut` in a guest is
      # usually the visible end of an SDK surface that moved.
      - name: cargo check (tests/inferlets)
        run: cargo check --target wasm32-wasip2 --manifest-path tests/inferlets/Cargo.toml
        env:
          RUSTFLAGS: -D warnings

      - name: cargo check (crates/engine/tests/inferlets)
        run: cargo check --target wasm32-wasip2 --manifest-path crates/engine/tests/inferlets/Cargo.toml
        env:
          RUSTFLAGS: -D warnings

  wit-drift:
    name: wit drift (sync-wit.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install wit-deps
        run: cargo install --locked wit-deps-cli

      - name: Regenerate vendored WIT copies
        run: ./scripts/sync-wit.sh

      - name: Fail if the vendored WIT copy is stale
        run: |
          if ! git diff --exit-code -- sdk/inferlet/tools/bakery/src/bakery/wit; then
            echo "::error::The vendored WIT copy is out of sync with crates/inferlet/wit."
            echo "Regenerate with: ./scripts/sync-wit.sh   (then commit)"
            exit 1
          fi

  # NO driver feature — pure Rust, builds on every OS we support. Cheapest
  # gate for "did the standalone wiring break end to end". Runs the full
  # unit-test suite too, since without a driver feature nothing pulls in
  # cmake.
  #
  # This was the `driver-dummy` job. That feature named a crate that is
  # deleted; what the job actually gated was the composition root building
  # with no device behind it, which `--no-default-features` alone says.
  pie-worker-no-driver:
    name: pie-worker (no driver feature)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pie-worker-no-driver-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo build (no driver feature)
        run: |
          cargo build -p worker --no-default-features

      - name: cargo test (pie-worker, no driver feature)
        run: |
          cargo test -p worker --no-default-features

      # The `pie` command is the root package's own binary; `worker` is a
      # library with no `[[bin]]`. Building the worker alone never produced a
      # runnable CLI, so nothing here covered the composition root.
      - name: cargo build (pie binary, no driver feature)
        run: |
          cargo build -p pie --no-default-features

  # The WebGPU driver and the seams that join it to the engine and the worker.
  #
  # `driver-wgpu` is an OPTIONAL feature of `engine`, `worker` and `pie`, so
  # every plain `cargo test -p engine` builds its seam OUT -- the same hole
  # `driver-metal` below was written for, and this backend had no job at all
  # until now. `crates/engine/src/driver/backend/wgpu.rs` is 1,600 lines that
  # nothing in CI compiled.
  #
  # No GPU is asked for. The device suites (`device`, `serving`) take
  # `required-features = ["native"]` and each opens an adapter through an
  # `Option`, so on a runner without one they SKIP rather than fail -- but the
  # steps below deliberately do not run them. What they cover is what a
  # compiler can settle: the portable half's 163 tests, both feature halves of
  # the crate, and every seam that names the driver.
  driver-wgpu:
    name: driver-wgpu (portable half + seams)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # `tests/browser.rs` builds this crate and `kernels-wgpu` for a
          # browser, which is the one claim this backend has that its
          # siblings do not. Without the target installed, every one of its
          # six tests takes the skip path and PASSES -- and `cargo test`
          # hides a passing test's stdout, so the message saying so was never
          # printed either. `PIE_WGPU_REQUIRE_BROWSER` on the step below
          # turns that skip into a failure, so dropping this line goes red
          # rather than quiet.
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-driver-wgpu-${{ hashFiles('**/Cargo.lock') }}

      # The half that needs no adapter, and the one `default = []` exists to
      # keep reachable. It stopped compiling its own test targets once; a
      # `cargo build` would not have said so, because the break was in
      # `#[cfg(test)]` code.
      - name: cargo test (driver-wgpu, portable half)
        run: cargo test -p driver-wgpu
        env:
          PIE_WGPU_REQUIRE_BROWSER: "1"

      # The device half, compiled and not run: `--no-run` builds every test
      # target behind `native` without asking the runner for a GPU.
      - name: cargo test --no-run (driver-wgpu, device half)
        run: cargo test -p driver-wgpu --features native --no-run

      - name: cargo test (kernels-wgpu, table + WGSL front end)
        run: cargo test -p kernels-wgpu

      # The three shader tables, compared -- `.wiki/kernel-x/refactor-bigplan.md`
      # §1.1. They are one table written down three times (100/100 identical
      # `launch`, 100/100 `axes`, 94/100 `operands`) and NOTHING in this
      # workspace compared them, which is why seven statements had drifted and
      # nobody could say which side was right. It also carries §8's countdown:
      # 300 rows to 0, a constant that only falls.
      #
      # It lives in `kernels` because it is above all three backends, and it
      # runs in this job because this job is the one that already builds them.
      - name: cargo test (the three shader tables agree)
        run: cargo test -p kernels --test shader_backends_agree

      # Mesa's CPU rasteriser, which is what makes the numeric proofs below
      # RUNNABLE on a runner with no GPU. This whole backend has only ever
      # been measured on llvmpipe; it is a strict implementation with no
      # vendor shortcuts, so a shader that agrees with a reference here agrees
      # because it is right.
      - name: Install a software adapter (llvmpipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      # Most tests in both files open an adapter through an `Option` and print
      # `SKIP` when there is none, and `cargo test` eats that line without
      # `--nocapture`. So until the two switches below, both steps read the
      # SAME GREEN whether every proof ran against llvmpipe or the install
      # above silently did nothing -- and nothing checked which. The install
      # exists for the express purpose of making these runnable;
      # `PIE_WGPU_REQUIRE_ADAPTER` and `PIE_WGPU_REQUIRE_DEVICE` are how the
      # purpose gets checked rather than assumed.
      #
      # How many that is, each suite counts and prints for itself -- in
      # `the_runner_states_whether_it_has_an_adapter` and
      # `..._whether_it_has_a_device`. This comment used to say "51 kernel
      # proofs and 13 device tests"; they are 55 and 18, which is what a
      # hand-kept number is worth after a few months.
      #
      # If either switch goes red, that IS the measurement: it means the
      # guarantee this job has been printing all along was never held.
      - name: cargo test (kernels-wgpu, on-device numeric proofs)
        env:
          PIE_WGPU_REQUIRE_ADAPTER: "1"
        run: cargo test -p kernels-wgpu --test gpu

      - name: cargo test (driver-wgpu, device tests)
        env:
          PIE_WGPU_REQUIRE_DEVICE: "1"
        run: cargo test -p driver-wgpu --features native --test device

      # This backend's three end-to-end gates, COMPILED. They cannot run here
      # -- each is `#[ignore]` and wants a built model in `PIE_HOME` -- but
      # every file under `tests/gpu/tests` is `#![cfg(feature = "...")]`, so
      # without a step that turns a driver feature on, no compiler in CI has
      # ever read one. Forty-odd files across four backends, in the same shape
      # the seams below are here for, and found by asking which job builds
      # them rather than by one going red.
      - name: cargo test --no-run (wgpu end-to-end gates)
        run: cargo test -p pie-gpu-tests --features driver-wgpu --no-run

      # The three seams. Each is a file that exists only when the feature is
      # on, which is exactly the shape that rots unread.
      #
      # CLIPPY rather than `check`, for the reason the `driver-wgpu, device
      # half` step above gives about `envelope`/`frames`/`serve`/`shell`: the
      # workspace clippy step lints `-p engine` with DEFAULT features, so
      # `driver/backend/wgpu.rs` is gated out of the build that lints and
      # nothing covered it. A `check` would not have covered it either.
      - name: cargo clippy (engine, driver-wgpu seam)
        run: |
          cargo clippy --no-deps --all-targets -p engine --features driver-wgpu \
            -- -D warnings

      # And a `check` does not reach their DOC comments. The wgpu seam is the
      # most heavily commented file in `engine`, and rustdoc compiles an
      # indented block as Rust -- so a pasted watchdog line,
      # `in_flight_control: KV copy pipeline Some(..) settled=false`, was a
      # doctest that had never compiled and nothing above would ever say so.
      # Cheap: the crate is already built by the step before this one.
      - name: cargo test --doc (engine, driver-wgpu seam)
        run: cargo test -p engine --features driver-wgpu --doc

      # The same gap on this side. The device half's step above is `--no-run`,
      # which does not merely skip RUNNING the doctests -- it never builds
      # them -- and `--test device` reaches one target. So a doctest written
      # anywhere under `native` would execute in no job at all.
      #
      # It measures nothing today on purpose: the crate's only two doctests are
      # ```ignore signature sketches, and what checks THOSE is
      # `the_seam_these_crates_sketch_is_the_seam_they_declare`, not rustdoc.
      # This step is here for the next one somebody writes.
      - name: cargo test --doc (driver-wgpu, device half)
        run: cargo test -p driver-wgpu --features native --doc

      # `cargo test --doc` and `cargo doc` are DIFFERENT checks and the step
      # above is only the first. `--doc` compiles the code blocks in a doc
      # comment; it never resolves an intra-doc LINK, so `[`WAIT`]` kept
      # pointing at a constant for hours after that constant was renamed to
      # `WAIT_DEFAULT`, with every suite, both clippy scopes and the doctests
      # green. Seven links in this crate had rotted that way, two of them from
      # that one rename.
      #
      # `--features native`, because the whole crate is the documented surface:
      # the portable half's docs cross-reference the device half by name --
      # `resources.rs` says in so many words which three types are behind the
      # gate -- and in a build where those items do not exist, an accurate
      # cross-reference cannot resolve. Rewriting them into dead text to please
      # the smaller configuration would trade a working link for a worse one.
      - name: cargo doc (driver-wgpu + kernels-wgpu, deny broken links)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps -p driver-wgpu --features native
          cargo doc --no-deps -p kernels-wgpu
          # `kernels` too, and it is not a wgpu crate: the routine machinery
          # and the shared operand vocabulary live there, this job is the one
          # that already builds it, and it had two unresolved links -- a macro
          # shadowed by the module of the same name, and a `driver-cuda` type
          # named as if it were local.
          cargo doc --no-deps -p kernels

      - name: cargo clippy (worker, driver-wgpu seam)
        run: |
          cargo clippy --no-deps --all-targets -p worker --features driver-wgpu \
            -- -D warnings

      - name: cargo build (pie binary, driver-wgpu)
        run: cargo build -p pie --features driver-wgpu

      # `pie config init` writes a `[driver]` block per compiled flavor, and
      # `it_names_the_driver_this_binary_actually_has` checks that the block is
      # the flavor the binary HAS. With default features that test resolves to
      # the no-driver fallback, so the wgpu block -- and whether the config it
      # writes parses at all -- is asserted by nothing. A missing arm does not
      # fail to compile: it falls into the catch-all, which is exactly how
      # Metal's went unnoticed, and the test's own comment says so.
      - name: cargo test (pie, driver-wgpu template + seam)
        run: cargo test -p pie --lib --features driver-wgpu

      # The two-driver binary USED TO be built here, on the grounds that it
      # "needs no shader toolchain: `kernels-vulkan`'s `native` is what costs
      # `slangc` and nothing on this path turns it on". That second clause
      # stopped being true when the SPIR-V moved into the rlib:
      # `driver-vulkan/native` now enables `kernels-vulkan/native`, because a
      # driver that means to run has to CARRY the words it hands
      # `vkCreateShaderModule`, and `engine/driver-vulkan` has always turned
      # `driver-vulkan/native` on. So the step moved to the `driver-vulkan`
      # job below, which installs `slangc` already. It is the same build; only
      # the runner that can afford it changed.

  # The Vulkan backend, which had no job of its own until the question that
  # kept it out was actually asked.
  #
  # The reason given for excluding it was that `kernels-vulkan`'s build script
  # shells out to a shader compiler, so anything behind `native` needs one on
  # the runner -- and it was never established that a runner could get one.
  #
  # It can. The tree is written in Slang and compiled by `slangc`, which is
  # not in any distribution but IS a published release tarball, so the step
  # below fetches the exact version this tree is developed and measured
  # against (2026.14.1) rather than whatever a package manager happens to
  # have. Pinning is the point: `slangc` chooses the SPIR-V dialect a storage
  # buffer is emitted in, and a different choice loads silently and is
  # visible only by disassembling. So this job takes the whole backend, not
  # the portable slice.
  driver-vulkan:
    name: driver-vulkan (+ kernels, shaders, seams)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-driver-vulkan-${{ hashFiles('**/Cargo.lock') }}

      # `slangc` is what `native` costs. Nothing else: this job deliberately
      # does NOT install `mesa-vulkan-drivers`, which the sibling wgpu job
      # does and which would otherwise be the obvious way to make the
      # on-device proofs below RUN rather than skip.
      #
      # It was tried and measured. Mesa 26.0's `lavapipe` presents a device,
      # claims the tier, and then SIGSEGVs inside the ICD partway through
      # `affine_qmm_t_is_right_at_every_tile_shape_and_quantization_point` --
      # reproducibly, in isolation, on a shader that is right on real
      # hardware. So a software device here does not buy coverage; it buys a
      # red job that says nothing about this repository.
      #
      # With no device at all, every on-device test in both crates skips by
      # design and says why, so the steps below stay meaningful: they prove
      # the shaders COMPILE and the Rust around them builds and passes its
      # host-side tests. Actually running them wants the hardware gates.
      - name: Install the Slang shader compiler
        run: |
          ver=2026.14.1
          url="https://github.com/shader-slang/slang/releases/download/v$ver/slang-$ver-linux-x86_64-glibc-2.27.tar.gz"
          mkdir -p "$HOME/slang"
          curl -fsSL "$url" | tar -xz -C "$HOME/slang"
          echo "PIE_SLANGC=$HOME/slang/bin/slangc" >> "$GITHUB_ENV"
          "$HOME/slang/bin/slangc" -v

      # The half that needs neither a device nor `slangc`, and the one
      # `default = []` exists to keep reachable: 82 tests across the lib and
      # four test targets.
      - name: cargo test (driver-vulkan, portable half)
        run: cargo test -p driver-vulkan

      # Every shader, compiled. This is the step the exclusion was about, and
      # it is the one that would have caught a `.slang` that only a newer
      # `slangc` accepts -- which is why the version above is pinned rather
      # than taken from whatever is latest at the time the job runs.
      - name: cargo test (kernels-vulkan, table + every SPIR-V module)
        run: cargo test -p kernels-vulkan --features native

      # The device half of the driver, compiled and not run.
      - name: cargo test --no-run (driver-vulkan, device half)
        run: cargo test -p driver-vulkan --features native --no-run

      # This backend's end-to-end gates, COMPILED. Each is `#[ignore]` and
      # wants a built model, so they cannot run here -- but every file under
      # `tests/gpu/tests` is `#![cfg(feature = "...")]`, so without a step
      # that turns this driver's feature on, no compiler reads one.
      - name: cargo test --no-run (vulkan end-to-end gates)
        run: cargo test -p pie-gpu-tests --features driver-vulkan --no-run

      # CLIPPY, which the `cargo fmt` list above says is out of reach for this
      # crate for want of a shader compiler. It is installed two steps up.
      # Both crates are at zero warnings today, which is the whole bar.
      #
      # `--no-deps` because `-D warnings` otherwise reaches the dependency
      # graph, where `kernels-cuda` has 29 warnings this job has no
      # business failing on. Verified to still bite: re-indenting one doc line
      # in `driver-vulkan`'s device tests turns this step red.
      - name: cargo clippy (vulkan crates)
        run: |
          cargo clippy --no-deps -p kernels-vulkan -p driver-vulkan \
            --features kernels-vulkan/native,driver-vulkan/native \
            --all-targets -- -D warnings

      # The seams. Each is a file that exists only when the feature is on.
      - name: cargo check (engine, driver-vulkan seam)
        run: cargo check -p engine --features driver-vulkan

      - name: cargo check (worker, driver-vulkan)
        run: cargo check -p worker --features driver-vulkan

      - name: cargo build (pie binary, driver-vulkan)
        run: cargo build -p pie --features driver-vulkan

      # The TWO-driver binary, which is the configuration neither driver's own
      # job builds otherwise. `driver-wgpu` and `driver-vulkan` landed within a
      # day of each other into the same files, the same functions and the same
      # match arms -- eleven conflicts -- and a duplicated arm or a colliding
      # name shows up only where both are on. The commit that wired the wgpu
      # backend claimed the pair builds and put nothing behind the claim.
      #
      # It sits in THIS job rather than the wgpu one because `driver-vulkan`
      # now costs `slangc` on any path that reaches its device half, and this
      # is the job that has one. The wgpu crates are not otherwise built here;
      # that is the price of the toolchain being the scarce thing.
      - name: cargo build (pie binary, both portable drivers)
        run: cargo build -p pie --features driver-wgpu,driver-vulkan

  # The Metal driver and the seam that joins it to the engine.
  #
  # `driver-metal` is an OPTIONAL feature of `engine`, so a plain
  # `cargo test -p engine` builds its seam OUT. That file once went weeks
  # without a compiler reading it and accumulated seven type errors; this job
  # is what catches that on the first push. It was added once and lost in a
  # rebase, which is its own argument for a job rather than a habit.
  driver-metal:
    name: driver-metal (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-driver-metal-${{ hashFiles('**/Cargo.lock') }}

      # BOTH halves, on one runner, which is the whole point of `metal-4`
      # being a feature rather than `cfg(target_vendor = "apple")`:
      #
      #   A platform cfg cannot be tested. A feature can.
      #
      # On macOS `target_vendor = "apple"` is always true, so the portable
      # half was never compiled by any job in the tree; on Linux it is always
      # false, so the Apple half never was. No machine built both, and that is
      # exactly how three cross-boundary errors got in and stayed
      # (`.wiki/driver/real-metal-north-star.md` §7). There is still no Linux
      # job for this crate — `model-loader` pulls `zstd-sys`, a C build that
      # needs a cross toolchain — and with the feature there does not need to
      # be one.
      #
      # The name says what the green tick means, because a job that tested
      # nothing and a job that tested the portable half look identical.
      - name: cargo test (driver-metal, portable half — no GPU)
        run: cargo test -p driver-metal

      - name: cargo test (driver-metal, metal-4)
        run: cargo test -p driver-metal --features metal-4

      # Does this runner have a GPU, and did anything above use it?
      #
      # Every device test in the crate opens with `let Ok(context) =
      # Context::new() else { return; }`, which is the right shape -- a test
      # that cannot run should not fail -- and has one bad property: a test
      # that skipped and a test that measured a thousand numbers both print
      # `ok`. That is the same failure this job's own comment names three
      # steps up, "a job that tested nothing and a job that tested the
      # portable half look identical", and the device tests had it worse:
      # they were `#[ignore]`d, so no step here ran them at all. Several
      # thousand assertions against real hardware -- every paged attention
      # entrypoint and every GDN entrypoint -- were compiled by CI and
      # executed by nobody but a laptop.
      #
      # `device_presence` states the answer in the log either way, so a build
      # that measured nothing says so. The step after it runs the device tests
      # wherever there is a device to run them on. Named separately because
      # their green ticks mean different things.
      #
      # The open question this settles is whether a hosted runner vends a
      # Metal 4 device at all. `macos-latest` now maps to macOS 26, which is
      # the OS Metal 4 needs; whether the virtualised Apple GPU behind it
      # exposes one has never been checked by anything in this tree. When the
      # log says PRESENT, set `PIE_METAL_REQUIRE_DEVICE=1` below and the
      # silence can never come back.
      - name: Does this runner have a Metal 4 device?
        run: |
          cargo test -p driver-metal --features metal-4 \
            --test device_presence -- --nocapture

      # The three device tests that need a GPU and nothing else. The other
      # `#[ignore]`d tests in this crate are excluded on purpose and by name:
      # `device_real_weights` and `device_checkpoint_names` want a checkpoint
      # this runner has no way to fetch, and `device_icb` allocates 5 GiB.
      - name: cargo test (driver-metal, device tests — needs real hardware)
        run: |
          cargo test -p driver-metal --features metal-4 \
            --test device_attention --test device_gdn --test device_kernels \
            --test device_saturation \
            -- --include-ignored --test-threads=1

      # Type-check AND test: the seam's tests run everything that needs no
      # checkpoint, and the checkpoint-gated ones state that they skipped.
      - name: cargo test (engine, driver-metal seam)
        run: cargo test -p engine --features driver-metal

      # The worker feature the release build selects on macOS. `driver-metal`
      # is `worker`'s name for `engine/driver-metal`, and nothing else
      # compiles that composition.
      - name: cargo build (worker, driver-metal)
        run: |
          cargo build -p worker \
            --no-default-features --features driver-metal

      # THE COMPOSITION ROOT, which every other backend's job builds and this
      # one did not. `worker` is a library with no `[[bin]]`, so the step above
      # never produced a runnable CLI; `pie`'s own `driver-metal` forwards to
      # `worker/driver-metal` and this package is the only one with a binary.
      # The wgpu job has said `cargo build -p pie --features driver-wgpu` since
      # it was written, and vulkan's says the same -- Metal's absence was an
      # omission and not a decision.
      #
      # What it costs to leave out is not hypothetical. This is the exact
      # command that failed with `cannot find BootConfig in driver` after a
      # commit deleted `pub mod boot;` from `engine/src/driver.rs` while
      # `boot.rs`, its tests and its only consumer -- `backend/metal.rs` --
      # all stayed. Nothing was red anywhere, because no job in this file
      # compiled the seam that named it.
      - name: cargo build (pie binary, driver-metal)
        run: cargo build -p pie --features driver-metal

      # And the template test, for the same reason the wgpu job runs its own:
      # `it_names_the_driver_this_binary_actually_has` checks the `[driver]`
      # block `pie config init` writes against the flavor the binary HAS, and
      # its Metal arm is behind `#[cfg(feature = "driver-metal")]`. Without a
      # build that turns the feature on, that arm is dead source and the
      # assertion silently checks nothing. Its comment records what the hole
      # cost the last time: Metal "came to be handed the dummy driver's block:
      # it parsed perfectly and then generated random tokens."
      - name: cargo test (pie, driver-metal template + seam)
        run: cargo test -p pie --lib --features driver-metal

      # Both configurations again: a lint that only fires in one half is a
      # lint nobody sees.
      - name: cargo clippy (driver-metal, portable half)
        run: cargo clippy --no-deps -p driver-metal --all-targets -- -D warnings

      - name: cargo clippy (driver-metal, metal-4)
        run: |
          cargo clippy --no-deps -p driver-metal --all-targets \
            --features metal-4 -- -D warnings

  pie-worker-cuda:
    name: pie-worker (driver-cuda)
    runs-on: [self-hosted, cuda]
    if: contains(github.event.pull_request.labels.*.name, 'ci-cuda')
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # EVERY FEATURE SPELLING, built. Two of the four were broken at once
      # while the two either side of them were green, and nothing said so —
      # `--features cuda-13` failed with 58 errors in `fire/launch.rs` and
      # `--features cuda-13,bridge` failed on `weights/`, both for the same
      # reason: `abi` is the only spelling that brings `driver_api` and
      # `model-loader`, so a module reaching for either compiles under
      # `cuda-13,abi` and under nothing else.
      #
      # Here rather than in the no-toolkit job because `bridge` compiles the
      # generated shim against real headers and asks for nvcc. The first two
      # are covered by `cargo test` there; these are the two that were not
      # covered anywhere.
      #
      # BUILDING IS ENOUGH: the failure this catches is "does not compile",
      # which is exactly the failure that hides — a configuration nobody
      # builds is a configuration nobody checks, which is §7's own argument
      # for `metal-4` being a feature rather than a `target_vendor`.
      #
      # AND A TEST TARGET IS A CONFIGURATION NOBODY BUILT. `--all-targets` is
      # this step's second half and was added after the sentence above proved
      # true one level down: `cargo check` does not build test targets, so a
      # `tests/*.rs` that stopped compiling stayed green everywhere. Five such
      # targets accumulated before anyone looked, and the sixth —
      # `tests/serve.rs`, 4,083 lines — had been dead since `50fa127a3`
      # deleted the C descriptor structs it imports, which is longer than any
      # of them. It is only built under `cuda-13,abi`, and this line was the
      # only place that spelling was built at all.
      #
      # `cargo test --no-run` rather than `cargo build --all-targets`: they
      # compile the same set, and the first says what the compile is FOR.
      - name: cargo build (every feature spelling, every target)
        run: |
          # `cuda-13,bridge` STOOD HERE. `bridge` is retired (north star §6)
          # and naming a feature that does not exist is a hard cargo error,
          # so this line had to go in the same commit as the manifest.
          #
          # `abi` is what covers it: `abi = ["bridge", …]` until this commit
          # and `["_cuda", …]` after, so the configuration this step actually
          # built under both spellings is the one below. The spelling that
          # went was a strict subset, not a distinct configuration.
          cargo test -p driver-cuda --features cuda-13,abi --no-run --all-targets

          # `model-loader`'s CUDA half is the same hole from the other side.
          # Its `executor::cuda` is `feature = "cuda"`, and its lib TEST is
          # where the four tile-map symbols are resolved against
          # `kernels_cuda::routine` — the check that a plan cannot name a
          # kernel this build has no host program for. Nothing built it: the
          # workspace sweeps take the crate without the feature, and the
          # feature was only ever reached transitively through `driver-cuda`,
          # which does not compile a dependency's tests.
          cargo test -p model-loader --features cuda-13 --no-run --all-targets

      - name: cargo build (driver-cuda)
        run: |
          cargo build -p worker \
            --no-default-features --features driver-cuda-13

      - name: Native CUDA entrypoint validation
        run: |
          CUDA_BUILD_DIR="$(find target/debug/build -type d \
            -path '*/out/cuda/build' -print -quit)"
          test -n "$CUDA_BUILD_DIR"
          cmake --build "$CUDA_BUILD_DIR" \
            --target test_entry_validation test_pipeline_dispatch_bind
          ctest --test-dir "$CUDA_BUILD_DIR" --output-on-failure \
            -R '^(entry_validation|pipeline_dispatch_bind)$'

      # The 66 test and bench executables under csrc/. `cargo build -p
      # driver-cuda` asks CMake for `pie_driver_cuda_lib` and stops, so these
      # were configured by CMake and built by no command anyone runs -- eleven
      # kernel-family renames landed green across them, leaving a dead
      # `namespace ops` alias, call sites naming a `kernels` not in scope, and
      # 27 XQA kernels defined in a namespace their only caller did not use.
      # That last one cannot fail a compile: `cargo build -p driver-cuda`
      # produces an rlib and never links.
      - name: Build every driver-cuda harness (66 targets)
        run: |
          CUDA_BUILD_DIR="$(find target/debug/build -type d \
            -path '*/out/cuda/build' -print -quit)"
          test -n "$CUDA_BUILD_DIR"
          cmake --build "$CUDA_BUILD_DIR" --target pie_driver_cuda_checks

      - name: Verify no CUDA shared deps
        run: |
          ldd target/debug/pie
          ldd target/debug/pie | grep -E "libcudart|libcublas|libcublasLt" \
            && { echo "FAIL: CUDA shared lib leaked into binary"; exit 1; } \
            || echo "OK: no CUDA shared deps"
