name: ci

# What can be checked without a GPU, which is the front end and the lint. The
# device parser needs CUDA and is checked by `gpu.yml` on a self-hosted runner;
# splitting them keeps a front-end regression from waiting on hardware.

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The workspace builds with no warnings, so a new one is a failure
      # rather than something to scroll past.
      - name: build
        run: cargo build --release --manifest-path rust/Cargo.toml
        env:
          RUSTFLAGS: -D warnings
      - name: clippy
        run: cargo clippy --release --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: test
        run: cargo test --release --manifest-path rust/Cargo.toml

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: lint
        run: uvx ruff check src tests
      - name: format check
        run: uvx ruff format --check --diff src/gpugrammar

  # The library shipped as a wheel that installed and then failed to import,
  # because the build backend was plain setuptools and the extension is a Rust
  # cdylib. Nothing caught it, so this builds the wheel and imports it in a
  # clean environment - which needs no GPU, since compiling is host work.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - name: build the wheel
        run: uvx maturin build --release --out dist
      - name: install it somewhere clean and use it
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          uv run --python /tmp/clean/bin/python python - <<'PY'
          import json
          import gpugrammar
          engine = gpugrammar.Engine([bytes([i]) for i in range(256)])
          grammar = engine.compile_json_schema(
              json.dumps({"type": "object", "properties": {"a": {"type": "string"}}})
          )
          assert grammar.approximations is not None
          # The budget on the regex path, which is the one a request supplies.
          try:
              engine.compile_regex("(a|b)*a" + "(a|b)" * 24)
          except gpugrammar.CompileError as refusal:
              assert refusal.stage == "lexer", refusal.stage
          else:
              raise SystemExit("an exponential pattern was not refused")
          print("the wheel imports and compiles")
          PY
      # A hosted runner has no CUDA toolkit, so `build.rs` finds no nvcc and
      # embeds an empty fatbin. That degradation is deliberate - the front end
      # must stay buildable by a contributor without CUDA - and it is worth
      # asserting either way, because both halves fail silently: a wheel that
      # ships no kernels looks identical to one that does until something runs.
      - name: without a toolkit, no kernels, and the front end still works
        run: |
          uv run --python /tmp/clean/bin/python python -c "
          from gpugrammar import _gpugrammar as g
          assert not g.cuda_available(), 'a runner with no nvcc produced kernels'
          print('no toolkit, no kernels, front end fine')"

  # The one thing a hosted runner cannot do. Everything here needs a real
  # device: the kernels are CUDA, the step is a CUDA graph, and the
  # verifications compare the device against the reference matcher row by row.
  gpu:
    runs-on: [self-hosted, cuda]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - name: build the extension
        run: |
          uvx maturin build --release --out dist
          uv venv
          uv pip install torch triton numpy
          uv pip install --no-deps dist/*.whl
      # This runner has nvcc, so the wheel it just built must carry kernels.
      # The whole point of the fatbin is that nothing compiles at run time, so
      # a build that quietly found no nvcc has to be a failure here.
      - name: the wheel carries CUDA kernels
        run: |
          uv run python -c "
          from gpugrammar import _gpugrammar as g
          assert g.cuda_available(), 'nvcc is present but no kernels were embedded'
          print(f'{g.cuda_fatbin_bytes()} bytes of fatbin')"
      - name: tests
        run: uv run --with numpy python -m unittest discover -s tests
        env:
          PYTHONPATH: src
      # The port's safety net. Both backends on the same input, compared word
      # for word, and any disagreement fails the run. The verifications below
      # check a backend against the reference matcher, which finds a wrong
      # answer but not one both backends would share; this finds any
      # difference at all, which is what a port needs.
      - name: the two backends agree
        run: |
          uv run --with numpy python -m unittest discover -s tests
          uv run python -m gpu_lr1.verify --quick
        env:
          PYTHONPATH: src
          GPUGRAMMAR_BACKEND: differential
      # Not unit tests. Each walks real documents through the device and
      # compares the mask word for word against the reference matcher, which
      # is the only thing that can see a mask that narrowed - and it is what
      # has caught every kernel bug in this project. `--quick` is ~80 s.
      - name: verify against the reference matcher
        run: uv run python -m gpu_lr1.verify --quick
        env:
          PYTHONPATH: src
