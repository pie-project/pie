name: Release PyPI Package

# One package per run. `pie-server` depends on `pie-client`: publish
# `pie-client` first when it changed. `pie-server` is an abi3 wheel per
# platform, each with every engine that platform supports.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        required: true
        type: choice
        options: [pie-client, inferlet, pie-server]
      dry_run:
        description: Build and validate, do not publish
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pure:
    name: "${{ inputs.package }}: build"
    if: inputs.package != 'pie-server'
    runs-on: ubuntu-latest
    env:
      DIR: python/${{ inputs.package == 'pie-client' && 'client' || 'inferlet' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build pytest
      - name: tests
        run: |
          case "$DIR" in
            python/client)   python -m pip install -e "$DIR" && python -m pytest -q "$DIR/tests" ;;
            python/inferlet) PYTHONPATH="$DIR/src" python -m pytest -q "$DIR/tests" ;;
          esac
      # The unit tests stub `wit_world`; a componentize-py build resolves every
      # WIT import against `crates/inferlet/wit` for real.
      - name: a component builds against the inferlet library
        if: inputs.package == 'inferlet'
        run: |
          python -m pip install componentize-py
          mkdir -p "$RUNNER_TEMP/app"
          cat > "$RUNNER_TEMP/app/app.py" <<'PY'
          from inferlet import chat, model, reasoning, session, tokenizer
          from wit_world.exports import Run as RunBase

          class Run(RunBase):
              async def run(self, input: str) -> str:
                  _ = (model.name(), model.pass_kind(), model.frame_size(), model.rs_state_size(),
                       tokenizer.encode("hi"), chat.stop_tokens(), chat.Decoder(), reasoning.Decoder())
                  session.send(input)
                  return "ok"
          PY
          bash scripts/check-inferlet-interfaces.sh
          componentize-py -d crates/inferlet/wit -w inferlet componentize \
            -p "$RUNNER_TEMP/app" -p python/inferlet/src -p python/inferlet/src/inferlet/bindings \
            app -o "$RUNNER_TEMP/app/app.wasm"
      - run: python -m build "$DIR"
      - uses: actions/upload-artifact@v6
        with:
          name: dist-pure
          path: ${{ env.DIR }}/dist
          if-no-files-found: error

  wheel:
    if: inputs.package == 'pie-server'
    name: "pie-server: wheel (${{ matrix.target.label }})"
    strategy:
      fail-fast: false
      matrix:
        target:
          # Linux on ubuntu-22.04 (glibc 2.35, so manylinux_2_35): the Slang
          # release that compiles the Vulkan kernels needs 2.34.
          - { label: linux-x86_64,  runner: ubuntu-22.04,       triple: x86_64-unknown-linux-gnu,  features: 'cuda,vulkan,wgpu', manylinux: manylinux_2_35 }
          - { label: linux-aarch64, runner: ubuntu-22.04-arm,   triple: aarch64-unknown-linux-gnu, features: 'cuda,vulkan,wgpu', manylinux: manylinux_2_35 }
          - { label: macos-arm64,   runner: macos-15,           triple: aarch64-apple-darwin,      features: 'metal,wgpu' }
          - { label: windows-x64,   runner: windows-large-x64,  triple: x86_64-pc-windows-msvc,    features: 'cuda,vulkan' }
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          triple: ${{ matrix.target.triple }}
          features: ${{ matrix.target.features }}
          cache-key: release-pie-server-${{ matrix.target.label }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - shell: bash
        run: |
          python3 -m pip install maturin
          cd python/server
          python3 -m maturin build --profile release-min --target ${{ matrix.target.triple }} \
            --no-default-features --features ${{ matrix.target.features }} --out dist \
            ${{ matrix.target.manylinux && format('--compatibility {0}', matrix.target.manylinux) || '' }}
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.target.label }}
          path: python/server/dist
          if-no-files-found: error

  sdist:
    name: "pie-server: sdist"
    if: inputs.package == 'pie-server'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install maturin && maturin sdist --out dist
        working-directory: python/server
      - uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: python/server/dist
          if-no-files-found: error

  publish:
    name: "pypi: check + publish"
    needs: [pure, wheel, sdist]
    if: >-
      always() && !cancelled()
      && (inputs.package == 'pie-server' || needs.pure.result == 'success')
      && (inputs.package != 'pie-server' || (needs.wheel.result == 'success' && needs.sdist.result == 'success'))
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade twine && ls -la dist && python -m twine check dist/*
      - name: smoke test
        run: |
          python -m venv smoke
          case "${{ inputs.package }}" in
            pie-client) smoke/bin/pip install dist/*.whl && smoke/bin/python -c "import pie_client" && smoke/bin/pie-client --help >/dev/null ;;
            inferlet)   smoke/bin/pip install dist/*.whl && smoke/bin/pip show inferlet >/dev/null ;;  # `import inferlet` needs a componentize-py build
            pie-server) smoke/bin/pip install dist/pie_server-*-manylinux*x86_64.whl && smoke/bin/python -c "from pie import _engine; from pie.config import Config; print(Config().to_toml())" ;;
          esac
      - if: inputs.dry_run == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
