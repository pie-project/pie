name: Release Cargo Packages

# `inferlet` and `pie-client` are the public crates; the `pie-` prefixed ones
# are the internals they depend on, published so crates.io can resolve them.
# `inferlet` carries the `pie:inferlet` WIT package itself, so a WIT bump is
# released by publishing `inferlet`.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify, do not publish
        type: boolean
        default: false

permissions:
  contents: read

env:
  PACKAGES: -p pie-dtype -p pie-eta-ir -p pie-eta-dsl -p inferlet-macros -p inferlet -p pie-client-api -p pie-client

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test $PACKAGES
      - run: cargo publish $PACKAGES ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
