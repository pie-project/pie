name: Release Cargo Package

on:
  workflow_dispatch:
    inputs:
      # `inferlet` carries the `pie:inferlet` WIT package itself (crates/
      # inferlet/wit, kept in the archive by `include`), so a WIT bump is
      # released by publishing `inferlet` — there is no separate contract
      # crate to order ahead of it. `inferlet-macros` is still independent.
      package:
        description: 'Package to release'
        required: true
        type: choice
        options:
          - pie-client (crates/client/)
          - inferlet (crates/inferlet/)
          - inferlet-macros (crates/inferlet-macros/)
      dry_run:
        description: 'Dry run (build but do not publish)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Determine package path
        id: info
        run: |
          case "${{ inputs.package }}" in
            "pie-client (crates/client/)")
              echo "path=crates/client" >> $GITHUB_OUTPUT
              echo "name=pie-client" >> $GITHUB_OUTPUT
              ;;
            "inferlet (crates/inferlet/)")
              echo "path=crates/inferlet" >> $GITHUB_OUTPUT
              echo "name=inferlet" >> $GITHUB_OUTPUT
              ;;
            "inferlet-macros (crates/inferlet-macros/)")
              echo "path=crates/inferlet-macros" >> $GITHUB_OUTPUT
              echo "name=inferlet-macros" >> $GITHUB_OUTPUT
              ;;
          esac
      
      - name: Check package
        working-directory: ${{ steps.info.outputs.path }}
        run: cargo check
      
      - name: Run tests
        working-directory: ${{ steps.info.outputs.path }}
        run: cargo test
      
      - name: Dry run - publish
        if: inputs.dry_run == true
        working-directory: ${{ steps.info.outputs.path }}
        run: cargo publish --dry-run --allow-dirty
      
      - name: Publish to crates.io
        if: inputs.dry_run == false
        working-directory: ${{ steps.info.outputs.path }}
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
