name: Release Cargo Package

# `inferlet` carries the `pie:inferlet` WIT package itself, so a WIT bump is
# released by publishing `inferlet`; `inferlet-macros` is independent.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Crate to release
        required: true
        type: choice
        options: [client, inferlet, inferlet-macros]
      dry_run:
        description: Build and verify, do not publish
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ${{ inputs.package }}
      - run: cargo publish -p ${{ inputs.package }} ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
