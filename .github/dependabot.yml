version: 2
# Once a month, one pull request per ecosystem carrying every update it has.
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directories:
      - "/packages/python/client"
      - "/packages/python/inferlet"
      - "/packages/python/server"
    schedule:
      interval: "monthly"
    groups:
      pip:
        patterns: ["*"]

  # The npm workspace: one lockfile for client, inferlet, browser and server.
  - package-ecosystem: "npm"
    directory: "/packages/javascript"
    schedule:
      interval: "monthly"
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
