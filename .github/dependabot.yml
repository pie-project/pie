version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directories:
      - "/python/client"
      - "/python/inferlet"
      - "/python/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The npm workspace: one lockfile for client, inferlet, browser and server.
  - package-ecosystem: "npm"
    directory: "/javascript"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
