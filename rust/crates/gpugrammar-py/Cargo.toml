[package]
name = "gpugrammar-py"
description = "Python bindings for the gpugrammar compiler and reference runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_gpugrammar"
crate-type = ["cdylib"]

[dependencies]
mimalloc = { version = "0.1", default-features = false }
anyhow.workspace = true
gpugrammar-ir = { path = "../gpugrammar-ir" }
gpugrammar-lex = { path = "../gpugrammar-lex" }
gpugrammar-lr = { path = "../gpugrammar-lr" }
gpugrammar-run = { path = "../gpugrammar-run" }
gpugrammar-tables = { path = "../gpugrammar-tables" }
rustc-hash.workspace = true
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"] }

[lints]
workspace = true
