[package]
name = "pie-plan"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
authors = ["In Gim <in.gim@yale.edu>"]
description = "PTIR execution planning: normalization, stage signatures, value-domain analysis, region partitioning, and the lane-table ABI, produced as in-memory stage plans that emission consumes directly."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
keywords = ["pie", "tensor", "ir", "ptir", "compiler"]

[lib]
name = "pie_plan"
crate-type = ["rlib"]
path = "src/lib.rs"

# The planner is `no_std` (+ `alloc`) and has no error type of its own, so
# `std` (default) does nothing here but forward to `pie-ir`, whose decode and
# validate errors carry the `std::error::Error` impls.
[features]
default = ["std"]
std = ["pie-ir/std"]

[dependencies]
pie-ir = { path = "../ir", default-features = false }

# Shared ratchet from the root manifest. These six crates are gated with
# `-D warnings` in CI; see `[workspace.lints]` in the workspace `Cargo.toml`.
[lints]
workspace = true
