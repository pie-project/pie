[package]
name = "pie-codegen"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
authors = ["In Gim <in.gim@yale.edu>"]
description = "Backend source emission for PTIR: the deterministic C ABI header and the CUDA/C++ and MSL projections of the RNG contract, generated from the IR tables so host and device cannot drift."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
keywords = ["pie", "tensor", "ir", "ptir", "codegen"]

[lib]
name = "pie_codegen"
crate-type = ["rlib"]
path = "src/lib.rs"

# Host-side only: this crate writes the generated files in `include/`, emits
# backend kernel source, and builds the launch package. `pie-plan` supplies the
# stage plans it emits from and the cache-identity versions the header pins;
# `pie-driver-abi` is the shared host<->driver contract, so the launch package
# is built out of the same declarations the drivers read it with rather than a
# second copy of them.
[dependencies]
pie-ir = { path = "../ir" }
pie-plan = { path = "../plan" }
pie-driver-abi = { path = "../../interface/driver" }

# Shared ratchet from the root manifest. These six crates are gated with
# `-D warnings` in CI; see `[workspace.lints]` in the workspace `Cargo.toml`.
[lints]
workspace = true
