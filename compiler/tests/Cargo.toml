[package]
name = "pie-compiler-tests"
version = "0.1.0"
edition = "2024"
description = "Conformance suite for the PTIR toolchain: golden traces, the malformed-wire corpus, generated-artifact drift checks, and cross-implementation parity. Test-only — it ships no library."
license = "Apache-2.0"
publish = false

[dev-dependencies]
pie-ir = { path = "../ir" }
pie-plan = { path = "../plan" }
pie-eval = { path = "../eval" }
pie-codegen = { path = "../codegen" }
pie-driver-abi = { path = "../../interface/driver" }

# Shared ratchet from the root manifest. These six crates are gated with
# `-D warnings` in CI; see `[workspace.lints]` in the workspace `Cargo.toml`.
[lints]
workspace = true
