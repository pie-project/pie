[workspace]
resolver = "3"
members = [
    "crates/bootstrap",
    "crates/runtime",
    "crates/controller",
    "crates/gateway",
    "crates/worker",
    "crates/client",
    "crates/transport",
    "crates/tokenizer",
    "crates/grammar",
    "crates/waker",
    "crates/ids",
    "crates/dtype",

    "crates/client-api",
    "crates/controller-api",
    "crates/worker-api",
    "crates/engine",

    "crates/model-exec",
    "crates/eta-exec",

    "crates/checkpoint",
    "crates/ztensor",
    "crates/ztensor-compat",

    "crates/eta-ir",
    "crates/eta-dsl",
    "crates/eta-compiler",

    "crates/inferlet",
    "crates/inferlet-macros",

    "crates/model-ir",
    "crates/model-dsl",
    "crates/model-compiler",
    "crates/models",
    "crates/checkpoint-dsl",
    "crates/chat-template",
    "crates/kernels-cuda",
    "crates/kernels-metal",
    "crates/engine-cuda",
    "crates/engine-metal",
    "crates/kernels-vulkan",
    "crates/engine-vulkan",
    "crates/kernels-wgpu",
    "crates/engine-wgpu",

    "sdk/server/python",
]
default-members = [
    "crates/bootstrap",
    "crates/runtime",
    "crates/controller",
    "crates/gateway",
    "crates/worker",
    "crates/client",
    "crates/transport",
    "crates/tokenizer",
    "crates/grammar",
    "crates/waker",
    "crates/ids",
    "crates/dtype",
    "crates/client-api",
    "crates/controller-api",
    "crates/worker-api",
    "crates/engine",
    "crates/model-exec",
    "crates/eta-exec",
    "crates/models",
    "crates/model-ir",
    "crates/model-dsl",
    "crates/checkpoint-dsl",
    "crates/model-compiler",
    "crates/checkpoint",
    "crates/ztensor",
    "crates/ztensor-compat",
    "crates/kernels-cuda",
    "crates/kernels-metal",
    "crates/kernels-vulkan",
    "crates/engine-vulkan",
    "crates/kernels-wgpu",
    "crates/engine-wgpu",
    "crates/eta-ir",
    "crates/eta-dsl",
    "crates/eta-compiler",
    "crates/inferlet-macros",
    "sdk/server/python",
]
exclude = [
    "tests/inferlets",
    ".claude",
]

[package]
name = "pie"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The pie standalone: multi-call CLI (local/serve + ops) composing the bootstrap skeleton and the controller/gateway/worker role libs in-proc, plus the three role daemons."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "pie"
path = "src/lib.rs"

[[bin]]
name = "pie"
path = "src/main.rs"

[[bin]]
name = "pie-controller"
path = "src/bin/pie-controller.rs"

[[bin]]
name = "pie-gateway"
path = "src/bin/pie-gateway.rs"

[[bin]]
name = "pie-worker"
path = "src/bin/pie-worker.rs"

[features]
default = []
cuda = ["worker/cuda"]
metal = ["worker/metal"]
vulkan = ["worker/vulkan"]
wgpu = ["worker/wgpu"]
profile-fire = ["worker/profile-fire"]

[dependencies]
bootstrap = { path = "crates/bootstrap" }
controller = { path = "crates/controller" }
gateway = { path = "crates/gateway" }
worker = { path = "crates/worker", default-features = false }
runtime = { path = "crates/runtime" }
models = { path = "crates/models" }
checkpoint = { path = "crates/checkpoint" }
checkpoint-dsl = { path = "crates/checkpoint-dsl" }
ztensor = { workspace = true }
tokenizer = { path = "crates/tokenizer" }
client = { path = "crates/client" }
ids = { path = "crates/ids" }
controller-api = { path = "crates/controller-api" }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
toml = "1.1"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "blocking", "stream"] }
tar = "0.4"
xz2 = "0.1"
toml_edit = "0.25.13"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[workspace.package]
version = "0.5.0"

rust-version = "1.91"

[workspace.dependencies]
linkme = "0.3"
inventory = "0.3"
ztensor = { path = "crates/ztensor" }
ztensor-compat = { path = "crates/ztensor-compat" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release-min]
inherits = "release"
lto = "thin"
strip = "symbols"
