# Top-level Cargo workspace for the host-side Rust crates.
#
# ONE workspace, ONE lockfile. Every Rust crate in the repo is a member and
# lives under `crates/`; the only Rust outside it is `sdk/server/python`, which
# stays beside the python package it ships with (maturin convention).
#
# Guest-target crates (`crates/inferlet`, wasm32-wasip2) are MEMBERS but sit
# outside `default-members`: that is what gives them this lockfile — the old
# excluded `sdk/rust` workspace resolved tensor-dsl a second, independent time —
# while keeping them out of host sweeps. CI builds them explicitly with
# `--target wasm32-wasip2`. `tests/inferlets` stays excluded: those carry their
# own lockfiles on purpose, as fixtures of a published guest contract.
[workspace]
# Resolver 3 is the edition-2024 default and is MSRV-aware: it will not pick a
# dependency version that needs a newer rustc than the `rust-version` declared
# below. Nothing in the current lockfile changes under it — the point is that a
# future `cargo update` cannot silently raise the floor.
resolver = "3"
members = [
    # -- serving fabric and its foundation leaves (bare names) ---------------
    # Process skeleton: CLI flag skeleton, path/config sourcing, tracing +
    # /metrics, signal/panic/exit lifecycle. Depends on no role lib. Also ships
    # the `pie-env` diagnostic bin ("do this role's boot preconditions hold").
    "crates/bootstrap",
    "crates/engine",
    # Role libraries (pure libs: run(Config) -> Handle; no bin, never dep each other).
    "crates/controller",
    "crates/gateway",
    "crates/worker",
    "crates/client",
    "crates/transport",
    # Keystone leaf: BPE tokenizer (encode/decode) loaded from HF tokenizer.json.
    "crates/tokenizer",
    # Constrained-decoding grammar engine (EBNF/regex/json-schema/matcher/bitmask).
    "crates/grammar",
    # X0 tensor-waker substrate (leaf crate; loom-model-checked in isolation).
    "crates/waker",
    # Id atoms, serde leaf — what the roles and the contracts all sit on.
    "crates/ids",

    # -- boundary contracts, suffix-named after their subject ---------------
    # `-api` = wire/message contract. They stay extracted because roles never
    # dep each other and bidirectional pairs would cycle.
    #
    # `-abi` was the other suffix, for the repr(C) FFI contract, and no crate
    # carries it any more: every driver on the far side is Rust, so the
    # marshalling shapes went and `driver-api` is owned Rust types with one
    # `#[repr(C)]` survivor that earns it. See `driver-api/src/local.rs`.
    "crates/client-api",
    "crates/controller-api",
    "crates/worker-api",
    "crates/driver-api",

    # -- driver-*: execution shells ----------------------------------------
    # The PTIR channel plane, shared by both Rust shells. It was `src/pipeline/`
    # inside `driver-metal` until the CUDA shell reached the same file, and
    # the move cost nothing because not one line of it named a Metal type --
    # the directory already built and tested on Linux while the crate around it
    # did not. A `default-member`, unlike every driver below it: it needs no
    # GPU, no toolkit and no OS, so there is no reason a workspace sweep should
    # not carry its tests.
    "crates/driver",

    # -- model-*: what a model IS, and how it gets onto a device ------------
    # Weight loader: checkpoints -> verified device-memory layouts. Consumed by
    # drivers at cold start, not by the serving runtime. One crate: the drivers
    # link the rlib and pass Rust types, and a device's arena crosses as an
    # `ArenaBacking` rather than as a second executor inside each driver.
    "crates/model-loader",

    # -- tensor-*: the guest-program toolchain ------------------------------
    # authoring eDSL -> PTIR -> planning -> CUDA/Metal codegen, plus the
    # reference interpreter every backend diffs against.
    "crates/tensor-ir",
    "crates/tensor-dsl",
    "crates/tensor-compiler",

    # -- guest-target members (outside default-members, see below) ----------
    # `inferlet` owns the canonical `pie:inferlet` WIT package (`wit/`) AND is
    # the wit-bindgen site over it -- it has to be both, because `generate!`
    # resolves its path on the filesystem and this crate is published. It is a
    # guest crate because the generated import shims are wasm, even though the
    # host reads its `wit/` directory by path.
    "crates/inferlet",
    "crates/inferlet-macros",

    # -- menlo: the typed-IR rewrite (.wiki/menlo/design.md) ------------------
    # The old model/kernel stack (string plans, #[points], claim tables, the
    # per-plane baker shells) was deleted in one commit and these took the
    # names. Layering: model-ir is a leaf of pure data; kernels is the
    # dispatch contract; kernels-* are entry functions with no IR knowledge;
    # kernels also carries the one walk written over that contract;
    # driver-* own the Run.
    # The IR: typed op enums, Def x Ty value declarations, the validator.
    "crates/model-ir",
    # The authoring surface: Recorder/Value, wrappers that own their shapes.
    "crates/model-dsl",
    # The model catalog: six forwards on the new surface, SKU names verbatim.
    "crates/model",
    # The dispatch contract (15 traits, aggregate exec) and the shared walk.
    "crates/kernels",
    # Pure CUDA kernel definitions: jit machinery, owned attention plans,
    # NCCL collectives; device text carried in-tree.
    "crates/kernels-cuda",
    # Pure Metal kernel definitions over the encode sink.
    "crates/kernels-metal",
    # The CUDA Run: one resolver, host-twin geometry, plan staging.
    "crates/driver-cuda",
    # The Metal Run over dyn Encode -- OS-portable like the walk it uses.
    "crates/driver-metal",

    # -- Rust that lives outside crates/ on purpose -------------------------
    # The python SDK's backend: pyo3/maturin want the Rust half beside its
    # product, not in the workspace tree.
    "sdk/server/python",
    # The engine's on-device end-to-end suite. No code of its own; it exists so
    # that `cargo test -p pie` means the CLI's own tests rather than
    # "compile thirty GPU test binaries". Almost everything in it is `#[ignore]`d
    # and asks for a real device.
    "tests/gpu",
]
# Host sweeps (`cargo check`, `cargo test` with no `-p`/`--workspace`) run this
# set. It is every member except the wasm32-wasip2 guest crate, which has no
# host target and would fail the sweep it is not part of.
default-members = [
    "crates/bootstrap",
    "crates/engine",
    "crates/controller",
    "crates/gateway",
    "crates/worker",
    "crates/client",
    "crates/transport",
    "crates/tokenizer",
    "crates/grammar",
    "crates/waker",
    "crates/ids",
    "crates/client-api",
    "crates/controller-api",
    "crates/worker-api",
    "crates/driver-api",
    "crates/driver",
    # The three shader drivers stood here through R2's quarantine and are out
    # of the workspace altogether now — see `exclude`.
    "crates/model",
    "crates/model-ir",
    "crates/model-dsl",
    "crates/model-loader",
    "crates/kernels",
    "crates/kernels-cuda",
    "crates/kernels-metal",
    "crates/tensor-ir",
    "crates/tensor-dsl",
    "crates/tensor-compiler",
    "crates/inferlet-macros",
    "sdk/server/python",
    "tests/gpu",
]
exclude = [
    # ALL THREE SHADER PLANES ARE IN THE WORKSPACE NOW. `driver-metal` came
    # back at P5a, `driver-wgpu` at P5b and `driver-vulkan` at P5c; this list
    # held the last of them for the whole of the quarantine and holds none.
    "tests/inferlets",
    # Worktree checkouts under .claude/worktrees/ must never be captured by
    # THIS manifest when cargo walks up from a worktree's excluded package
    # (e.g. .claude/worktrees/<x>/tests/inferlets/<name> — the worktree's own root
    # excludes it, so the walk continues up to here).
    ".claude",
]

# Shared package metadata. Opt in per field with `<field>.workspace = true`;
# today only the `compiler/*` crates do.
# ── The `pie` package ────────────────────────────────────────────────
#
# The root is a package as well as the workspace (the wasmtime pattern):
# `cargo run` here boots the standalone. It used to be `bin/pie`, one of four
# thin bin shells; the other three ride this same package as `src/bin/*`.
#
# That costs nothing, because `pie` already depended on all three role libs --
# it is the composition root, the one crate that deps controller AND gateway
# AND worker. Four packages whose union of dependencies equals one of them is
# four manifests to keep in step for no boundary.
[package]
name = "pie"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The pie standalone: multi-call CLI (local/serve + ops) composing the bootstrap skeleton and the controller/gateway/worker role libs in-proc, plus the three role daemons."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "pie"
path = "src/lib.rs"

[[bin]]
name = "pie"
path = "src/main.rs"

# The three role daemons. `src/bin/<name>.rs` names the binary, which is why
# the files are hyphenated: the user-facing commands are unchanged.
[[bin]]
name = "pie-controller"
path = "src/bin/pie-controller.rs"

[[bin]]
name = "pie-gateway"
path = "src/bin/pie-gateway.rs"

[[bin]]
name = "pie-worker"
path = "src/bin/pie-worker.rs"

[features]
# This package selects the driver backend; it forwards the flavors to the
# embedded worker. Default = none, and none means none: the always-linked
# `Dummy` flavor that used to catch a featureless build went with its crate,
# so `pie config init` refuses rather than writing a config naming it. Enable
# driver-cuda-12 / driver-cuda-13 for real inference.
default = []
# NVIDIA. The number is the CUDA runtime ABI the binary will LOAD, and it is
# in the name because this is the last package in the chain -- the one that
# actually produces a binary, and so the one where guessing is unrecoverable.
# `driver-cuda` STOOD HERE and meant `cuda-13` silently; the release workflow
# built six `cuda12.8`-labelled artifacts through it. See `crates/engine`.
_driver-cuda = ["worker/_driver-cuda"]
driver-cuda-12 = ["_driver-cuda", "worker/driver-cuda-12"]
driver-cuda-13 = ["_driver-cuda", "worker/driver-cuda-13"]
# BACK, forwarding to `worker`. No ABI in the name because Metal has none to
# choose: `driver-metal/metal-4` is the device half's gate and the version it
# states. Apple-only, and the seam that reads it says so with a target cfg
# rather than this flag -- so a non-Apple build with the feature on is a build
# with no metal seam in it, not a link error.
driver-metal = ["worker/driver-metal"]
# Probe passthroughs to the embedded worker (→ runtime).
profile-fire = ["worker/profile-fire"]

[dependencies]
# Shared process skeleton (imports as `bootstrap`): CLI flags, paths, tracing,
# signals, /metrics, banner.
bootstrap = { path = "crates/bootstrap" }
# The three role libs — this is the ONE package that deps all three (Seam 4).
controller = { path = "crates/controller" }
gateway = { path = "crates/gateway" }
worker = { path = "crates/worker", default-features = false }
engine = { path = "crates/engine" }  # program/manifest types for `pie inferlet`
# `pie model import` — the host-side load-plan executor and checkpoint
# writer. Pure Rust; needs no driver and no GPU.
model-loader = { path = "crates/model-loader" }
# The tokenizer compiler — `pie model import` runs it once and serializes the
# result into the artifact (`pie.tokenizer/1`), so the runtime never parses
# `tokenizer.json` again.
tokenizer = { path = "crates/tokenizer" }
# `model-config` STOOD HERE, the HF `config.json` normalizer. It is gone, and
# the config now rides into the artifact verbatim under `CONFIG_OBJECT` below.
# Client edge for `pie config tune`: the sweep generates load through
# the same websocket path a deployment is reached by, because measuring an
# in-process shortcut would measure something nobody runs.
client = { path = "crates/client" }
# THE CATALOG, and after R3 there is one. This line read `model-legacy` and
# carried `features = ["contract"]`, because `pie model build` authored that
# crate's load contract and `pie model import` applied its per-family ingest
# pass. Both are deleted (see `src/ops/model.rs`), and what is left needs
# three things from this crate. `pie model import` needs
# `serve::encoding::CONFIG_OBJECT`, the object name the checkpoint's own
# `config.json` is carried into an artifact under -- a literal here would be a
# second definition of something a reader elsewhere has to match exactly, and
# a mismatch does not fail, the read just finds nothing. `pie model list`
# needs `snapshot::Snapshot` and `identify`, because "can pie serve this?" is
# now a question about a checkpoint's tensor names and not about a table of HF
# `model_type` strings. None of the three is behind the `serve` feature.
model = { path = "crates/model" }
# Wire vocabulary — compose.rs names control-plane types (RoutingTable, Ack,
# GatewayInfo, WorkerInfo, Neighbors, WorkerStatus) from pie-controller-rpc and
# the id atoms (WorkerId/GatewayId/NodeId) from pie-ids.
ids = { path = "crates/ids" }
controller-api = { path = "crates/controller-api" }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
toml = "1.1"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# R3 weight/runtime provisioning downloaders — these live ONLY here (the worker
# lib links zero provisioning machinery). `reqwest` carries `blocking` because
# the CLI `runtime install` download is synchronous; the HF snapshot fetch in
# `local::hf::download` is async and streams.
#
# `rustls-no-provider`, not `rustls`: reqwest's `rustls` feature hard-selects
# the aws-lc backend (`rustls = ["__rustls-aws-lc-rs", ...]`), whose build
# script was the single most expensive unit in a cold build and a second crypto
# backend beside the `ring` the client crate and wasmtime-wasi-http already
# link. `bootstrap::install_crypto_provider` picks ring at process boot.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "blocking", "stream"] }
tar = "0.4"
xz2 = "0.1"
toml_edit = "0.25.13"

[dev-dependencies]
tempfile = "3"
# The `client` dev-dep STOOD HERE for `tests/boot_smoke.rs`, which drove
# `run_standalone` the way a client does. That test is deleted (`src/lib.rs`
# says so) and `client` is a plain dependency of this package besides, so the
# line named a reason that no longer exists for an edge that already did.


# SIGPIPE disposition — see `die_quietly_on_closed_pipe` in main.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[workspace.package]
# The floor is verified, not assumed: `cargo +1.91.1 check --all-targets` builds
# all six compiler crates. `rust-toolchain.toml` pins 1.97.1 because that is the
# version CI's `-D warnings` gate is calibrated against, but pinning a toolchain
# is not the same claim as requiring one — a consumer of `tensor-ir` needs only
# what the source actually uses.
#
# Lowering this further needs a toolchain to check it against; raising it needs
# a reason in the diff. Either way the number is a measurement, so re-measure
# rather than edit it to match whatever is installed.
rust-version = "1.91"

# The checkpoint readers, in one place because releasing them is a two-repo
# dance: `ztensor` owns the container format and its validation,
# `ztensor-compat` owns the foreign-format projections.
#
# An ordinary version requirement. It was a revision-pinned git dependency
# while the two were developed together, which `Cargo.lock` not being tracked
# here made necessary: a branch would have resolved to whatever v2's tip was at
# clone time, and v2 moved under us.
#
# The patch is named, not just `"2.1"`, because 2.1.1 broke the API on purpose
# and says so in its changelog. This is still a caret range — it does not pin —
# but it puts the floor above the break, so no resolution can land on 2.1.0 and
# fail to compile. `Cargo.lock` is not tracked here, which is what makes the
# floor the only thing deciding that.
#
# 2.1.0 put the modules on the spec's layers (`format` is L0+L1 and opens no
# file, `provide` is the projection face) and scoped the object builders. 2.1.1
# narrowed what is left: bytes are reached through `Tensor::data`, since the
# nine shorthands for it addressed one part while `verify` on the same receiver
# covered them all, and `Part::bytes` hands back a `Cow` rather than a
# lookalike of one.
[workspace.dependencies]
# THE ROUTINE REGISTRY. `#[routine]` emits a row beside its `fn`, and a
# distributed slice is what collects them without a list: each row lands in a
# `linkme_ROUTINES` link section and the linker hands back the bounds, so
# nothing enumerates and nothing can be left out of an enumeration.
#
# Chosen over `inventory` because it needs no life-before-main constructor --
# the slice IS the section, resolved at link time, so the first read costs
# nothing. Its two documented hazards do not reach this tree: every crate here
# is an `rlib` (no `staticlib` a foreign linker would half-swallow), and the
# collection was measured surviving `lto = "thin"`, `lto = "fat"`,
# `strip = "symbols"` and `--gc-sections`.
#
# IT DOES NOT REACH `wasm32-unknown-unknown`, and that is why the crate below
# is here beside it. A distributed slice is a link SECTION whose bounds the
# linker is asked for, and the wasm object format offers no such facility, so
# `linkme` refuses the target by name: "distributed_slice is not implemented
# for this platform" (dtolnay/linkme#86 -- not an omission, a missing
# primitive). `driver-wgpu/tests/browser.rs` claims the kernel table reaches a
# browser, so a plane with no table there would be that claim quietly ending.
linkme = "0.3"
# THE SAME REGISTRY, FOR WASM ONLY. `inventory` collects by running a
# constructor per row before `main` -- on this target through
# `__wasm_call_ctors` -- and builds a linked list the first read walks.
#
# That is strictly worse than a link section on every count the note above
# gives: it costs life-before-main, it turns a link-time constant into a
# run-time initialisation, and it is a list rather than a contiguous slice.
# It is used ONLY where the better mechanism does not exist. `#[routine]`
# emits a `linkme` row on every target with a linker to ask and an
# `inventory` row on wasm, both behind the same `cfg`, so no target carries
# two rows for one `fn` and none carries zero.
inventory = "0.3"
ztensor = "2.1.1"
ztensor-compat = "2.1.1"

# Shared lint table. Opt in per crate with `[lints] workspace = true`; today
# only the `compiler/*` crates do, because they are the only ones at zero
# clippy warnings and therefore the only ones CI can gate with `-D warnings`
# (`.github/workflows/ci.yml`). The rest of the workspace still carries ~240
# warnings; wire a crate in here once it is clean rather than all at once.
#
# Everything below is at zero occurrences across the compiler crates as of this
# commit, so each is a ratchet that costs nothing today and blocks a
# regression tomorrow. Lints that would need a cleanup first are deliberately
# absent — notably `clippy::wildcard_enum_match_arm`, the lint that would have
# caught the catch-all `_ =>` arms that silently absorbed new ops. Down from 38
# sites to 26; the survivors were each read and are fail-safe (`_ => None`,
# `_ => {}`, "skip this optimization") or delegate to a match that *is*
# exhaustive, so a new variant inherits a conservative answer rather than a
# confident wrong one. Turning the lint on would now mean 26 `#[allow]`s or 26
# hand-written variant lists that drift, which buys less than it costs.
[workspace.lints.rust]
# Promoted from `tensor-dsl`, which was the only crate carrying it. There is no
# `unsafe` anywhere in the tensor toolchain, so this extends that crate's
# existing guarantee to `tensor-ir` and `tensor-compiler` at zero cost.
unsafe_code = "forbid"
# Every public item in the tensor toolchain is documented, and this keeps it
# that way. These crates are read far more often than they are written -- the op
# table, the wire layout and the type rules are all consulted from other
# crates and from generated backend sources -- so an undocumented public item
# is a rule someone has to reconstruct from the implementation, and the
# reconstruction is what silently disagrees with it later.
missing_docs = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
# A compiler crate that writes to a stream is either debugging scaffolding left
# behind or a diagnostic that belongs behind an explicit, annotated `allow`.
print_stdout = "deny"
print_stderr = "deny"
# `cast_possible_truncation` is deliberately NOT set here. It fires on ~130
# `usize as u32` sites that are all bounded -- by the container ceilings, by
# the `u32` value-id space, or by `usize` being 64 bits on the only targets
# `tensor-compiler` and `tensor-compiler` build for -- so denying it workspace-wide buys
# ~130 `#[allow]` and no guarantee.
#
# It is denied at the top of `compiler/ir/src/lib.rs` instead, which is where
# it earns its keep: that crate narrows counts that came from bytes it did not
# write. Anywhere else, a narrowing cast still deserves the same question --
# what is the bound, and who enforces it -- the lint just cannot ask it
# usefully.

# Distribution profile for `worker`. Use
# `cargo build --profile release-min -p pie-worker`. The regular
# `release` profile stays as the default dev/bench path (no LTO).
#
# Thin LTO over fat: ~10× faster link than fat with most of the size
# and runtime win. Fat LTO doubled CI build time on the cuda matrix
# (CUDA kernel compile + Rust+C++ link grew from ~1h to many hours)
# without measurably better artifacts. Thin LTO parallelizes across
# codegen units, so we leave codegen-units at the default (16) too.
#
# NO `panic = "abort"`. It was here, and it was quietly deleting behaviour
# this tree goes to some length to provide: three `catch_unwind` barriers
# turn a panic into an answer rather than a dead process -- the driver lane
# in `engine::scheduler::worker` (which drains and fails the requests behind
# a poisoned lane instead of leaving a frame in flight, after one was
# measured stalled for 7030s), and the two C ABI seams in
# `driver_cuda::serve::guard` and `pie_wake`, whose whole documented purpose
# is that an operator gets a message naming the entry point "instead of a
# bare SIGABRT". Under `abort` every one of them is dead code and the
# shipped binary does exactly what those comments say it must not.
#
# Each of the three now fails the build under `cfg(panic = "abort")`, so
# this is not a line anyone can put back by accident. It cost ~8 MiB of
# binary, which is not a currency this project trades in.
[profile.release-min]
inherits = "release"
lto = "thin"
strip = "symbols"

