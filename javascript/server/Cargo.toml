[package]
name = "pie-server-node"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Node.js bindings for the pie engine: what `pie serve` boots, inside a Node process."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[features]
default = ["cuda"]
cuda = ["pie/cuda"]
metal = ["pie/metal"]
vulkan = ["pie/vulkan"]
wgpu = ["pie/wgpu"]

[lib]
name = "pie_server"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
pie = { path = "../..", default-features = false }
worker = { path = "../../crates/worker", default-features = false }
runtime = { path = "../../crates/runtime", default-features = false }
napi = { version = "3", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "3"
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread"] }
toml = "1.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
napi-build = "2"

# The workspace lints, except that napi-rs's macros expand to unsafe N-API
# glue, so `unsafe_code` cannot be forbidden here.
[lints.rust]
unsafe_code = "allow"
missing_docs = "allow"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
