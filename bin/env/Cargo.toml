[package]
name = "pie-env"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The pie process skeleton and the `pie-env` command. As a library (`startup`) it gives every bin the shared CLI flag skeleton, path/dir resolution, config sourcing to a String, tracing + a /metrics endpoint, and signal/panic/exit-code lifecycle. As a binary it answers, without booting a daemon, which config file a role will actually read and whether its boot preconditions hold. Depends on NO role library and never sees a typed Config."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

# Package is `pie-env` (workspace/crates.io namespace) but the lib imports as
# `startup` — the bins write `startup::init` / `startup::BootSpec`. The package
# is named for the command it ships (cf. `pie-bin` → `pie`), the lib for the
# role it plays.
[lib]
name = "startup"
path = "src/lib.rs"

# `pie-env` — the only binary the skeleton itself ships. It reuses the very same
# resolution path the daemons take (`config::resolve_path`), so it can never
# disagree with them.
[[bin]]
name = "pie-env"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# CLI: the shared global flags as a `#[derive(clap::Args)] GlobalArgs` the bins
# `#[command(flatten)]` into their own `Parser` (one `--help`, typed role flags).
# `derive` also backs the `pie-env` binary's own `Parser`.
clap = { version = "4.6", features = ["derive"] }
# Path/dir resolution (home dir for `$PIE_HOME` fallback).
dirs = "6.0"
# Observability: structured logs + env-filter level control.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Signals + the hand-rolled /metrics listener. NOT a runtime — the bin owns the
# runtime (`#[tokio::main]`); the skeleton only `spawn`s onto the ambient one.
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "io-util"] }
