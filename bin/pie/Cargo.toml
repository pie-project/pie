[package]
name = "pie-bin"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The pie standalone composition root: multi-call CLI (local/serve + ops) composing the startup skeleton + the controller/gateway/worker role libs in-proc."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

# Package is `pie-bin` (the runtime lib already owns `pie`); the user-facing
# command is `pie`.
[lib]
name = "pie_bin"
path = "src/lib.rs"

[[bin]]
name = "pie"
path = "src/main.rs"

[features]
# bin/pie is the composition root that selects the driver backend; forward the
# driver flavors to the embedded worker. Default = none (dummy fallback);
# enable driver-cuda or driver-metal for real inference.
default = []
driver-cuda = ["pie-worker/driver-cuda"]
# macOS/Apple Silicon. Without this the `pie` binary has no way to reach the
# Metal driver at all: `pie-worker`'s `driver-metal` is what links the archive,
# and this crate is the only one that builds a binary.
driver-metal = ["pie-worker/driver-metal"]
driver-dummy = ["pie-worker/driver-dummy"]
# Probe passthroughs to the embedded worker (→ runtime).
profile-fire = ["pie-worker/profile-fire"]

[dependencies]
# Shared process skeleton (imports as `startup`): CLI flags, paths, tracing,
# signals, /metrics, banner.
pie-env = { path = "../env" }
# The three role libs — bin/pie is the ONE crate that deps all three (Seam 4).
pie-controller = { path = "../../controller" }
pie-gateway = { path = "../../gateway" }
pie-worker = { path = "../../worker", default-features = false }
pie-engine = { path = "../../runtime/engine" }  # program/manifest types for `pie inferlet`
# `pie model convert` — the host-side load-plan executor and checkpoint
# writer. Pure Rust; needs no driver and no GPU.
pie-loader = { path = "../../loader" }
# The tokenizer compiler — `pie model convert` runs it once at import and
# serializes the result into the artifact (`pie.tokenizer/1`), so the runtime
# never parses `tokenizer.json` again.
pie-tokenizer = { path = "../../runtime/tokenizer" }
# The HF `config.json` normalizer — `pie model convert` runs it once and
# writes the result as the `pie.model/1` descriptor, so the runtime and the
# driver stop re-deriving it from HF quirks at every boot.
pie-model-config = { path = "../../model/config" }
# Client edge for `pie config tune`: the sweep generates load through
# the same websocket path a deployment is reached by, because measuring an
# in-process shortcut would measure something nobody runs.
pie-client = { path = "../../client/rust" }
pie-model = { path = "../../model", features = ["contract"] }
pie-model-common = { path = "../../model/common", features = ["contract"] }
# Wire vocabulary — compose.rs names control-plane types (RoutingTable, Ack,
# GatewayInfo, WorkerInfo, Neighbors, WorkerStatus) from pie-controller-rpc and
# the id atoms (WorkerId/GatewayId/NodeId) from pie-ids.
pie-ids = { path = "../../interface/ids" }
pie-controller-rpc = { path = "../../interface/controller" }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
toml = "1.1"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# R3 weight/runtime provisioning downloaders — these live ONLY here (the worker
# lib links zero provisioning machinery). `reqwest` carries `blocking` because
# the CLI `model pull` / `runtime install` downloads are synchronous.
hf-hub = "1.0.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking", "stream"] }
tar = "0.4"
xz2 = "0.1"
toml_edit = "0.25.13"

# What this crate's OWN tests need, which is now what is here. The engine's
# on-device suite moved to `tests/gpu` (`pie-gpu-tests`) and took `pie-engine`
# and `tracing-subscriber` with it — they were dev-deps of this crate because
# thirty GPU test binaries lived in its `tests/`, not because anything about
# the CLI needs them.
[dev-dependencies]
tempfile = "3"
# `boot_smoke` drives the one public composition seam (`run_standalone`) the
# way a client does; that is the reason this crate has a `[lib]` at all.
pie-client = { path = "../../client/rust" }

# SIGPIPE disposition — see `die_quietly_on_closed_pipe` in main.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
