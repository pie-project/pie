[package]
name = "pie-swift-core"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The C core of the Swift `PieServer`: a worker::Server on the Metal engine, behind include/pie_server.h."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "pie_server"
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
worker = { path = "../../../crates/worker", default-features = false, features = ["metal", "standalone"] }
serde_json = "1"
anyhow = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "allow"
missing_docs = "allow"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
