[package]
name = "pie-server-py"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Python bindings for the pie engine: what `pie serve` boots, inside a Python process."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[features]
default = ["cuda"]
cuda = ["worker/cuda"]
metal = ["worker/metal"]
vulkan = ["worker/vulkan"]
wgpu = ["worker/wgpu"]

[lib]
name = "pie_engine"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
worker = { path = "../../../crates/worker", default-features = false, features = ["standalone"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
toml = "1.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
