[package]
name = "pie-c"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "pie's C library (include/pie.h): a worker::Server in the caller's process, for any language with a C FFI. The Swift package links it."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "pie"
crate-type = ["staticlib", "cdylib"]
path = "src/lib.rs"

[features]
cuda = ["worker/cuda"]
metal = ["worker/metal"]
vulkan = ["worker/vulkan"]
wgpu = ["worker/wgpu"]

[dependencies]
worker = { path = "../../crates/worker", default-features = false, features = ["standalone"] }
serde_json = "1"
anyhow = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Each platform's engine without a flag: Metal on Apple, Vulkan on Android.
[target.'cfg(target_vendor = "apple")'.dependencies]
worker = { path = "../../crates/worker", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "android")'.dependencies]
worker = { path = "../../crates/worker", default-features = false, features = ["vulkan"] }

[lints.rust]
unsafe_code = "allow"
missing_docs = "allow"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
