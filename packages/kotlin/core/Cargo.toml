[package]
name = "pie-kotlin-core"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The JNI core of the Kotlin `PieServer`: a runtime::embed::Server on Vulkan (Android) or Metal (a Mac, for host tests)."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "pie_server"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
runtime = { path = "../../../crates/runtime" }
builtins = { path = "../../../crates/builtins" }
jni = "0.21"
serde_json = "1"
anyhow = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "android")'.dependencies]
runtime = { path = "../../../crates/runtime", features = ["vulkan"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
runtime = { path = "../../../crates/runtime", features = ["metal"] }

[lints.rust]
unsafe_code = "allow"
missing_docs = "allow"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
