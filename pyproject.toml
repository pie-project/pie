[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gpugrammar"
version = "0.1.0"
description = "Constrained decoding with the parser state resident on the GPU"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "torch>=2.4",
  "triton>=3.0",
]

[project.optional-dependencies]
tokenizers = ["tiktoken>=0.9", "transformers>=4.45"]
baselines = ["xgrammar>=0.1.29"]

[project.scripts]
gpu-lr1-bench = "gpu_lr1.benchmark:main"
gpu-lr1-csr-opt-bench = "gpu_lr1.csr_optimization_benchmark:main"
gpu-lr1-density-bench = "gpu_lr1.density_benchmark:main"
gpu-lr1-fair-xgrammar-bench = "gpu_lr1.fair_xgrammar_benchmark:main"
gpu-lr1-lr-bench = "gpu_lr1.lr1_benchmark:main"
gpu-lr1-lr-token-bench = "gpu_lr1.lr1_token_benchmark:main"
gpu-lr1-ragged-sample-bench = "gpu_lr1.ragged_sampler_benchmark:main"
gpu-lr1-collect-real-rows = "gpu_lr1.collect_real_rows:main"
gpu-lr1-stack-bench = "gpu_lr1.stack_benchmark:main"
gpu-lr1-xgrammar-bench = "gpu_lr1.xgrammar_benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# The engine is Triton kernels and a device runtime, so the checks that matter
# are the ones that catch a name that does not exist or an argument that is
# never used - not style.
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The kernels take the arguments their launch sites pass, whether or not a
# given specialisation reads them.
"src/gpu_lr1/device_parser.py" = ["B905"]
