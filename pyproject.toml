[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gpugrammar"
version = "0.1.0"
description = "Constrained decoding with the parser state resident on the GPU"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "torch>=2.4",
  "triton>=3.0",
]

[project.optional-dependencies]
tokenizers = ["tiktoken>=0.9", "transformers>=4.45"]
baselines = ["xgrammar>=0.1.29"]

[project.scripts]
# The measurement suite, which is what produces the numbers in the paper. The
# prototype-era benchmarks it superseded are gone; `gpu_lr1` is the research
# package and `gpugrammar` is the library.
gpugrammar-latency = "gpu_lr1.rigor.latency:main"
gpugrammar-soundness = "gpu_lr1.rigor.soundness:main"
gpugrammar-overlap = "gpu_lr1.rigor.overlap:main"
gpugrammar-serving = "gpu_lr1.rigor.serving:main"
gpugrammar-crossover = "gpu_lr1.crossover:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# The engine is Triton kernels and a device runtime, so the checks that matter
# are the ones that catch a name that does not exist or an argument that is
# never used - not style.
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The kernels take the arguments their launch sites pass, whether or not a
# given specialisation reads them.
"src/gpu_lr1/device_parser.py" = ["B905"]
