[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "engrain"
version = "0.1.0"
description = "Constrained decoding with the parser state resident on the GPU"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "torch>=2.4",
  "triton>=3.0",
]

[project.optional-dependencies]
tokenizers = ["tiktoken>=0.9", "transformers>=4.45"]
baselines = ["xgrammar>=0.1.29"]

# No console scripts. The wheel is the library - `engrain` and the
# extension - and the measurement suite is `engrain_lab`, which is research code
# run from a checkout (`python -m engrain_lab.rigor.latency`, `python -m
# engrain_lab.verify`). Installing entry points that name a package the wheel does
# not carry is how the previous set came to be broken.

# The extension is a Rust cdylib and the library is Python over it, so the
# build backend has to produce both. Plain setuptools produced a wheel with
# the Python half only, which installed and then failed on `import`.
[tool.maturin]
manifest-path = "rust/crates/engrain-py/Cargo.toml"
python-source = "src"
module-name = "engrain._engrain"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# The engine is Triton kernels and a device runtime, so the checks that matter
# are the ones that catch a name that does not exist or an argument that is
# never used - not style.
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The kernels take the arguments their launch sites pass, whether or not a
# given specialisation reads them.
"src/engrain/_engine.py" = ["B905"]
