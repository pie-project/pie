<!doctype html>
<meta charset="utf-8">
<title>pie in the browser — client</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 2rem auto; max-width: 56rem; }
  pre { background: #f4f4f4; padding: 0.75rem; white-space: pre-wrap; }
</style>
<h1>pie in the browser, through <code>@pie-project/client</code></h1>
<p>The unmodified JavaScript client talking to the runtime in this tab:
<code>pie.client()</code> gets an in-page transport instead of a WebSocket.</p>
<pre id="out"></pre>
<script type="module">
  import * as pie from "../../javascript/server-web/dist/pie.mjs";
  import { SHORT, page, loadRuntime, installInferlet } from "./harness.mjs";

  const { log, params, modelUrl, finish, fail } = page();
  const prompt = params.get("prompt") ?? SHORT;
  const maxTokens = Number(params.get("max_tokens") ?? 16);

  try {
    await loadRuntime(params);
    const summary = await pie.bootLazy(modelUrl, "");
    log(`booted: ${summary.sku}`);
    const { program } = await installInferlet("text-completion");
    log(`installed ${program}`);

    const client = pie.client();
    await client.connect();
    const process = await client.launchProcess(program, { prompt, max_tokens: maxTokens });
    log(`launched ${process.processId}`);
    const t0 = performance.now();
    for (;;) {
      const { event, value } = await process.recv();
      if (event === "return") { log(`return: ${value}`); break; }
      if (event === "error") { log(`error: ${value}`); break; }
      log(`${event}: ${value}`);
    }
    log(`done in ${((performance.now() - t0) / 1000).toFixed(1)} s`);
    await client.close();
    finish(0);
  } catch (e) {
    fail(e);
  }
</script>
