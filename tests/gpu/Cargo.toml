[package]
name = "pie-gpu-tests"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "The runtime's on-device end-to-end suite: boots the real standalone through the real client edge and asserts what the engine produced."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
# Nothing depends on this crate and it has no code of its own. It exists to own
# `tests/`.
publish = false

# No library, no binary — only integration tests. The empty lib target is what
# lets a crate be nothing but a `tests/` directory.
[lib]
path = "src/lib.rs"
test = false
doctest = false

[features]
# Forwarded to the composition root, which is what selects the engine. There
# is no fallback: the dummy engine these no-GPU diagnostics used to run
# against is deleted, so a build with neither feature reaches no device.
default = []
engine-cuda-12 = ["_engine-cuda", "pie/engine-cuda-12", "runtime/engine-cuda-12"]
engine-cuda-13 = ["_engine-cuda", "pie/engine-cuda-13", "runtime/engine-cuda-13"]
# The private "the CUDA shell is linked" gate, the same shape and the same
# underscore as `runtime`'s own. Two gates here drive the `Engine` CONTRACT
# directly rather than the client edge -- `copy_kv` and `Readout::Rows` are
# engine verbs with no guest spelling -- so they name `engine` and
# `engine_cuda` types, and a build with neither ABI selected must not compile
# them.
_engine-cuda = ["pie/_engine-cuda", "runtime/_engine-cuda"]

[dev-dependencies]
# The composition root. These tests boot the same `run_standalone` a `pie
# serve` does — that is the point of them.
pie = { path = "../.." }
# The client edge. Load goes over the websocket a deployment is reached by,
# because an in-process shortcut would prove something nobody runs.
client = { path = "../../crates/client" }
# The runtime lib — read `inference::get_stats()` in-process to observe the
# scheduler's fire probes (the thrust-2 bubble/quorum gate) after a decode.
runtime = { path = "../../crates/runtime" }
# **THE CONTRACT, FOR THE TWO GATES THAT DRIVE IT DIRECTLY.** `copy_kv` and
# `Readout::Rows` are `Engine` verbs a guest has no way to spell, so
# `cuda_kv_page_graft` and `cuda_row_selected_readout` open an engine through
# `runtime::engine::backend::open` and submit their own frames -- the shape
# `crates/runtime/tests/cuda_boot_smoke.rs` established one layer down. Every
# other gate here goes over the websocket, which is still the point of them.
engine = { path = "../../crates/engine" }
# For `engine_cuda::device::present()`: those two gates skip at RUN time on a
# machine with no card, rather than being `#[ignore]`d on a build flag.
engine-cuda = { path = "../../crates/engine-cuda" }
# The catalog's classifier input (`model::Request`), which is what states a
# lane's fact word. A gate that spelled a word by hand would be pinning a
# different model than the one it fires.
model = { path = "../../crates/model" }
# The guest-program half of `cuda_row_selected_readout`: it authors an ETA
# epilogue at the LOAD's own vocabulary (a corpus golden is authored at the
# dummy profile's and cannot bind here), plans it and emits CUDA for it —
# which is the splice the scheduler lane makes and a gate holding the engine
# directly has to make for itself.
eta-compiler = { path = "../../crates/eta-compiler" }
# The two IRs these tests author by hand: `model_ir::Platform` to pick a
# shell, and `eta_ir::{container, op, registry, types, validate}` to build a
# guest program and bind it. Both were reached through `engine`'s re-export
# until that came out.
model-ir = { path = "../../crates/model-ir" }
eta-ir = { path = "../../crates/eta-ir" }
# The checkpoint's own vocabulary: a tokenizer from another snapshot decodes
# the right ids into the wrong words.
tokenizer = { path = "../../crates/tokenizer" }

anyhow = "1.0"
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
# `cuda_boot_smoke` drives one turn through the booted runtime's HTTP ingress
# (`POST /v1/generate`), which is the one client surface no other gate here
# touches.
#
# `rustls-no-provider` rather than `rustls` for the same reason the rest of the
# tree uses it: reqwest's `rustls` feature hard-selects the aws-lc backend, and
# because features unify across a workspace build, this one dev-dependency was
# enough to put `aws-lc-sys` back into every `cargo build --workspace`. These
# probes only ever talk to loopback over plain HTTP, so they need no provider
# at all.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# Diagnostic trace subscriber for the inproc forward-path probes (RUST_LOG).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `libc` STOOD HERE. Its one user was `cuda_declared_family_parity`, which
# captured fd 2 to assert on what the engine printed during a fire. That gate
# went in the census wave: its OFF/ON polarity was `PIE_DECLARED_FORWARD`, an
# environment switch no crate in this tree reads any more, because the declared
# model text is the only forward this build has. What asks the per-family
# question now is `engine/tests/every_sku_walks_its_classes` over the whole
# catalog and `engine-cuda/tests/masked_axis::every_sku_probes_its_caches`.
