[package]
name = "locally-typical-sampling"
version = "0.1.0"
description = "Locally typical sampling — keep tokens whose information content is closest to the entropy"
authors = ["Pie Team"]

[runtime]
core = "^0.2.0"

[parameters]
prompt = {type = "string", optional = true, description = "Prompt to send to the model"}
mass = {type = "float", optional = true, description = "Typical mass to retain, 0<mass<=1 (default: 0.95)"}
temperature = {type = "float", optional = true, description = "Temperature applied before typicality (default: 1.0)"}
max_tokens = {type = "int", optional = true, description = "Number of generated tokens (default: 32)"}
seed = {type = "int", optional = true, description = "RNG key for Gumbel-max sampling"}
