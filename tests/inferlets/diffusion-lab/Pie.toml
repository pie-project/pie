[package]
name = "diffusion-lab"
version = "0.1.0"
description = "DiffusionGemma sampler variants as guest programs on one unchanged host: acceptance rules, sticky (masked) decoding, temperature schedules, self-conditioning width, commit elision, infilling, best-of-K, and a self-log-prob quality readout"
authors = ["Pie Team"]

[runtime]
core = "^0.2.0"

[parameters]
prompt = {type = "string", optional = true, description = "User turn to answer"}
max_tokens = {type = "int", optional = true, description = "Generation budget in tokens, rounded up to whole canvases (default: one canvas)"}
max_steps = {type = "int", optional = true, description = "Denoising steps per canvas at most (default: 48)"}
variant = {type = "string", optional = true, description = "Acceptance rule: reference | remask | margin | sticky (default: reference)"}
schedule = {type = "string", optional = true, description = "Temperature schedule: linear | cosine (default: linear)"}
t_max = {type = "float", optional = true, description = "Temperature at the first step (default: 0.8)"}
t_min = {type = "float", optional = true, description = "Temperature at the last step (default: 0.4)"}
entropy_bound = {type = "float", optional = true, description = "Entropy-bound budget of the reference rule (default: 0.1)"}
margin = {type = "float", optional = true, description = "Top-1 minus top-2 probability an accepted row needs under `margin` (default: 0.5)"}
confidence = {type = "float", optional = true, description = "Mean-entropy threshold of the stopping rule (default: 0.005)"}
stability = {type = "int", optional = true, description = "Steps the argmax canvas must hold before the stopping rule may fire (default: 1)"}
taps = {type = "int", optional = true, description = "Self-conditioning taps staged per row, 0 = none (default: the model's width)"}
elide_commit = {type = "bool", optional = true, description = "Skip the causal encode of the last block (nothing reads its KV)"}
quality = {type = "bool", optional = true, description = "Read the committed block's mean self-log-prob out of its encode pass"}
best_of = {type = "int", optional = true, description = "Canvases denoised per block, the lowest final entropy committed (default: 1)"}
clamp = {type = "string", optional = true, description = "Infilling: JSON list of [position, token] pairs held fixed in the first canvas"}
seed = {type = "int", optional = true, description = "Seed of the device rng and the host's canvas noise"}
