[package]
name = "latent-probe"
version = "0.1.0"
description = "Probe of the float-port denoise loop (imagegen D1/D3/D4): a latent channel seeded on the device, bound as input(\"latents\") beside input(\"timestep\"), stepped by an Euler epilogue over velocity(), read back once"
authors = ["Pie Team"]

[runtime]
core = "^0.2.0"

[parameters]
reading = {type = "string", optional = true, description = "Which declared reading to drive (default: the first token-less reading with a velocity readout)"}
steps = {type = "int", optional = true, description = "Euler steps (default: 4)"}
rows = {type = "int", optional = true, description = "Latent rows one lane carries (default: 16)"}
seed = {type = "int", optional = true, description = "Seed of the device Normal draw (default: 7)"}
prompt = {type = "string", optional = true, description = "Encoded through the model's `text` reading into the context port, when the reading declares one"}
