[package]
name = "text-to-image"
version = "0.1.0"
description = "The model-agnostic text-to-image sampler: encode the prompt with the family's text reading, denoise a latent under its schedule, and hand back pixels (or the raw latent when the family declares no VAE decode reading)"
authors = ["Pie Team"]

[runtime]
core = "^0.2.0"

[parameters]
prompt = {type = "string", optional = true, description = "What to draw"}
negative_prompt = {type = "string", optional = true, description = "What to steer away from; needs guidance > 1 and a model with no guidance port (a batch-of-2 CFG run)"}
width = {type = "int", optional = true, description = "Pixel width, rounded down to the model's latent/patch grid (default 1024)"}
height = {type = "int", optional = true, description = "Pixel height, same rounding (default 1024)"}
steps = {type = "int", optional = true, description = "Denoise steps (default: the pinned sigma count when the schedule has one, else 8)"}
seed = {type = "int", optional = true, description = "Seed of the keyed Normal draw the latent starts from"}
guidance = {type = "float", optional = true, description = "Guidance scale: the `guidance` port's value where the model has one, else the CFG scale"}
out = {type = "string", optional = true, description = "Suggested output name (default `image`)"}
