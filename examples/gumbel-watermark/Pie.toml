[package]
name = "gumbel-watermark"
version = "0.1.0"
description = "Aaronson's distortion-free Gumbel watermark — key the sampler's noise on the context instead of a counter"
authors = ["Pie Team"]

[runtime]
core = "^0.2.0"

[parameters]
prompt = {type = "string", optional = true, description = "Prompt to send to the model"}
secret = {type = "int", optional = true, description = "Watermark secret; the detector needs this and nothing else"}
context_width = {type = "int", optional = true, description = "Preceding tokens seeding each step, 1..8 (default: 4)"}
watermark = {type = "bool", optional = true, description = "False free-runs the RNG, producing unwatermarked text (default: true)"}
temperature = {type = "float", optional = true, description = "Temperature applied before sampling (default: 1.0)"}
max_tokens = {type = "int", optional = true, description = "Number of generated tokens (default: 32)"}
seed = {type = "int", optional = true, description = "RNG key used only when watermarking is off"}
