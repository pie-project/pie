[package]
name = "text-to-video"
version = "0.1.0"
description = "The model-agnostic text-to-video sampler: encode the prompt with the family's text reading, denoise a latent VOLUME under its schedule, decode it one latent frame at a time through the family's causal VAE arms, and stream the clip out as mp4"
authors = ["Pie Team"]

[runtime]
core = "^0.2.0"

[parameters]
prompt = {type = "string", optional = true, description = "What to film"}
prompt_ids = {type = "string", optional = true, description = "The prompt as token ids, comma-separated — the door for a row whose artifact does not carry its text encoder's own vocabulary (Wan 2.2's umT5 is SentencePiece Unigram and pie compiles BPE pipelines alone). Overrides `prompt`"}
negative_prompt = {type = "string", optional = true, description = "What to steer away from; needs guidance > 1 and a model with no guidance port (a batch-of-2 CFG run)"}
negative_prompt_ids = {type = "string", optional = true, description = "The negative prompt as token ids, comma-separated"}
width = {type = "int", optional = true, description = "Pixel width, rounded down to the model's latent/patch grid (default 832)"}
height = {type = "int", optional = true, description = "Pixel height, same rounding (default 480)"}
frames = {type = "int", optional = true, description = "Output frames. A causal video VAE lands 1 + tc*(T-1) frames from T latent frames, so this must satisfy (frames - 1) % temporal-compression == 0; anything else is refused by name (default 17)"}
fps = {type = "float", optional = true, description = "Frame rate written into the mp4 (default 24)"}
steps = {type = "int", optional = true, description = "Denoise steps (default: the pinned sigma count when the schedule has one, else 8)"}
seed = {type = "int", optional = true, description = "Seed of the keyed Normal draw the latent starts from"}
guidance = {type = "float", optional = true, description = "Guidance scale: the `guidance` port's value where the model has one, else the CFG scale"}
format = {type = "string", optional = true, description = "`mp4` (H.264 via NVENC, the default) or `y4m` (uncompressed, the parity format)"}
out = {type = "string", optional = true, description = "Suggested output name (default `video`)"}
