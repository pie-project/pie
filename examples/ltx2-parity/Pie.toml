[package]
name = "ltx2-parity"
version = "0.1.0"
description = "One joint video+audio denoise step of an LTX-2.5 miniature (four lanes in one group), or one connector pass, for scripts/imagegen/ltx2_parity.py"
authors = ["Pie Team"]

[runtime]
core = "^0.2.0"

[parameters]
case = {type = "string", optional = true, description = "The case JSON the harness wrote, as one string"}
case_file = {type = "string", optional = true, description = "Its file name under the sandbox scratch dir instead (allow_fs = true)"}
case_0 = {type = "string", optional = true, description = "Piece 0 of the case JSON, concatenated with the others"}
case_1 = {type = "string", optional = true, description = "Piece 1 of the case JSON, concatenated with the others"}
case_2 = {type = "string", optional = true, description = "Piece 2 of the case JSON, concatenated with the others"}
case_3 = {type = "string", optional = true, description = "Piece 3 of the case JSON, concatenated with the others"}
case_4 = {type = "string", optional = true, description = "Piece 4 of the case JSON, concatenated with the others"}
case_5 = {type = "string", optional = true, description = "Piece 5 of the case JSON, concatenated with the others"}
case_6 = {type = "string", optional = true, description = "Piece 6 of the case JSON, concatenated with the others"}
case_7 = {type = "string", optional = true, description = "Piece 7 of the case JSON, concatenated with the others"}
case_8 = {type = "string", optional = true, description = "Piece 8 of the case JSON, concatenated with the others"}
case_9 = {type = "string", optional = true, description = "Piece 9 of the case JSON, concatenated with the others"}
case_10 = {type = "string", optional = true, description = "Piece 10 of the case JSON, concatenated with the others"}
case_11 = {type = "string", optional = true, description = "Piece 11 of the case JSON, concatenated with the others"}
