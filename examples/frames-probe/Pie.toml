[package]
name = "frames-probe"
version = "0.1.0"
description = "Builds a gradient clip with frames.from-rgb8 and sends it out as a still and a video"
authors = ["Pie Team"]

[runtime]
core = "^0.2.0"

[parameters]
width = {type = "int", optional = true, description = "Frame width (default: 160 — NVENC's H.264 floor is 145)"}
height = {type = "int", optional = true, description = "Frame height (default: 96)"}
frames = {type = "int", optional = true, description = "Frames in the clip (default: 8)"}
fps = {type = "float", optional = true, description = "Frame rate the clip declares (default: 25)"}
video = {type = "string", optional = true, description = "Clip format: 'mp4' (NVENC) or 'y4m' (default: mp4)"}
