[package]
name = "zimage-parity"
version = "0.1.0"
description = "The refine reading then one denoise step of the z-image family (and, on the flagship, the text reading), read out as the refined caption and the velocity, for scripts/imagegen/zimage_parity.py"
authors = ["Pie Team"]

[runtime]
core = "^0.2.0"

[parameters]
case = {type = "string", optional = true, description = "The case JSON the harness wrote (case.json), as one string"}
case_file = {type = "string", optional = true, description = "Its file name under the sandbox scratch dir instead (allow_fs = true)"}
case_0 = {type = "string", optional = true, description = "Piece 0 of the case JSON, concatenated with the others"}
case_1 = {type = "string", optional = true, description = "Piece 1 of the case JSON"}
case_2 = {type = "string", optional = true, description = "Piece 2 of the case JSON"}
case_3 = {type = "string", optional = true, description = "Piece 3 of the case JSON"}
case_4 = {type = "string", optional = true, description = "Piece 4 of the case JSON"}
case_5 = {type = "string", optional = true, description = "Piece 5 of the case JSON"}
case_6 = {type = "string", optional = true, description = "Piece 6 of the case JSON"}
case_7 = {type = "string", optional = true, description = "Piece 7 of the case JSON"}
case_8 = {type = "string", optional = true, description = "Piece 8 of the case JSON"}
case_9 = {type = "string", optional = true, description = "Piece 9 of the case JSON"}
case_10 = {type = "string", optional = true, description = "Piece 10 of the case JSON"}
case_11 = {type = "string", optional = true, description = "Piece 11 of the case JSON"}
case_12 = {type = "string", optional = true, description = "Piece 12 of the case JSON"}
case_13 = {type = "string", optional = true, description = "Piece 13 of the case JSON"}
case_14 = {type = "string", optional = true, description = "Piece 14 of the case JSON"}
case_15 = {type = "string", optional = true, description = "Piece 15 of the case JSON"}
case_16 = {type = "string", optional = true, description = "Piece 16 of the case JSON"}
case_17 = {type = "string", optional = true, description = "Piece 17 of the case JSON"}
case_18 = {type = "string", optional = true, description = "Piece 18 of the case JSON"}
case_19 = {type = "string", optional = true, description = "Piece 19 of the case JSON"}
case_20 = {type = "string", optional = true, description = "Piece 20 of the case JSON"}
case_21 = {type = "string", optional = true, description = "Piece 21 of the case JSON"}
case_22 = {type = "string", optional = true, description = "Piece 22 of the case JSON"}
case_23 = {type = "string", optional = true, description = "Piece 23 of the case JSON"}
case_24 = {type = "string", optional = true, description = "Piece 24 of the case JSON"}
case_25 = {type = "string", optional = true, description = "Piece 25 of the case JSON"}
case_26 = {type = "string", optional = true, description = "Piece 26 of the case JSON"}
case_27 = {type = "string", optional = true, description = "Piece 27 of the case JSON"}
case_28 = {type = "string", optional = true, description = "Piece 28 of the case JSON"}
case_29 = {type = "string", optional = true, description = "Piece 29 of the case JSON"}
case_30 = {type = "string", optional = true, description = "Piece 30 of the case JSON"}
case_31 = {type = "string", optional = true, description = "Piece 31 of the case JSON"}
refine_only = {type = "bool", optional = true, description = "Stop after the refine reading (the refined caption alone)"}
prompt = {type = "string", optional = true, description = "Run the text reading on this prompt first (flagship rows); its rows replace the case's caption unless text_only"}
steps = {type = "int", optional = true, description = "Run the whole Euler trajectory of this many steps instead of one denoise step; the case latents are then the initial noise"}
stop = {type = "int", optional = true, description = "Stop the trajectory after this many steps (bisect against sched.x{n})"}
ctx_tap = {type = "bool", optional = true, description = "Read the denoise readout off the context lane too (bisect)"}
text_only = {type = "bool", optional = true, description = "With prompt: the text reading alone, no case needed"}
