[package]
name = "flux2-klein-parity"
version = "0.1.0"
description = "FLUX.2-klein-4B against its diffusers golden: the text reading, one denoise step, and the four-step Euler trajectory, for scripts/imagegen/flux2_klein_parity.py"
authors = ["Pie Team"]

[runtime]
core = "^0.2.0"

[parameters]
case_file = {type = "string", optional = true, description = "The case JSON under the sandbox scratch dir (default case.json); the harness drops it there once the process announces its instance id"}
wait_secs = {type = "int", optional = true, description = "How long to wait for the case to appear (default 120)"}
