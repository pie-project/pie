[package]
name = "quickstart-js"
version = "0.1.0"
description = "Greedy text completion in twenty lines: one forward pass per token, driven from the host"
authors = ["Pie Team"]

[runtime]
language = "javascript"
core = "^0.2.0"

[parameters]
prompt = {type = "string", optional = true, description = "Prompt to continue"}
max_tokens = {type = "int", optional = true, description = "Tokens to generate (default: 8)"}
