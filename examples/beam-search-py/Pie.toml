[package]
name = "beam-search-py"
version = "0.1.0"
description = "On-device beam search with shared KV storage and logical ancestry masks — the Python twin"
authors = ["Pie Team"]

[runtime]
language = "python"
core = "^0.2.0"

[parameters]
max_tokens = {type = "int", optional = true, description = "Number of beam-search steps (default: 16, maximum: 63)"}
beams = {type = "int", optional = true, description = "Beam width (default: 2; 1 degenerates to greedy decoding)"}
