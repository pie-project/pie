[package]
name = "pie-loader"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Typed weight-loading compiler: checkpoints to verified device-memory layouts."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[lib]
name = "pie_loader"
crate-type = ["rlib"]
path = "src/lib.rs"

# The C ABI — repr(C) marshalling, extern entry points, the committed
# `pie_loader.h`, and the `pie-loader` CLI — lives in `capi/`
# (`pie-loader-capi`). This crate is the compiler alone and knows nothing of
# C; the split makes that a dependency arrow instead of a module convention.

[features]
default = ["testkit"]

# The parts of this crate that exist to *check* the loader rather than to be
# the loader: the differential oracle and the CPU plan executor the
# `pie-loader` tool replays with.
#
# On by default so `cargo build` and `cargo test` work unasked.
# `worker/Cargo.toml` turns it off, which is also the check: if the load path
# ever grows a route into the oracle, the worker stops compiling.
testkit = []

[dependencies]
half = "2"
# The checkpoint readers; the requirement itself lives in the workspace
# manifest, because releasing them is a two-repo dance.
ztensor = { workspace = true, features = ["zstd"] }
ztensor-compat = { workspace = true, features = [
    "safetensors",
    "gguf",
    "npz",
    "pickle",
    "hdf5",
    "onnx",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
ztensor = { workspace = true }
# A dev-only cycle, which cargo permits: the golden and verifier tests check
# the *marshalled* view of a plan, and the marshalling lives in the ABI crate
# above this one. The lib itself must never depend on it — that is the whole
# point of the split.
pie-loader-capi = { path = "capi", default-features = false }
