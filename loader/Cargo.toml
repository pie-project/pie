[package]
name = "pie-loader"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Typed weight-loading compiler: checkpoints to verified device-memory layouts."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

# `links = "pie_loader"` lets downstream crates (e.g. `pie-worker`'s build.rs)
# discover the generated C++ header directory via the `DEP_PIE_LOADER_INCLUDE`
# env var, which is how the native drivers get `pie_loader.h` on their include
# path (build script ↔ build script handoff).
links = "pie_loader"

[lib]
name = "pie_loader"
crate-type = ["rlib"]
path = "src/lib.rs"

# The loader as a tool: compile, inspect, check and replay a plan without a
# GPU, a runtime, or a driver.
[[bin]]
name = "pie-loader"
path = "src/main.rs"
required-features = ["testkit"]

[features]
default = ["testkit"]

# The parts of this crate that exist to *check* the loader rather than to be
# the loader: the differential oracle, the contract fixture builder, and the
# CPU plan executor the `pie-loader` tool replays with. None is reachable from
# `ffi/`, so a driver linking this crate has no use for ~1.4k lines of them.
#
# On by default so `cargo build`, `cargo test` and the tool all work unasked.
# `worker/Cargo.toml` turns it off, which is also the check: if `ffi/` ever
# grows a path into the oracle, the worker stops compiling.
testkit = []

[dependencies]
half = "2"
# The checkpoint readers; the requirement itself lives in the workspace
# manifest, because releasing them is a two-repo dance.
ztensor = { workspace = true, features = ["zstd"] }
ztensor-compat = { workspace = true, features = [
    "safetensors",
    "gguf",
    "npz",
    "pickle",
    "hdf5",
    "onnx",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
ztensor = { workspace = true }
