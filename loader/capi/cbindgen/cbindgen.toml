language = "C++"
pragma_once = true
namespace = "pie_loader"
usize_is_size_t = true
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
autogen_warning = "/* Generated by pie-loader-cbindgen (cbindgen). Do not edit by hand. Regenerate: cargo run -p pie-loader-cbindgen */"

# A plan contains its groups and a group points at a plan, so the two types are
# mutually recursive and C++ needs one of them announced before the other. The
# namespace is opened explicitly because this text lands above the one cbindgen
# emits.
after_includes = """
namespace pie_loader {
struct PieLoaderPlan;
}
"""

# The loader's C surface is exactly this crate (`loader/capi`). The compiler
# crate below it is internal IR with no `#[repr(C)]` and must not leak, which
# `parse_deps = false` guarantees structurally: cbindgen never reads it.
[parse]
parse_deps = false

[export]
# Constants whose names are not `PIE_LOADER_`-prefixed are compiler-internal.
# The tile-map masks in particular are the *loader's* opinion of what each
# backend can do; a driver declares its own capability in
# `PieLoaderTargetSpec::tile_map_mask` rather than importing that opinion, and
# the C++ side defines its own in `driver/{cuda,metal}/src/loader/load_plan.hpp`.
#
# cbindgen matches by item name with no notion of the module path, so a wanted
# constant must never share a name with an excluded one.
exclude = [
  "TILE_MAP_CAST",
  "TILE_MAP_DECODE",
  "TILE_MAP_ENCODE",
  "TILE_MAP_TRANSCODE",
  "TILE_MAP_REBLOCK",
  "TILE_MAP_REORDER",
  "TILE_MAP_REPACK",
  "TILE_MAP_SCALE",
  "CONVERT_TILE_MAP_MASK",
  "CUDA_TILE_MAP_MASK",
  "METAL_TILE_MAP_MASK",
  "HOST_TILE_MAP_MASK",
  "FUSION_FP8_TO_MXFP4",
]
# cbindgen's `export.include` is *additive*: it forces items into the header
# that are not otherwise reachable. It is not a filter, and every type that some
# exported struct has a field of arrives on its own. This list was 46 names, 45
# of which said nothing — removing them leaves the header byte-identical.
#
# `PieLoaderExprKind` is the one that has to be named. It is the tag on a
# contract node, which the *driver* writes and `ffi::contract::read_expr` reads,
# so no exported struct holds one and cbindgen has no path to it.
include = ["PieLoaderExprKind"]

[enum]
prefix_with_name = false
