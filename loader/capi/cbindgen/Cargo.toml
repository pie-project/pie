[package]
name = "pie-loader-cbindgen"
version = "0.1.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Decoupled generator: emits the committed pie_loader.h header from pie-loader's repr(C) FFI surface via cbindgen."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[[bin]]
name = "pie-loader-cbindgen"
path = "src/main.rs"

[dependencies]
cbindgen = "0.29"
