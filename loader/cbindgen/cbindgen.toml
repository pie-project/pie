language = "C++"
pragma_once = true
namespace = "pie_loader"
usize_is_size_t = true
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
autogen_warning = "/* Generated by pie-loader-cbindgen (cbindgen). Do not edit by hand. Regenerate: cargo run -p pie-loader-cbindgen */"

# The loader's C surface is exactly `src/ffi/`. Everything else in the crate is
# the compiler's internal IR, which has no `#[repr(C)]` and must not leak.
[parse]
parse_deps = false

[export]
# Constants whose names are not `PIE_LOADER_`-prefixed are compiler-internal.
# The tile-map masks in particular are the *loader's* opinion of what each
# backend can do; a driver declares its own capability in
# `PieLoaderTargetSpec::tile_map_mask` rather than importing that opinion, and
# the C++ side defines its own in `pie_native/load_plan.hpp`.
#
# cbindgen matches by item name with no notion of the module path, so the three
# `backend::{cuda,host,metal}::TILE_MAP_MASK` constants collide under one entry.
# Excluding the name drops all three, which is what we want here — but it also
# means a *wanted* constant must never share a name across backend modules,
# because cbindgen would silently emit whichever it saw first.
exclude = [
  "TILE_MAP_CAST",
  "TILE_MAP_DECODE",
  "TILE_MAP_ENCODE",
  "TILE_MAP_TRANSCODE",
  "TILE_MAP_REBLOCK",
  "TILE_MAP_REORDER",
  "TILE_MAP_REPACK",
  "TILE_MAP_MASK",
]
include = [
  "PieLoaderBackendKind",
  "PieLoaderBufferDeclSlice",
  "PieLoaderBufferDeclView",
  "PieLoaderBytes",
  "PieLoaderCheckpoint",
  "PieLoaderCheckpointFileSlice",
  "PieLoaderCheckpointFileView",
  "PieLoaderCheckpointFormat",
  "PieLoaderContractRequest",
  "PieLoaderDType",
  "PieLoaderDestExtentView",
  "PieLoaderDiagnostic",
  "PieLoaderDiagnostics",
  "PieLoaderDimSpecSlice",
  "PieLoaderDimSpecView",
  "PieLoaderEncodingKind",
  "PieLoaderExprKind",
  "PieLoaderI64Slice",
  "PieLoaderMemoryPlanView",
  "PieLoaderOptDType",
  "PieLoaderOptimizerPassStatsSlice",
  "PieLoaderOptimizerPassStatsView",
  "PieLoaderOptimizerReportView",
  "PieLoaderPlan",
  "PieLoaderQuantScheme",
  "PieLoaderRawTensorSlice",
  "PieLoaderRawTensorView",
  "PieLoaderRepackLayout",
  "PieLoaderRowMap",
  "PieLoaderSeverity",
  "PieLoaderSlabPlacementSlice",
  "PieLoaderSlabPlacementView",
  "PieLoaderSourceExtentView",
  "PieLoaderSourceTensorSlice",
  "PieLoaderSourceTensorView",
  "PieLoaderStatus",
  "PieLoaderStorageInstrKind",
  "PieLoaderStorageInstrSlice",
  "PieLoaderStorageInstrView",
  "PieLoaderStridedExtentView",
  "PieLoaderTargetSpec",
  "PieLoaderTargetView",
  "PieLoaderTensorDeclSlice",
  "PieLoaderTensorDeclView",
  "PieLoaderTileMapKind",
  "PieLoaderU32Slice",
]

[enum]
prefix_with_name = false
