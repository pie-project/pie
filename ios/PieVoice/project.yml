# XcodeGen spec for the PieVoice iOS app (physical devices + Simulator).
#
#   brew install xcodegen
#   cd ios/PieVoice && xcodegen
#   open PieVoice.xcodeproj   → select your team under Signing → Run
#
# Prerequisites, built from the repo root (deploy-device.sh does all of it):
#   (cd ios/pie-shim && cargo build --release --target aarch64-apple-ios)      # device
#   (cd ios/pie-shim && cargo build --release --target aarch64-apple-ios-sim)  # simulator
#   (cd examples && cargo build --release --target wasm32-wasip2 -p voice-chat)
#   model artifact directory at Resources/models/Qwen--Qwen3.5-0.8B/
#     (copied from $PIE_HOME/models after `pie model import Qwen/Qwen3.5-0.8B`)
#   bash ios/voice-app/make-samples.sh ios/PieVoice/Resources
name: PieVoice
options:
  bundleIdPrefix: org.pie-project
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  PieVoice:
    type: application
    platform: iOS
    sources:
      - path: ../voice-app/Sources
      # App icon and the global accent color (Yale blue, lighter in dark
      # mode), which also tints system alerts and pickers.
      - path: Assets.xcassets
      # Individual files land at the bundle root; the model keeps its
      # models/<name>/ directory via a folder reference — the layout
      # PieRuntimeConfig expects, and the one a Pie store uses.
      - path: Resources/voice_chat.wasm
        buildPhase: resources
      - path: Resources/sample-question-1.wav
        buildPhase: resources
      - path: Resources/sample-question-2.wav
        buildPhase: resources
      - path: Resources/sample-question-3.wav
        buildPhase: resources
      - path: Resources/models
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.pie-project.voice
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # The Rust shim staticlib, built into the repository target
        # directory: per-SDK search path picks the device or simulator
        # build automatically.
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(SRCROOT)/../../target/aarch64-apple-ios/release
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(SRCROOT)/../../target/aarch64-apple-ios-sim/release
        OTHER_LDFLAGS: >-
          -lpie_ios_shim -lresolv -lc++
          -Xlinker -U -Xlinker _SCDynamicStoreCopyComputerName
        CODE_SIGN_STYLE: Automatic
        # Aarush's Personal Team (free Apple ID). Another developer
        # overrides it with `xcodegen` after editing this line, or passes
        # DEVELOPMENT_TEAM=<id> to xcodebuild / deploy-device.sh.
        DEVELOPMENT_TEAM: JQ8RG44463
        CODE_SIGN_IDENTITY: "Apple Development"
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - PieVoiceUITests
    dependencies:
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: SystemConfiguration.framework
      - sdk: Metal.framework
      - sdk: AVFoundation.framework
      - sdk: Speech.framework

  # Real-touch walk through every animated interaction on the demo
  # backend, recorded by motion-tour.sh. Simulator only.
  PieVoiceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PieVoice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TEST_TARGET_NAME: PieVoice
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JQ8RG44463
