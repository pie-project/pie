[package]
name = "pie-ios-shim"
version = "0.2.0"
edition = "2024"
description = "C-ABI staticlib embedding the Pie engine for iOS apps"
license = "Apache-2.0"

[lib]
name = "pie_ios_shim"
crate-type = ["staticlib"]

[dependencies]
# The standalone composition (controller + gateway + worker in one
# process) and its config derivation, with the Metal engine: the only
# backend that runs on an iPhone GPU.
pie = { path = "../..", default-features = false, features = ["metal"] }
pie-client = { path = "../../crates/client" }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Standalone crate: opt out of the parent cargo workspace, which does not
# list this directory as a member.
[workspace]
