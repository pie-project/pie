[package]
name = "pie-server-py"
version.workspace = true
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Python bindings for the pie engine — embed `pie serve` inside a Python script via `pie.server.Server`."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[features]
profile-fire = ["worker/profile-fire"]

default = ["cuda"]
cuda = ["worker/cuda"]
metal = ["worker/metal"]

[lib]
name = "pie_engine"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging", "std"] }
worker = { path = "../../../crates/worker", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module"] }
tokio = { version = "1.53", features = ["rt-multi-thread"] }
toml = "1.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
