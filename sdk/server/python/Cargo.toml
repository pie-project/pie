[package]
name = "pie-server-py"
version = "0.4.0"
edition = "2024"
authors = ["In Gim <in.gim@icloud.com>"]
description = "Python bindings for the pie engine — embed `pie serve` inside a Python script via `pie.server.Server`."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"

[features]
profile-fire = ["worker/profile-fire"]

# Which backends the embedded engine can host.
#
# `default` keeps what this wheel has always built, so nothing that builds it
# today changes. What is new is that the OTHER three are reachable:
# `maturin build --no-default-features --features driver-wgpu` produces a wheel
# whose `pie.server.Server` hosts WebGPU, which is what the curated inferlet
# harness needs to measure a backend other than CUDA.
#
# They were not reachable before, and the comment on the `worker` dependency
# said they were -- "Build the embedded drivers into the Python engine so
# `pie.server.Server` can host the same local flavors as `pie serve`". `pie
# serve` can host four; this wheel could host one.
# The CUDA default is a GUESS, and it is spelled out here so that it is a
# greppable one. It used to read `driver-cuda`, which resolved to the 13 ABI
# three manifests away; a wheel built for a CUDA 12 box got no error, only a
# segfault inside `cudaGraphAddNode`. Naming the ABI does not remove the
# guess -- a wheel has to default to something -- but it puts it where a
# packager can see and override it with `--no-default-features`.
default = ["driver-cuda-13"]
driver-cuda-12 = ["worker/driver-cuda-12"]
driver-cuda-13 = ["worker/driver-cuda-13"]
driver-metal = ["worker/driver-metal"]
driver-vulkan = ["worker/driver-vulkan"]
driver-wgpu = ["worker/driver-wgpu"]

[lib]
name = "pie_engine"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# TLS backend selection, not TLS use: the engine's HTTPS clients are built on
# reqwest's `rustls-no-provider`, so *something* in the process has to name a
# provider. The CLI has `bootstrap` for that; the wheel has this.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging", "std"] }
# `worker` is the engine library — we link the same `serve::start_engine`
# the CLI uses, so the CLI and the pyo3 wheel can never drift in their boot
# behavior.
#
# WHICH drivers is a build choice now, made by the `[features]` table above
# rather than pinned here. It used to say `features = ["driver-cuda"]` under a
# comment claiming the wheel hosted "the same local flavors as `pie serve`",
# and a claim nobody could act on is what that was: the feature list was not
# forwarded, so no build command could select anything else.
worker = { path = "../../../crates/worker", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module"] }
tokio = { version = "1.53", features = ["rt-multi-thread"] }
toml = "1.1"
# The embedded engine emits `tracing` events exactly as the CLI does, but a
# `tracing` event with no subscriber installed is discarded silently. Without
# this the wheel is mute: an engine-side WARN explaining why a request failed
# never reaches the Python process, and `RUST_LOG` appears to do nothing.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
