# buck2's pagable at 03a23abe (https://github.com/facebook/buck2), with
# workspace inheritance resolved and one change: generic typetag registration
# also covers Android (ELF `.init_array`) and Apple's other platforms (Mach-O
# `__mod_init_func`), which the upstream cfg refuses. See README.md.

[package]
name = "pagable"
version = "0.4.2"
edition = "2024"
description = "Serialization framework with content-addressed `Arc` deduplication and runtime polymorphism via typetag"
repository = "https://github.com/facebook/buck2"
license = "MIT OR Apache-2.0"

[dependencies]
allocative = { git = "https://github.com/facebook/buck2.git", branch = "main", features = ["anyhow", "bumpalo", "compact_str", "dashmap", "either", "futures", "hashbrown", "indexmap", "jiff", "num-bigint", "once_cell", "parking_lot", "prost-types", "serde_json", "slab", "smallvec", "sorted_vector_map", "tokio", "triomphe"] }
anyhow = "1.0.104"
async-trait = "0.1.92"
blake3 = { version = "1.8", features = ["mmap", "rayon", "traits-preview"] }
bytemuck = { version = "1.25", features = ["const_zeroed", "derive", "min_const_generics", "must_cast"] }
dashmap = { version = "6.2.1", features = ["rayon", "serde"] }
dupe = { git = "https://github.com/facebook/buck2.git", branch = "main" }
either = "1.18.0"
fancy-regex = "0.19.2"
indexmap = { version = "2.14.2", features = ["arbitrary", "rayon", "serde"] }
inventory = "0.3.24"
num-bigint = { version = "0.5.1", features = ["rand_0_10", "serde"] }
once_cell = "1.21.4"
pagable_derive = { git = "https://github.com/facebook/buck2.git", branch = "main" }
parking_lot = { version = "0.12.1", features = ["arc_lock", "send_guard"] }
postcard = { version = "1.0.8", features = ["use-crc", "use-std"] }
regex = "1.13.1"
sequence_trie = { version = "0.3.6", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["alloc", "float_roundtrip", "raw_value", "unbounded_depth"] }
smallvec = { version = "1.16.2", features = ["const_generics"] }
sorted_vector_map = "0.2.1"
static_assertions = "1.1.0"
static_interner = { git = "https://github.com/facebook/buck2.git", branch = "main", features = ["allocative", "dupe", "strong_hash"] }
strong_hash = { git = "https://github.com/facebook/buck2.git", branch = "main", features = ["compact_str", "num-bigint", "triomphe"] }
take_mut = "0.2"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full", "test-util", "tracing"], optional = true }
triomphe = { version = "0.1.16", features = ["arc-swap"] }

[features]
default = []
tokio = ["dep:tokio"]
