[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pie-server"
version = "0.5.1"
description = "What `pie serve` boots, inside a Python process: `pie.server.Server`."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "In Gim", email = "in.gim@icloud.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pie-client",
]

[tool.maturin]
python-source = "python"
python-packages = ["pie"]
module-name = "pie._engine"
manifest-path = "Cargo.toml"

[tool.uv.sources]
pie-client = { path = "../client", editable = true }

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../../crates/**/Cargo.toml" },
    { file = "../../crates/**/*.rs" },
    { file = "../../crates/**/*.wit" },
    { file = "../../crates/**/*.cpp" },
    { file = "../../crates/**/*.cu" },
    { file = "../../crates/**/*.cuh" },
    { file = "../../crates/**/*.hpp" },
    { file = "../../crates/**/*.h" },
    { file = "../../crates/**/*.metal" },
    { file = "../../crates/**/CMakeLists.txt" },
]
